{{- /*
The tester app itself — stdlib-only Python, shipped as a ConfigMap so the
chart needs no image build. See Chart.yaml for the design; the
load-bearing property is that the secret VALUE never leaves the pod:
only sha256 digests appear in responses.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app.kubernetes.io/name: secret-tester
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  server.py: |
    import hashlib
    import json
    import os
    import sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    KEY = os.environ["SECRET_KEY"]
    EXPECTED = os.environ["EXPECTED_SHA256"].strip().lower()
    CONTROL = os.environ["CONTROL_SHA256"].strip().lower()
    PORT = int(os.environ["PORT"])
    BASE = os.environ["BASE_PATH"].rstrip("/")

    # Fail fast: no secret, no server. The container exits non-zero
    # immediately (NO_SECRET), which surfaces as CrashLoopBackOff and an
    # AgentAppUnhealthy alert instead of a page that silently lies.
    SECRET = os.environ.get(KEY)
    if not SECRET:
        print(f"NO_SECRET: required env var {KEY} is not provided - failing fast", file=sys.stderr)
        sys.exit(1)

    def digest(value: str) -> str:
        return hashlib.sha256(value.encode("utf-8")).hexdigest()

    # NOTE: plain-string template + .replace, NOT an f-string. f-string
    # brace escaping would put doubled open-braces in this file, which
    # Helm (which templates this ConfigMap) would parse as an action.
    PAGE = """<!doctype html>
    <html><head><title>Secret SHA tester</title></head>
    <body>
    <h1>Secret SHA tester</h1>
    <p>This page proves the platform delivered the agent-app's secret
    (<code>__KEY__</code>) without ever showing it: the GitOps repo carries
    only a sha256 checksum, and the button below compares it against the
    LIVE secret in this pod, server-side. Two payloads are tested each
    click - the expected checksum (must MATCH) and a control checksum
    (must MISMATCH).</p>
    <ul>
      <li>expected sha256 (from the repo): <code>__EXPECTED__</code></li>
      <li>control sha256 (must not match): <code>__CONTROL__</code></li>
    </ul>
    <button id="verify">Verify secret availability</button>
    <pre id="result">(not verified yet)</pre>
    <script>
    document.getElementById("verify").addEventListener("click", async () => {
      const r = await fetch("__BASE__/verify");
      const data = await r.json();
      document.getElementById("result").textContent =
        (data.pass ? "PASS" : "FAIL") + "\\n" + JSON.stringify(data, null, 2);
    });
    </script>
    </body></html>
    """
    PAGE = (
        PAGE.replace("__KEY__", KEY)
        .replace("__EXPECTED__", EXPECTED)
        .replace("__CONTROL__", CONTROL)
        .replace("__BASE__", BASE)
    )

    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, content_type, body):
            data = body.encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            path = self.path.split("?", 1)[0].rstrip("/")
            if path in (BASE + "/verify", "/verify"):
                actual = digest(SECRET)
                payloads = [
                    {"name": "expected", "sha256": EXPECTED, "match": actual == EXPECTED},
                    {"name": "control", "sha256": CONTROL, "match": actual == CONTROL},
                ]
                result = {
                    "secretAvailable": True,
                    "secretKey": KEY,
                    "actualSha256": actual,
                    "payloads": payloads,
                    # PASS = the expected payload matches AND the control
                    # payload does not - a comparator that says yes to
                    # everything cannot pass.
                    "pass": payloads[0]["match"] and not payloads[1]["match"],
                }
                self._send(200, "application/json", json.dumps(result, indent=2))
            else:
                self._send(200, "text/html; charset=utf-8", PAGE)

        def log_message(self, fmt, *args):
            pass

    print(f"secret-tester: serving on :{PORT} (base path {BASE})", flush=True)
    HTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
