# The shape deployments/connections/profiles/<name>.yaml lands as (ADR-152):
# two projected connections, the keys the compiler fixes per provider.
spec:
  connections:
    - name: company-discord
      provider: discord
      secretName: connection-company-discord
      keys: [DISCORD_BOT_TOKEN, DISCORD_APPLICATION_ID, DISCORD_PUBLIC_KEY]
    - name: platform-github
      provider: github
      secretName: connection-platform-github
      keys: [GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, GITHUB_WEBHOOK_SECRET, GITHUB_APP_SLUG]
