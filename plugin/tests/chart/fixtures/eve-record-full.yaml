# Every EveAgent record surface at once: a subdir-layout source, a private
# source credential, env requirements, deployment knobs and the compiled
# overlay.
spec:
  persona: echo
  runtime: eve
  source: https://github.com/factorylevel/eve-agents.git
  ref: main
  sourceSubdir: agents/echo
  gitAuthSecretRef: ag-eve-echo-git-auth
  sha: 3f06a1b2c3d4e5f60718293a4b5c6d7e8f901234
  envRequires:
    - AI_GATEWAY_API_KEY
    - name: ECHO_GREETING
      required: false
      secret: false
      description: Greeting prefix the agent uses.
  deployment:
    runtimeImageTag: 0.42.0-test
    diskSizeGb: 20
  env:
    CONTENT_BOARD_URL: http://hermes-board.hermes-board.svc:8080
