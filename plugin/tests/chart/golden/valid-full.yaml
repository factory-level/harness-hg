# Source: hermes-profile/templates/pod/configmap-boot.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-support-agent-boot
  namespace: hermes-support-agent
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: hermes-profile
    app.kubernetes.io/name: hermes-profile
    app.kubernetes.io/instance: hermes-support-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: hermes-profile-0.1.0
    hermes-gitops.factorylevel.dev/persona: "support-agent"
    hermes-gitops.factorylevel.dev/managed: "true"
data:
  boot.sh: |
    #!/bin/sh
    # Generated by harness/hermes/charts/hermes-profile/templates/pod/configmap-boot.yaml -
    # do not edit by hand, edit the chart template instead.
    set -eu

    STAMP_DIR="$HERMES_HOME/.hermes-gitops"
    STAMP_FILE="$STAMP_DIR/installed_sha"
    PROFILE_DIR="$HERMES_HOME/profiles/$HERMES_PROFILE_NAME"

    mkdir -p "$STAMP_DIR"

    CURRENT_SHA=""
    if [ -f "$STAMP_FILE" ]; then
      CURRENT_SHA="$(cat "$STAMP_FILE")"
    fi

    if [ "$CURRENT_SHA" != "$HERMES_DIST_SHA" ]; then
      echo "[bootstrap] installed_sha ('$CURRENT_SHA') != spec.sha ('$HERMES_DIST_SHA') - (re)installing distribution"
      rm -rf /tmp/dist
      # Private-source auth (issue #18 [G1]): when spec.gitAuthSecretRef
      # names a Secret, it is mounted at /git-auth (see statefulset.yaml)
      # and consumed off the source scheme: username+password keys become
      # an ephemeral ~/.netrc for https sources; an ssh-privatekey key
      # becomes an ephemeral identity for git@/ssh sources. Both live in
      # $HOME only for the duration of the clone and are removed right
      # after (alongside the .git scrub below), so no credential ever
      # lands in the installed profile or the running container's
      # long-lived filesystem.
      GIT_AUTH_CLEANUP=""
      if [ -d /git-auth ]; then
        case "$HERMES_DIST_SOURCE" in
          https://*)
            if [ -f /git-auth/username ] && [ -f /git-auth/password ]; then
              DIST_HOST="$(printf '%s' "$HERMES_DIST_SOURCE" | sed -E 's#^https://([^/]+)/.*#\1#')"
              printf 'machine %s\nlogin %s\npassword %s\n' \
                "$DIST_HOST" "$(cat /git-auth/username)" "$(cat /git-auth/password)" > "$HOME/.netrc"
              chmod 600 "$HOME/.netrc"
              GIT_AUTH_CLEANUP="$HOME/.netrc"
              echo "[bootstrap] git auth: using HTTPS credentials from gitAuthSecretRef for $DIST_HOST"
            else
              echo "[bootstrap] git auth: /git-auth mounted but username/password keys missing for an https source" >&2
              exit 1
            fi
            ;;
          git@*|ssh://*)
            if [ -f /git-auth/ssh-privatekey ]; then
              mkdir -p "$HOME/.ssh"
              cp /git-auth/ssh-privatekey "$HOME/.ssh/git-auth-key"
              chmod 600 "$HOME/.ssh/git-auth-key"
              export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/git-auth-key -o StrictHostKeyChecking=accept-new"
              GIT_AUTH_CLEANUP="$HOME/.ssh/git-auth-key"
              echo "[bootstrap] git auth: using SSH deploy key from gitAuthSecretRef"
            else
              echo "[bootstrap] git auth: /git-auth mounted but ssh-privatekey key missing for an ssh source" >&2
              exit 1
            fi
            ;;
        esac
      fi
      git clone "$HERMES_DIST_SOURCE" /tmp/dist
      git -C /tmp/dist checkout "$HERMES_DIST_SHA"
      if [ -n "$GIT_AUTH_CLEANUP" ]; then
        rm -f $GIT_AUTH_CLEANUP
        unset GIT_SSH_COMMAND || true
      fi
      # `hermes profile install` only strips .git when IT does the git clone
      # itself (a bare git-URL source); since we pre-clone to a local
      # directory ourselves, its local-directory install branch would
      # otherwise copy .git straight into the installed profile (verified
      # live in this task's k3d check before this line was added).
      rm -rf /tmp/dist/.git
      # Subdir-layout sources (spec.sourceSubdir, the fork's --subdir /
      # #subdirectory= form): the distribution root is a subtree of the
      # clone, and installing that subtree path directly is the fork's
      # local-directory equivalent of --subdir.
      hermes profile install "/tmp/dist${HERMES_DIST_SUBDIR:+/$HERMES_DIST_SUBDIR}" --name "$HERMES_PROFILE_NAME" --force -y
      rm -rf /tmp/dist
      echo "$HERMES_DIST_SHA" > "$STAMP_FILE"
    else
      echo "[bootstrap] installed_sha matches spec.sha ('$HERMES_DIST_SHA') - skipping (re)install"
    fi

    hermes profile use "$HERMES_PROFILE_NAME"

    # ---- observer-metrics plugin (hermes.observer.v1) ----------------------
    # Copies the chart-shipped directory plugin (configmap-plugins.yaml,
    # mounted at /plugins) into the ACTIVE profile's user-plugins dir -
    # the fork's gateway process resolves HERMES_HOME to the profile dir,
    # so $PROFILE_DIR/plugins/ is exactly where hermes_cli/plugins.py's
    # "user" discovery source scans - and adds it to plugins.enabled in
    # the profile's config.yaml (preserved across --force reinstalls).
    # Runs every boot: a distribution that ships its own plugins/ dir
    # replaces this dir at install time, and this re-copy converges it
    # back. Copy BEFORE enable: `hermes plugins enable` exits nonzero if
    # discovery can't find the plugin; re-running enable is a no-op.
    if [ "${HERMES_OBSERVER_METRICS:-1}" = "1" ] && [ -d /plugins ]; then
      echo "[bootstrap] installing observer-metrics plugin"
      mkdir -p "$PROFILE_DIR/plugins/observer-metrics"
      cp -f /plugins/plugin.yaml /plugins/__init__.py "$PROFILE_DIR/plugins/observer-metrics/"
      hermes plugins enable observer-metrics --no-allow-tool-override
    else
      # Disabled (or mount absent): converge OFF. Both guarded - the
      # plugin may never have been installed/enabled on this PVC.
      rm -rf "$PROFILE_DIR/plugins/observer-metrics" || true
      hermes plugins disable observer-metrics >/dev/null 2>&1 || true
    fi

    echo "[bootstrap] materializing .env for profile '$HERMES_PROFILE_NAME'"
    : > "$PROFILE_DIR/.env.tmp"
    # Secret volume mounts glob-skip their own "..data"/"..<timestamp>" bookkeeping
    # entries automatically (POSIX sh globs never match leading-dot names), so no
    # special-casing is needed here - only the real, renamed leaf keys show up.
    for dir in /run/secrets/hermes-env /run/secrets/hermes-api-key; do
      [ -d "$dir" ] || continue
      for f in "$dir"/*; do
        [ -e "$f" ] || continue
        key="$(basename "$f")"
        val="$(cat "$f")"
        printf '%s=%s\n' "$key" "$val" >> "$PROFILE_DIR/.env.tmp"
      done
    done
    mv "$PROFILE_DIR/.env.tmp" "$PROFILE_DIR/.env"
    chmod 600 "$PROFILE_DIR/.env"

    # ---- declared cron jobs -------------------------------------------------
    # `hermes profile install` copies a distribution's cron/ directory onto the
    # PVC, but the scheduler only reads cron/jobs.json - so a shipped
    # cron/<job>.yaml lands on disk and never runs. `cron sync` converges the
    # declarations into the store. Runs AFTER .env so a job's provider/model
    # snapshot resolves against the profile's real credentials.
    #
    # New jobs arrive PAUSED and sync never rewrites the enabled flag again, so
    # `hermes cron resume <name>` is a decision that survives every redeploy.
    #
    # The two ways this can fail are NOT the same and must not be conflated:
    #
    #   - The subcommand does not exist. An agent image predating `cron sync`
    #     must not brick the pod for want of a feature it never had, so this is
    #     a warning and boot continues. Probed with `--help` (no side effects)
    #     rather than inferred from an exit code, because argparse's "invalid
    #     choice" is indistinguishable from a genuine failure by status alone.
    #
    #   - The subcommand exists and FAILED: a malformed declaration, an
    #     unwritable store, a job the runtime rejected. That is a
    #     misconfigured agent, and swallowing it would leave a healthy-looking
    #     pod running none of the work it was told to do - the exact failure
    #     this step exists to end. Fail the initContainer instead: a
    #     CrashLoopBackOff is visible, a log line in an init container is not.
    #     `hg validate` catches these locally, before a cluster is involved.
    echo "[bootstrap] syncing declared cron jobs"
    if hermes -p "$HERMES_PROFILE_NAME" cron sync --help >/dev/null 2>&1; then
      if ! hermes -p "$HERMES_PROFILE_NAME" cron sync; then
        echo "[bootstrap] FATAL: cron sync failed - this agent's declared jobs are NOT scheduled." >&2
        echo "[bootstrap] Run 'hg validate' against the distribution; it checks every cron/*.yaml." >&2
        exit 1
      fi
    else
      echo "[bootstrap] WARNING: this agent image predates 'hermes cron sync'." >&2
      echo "[bootstrap] Any declared cron/<job>.yaml is on the volume but NOT scheduled." >&2
      echo "[bootstrap] Rebuild the agent image from the fork to activate them." >&2
    fi

    echo "[bootstrap] done"
---
# Source: hermes-profile/templates/pod/configmap-plugins.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-support-agent-plugins
  namespace: hermes-support-agent
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: hermes-profile
    app.kubernetes.io/name: hermes-profile
    app.kubernetes.io/instance: hermes-support-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: hermes-profile-0.1.0
    hermes-gitops.factorylevel.dev/persona: "support-agent"
    hermes-gitops.factorylevel.dev/managed: "true"
data:
  plugin.yaml: |
    name: observer-metrics
    version: "0.1.0"
    description: >
      hermes.observer.v1 - exposes per-profile token usage and estimated
      spend as Prometheus metrics on :9464/metrics (stdlib-only, fail-open).
      Delivered by the hermes-profile chart (files/plugins/observer-metrics,
      copied to the profile's plugins/ dir by boot.sh); the fleet Grafana
      budget dashboard (charts/fleet-dashboard) and the per-profile
      monitoring dashboard read the series it emits.
    author: hermes-gitops
    kind: standalone
    provides_hooks:
      - post_api_request
      - api_request_error
    
  __init__.py: |
    """observer-metrics: hermes.observer.v1 -> Prometheus text exposition.
    
    Ships with the hermes-profile chart (delivered via ConfigMap + boot.sh
    into the profile's plugins/ dir) and runs inside the agent process. It
    subscribes to the fork's read-only observer contract and serves
    /metrics on HERMES_OBSERVER_METRICS_PORT (default 9464), scraped by the
    platform Prometheus through the pod's prometheus.io/* annotations.
    
    Two kinds of series, deliberately:
    
      - process-lifetime counters (hermes_usage_tokens_total,
        hermes_estimated_cost_usd_total) accumulated from post_api_request
        events - good for rates ("who is burning right now");
      - month-to-date gauges (hermes_cost_usd_mtd, hermes_tokens_mtd)
        computed from the fork's persisted state.db at scrape time - the
        AUTHORITY for budget math: they survive pod restarts, cover every
        hermes process on this PVC (gateway, cron/kanban subprocesses), and
        need no Prometheus retention (the platform default keeps 2d).
    
    Costs are the fork's canonical usage-pricing ESTIMATES, not provider
    billing.
    
    Fail-open everywhere: no exception may ever escape into the agent. The
    fork's invoke_hook already isolates callbacks, but this module also
    guards every path itself (hooks, sqlite reads, the server thread). If
    another hermes process on this pod already owns the port (cron/kanban
    chat subprocesses load plugins too), the bind failure is logged and the
    hooks stay registered - the gateway's server is the authoritative one,
    and state.db covers the subprocess usage.
    
    Kill switches, strongest first: metrics.enabled=false (chart value ->
    HERMES_OBSERVER_METRICS=0), HERMES_OBSERVER_METRICS_DISABLED=1 (per
    profile, via the profile's env Secret), HERMES_SAFE_MODE=1 (fork-level,
    disables all plugins).
    """
    
    from __future__ import annotations
    
    import logging
    import os
    import sqlite3
    import threading
    import time
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    
    logger = logging.getLogger(__name__)
    
    # Observer usage keys -> the metric's `type` label.
    _TYPE_MAP = {
        "input_tokens": "input",
        "output_tokens": "output",
        "cache_read_tokens": "cache_read",
        "cache_write_tokens": "cache_creation",
        "reasoning_tokens": "reasoning",
    }
    _MTD_TYPES = ("input", "output", "cache_read", "cache_creation", "reasoning")
    _MTD_TTL_SECONDS = 15.0
    
    # Whole-session usage is attributed to the month the session STARTED in;
    # a session spanning the boundary misattributes its tail (the
    # alternative, last_seen, would misattribute the head instead).
    _MTD_SQL = """
    SELECT COALESCE(SUM(u.input_tokens), 0),
           COALESCE(SUM(u.output_tokens), 0),
           COALESCE(SUM(u.cache_read_tokens), 0),
           COALESCE(SUM(u.cache_write_tokens), 0),
           COALESCE(SUM(u.reasoning_tokens), 0),
           COALESCE(SUM(u.estimated_cost_usd), 0)
    FROM session_model_usage u
    JOIN sessions s ON s.id = u.session_id
    WHERE s.started_at >= ?
    """
    
    
    class _State:
        def __init__(self, profile: str):
            self.profile = profile
            self.lock = threading.Lock()
            self.tokens: dict[tuple[str, str, str], int] = {}
            self.cost: dict[tuple[str, str], float] = {}
            self.last_event_ts = 0.0
            self.scrape_errors = 0
            # (fetched_at, values) - kept on read failure so a locked/missing
            # state.db serves stale-but-sane numbers instead of a gap.
            self.mtd_cache: tuple[float, dict] | None = None
    
    
    _STATE: _State | None = None
    
    
    def _enabled() -> bool:
        if os.getenv("HERMES_OBSERVER_METRICS", "1").strip().lower() in {"0", "false", "no", "off"}:
            return False
        if os.getenv("HERMES_OBSERVER_METRICS_DISABLED", "").strip().lower() in {"1", "true", "yes", "on"}:
            return False
        return True
    
    
    def _estimate_cost(model, provider, base_url, usage: dict):
        """Price one event via the fork's canonical pricing. Lazily imported
        and fully guarded: unit tests monkeypatch this, and a broken fork
        import must never break the hook."""
        try:
            from agent.usage_pricing import CanonicalUsage, estimate_usage_cost
    
            cu = CanonicalUsage(
                input_tokens=int(usage.get("input_tokens") or 0),
                output_tokens=int(usage.get("output_tokens") or 0),
                cache_read_tokens=int(usage.get("cache_read_tokens") or 0),
                cache_write_tokens=int(usage.get("cache_write_tokens") or 0),
                reasoning_tokens=int(usage.get("reasoning_tokens") or 0),
            )
            result = estimate_usage_cost(model, cu, provider=provider, base_url=base_url)
            return float(result.amount_usd) if result.amount_usd is not None else None
        except Exception:
            return None
    
    
    def _on_post_api_request(**kwargs):
        st = _STATE
        if st is None:
            return
        try:
            usage = kwargs.get("usage") or {}
            model = str(kwargs.get("model") or "unknown")
            provider = str(kwargs.get("provider") or "unknown")
            with st.lock:
                for key, label in _TYPE_MAP.items():
                    n = int(usage.get(key) or 0)
                    if n:
                        k = (model, provider, label)
                        st.tokens[k] = st.tokens.get(k, 0) + n
                st.last_event_ts = time.time()
            cost = _estimate_cost(model, provider, kwargs.get("base_url"), usage)
            if cost:
                with st.lock:
                    st.cost[(model, provider)] = st.cost.get((model, provider), 0.0) + cost
        except Exception:
            logger.debug("observer-metrics: post_api_request hook failed", exc_info=True)
    
    
    def _on_api_request_error(**kwargs):
        # Errors carry no usage; they still prove the observer is alive.
        st = _STATE
        if st is None:
            return
        try:
            with st.lock:
                st.last_event_ts = time.time()
        except Exception:
            pass
    
    
    def _month_start_epoch(now=None) -> float:
        now = now or datetime.now(timezone.utc)
        return datetime(now.year, now.month, 1, tzinfo=timezone.utc).timestamp()
    
    
    def _read_mtd(db_path: str) -> dict:
        # Read-only URI + short busy timeout: WAL readers coexist with the
        # agent's writer (hermes_state.py sets WAL, DELETE fallback).
        conn = sqlite3.connect(f"file:{db_path}?mode=ro", uri=True, timeout=2.0)
        try:
            row = conn.execute(_MTD_SQL, (_month_start_epoch(),)).fetchone()
        finally:
            conn.close()
        return {
            "input": row[0],
            "output": row[1],
            "cache_read": row[2],
            "cache_creation": row[3],
            "reasoning": row[4],
            "cost_usd": row[5],
        }
    
    
    def _state_db_path() -> str:
        from hermes_constants import get_hermes_home
    
        return str(get_hermes_home() / "state.db")
    
    
    def _get_mtd(st: _State):
        now = time.time()
        if st.mtd_cache and now - st.mtd_cache[0] < _MTD_TTL_SECONDS:
            return st.mtd_cache[1]
        try:
            data = _read_mtd(_state_db_path())
            st.mtd_cache = (now, data)
            return data
        except Exception:
            with st.lock:
                st.scrape_errors += 1
            return st.mtd_cache[1] if st.mtd_cache else None
    
    
    def _esc(v: str) -> str:
        return v.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")
    
    
    def _render(st: _State) -> str:
        p = _esc(st.profile)
        with st.lock:
            tokens = dict(st.tokens)
            cost = dict(st.cost)
            last_ts = st.last_event_ts
        lines = [
            "# HELP hermes_usage_tokens_total Tokens consumed by bucket (this process's lifetime).",
            "# TYPE hermes_usage_tokens_total counter",
        ]
        for (m, pr, t), v in sorted(tokens.items()):
            lines.append(
                f'hermes_usage_tokens_total{{profile="{p}",model="{_esc(m)}",provider="{_esc(pr)}",type="{t}"}} {v}'
            )
        lines += [
            "# HELP hermes_estimated_cost_usd_total Estimated spend in USD (this process's lifetime).",
            "# TYPE hermes_estimated_cost_usd_total counter",
        ]
        for (m, pr), v in sorted(cost.items()):
            lines.append(
                f'hermes_estimated_cost_usd_total{{profile="{p}",model="{_esc(m)}",provider="{_esc(pr)}"}} {v:.6f}'
            )
        mtd = _get_mtd(st)
        if mtd is not None:
            lines += [
                "# HELP hermes_cost_usd_mtd Month-to-date estimated spend in USD, from persisted state.db (all processes; authority for budgets).",
                "# TYPE hermes_cost_usd_mtd gauge",
                f'hermes_cost_usd_mtd{{profile="{p}"}} {mtd["cost_usd"]:.6f}',
                "# HELP hermes_tokens_mtd Month-to-date tokens by bucket, from persisted state.db.",
                "# TYPE hermes_tokens_mtd gauge",
            ]
            for t in _MTD_TYPES:
                lines.append(f'hermes_tokens_mtd{{profile="{p}",type="{t}"}} {mtd[t]}')
        # scrape_errors is read after _get_mtd so a failing read is visible
        # on the same scrape that suffered it.
        with st.lock:
            errs = st.scrape_errors
        lines += [
            "# HELP hermes_observer_last_event_timestamp_seconds Unix time of the last observer event seen by this process.",
            "# TYPE hermes_observer_last_event_timestamp_seconds gauge",
            f'hermes_observer_last_event_timestamp_seconds{{profile="{p}"}} {last_ts}',
            "# HELP hermes_metrics_scrape_errors_total state.db read failures.",
            "# TYPE hermes_metrics_scrape_errors_total counter",
            f'hermes_metrics_scrape_errors_total{{profile="{p}"}} {errs}',
        ]
        return "\n".join(lines) + "\n"
    
    
    def _start_server(st: _State, port: int) -> bool:
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path.split("?")[0] != "/metrics":
                    self.send_response(404)
                    self.end_headers()
                    return
                try:
                    body = _render(st).encode()
                except Exception:
                    logger.debug("observer-metrics: render failed", exc_info=True)
                    self.send_response(500)
                    self.end_headers()
                    return
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
    
            def log_message(self, *args):
                pass
    
        try:
            server = ThreadingHTTPServer(("0.0.0.0", port), Handler)
            server.daemon_threads = True
        except OSError:
            logger.debug(
                "observer-metrics: port %d already bound (another hermes process "
                "owns the exporter) - hooks stay registered, no server here",
                port,
            )
            return False
        threading.Thread(target=server.serve_forever, name="observer-metrics", daemon=True).start()
        logger.info("observer-metrics: serving /metrics on :%d", port)
        return True
    
    
    def register(ctx):
        global _STATE
        try:
            if not _enabled():
                logger.info("observer-metrics: disabled via environment")
                return
            _STATE = _State(profile=str(ctx.profile_name or "unknown"))
            ctx.register_hook("post_api_request", _on_post_api_request)
            ctx.register_hook("api_request_error", _on_api_request_error)
            port = int(os.getenv("HERMES_OBSERVER_METRICS_PORT", "9464"))
            _start_server(_STATE, port)
        except Exception:
            logger.warning("observer-metrics: register failed (metrics disabled)", exc_info=True)
---
# Source: hermes-profile/templates/pod/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: hermes-support-agent
  namespace: hermes-support-agent
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: hermes-profile
    app.kubernetes.io/name: hermes-profile
    app.kubernetes.io/instance: hermes-support-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: hermes-profile-0.1.0
    hermes-gitops.factorylevel.dev/persona: "support-agent"
    hermes-gitops.factorylevel.dev/managed: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes-profile
    app.kubernetes.io/instance: hermes-support-agent
  ports:
    - name: http
      port: 8642
      targetPort: 8642
      protocol: TCP
    - name: tools
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Source: hermes-profile/templates/pod/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-support-agent
  namespace: hermes-support-agent
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: hermes-profile
    app.kubernetes.io/name: hermes-profile
    app.kubernetes.io/instance: hermes-support-agent
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1.0"
    helm.sh/chart: hermes-profile-0.1.0
    hermes-gitops.factorylevel.dev/persona: "support-agent"
    hermes-gitops.factorylevel.dev/managed: "true"
spec:
  # Hermes is single-host per instance: the profile's state.db (SQLite) and
  # the s6-supervised gateway process are not designed for concurrent
  # multi-replica access to the same /opt/data volume. Never scale this
  # StatefulSet beyond 1 - a second replica would race the first for the
  # same PVC (ReadWriteOnce) and the same SQLite files.
  replicas: 1
  serviceName: hermes-support-agent
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-profile
      app.kubernetes.io/instance: hermes-support-agent
  # Delete the PVC when the StatefulSet itself is deleted (uninstalling this
  # instance should reclaim its disk), but keep it across a scale-down/up
  # cycle (whenScaled: Retain) - moot at replicas:1 today, but the safer
  # default if that ever changes.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: hermes-profile
          app.kubernetes.io/instance: hermes-support-agent
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-profile
        app.kubernetes.io/instance: hermes-support-agent
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.1.0"
        helm.sh/chart: hermes-profile-0.1.0
        hermes-gitops.factorylevel.dev/persona: "support-agent"
        hermes-gitops.factorylevel.dev/managed: "true"
      annotations:
        # Rolls the pod whenever the profile record changes (new sha,
        # persona, envRequires, ...) even though none of this
        # chart's own template bytes changed.
        checksum/profile: f1f8bf91f890c8dfedcdfd509affb0db11b90878ea8d5e7c73fa8f3df8e2f91b
        # Rolls the pod when the chart-shipped observer-metrics plugin
        # source changes (the plugin only reloads at process start).
        checksum/observer-metrics-plugin: 834d0097a583f63bf04d6f8ef37647ac3f2385a772b4e1b88678673ae0e1640b
        # The platform Prometheus's default annotation-driven job scrapes
        # these - no scrape-config edits anywhere.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: hermes-support-agent
      # Pod-level securityContext only carries fsGroup; each container sets
      # its own runAsUser/Group (the ingress sidecars have their own image
      # constraints - see their securityContext comments below). fsGroup
      # alone only affects mounted-volume group ownership/permissions, not
      # any container's process UID, so it's safe to apply pod-wide: every
      # container that mounts `data` gets group-write access to it
      # regardless of which UID it runs as.
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: bootstrap-distribution
          image: ghcr.io/dummy/hermes-agent:hermes-base-2026-07
          imagePullPolicy: IfNotPresent
          # Overrides the image's s6 ENTRYPOINT entirely (this job needs no
          # supervision - it runs once to completion per boot). `git` and
          # `hermes` are both on PATH via image-level ENV (Dockerfile `apt-get
          # install ... git ...` and `ENV PATH="/opt/hermes/bin:...`),
          # independent of ENTRYPOINT/CMD, so both are available here even
          # though /init never runs in this container.
          command: ["/bin/sh", "/scripts/boot.sh"]
          env:
            - name: HERMES_PROFILE_NAME
              value: "support-agent"
            - name: HERMES_DIST_SOURCE
              value: "https://github.com/factorylevel/support-agent"
            - name: HERMES_DIST_SHA
              value: "9f2c1ab3d4e5f60718293a4b5c6d7e8f9a0b1c2d"
            - name: HERMES_DIST_SUBDIR
              value: ""
            - name: HERMES_OBSERVER_METRICS
              value: "1"
          # runAsUser/Group 10000 (this container only - see the pod-level
          # securityContext comment above for why it's not set pod-wide):
          # the UID the image's `hermes` user is baked in at (Dockerfile
          # `RUN useradd -u 10000 -m -d /opt/data hermes`,
          # hermes-agent-gitops fork, ~line 92). The Dockerfile
          # itself never sets `USER hermes` (its only USER directive is
          # `USER root` at ~line 214, right before the runtime-stage COPY
          # layers) and its ENTRYPOINT is s6-overlay's `/init` (~line 360),
          # so the image's *default* `docker run` identity is root,
          # dropping to `hermes` per-service via `s6-setuidgid hermes`
          # inside docker/main-wrapper.sh and docker/stage2-hook.sh at
          # runtime - neither of which this initContainer goes through (see
          # `command` above), so that drop never happens here; we set the
          # target UID directly instead. docker/stage2-hook.sh's own guard
          # (`cur_uid != 0 && cur_uid != $(id -u hermes)` => hard fail)
          # would tolerate this UID too, for what it's worth, since it's
          # exactly the image's baked-in hermes UID - but this container
          # bypasses that script entirely, so it's moot here; it mattered
          # more before the s6-bypass fix below (see the main container's
          # own command comment) and is kept for the main container's own
          # rationale. Live-verified end-to-end in this task's k3d check
          # (see the Task 8 report) - a fresh PVC's mkdir/write both
          # succeed under UID 10000 thanks to fsGroup + OnRootMismatch.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: boot-script
              mountPath: /scripts
              readOnly: true
            - name: env-secret
              mountPath: /run/secrets/hermes-env
              readOnly: true
            - name: api-key-secret
              mountPath: /run/secrets/hermes-api-key
              readOnly: true
            - name: observer-plugins
              mountPath: /plugins
              readOnly: true
      containers:
        - name: hermes-agent
          image: ghcr.io/dummy/hermes-agent:hermes-base-2026-07
          imagePullPolicy: IfNotPresent
          # Overrides the image's s6 ENTRYPOINT (command), not just args -
          # this is a deliberate departure from the fork's docker-compose
          # default (`entrypoint` unset, `command: ["gateway", "run"]`,
          # which DOES go through /init). Live-verified in this task's k3d
          # check: going through /init, docker/cont-init.d/02-reconcile-profiles
          # unconditionally reconciles and *starts* an s6-supervised gateway
          # for the image's built-in "default" profile (independent of
          # whatever `hermes profile use` set as active), and s6's
          # `main-hermes` service starts a SECOND gateway process for it
          # under supervision. Our own container CMD then execs a THIRD
          # `hermes gateway run` (for the active/support-agent profile) as
          # main-wrapper.sh's "main program" - all three race for
          # API_SERVER_PORT 8642, and the pod crash-loops with "[Errno 98]
          # address already in use". Invoking the CLI directly (no /init, no
          # s6, no cont-init.d, no reconcile-profiles) sidesteps all of that
          # for this single-tenant pod: only the one profile installed by
          # the initContainer ever runs. Trade-off: s6's auto-restart-on-crash
          # supervision is skipped - acceptable, since Kubernetes' own pod
          # restartPolicy already provides container-level restart.
          # No HERMES_UID/HERMES_GID env vars are set here: those exist to
          # trigger stage2-hook.sh's root-only usermod/groupmod remap for
          # the docker-compose root-then-drop flow, which this pod also
          # doesn't go through at all now (see securityContext comment
          # above for the separate, still-applicable UID/GID rationale).
          command: ["/opt/hermes/bin/hermes"]
          args: ["gateway", "run"]
          # See the bootstrap-distribution initContainer's securityContext
          # comment for the UID/GID rationale (same image, same baked-in
          # hermes UID 10000) - set per-container, not pod-wide, so the
          # ingress sidecars keep their own image's default where needed.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
          env:
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-support-agent-api-key
                  key: password
            # Explicit env beats envFrom in k8s precedence, which is why
            # the per-profile secret-driven opt-out uses the DISTINCT
            # HERMES_OBSERVER_METRICS_DISABLED variable (via envFrom
            # below) instead of overriding this one.
            - name: HERMES_OBSERVER_METRICS
              value: "1"
            - name: HERMES_OBSERVER_METRICS_PORT
              value: "9464"
          envFrom:
            - secretRef:
                name: hermes-support-agent-env
          ports:
            - name: http
              containerPort: 8642
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP
          # GET /health is unauthenticated (gateway/platforms/api_server.py,
          # hermes-agent-gitops fork, ~line 1836 - `_handle_health`
          # does not call `_check_auth`, unlike every other route including
          # `/health/detailed`), so probes need no credentials.
          startupProbe:
            httpGet:
              path: /health
              port: 8642
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8642
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8642
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /opt/data
        - name: dashboard
          # The Hermes browser dashboard (`hermes dashboard`: the web SPA +
          # JSON-RPC/WS gateway, image-bundled dist) as its own supervised
          # container. In the s6 image this is an s6 service slot, but this
          # pod deliberately bypasses /init (see the hermes-agent command
          # comment above), so the slot never starts there - this sidecar is
          # the pod-world equivalent, honoring the same env contract
          # (HERMES_DASHBOARD + the dashboard_auth provider vars, delivered
          # via the profile's env Secret). When the trio is absent the
          # container idles instead of exiting: a clean exit would
          # crash-loop under restartPolicy Always, and rendering the
          # container conditionally on Secret CONTENTS is impossible at
          # template time (Helm only sees the Secret's name).
          image: ghcr.io/dummy/hermes-agent:hermes-base-2026-07
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              export HOME=/opt/data
              cd /opt/data
              case "${HERMES_DASHBOARD:-}" in
                1|true|TRUE|True|yes|YES|Yes) ;;
                *) echo "[dashboard] HERMES_DASHBOARD not set - idling."; exec sleep infinity ;;
              esac
              # Non-loopback bind fails closed without an auth provider
              # (June 2026 hardening); idle loudly instead of crash-looping.
              if [ -z "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}" ] && [ -z "${HERMES_DASHBOARD_OAUTH_CLIENT_ID:-}" ]; then
                echo "[dashboard] enabled but no auth provider configured;" \
                     "set HERMES_DASHBOARD_BASIC_AUTH_USERNAME/_PASSWORD or" \
                     "HERMES_DASHBOARD_OAUTH_CLIENT_ID - idling." >&2
                exec sleep infinity
              fi
              exec /opt/hermes/bin/hermes dashboard \
                --host "${HERMES_DASHBOARD_HOST:-0.0.0.0}" \
                --port "${HERMES_DASHBOARD_PORT:-9119}" \
                --no-open
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
          envFrom:
            - secretRef:
                name: hermes-support-agent-env
          ports:
            - name: dashboard
              containerPort: 9119
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: boot-script
          configMap:
            name: hermes-support-agent-boot
            defaultMode: 0755
        - name: env-secret
          secret:
            secretName: hermes-support-agent-env
        - name: observer-plugins
          configMap:
            name: hermes-support-agent-plugins
        - name: api-key-secret
          secret:
            secretName: hermes-support-agent-api-key
            # Renamed at mount time (password -> API_SERVER_KEY) so the
            # initContainer's generic "copy every file under this dir into
            # .env" loop (pod/configmap-boot.yaml) writes the right key name
            # without special-casing this one secret.
            items:
              - key: password
                path: API_SERVER_KEY
