data:
  runtime-manifest.json: "{\"contract\":\"agent-runtime/v1alpha1\",\"spec\":{\"apps\":[\"docs-site\",\"relay\",\"vector-db\"],\"connections\":[],\"engine\":\"eve\",\"instance\":\"ag-eve-echo\",\"name\":\"echo\",\"namespace\":\"ag-eve-echo\",\"requiredSecrets\":[\"ANTHROPIC_API_KEY\"],\"runtimeImage\":\"us-docker.pkg.dev/inferlab-dev/harness-hg/eve-runtime:0.42.0\",\"source\":{\"repository\":\"https://github.com/factorylevel/eve-agents.git\",\"revision\":\"3f06a1b2c3d4e5f60718293a4b5c6d7e8f901234\",\"subdir\":\"agents/echo\"},\"workspaces\":[{\"access\":\"read-write\",\"name\":\"notes\",\"path\":\"/app/workspaces/notes\",\"repository\":\"https://github.com/factory-level/notes.git\",\"revision\":\"0123456789abcdef0123456789abcdef01234567\"},{\"access\":\"read-only\",\"name\":\"platform\",\"path\":\"/app/workspaces/platform\",\"repository\":\"github.com/factory-level/hermes-gitops-plugin\",\"revision\":\"b5113eb5c0ffee00000000000000000000000000\"}]}}"
---
# Source: eve-agent/templates/backup.yaml
# Backup path (providers.backup=pvc, ADR-150): archive the instance's data
# volume into a per-instance backups PVC on the agent's declared schedule.
# The PORT of hermes-profile/templates/pod/backup.yaml: same routine
# convention (label, `backups` sink volume, annotations), same sqlite
# snapshot step, Eve's own exclusions and protected paths:
#
#   protected  state/          the Workflow world (every session, queue,
#                              stream) and the sandbox cache - symlinked
#                              into <project>/.eve by boot.sh so a rebuild
#                              never touches it
#              src/            the checkout at spec.sha (small without the
#                              excludes below; restoring it keeps an
#                              instance coherent even if the source repo
#                              rewrote history)
#              .hermes-gitops/ the build stamp
#   excluded   node_modules/, .output/, the npm cache and eve's build /
#              diagnostic trees: rebuildable from spec.sha, and their
#              ABSENCE after a restore is what makes boot.sh rebuild
#              (it checks for .output/, not just the stamp).
#
# The workspaces claim is NOT archived: its checkouts are declarative
# (bindings pinned by sha in Git) and boot.sh re-clones what is missing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ag-eve-echo-backups
  namespace: ag-eve-echo
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-agent
    app.kubernetes.io/name: eve-agent
    app.kubernetes.io/instance: ag-eve-echo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.42.0"
    helm.sh/chart: eve-agent-0.1.0
    hermes-gitops.factorylevel.dev/persona: "echo"
    hermes-gitops.factorylevel.dev/runtime: eve
    hermes-gitops.factorylevel.dev/managed: "true"
  annotations:
    # WaitForFirstConsumer StorageClasses keep this Pending until the first
    # backup Job mounts it - steady state, not un-health (see hermes-profile).
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
# Source: eve-agent/templates/service.yaml
