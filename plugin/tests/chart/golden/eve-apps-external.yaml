      protocol: TCP
---
# Source: eve-agent/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ag-eve-echo
  namespace: ag-eve-echo
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-agent
    app.kubernetes.io/name: eve-agent
    app.kubernetes.io/instance: ag-eve-echo
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.42.0"
    helm.sh/chart: eve-agent-0.1.0
    hermes-gitops.factorylevel.dev/persona: "echo"
    hermes-gitops.factorylevel.dev/runtime: eve
    hermes-gitops.factorylevel.dev/managed: "true"
spec:
  # One replica, one volume: the default Workflow world persists run state
  # under <project>/.eve/.workflow-data on the data claim (eve's self-hosting
  # guide requires it on persistent storage), and that local world is
  # single-process. Scaling beyond 1 needs a shared Workflow world package
  # selected in agent.ts - a later arc, not a knob here.
  replicas: 1
  serviceName: ag-eve-echo
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-agent
      app.kubernetes.io/instance: ag-eve-echo
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: eve-agent
          app.kubernetes.io/instance: ag-eve-echo
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    # Workspace bindings (ADR-150, the hermes-profile shape): the bound
    # repositories' checkouts, separate from the data claim so re-pinning a
    # workspace never touches the agent's state. volumeClaimTemplates are
    # immutable on a live StatefulSet (ADR-76): binding a FIRST workspace to
    # an existing instance needs a one-time
    #   kubectl delete statefulset <name> --cascade=orphan
    # before Argo CD recreates it - the data claim survives (Retain).
    - metadata:
        name: workspaces
        labels:
          app.kubernetes.io/name: eve-agent
          app.kubernetes.io/instance: ag-eve-echo
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-agent
        app.kubernetes.io/instance: ag-eve-echo
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.42.0"
        helm.sh/chart: eve-agent-0.1.0
        hermes-gitops.factorylevel.dev/persona: "echo"
        hermes-gitops.factorylevel.dev/runtime: eve
        hermes-gitops.factorylevel.dev/managed: "true"
      annotations:
        # Rolls the pod whenever the record changes (new sha, envRequires,
        # ...) even though none of this chart's template bytes changed.
        checksum/record: 52fa955be7ee66e97139b8fd7790ad609278733ea18df240a8783155f6de5d8e
        # Rolls the pod when the boot script or the default channel file
        # change (a chart upgrade that fixes the build path must re-run the
        # initContainer on the existing instance, not wait for a new sha).
        checksum/boot: 2079a6a8e4c2ecd1988c870ed9893415a3f548328b532a9f29522673bbad5193
    spec:
      serviceAccountName: ag-eve-echo
      # eve stops every open sandbox on SIGTERM and an in-flight step must
      # reach its durable checkpoint; the default 30s turns a rolling
      # restart into re-run steps (values.yaml shutdown.gracePeriodSeconds).
      terminationGracePeriodSeconds: 120
      # fsGroup = the image's `node` user so both containers share the data
      # claim; each container pins its own UID below.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: build-agent
          image: us-docker.pkg.dev/inferlab-dev/harness-hg/eve-runtime:0.42.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/boot.sh"]
          env:
            - name: EVE_DIST_SOURCE
              value: "https://github.com/factorylevel/eve-agents.git"
            - name: EVE_DIST_SHA
              value: "3f06a1b2c3d4e5f60718293a4b5c6d7e8f901234"
            - name: EVE_DIST_SUBDIR
              value: "agents/echo"
            # Workspace bindings for boot.sh: "name source sha access" per
            # line (the script is a plain file, files/boot.sh, so the
            # bundle chart can ship the same bytes).
            - name: EVE_WORKSPACE_BINDINGS
              value: "platform https://github.com/factory-level/hermes-gitops-plugin b5113eb5c0ffee00000000000000000000000000 read-only\nnotes https://github.com/factory-level/notes.git 0123456789abcdef0123456789abcdef01234567 read-write"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: data
              mountPath: /app
            - name: boot-script
              mountPath: /scripts
              readOnly: true
            - name: workspaces
              mountPath: /app/workspaces
            - name: ws-git-notes
              mountPath: /run/secrets/repositories/notes/git
              readOnly: true
      containers:
        - name: eve-agent
          image: us-docker.pkg.dev/inferlab-dev/harness-hg/eve-runtime:0.42.0
          imagePullPolicy: IfNotPresent
          workingDir: /app/src/agents/echo
          # The project's own eve (the build step proved it equals the
          # image's pin) serves the Nitro output under .output/. PORT is
          # eve's own port variable; --host binds every interface so the
          # Service can reach it.
          command: ["./node_modules/.bin/eve"]
          args: ["start", "--host", "0.0.0.0"]
          env:
            - name: HOME
              value: /app/home
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: EVE_PROJECT_DIR
              value: "/app/src/agents/echo"
            # Workspace bindings: one variable per bound repository naming
            # its checkout (boot.sh clones it at the pinned sha; a failed
            # clone leaves the variable pointing at a missing directory -
            # degraded, the agent decides what that means).
            - name: EVE_WORKSPACES_ROOT
              value: /app/workspaces
            - name: EVE_WORKSPACE_PLATFORM
              value: /app/workspaces/platform
            - name: EVE_WORKSPACE_NOTES
              value: /app/workspaces/notes
            # Route auth: the minted Basic credential the default
            # agent/channels/eve.ts verifies (templates/route-auth-secret.yaml).
            # The default channel reads the PASSWORD FILE per request, so a
            # re-minted Secret propagates through the volume without a
            # restart. The env form is provided for authored channels that
            # prefer httpBasic({username, password}); it is captured at
            # process start and goes stale on a re-mint - authors choosing
            # it accept that.
            - name: ROUTE_AUTH_BASIC_USERNAME
              value: "agent"
            - name: ROUTE_AUTH_BASIC_PASSWORD_FILE
              value: /run/secrets/route-auth/password
            - name: ROUTE_AUTH_BASIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ag-eve-echo-route-auth
                  key: password
          envFrom:
            - secretRef:
                name: ag-eve-echo-env
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # GET /eve/v1/health is public by design (route auth never covers
          # it), so probes need no credentials.
          startupProbe:
            httpGet:
              path: /eve/v1/health
              port: 3000
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /eve/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /eve/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: data
              mountPath: /app
            - name: workspaces
              mountPath: /app/workspaces
            # /hg: what the platform resolved for this agent (ADR-153).
            # Read-only and outside /app deliberately - it describes the
            # deployment, it is not part of it.
            - name: runtime-manifest
              mountPath: /hg
              readOnly: true
            - name: route-auth
              mountPath: /run/secrets/route-auth
              readOnly: true
      volumes:
        - name: boot-script
          configMap:
            name: ag-eve-echo-boot
            defaultMode: 0755
        - name: runtime-manifest
          configMap:
            name: ag-eve-echo-runtime-manifest
        # 0440, not 0400: Secret volumes are owned by root with fsGroup as
        # the group, and the process runs as uid 1000 - group-read is what
        # lets it read the file.
        - name: route-auth
          secret:
            secretName: ag-eve-echo-route-auth
            defaultMode: 0440
        - name: ws-git-notes
          secret:
            secretName: notes-git-auth
            defaultMode: 0440
