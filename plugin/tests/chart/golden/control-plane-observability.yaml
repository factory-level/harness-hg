# Source: control-plane-observability/templates/configmap-dashboard-backup.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane-observability-backup-history
  namespace: hermes-monitoring
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: observability
    grafana_dashboard: "1"
    app.kubernetes.io/name: control-plane-observability
    app.kubernetes.io/instance: control-plane-observability
  annotations:
    grafana_folder: Control Plane
data:
  control-plane-observability-backup-history.json: |
    {
      "uid": "hg-backup-history",
      "title": "Hermes — Backup history",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": { "from": "now-7d", "to": "now" },
      "templating": { "list": [
        {
          "name": "namespace",
          "label": "Namespace",
          "type": "textbox",
          "hide": 0,
          "query": "hermes-.*",
          "current": { "text": "hermes-.*", "value": "hermes-.*" }
        }
      ] },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Control plane",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 },
          "panels": []
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "Backup runs — control plane (succeeded / failed / active)",
          "description": "One series per backup Job, joined to its owning routine CronJob. kube_job_* series exist while the Job objects are retained (the routines' history limits); Prometheus keeps the emitted samples for its 15d retention — this window IS the history.",
          "gridPos": { "x": 0, "y": 1, "w": 14, "h": 9 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": { "defaults": { "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "max by (namespace, job_name) (kube_job_status_succeeded{namespace=~\"hermes-nexus|hermes-system\"}) * on(namespace, job_name) group_left(owner_name) max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", namespace=~\"hermes-nexus|hermes-system\"})",
              "legendFormat": "ok {{namespace}}/{{owner_name}}/{{job_name}}" },
            { "refId": "B", "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "max by (namespace, job_name) (kube_job_status_failed{namespace=~\"hermes-nexus|hermes-system\"}) * on(namespace, job_name) group_left(owner_name) max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", namespace=~\"hermes-nexus|hermes-system\"})",
              "legendFormat": "fail {{namespace}}/{{owner_name}}/{{job_name}}" },
            { "refId": "C", "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "max by (namespace, job_name) (kube_job_status_active{namespace=~\"hermes-nexus|hermes-system\"}) * on(namespace, job_name) group_left(owner_name) max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", namespace=~\"hermes-nexus|hermes-system\"})",
              "legendFormat": "active {{namespace}}/{{owner_name}}/{{job_name}}" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Run duration (s) — control plane",
          "description": "completion_time - start_time per finished backup Job. Active Jobs have no completion series yet and do not plot here.",
          "gridPos": { "x": 14, "y": 1, "w": 10, "h": 9 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "(max by (namespace, job_name) (kube_job_status_completion_time{namespace=~\"hermes-nexus|hermes-system\"}) - max by (namespace, job_name) (kube_job_status_start_time{namespace=~\"hermes-nexus|hermes-system\"})) * on(namespace, job_name) group_left(owner_name) max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", namespace=~\"hermes-nexus|hermes-system\"})",
              "legendFormat": "{{namespace}}/{{owner_name}}/{{job_name}}" }
          ]
        },
        {
          "id": 200,
          "type": "row",
          "title": "Agents",
          "gridPos": { "x": 0, "y": 10, "w": 24, "h": 1 },
          "panels": []
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Backup runs — agents (succeeded / failed / active)",
          "description": "Per-profile, bundle and app-chart routines in the agent namespaces. Same join and same retention caveat as the control-plane panel.",
          "gridPos": { "x": 0, "y": 11, "w": 14, "h": 9 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": { "defaults": { "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "max by (namespace, job_name) (kube_job_status_succeeded{namespace=~\"$namespace\", namespace!~\"hermes-nexus|hermes-system|hermes-monitoring|hermes-gitops\"}) * on(namespace, job_name) group_left(owner_name) max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", namespace=~\"$namespace\"})",
              "legendFormat": "ok {{namespace}}/{{owner_name}}/{{job_name}}" },
            { "refId": "B", "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "max by (namespace, job_name) (kube_job_status_failed{namespace=~\"$namespace\", namespace!~\"hermes-nexus|hermes-system|hermes-monitoring|hermes-gitops\"}) * on(namespace, job_name) group_left(owner_name) max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", namespace=~\"$namespace\"})",
              "legendFormat": "fail {{namespace}}/{{owner_name}}/{{job_name}}" },
            { "refId": "C", "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "max by (namespace, job_name) (kube_job_status_active{namespace=~\"$namespace\", namespace!~\"hermes-nexus|hermes-system|hermes-monitoring|hermes-gitops\"}) * on(namespace, job_name) group_left(owner_name) max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", namespace=~\"$namespace\"})",
              "legendFormat": "active {{namespace}}/{{owner_name}}/{{job_name}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Run duration (s) — agents",
          "gridPos": { "x": 14, "y": 11, "w": 10, "h": 9 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "(max by (namespace, job_name) (kube_job_status_completion_time{namespace=~\"$namespace\", namespace!~\"hermes-nexus|hermes-system|hermes-monitoring|hermes-gitops\"}) - max by (namespace, job_name) (kube_job_status_start_time{namespace=~\"$namespace\", namespace!~\"hermes-nexus|hermes-system|hermes-monitoring|hermes-gitops\"})) * on(namespace, job_name) group_left(owner_name) max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"CronJob\", namespace=~\"$namespace\"})",
              "legendFormat": "{{namespace}}/{{owner_name}}/{{job_name}}" }
          ]
        }
      ]
    }
