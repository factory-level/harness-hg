# Source: loki/templates/daemonset-promtail.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: hermes-monitoring
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: loki
    app.kubernetes.io/name: promtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
      annotations:
        checksum/config: b9cada20368f75b623f487efc0764910bb1717fc3038be686a73847d40a270ff
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.1.1
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          securityContext:
            # Reading /var/log/pods requires root on most nodes; promtail
            # is read-only there and writes only its positions file.
            runAsUser: 0
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/promtail}
            - {name: run, mountPath: /run/promtail}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: containers, mountPath: /var/lib/docker/containers, readOnly: true}
      volumes:
        - name: config
          configMap: {name: promtail-config}
        - name: run
          hostPath: {path: /run/promtail, type: DirectoryOrCreate}
        - name: pods
          hostPath: {path: /var/log/pods}
        - name: containers
          hostPath: {path: /var/lib/docker/containers}
---
# Source: loki/templates/statefulset-loki.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: hermes-monitoring
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: loki
    app.kubernetes.io/name: loki
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
      annotations:
        checksum/config: 85bcd6fddc7219e553bfc2aa10d9d16ed18d2340afbfd73f534b8f7ecb1be407
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: loki
          image: grafana/loki:3.1.1
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
