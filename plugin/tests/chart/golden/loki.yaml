---
# Source: loki/templates/promtail-rbac.yaml
# Promtail needs to list pods to map log files to streams. Read-only,
# cluster-wide - it collects BOTH planes (one label apart, ADR 0164).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: hermes-monitoring
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: loki
    app.kubernetes.io/name: promtail
---
# Source: loki/templates/configmap-dashboard.yaml
# The control-plane logs dashboard (#661 acceptance): plane-split queries
# against the fixed "loki" datasource uid. uid is a promised constant, the
# control-plane singleton convention (hg-control-plane-* family).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-dashboard
  namespace: hermes-monitoring
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: loki
    app.kubernetes.io/name: loki
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Control Plane
data:
  control-plane-logs.json: |
    {
      "uid": "hg-control-plane-logs",
      "title": "Control Plane / Logs",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "Control-plane logs (plane=\"control-plane\")",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "{plane=\"control-plane\"}"}],
          "options": {"showLabels": true, "sortOrder": "Descending"}
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Workload errors (plane=\"workload\" |~ (?i)error)",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "{plane=\"workload\"} |~ `(?i)error`"}],
          "options": {"showLabels": true, "sortOrder": "Descending"}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Log volume by plane",
          "gridPos": {"h": 7, "w": 24, "x": 0, "y": 20},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{"refId": "A", "expr": "sum by (plane) (rate({plane=~\".+\"}[5m]))"}]
        }
      ]
    }
---
# Source: loki/templates/configmap-datasource.yaml
# The Grafana datasource, provisioned declaratively via the datasources
# sidecar (grafana_datasource: "1"). The uid "loki" is FIXED and
# load-bearing, the "prometheus" uid precedent: provisioned logs panels
# reference the datasource by this uid, never by name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: hermes-monitoring
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: loki
    app.kubernetes.io/name: loki
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.hermes-monitoring.svc:3100
        isDefault: false
---
# Source: loki/templates/configmap-loki.yaml
# Loki's own config: single binary, filesystem object store, TSDB index,
# compactor-enforced retention. auth_enabled false - the Service is
# cluster-internal only; Grafana is the only intended client.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: hermes-monitoring
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: loki
    app.kubernetes.io/name: loki
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 24h
---
# Source: loki/templates/configmap-promtail.yaml
# The collector config. The plane relabel is the point (ADR 0164): every
# stream carries plane=control-plane|workload derived from its namespace,
# so the two planes are one query dimension apart and never interleaved
# by default.
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: hermes-monitoring
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: loki
    app.kubernetes.io/name: promtail
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki.hermes-monitoring.svc:3100/loki/api/v1/push
    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # plane=control-plane for the declared namespaces + prefix,
          # else workload (control-plane/planes.yaml is the authority).
          - target_label: plane
            replacement: workload
          - source_labels: [__meta_kubernetes_namespace]
            regex: "(argocd|external-secrets|hermes-secrets|hermes-system|hermes-monitoring|hermes-system-.*)"
            target_label: plane
            replacement: control-plane
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
---
