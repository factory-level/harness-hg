# Source: eve-bundle/templates/networkpolicy.yaml
# Bundling is a CO-LOCATION decision and must never be a security
# downgrade (hermes-bundle/templates/networkpolicy.yaml): every enabled
# member's port is admitted, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ag-eve-team
  namespace: ag-eve-team
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-bundle
    app.kubernetes.io/name: eve-bundle
    app.kubernetes.io/instance: ag-eve-team
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.42.0"
    helm.sh/chart: "eve-bundle-0.1.0"
    hermes-gitops.factorylevel.dev/bundle: "team"
    hermes-gitops.factorylevel.dev/runtime: eve
    hermes-gitops.factorylevel.dev/managed: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: eve-bundle
      app.kubernetes.io/instance: ag-eve-team
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
        - port: 3100
          protocol: TCP
