# Source: eve-bundle/templates/backup.yaml
# Backup path for an Eve bundle (ADR-150): the eve-agent routine over the
# SHARED data claim - every member's members/<name>/{state,src,
# .hermes-gitops} in one archive. Gated on providers.backup ALONE (the
# hermes-bundle rule): bundling retires each member's own CronJob, so the
# members' declared intent has nowhere else to live; the schedule and
# retention are the platform's backup.* values. Same exclusions as
# eve-agent (node_modules/.output/caches/eve build trees are rebuilt from
# each member's sha - their absence is what makes boot.sh rebuild); the
# workspaces claim is never archived (declarative, re-cloned).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ag-eve-team-backups
  namespace: ag-eve-team
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-bundle
    app.kubernetes.io/name: eve-bundle
    app.kubernetes.io/instance: ag-eve-team
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.42.0"
    helm.sh/chart: "eve-bundle-0.1.0"
    hermes-gitops.factorylevel.dev/bundle: "team"
    hermes-gitops.factorylevel.dev/runtime: eve
    hermes-gitops.factorylevel.dev/managed: "true"
  annotations:
    # WaitForFirstConsumer StorageClasses keep this Pending until the first
    # backup Job mounts it - steady state, not un-health (see hermes-profile).
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
# Source: eve-bundle/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: ag-eve-team
  namespace: ag-eve-team
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-bundle
    app.kubernetes.io/name: eve-bundle
    app.kubernetes.io/instance: ag-eve-team
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.42.0"
    helm.sh/chart: "eve-bundle-0.1.0"
    hermes-gitops.factorylevel.dev/bundle: "team"
    hermes-gitops.factorylevel.dev/runtime: eve
    hermes-gitops.factorylevel.dev/managed: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eve-bundle
    app.kubernetes.io/instance: ag-eve-team
  ports:
    - name: echo
      port: 3000
      targetPort: 3000
      protocol: TCP
      appProtocol: http
    - name: greeter
      port: 3100
      targetPort: 3100
      protocol: TCP
      appProtocol: http
---
# Source: eve-bundle/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ag-eve-team
  namespace: ag-eve-team
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-bundle
    app.kubernetes.io/name: eve-bundle
    app.kubernetes.io/instance: ag-eve-team
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.42.0"
    helm.sh/chart: "eve-bundle-0.1.0"
    hermes-gitops.factorylevel.dev/bundle: "team"
    hermes-gitops.factorylevel.dev/runtime: eve
    hermes-gitops.factorylevel.dev/managed: "true"
spec:
  # One replica: every member's local Workflow world is single-process
  # (eve-agent/templates/statefulset.yaml says why).
  replicas: 1
  serviceName: ag-eve-team
  selector:
    matchLabels:
      app.kubernetes.io/name: eve-bundle
      app.kubernetes.io/instance: ag-eve-team
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  volumeClaimTemplates:
    # The shared data claim: /app/members/<name>/{src,state,home,.npm,
    # .hermes-gitops} per member - each member's world store is its own.
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: eve-bundle
          app.kubernetes.io/instance: ag-eve-team
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    # The bundle's workspaces claim (always rendered, like hermes-bundle's,
    # so adding a first repository never hits ADR-76's immutable-template
    # rule).
    - metadata:
        name: workspaces
        labels:
          app.kubernetes.io/name: eve-bundle
          app.kubernetes.io/instance: ag-eve-team
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eve-bundle
        app.kubernetes.io/instance: ag-eve-team
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.42.0"
        helm.sh/chart: "eve-bundle-0.1.0"
        hermes-gitops.factorylevel.dev/bundle: "team"
