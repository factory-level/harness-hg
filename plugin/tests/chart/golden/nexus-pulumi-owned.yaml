          "description": "Group selected objects into a named presentation hull (ADR-72): move together, rename, collapse to a pill, ungroup without deleting members. Pure canvas arrangement - deployment grouping stays plan data and these never feed a rollup.",
          "milestone": "M13 · Canvas editing",
          "defaultOff": true
        },
        {
          "id": "edit-inspector",
          "title": "Edit-mode inspector",
          "description": "Selecting one card in edit mode docks the component drawer beside the canvas (non-modal, canvas keeps the keyboard) with a Canvas section - sheet position and remove-from-sheet - kept visibly apart from the read-only inventory facts. A multi-selection shows a count panel with bulk remove.",
          "milestone": "M13 · Canvas editing",
          "defaultOff": true
        },
        {
          "id": "canvas-multiselect",
          "title": "Multi-selection",
          "description": "The Miro selection grammar in edit mode: shift-click toggles, a Shift-held or Select-tool background drag sweeps a marquee (a bare drag pans), Cmd/Ctrl-A selects the sheet, arrows nudge (Shift = grid step). A drag or Delete of many objects is ONE undo step.",
          "milestone": "M13 · Canvas editing",
          "defaultOff": false
        },
        {
          "id": "eval-results",
          "title": "Eval results",
          "description": "Published eval results on agent detail and in the Agents directory, and the eval source in the health overlay (ADR-57). Off means the adapter reports `not configured` regardless of what has been published.",
          "milestone": "M1 · Evals",
          "defaultOff": true
        },
        {
          "id": "iam-badge",
          "title": "IAM badge",
          "description": "A shield on every card carrying an ADR-40 workload endpoint, listing the hostnames published outside the cluster (in-cluster Service URLs are deliberately not counted). It reports publication, not authorization - Cloudflare Access group membership is not carried in the plan yet.",
          "milestone": "M10 · Canvas object system",
          "defaultOff": true
        },
        {
          "id": "alerting-badge",
          "title": "Alerting badge",
          "description": "A bell on the agents alarms are ROUTED TO - earned twice over: an alarm-family route must deliver to the agent AND the alert pipeline (promstack Prometheus, the feed into Alertmanager) must be connected. Count = inbound alarm routes + the live firing summary. Merely being monitored rings nothing; on a typical fleet this is one bell, on the SRE.",
          "milestone": "M10 · Canvas object system",
          "defaultOff": true
        },
        {
          "id": "backups-view",
          "title": "Backups",
          "description": "The top-level Backups surface: every discovered routine as a status row with its schedule, retention, protected paths and last success, plus the platform backup summary. Schedule health and artifact verification are separate columns on purpose - a routine that runs nightly and has never been read back is not a proven restore point, and this view refuses to render it as one.",
          "milestone": "M12 · Backups",
          "defaultOff": true
        },
        {
          "id": "avatar-gallery",
          "title": "Avatar gallery",
          "description": "The avatar-code page at #/avatars: the platform's animated avatar inventory with click-to-copy codes for agent display.icon declarations. Read-only reference material - the selection itself is a persona-repository declaration.",
          "milestone": "Wave 5 · Brand",
          "defaultOff": false
        },
        {
          "id": "canvas-object-demo",
          "title": "Canvas Object Demo",
          "description": "A specimen sheet beside System showing all eight canvas object kinds at the design's exact coordinates - including reserved profiles, agent distributions and communication panels, which no plan can express until a dashboard-plan v1alpha3. It renders no live data: every name on it is fiction, and the sheet says so.",
          "milestone": "M10 · Canvas object system",
          "defaultOff": true
        },
        {
          "id": "canvas-badge-demo",
          "title": "Canvas Badge Demo",
          "description": "A specimen page beside Objects showing every badge domain in every state it has — including the `none` state an enabled domain renders when it has nothing to report, and the two disclaimers that keep IAM and Alerting honest. Every badge is drawn by the production card from synthetic facts: it renders no live data, and every name on it is fiction.",
          "milestone": "M10 · Canvas object system",
          "defaultOff": true
        }
      ]
    }
    
