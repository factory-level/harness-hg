# Source: nexus/templates/configmaps.yaml
# Operator configuration, resolved at Path.home()/.hermes/plugins/
# hermes-gitops/config.yaml - HOME points at the state volume, and this
# file is subPath-mounted onto that exact path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  labels: {hermes-gitops.factorylevel.dev/plane: control-plane, hermes-gitops.factorylevel.dev/component: nexus, app.kubernetes.io/name: nexus}
data:
  config.yaml: |
    repoPath: /repo
    cacheSeconds: 15
    staleAfterSeconds: 90
    backupStaleHours: 48
    evalStaleHours: 168
    integrations:
      argocd: {baseUrl: "https://argocd.example.com"}
      grafana:
        baseUrl: "https://grafana.example.com"
      # READ, not linked: the alert and uptime sources query this.
      prometheus: {baseUrl: "http://monitoring-prometheus.hermes-monitoring.svc:9090"}
      router: {baseUrl: "http://hermes-event-router.hermes-system.svc"}
    # External tool URLs (#469, spec §23) - rendered whole, same reason as
    # capabilities below: an id the chart does not know about still
    # reaches the backend, which is the one that gates each value.
    toolUrls: {}
    workspace:
      identityHeader: "Cf-Access-Authenticated-User-Email"
      ownerEmails: []
    oidc:
      issuer: ""
      clientId: "nexus"
      roleClaim: "email"
      roles:
        owner: []
        operator: []
        viewer: []
    adapters:
      argo: {enabled: true}
      gateway: {enabled: false}
    # Deployment capabilities (ADR-84). Rendered whole so a key the chart
    # does not know about still reaches the backend, which resolves any
    # non-boolean as absent.
    capabilities: {"views":{"agents":true,"backups":true,"communication":true,"system":true},"workspaceReset":false}
---
# Source: nexus/templates/backup.yaml
# The overlay state's backup routine - the SAME convention every routine
# follows (ADR-31/48): labelled CronJob, sink volume named `backups`,
# protects annotation naming what the artifact must contain. hg backup
# and hg platform backup discover it exactly like a profile's.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-backups
  labels: {hermes-gitops.factorylevel.dev/plane: control-plane, hermes-gitops.factorylevel.dev/component: nexus, app.kubernetes.io/name: nexus}
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Source: nexus/templates/deployment.yaml
# The standalone Nexus service (ADR-48). HOME points at the state PVC, so
# plugin_api's Path.home()-derived state paths land on durable storage
# with zero code change; the config file is subPath-mounted onto the
# exact path the plugin resolves. The plan arrives by git clone (init)
# and stays fresh by pull (sidecar) - Nexus stays a projection of the
# GitOps repository, never a second authority (ADR-42).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-state
  labels: {hermes-gitops.factorylevel.dev/plane: control-plane, hermes-gitops.factorylevel.dev/component: nexus, app.kubernetes.io/name: nexus}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Source: nexus/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nexus-argo-reader
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  # Backup routines are labelled CronJobs and can live in any profile
  # namespace, so this is necessarily cluster-scoped. Jobs are the
  # routines' RUNS (the Backups view's per-run strip joins them back by
  # ownerReferences - a Job carries no routine label to select on). No
  # Pods, no logs.
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
  # Workspace mount PRESENCE (ADR-77): /nexus/workspaces joins the
  # declared bindings with the running pod's volumeMounts, and profile
  # pods live one per namespace - cluster-scoped like the CronJob rule
  # above, for the same reason. Pod SPECS only: no exec, no logs, and a
  # spec carries env NAMES and secret REFERENCES, never values. This is
  # still a widening - a compromised UI pod can now enumerate pod shapes
  # fleet-wide - and it is recorded as such in ADR-77.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# Source: nexus/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus-argo-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nexus-argo-reader
subjects:
  - kind: ServiceAccount
    name: nexus
    namespace: hermes-nexus
---
# Source: nexus/templates/rbac.yaml
# The operator-host records (ADR-55 / M01, ADR-59 / #282): NAMED
# ConfigMaps in this namespace, get only. A namespaced Role with
# resourceNames, not a wider ClusterRole rule - "read ConfigMaps"
# cluster-wide would include every mounted config in every namespace, and
# this pod needs exactly these two. Adding a third means adding it here:
# `_k8s_get_optional` treats only a 404 as "absent", so a missing grant
# surfaces as a 500 rather than as an empty surface, which is the
# behaviour we want and the reason this list has to stay in step.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-reconciliation-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - hermes-reconciliation-status
      - hermes-platform-backup-status
    verbs: ["get"]
---
# Source: nexus/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-reconciliation-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nexus-reconciliation-reader
subjects:
  - kind: ServiceAccount
    name: nexus
    namespace: hermes-nexus
---
# Source: nexus/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: nexus
  labels: {hermes-gitops.factorylevel.dev/plane: control-plane, hermes-gitops.factorylevel.dev/component: nexus, app.kubernetes.io/name: nexus}
spec:
  selector: {app.kubernetes.io/name: nexus}
  ports:
    - port: 80
      targetPort: 8080
---
# Source: nexus/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: nexus
    app.kubernetes.io/name: nexus
    # Queried by `hg up` to decide whether it owns this release (ADR-53).
    hermes.dev/owner: "pulumi"
spec:
  replicas: 1
  strategy: {type: Recreate}   # the state PVC is RWO
  selector:
    matchLabels: {app.kubernetes.io/name: nexus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nexus}
      annotations:
        # Scraped by the monitoring stack's existing kubernetes-pods
        # annotation job (#280) - no ServiceMonitor, no monitoring-chart
        # change. /metrics serves published eval results.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        # Roll the pods when the projected code/UI changes - a ConfigMap
        # edit alone updates mounts minutes later without a restart, which
        # left a crashed old process running the new file (observed live).
        # features.json rides the code checksum too: it is projected into
        # the SAME nexus-code ConfigMap, and plugin_api.py captures the
        # registry once at import (FEATURES, plugin_api.py:88), so adding
        # a flag without a restart left the pod serving the old set.
        # `codeChecksum` is the same payload hashed by the CALLER (Pulumi
        # hashes the projected files so its Release diff can see them at
        # all - it does not read a local chart's contents). Preferred when
        # set so the two never disagree; a plain `helm install` still gets
        # the render-time hash below.
        # The UI bundles are NOT chart files (they live in the externally
        # provisioned dist ConfigMap, see configmaps.yaml), so the
        # render-time fallback cannot see them; the CALLER's codeChecksum
        # hashes control-plane/nexus/dist too - style.css included, because
        # the brand fonts live INSIDE it (ADR-105) and a CSS-only update
        # must roll the pod, or standalone.py's boot-time DIST_VERSION keeps
        # advertising the old cache key over a new mount.
        checksum/code: 71e1ce834deec459840cc8769c6ee72b95c1ad88d0b235bd8a2a2fad93ad39ea
        # Same reason, for the CONFIG map: changing an integration base URL
        # rewrote the ConfigMap and left the running pod on the old value,
        # so Nexus kept serving dead Grafana/Argo links after a fixed `up`.
        checksum/config: 7cb93ef522870f2186f14cd15276366f7801c9f023a7d8f2adb1ed5c74d21c65
    spec:
      serviceAccountName: nexus
      initContainers:
        - name: clone
          image: ghcr.io/factory-level/harness-hg-nexus:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /state/.hermes/plugins/hermes-gitops/state
              rm -rf /repo/* /repo/.git 2>/dev/null || true
              git config --global credential.helper '!f() { echo "username=${GIT_USERNAME}"; echo "password=${GIT_TOKEN}"; }; f'
              git clone --depth 1 --branch main \
                "https://github.com/org/gitops.git" /repo
          env:
            - name: GIT_USERNAME
              valueFrom: {secretKeyRef: {name: "nexus-gitops-auth", key: username}}
            - name: GIT_TOKEN
              valueFrom: {secretKeyRef: {name: "nexus-gitops-auth", key: token}}
          volumeMounts:
            - {name: repo, mountPath: /repo}
            - {name: state, mountPath: /state}
      containers:
        - name: nexus
          image: ghcr.io/factory-level/harness-hg-nexus:0.0.0-dev
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["uvicorn", "standalone:app", "--host", "0.0.0.0", "--port", "8080"]
          env:
            - {name: HOME, value: /state}
            - {name: PYTHONPATH, value: /app}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - {name: code, mountPath: /app}
            - {name: dist, mountPath: /app/dist}
            - {name: repo, mountPath: /repo, readOnly: true}
            - {name: state, mountPath: /state}
            - name: config
              mountPath: /state/.hermes/plugins/hermes-gitops/config.yaml
              subPath: config.yaml
        - name: repo-sync
          image: ghcr.io/factory-level/harness-hg-nexus:0.0.0-dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              git config --global credential.helper '!f() { echo "username=${GIT_USERNAME}"; echo "password=${GIT_TOKEN}"; }; f'
              while true; do
                git -C /repo pull --quiet || echo "[repo-sync] pull failed; retrying"
                sleep 60
              done
          env:
            - name: GIT_USERNAME
              valueFrom: {secretKeyRef: {name: "nexus-gitops-auth", key: username}}
            - name: GIT_TOKEN
              valueFrom: {secretKeyRef: {name: "nexus-gitops-auth", key: token}}
          volumeMounts:
            - {name: repo, mountPath: /repo}
      volumes:
        - {name: repo, emptyDir: {}}
        - {name: state, persistentVolumeClaim: {claimName: nexus-state}}
        - {name: code, configMap: {name: nexus-code}}
        - {name: dist, configMap: {name: "nexus-ui-dist"}}
        - {name: config, configMap: {name: nexus-config}}
---
# Source: nexus/templates/backup.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nexus-backup
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: nexus
    app.kubernetes.io/name: nexus
    hermes.dev/backup-routine: "true"
  annotations:
    hermes.dev/backup-protects: ".hermes/plugins/hermes-gitops/state"
    # Retention and destination as READABLE facts (#282). Both are already
    # true of this routine - retention is interpolated into the prune step
    # below, the destination is the `backups` volume - but only as shell
    # text and a volume name. A Backups view that has to parse a container
    # command to tell an operator how many restore points exist would be
    # reading the wrong thing; these annotations are the contract.
    hermes.dev/backup-retention: "7"
    hermes.dev/backup-destination: pvc
spec:
  schedule: "45 3 * * *"
  concurrencyPolicy: Forbid
  # Keep enough finished Jobs for the Backups view's per-run strip to
  # show real history (defaults are 3/1); the long window lives in
  # Grafana's kube_job_* series, not in retained objects.
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app.kubernetes.io/name: nexus-backup}
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: {app.kubernetes.io/name: nexus}
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: busybox:1.37
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  ts="$(date -u +%Y%m%d-%H%M%S)"
                  archive="/backups/nexus-state-${ts}.tar.gz"
                  echo "[backup] archiving /data -> ${archive}"
                  tar czf "${archive}" -C /data .
                  ls -1 /backups/*.tar.gz | sort -r | tail -n +8 | while read -r old; do
                    rm -f "${old}"
                  done
              volumeMounts:
                - {name: data, mountPath: /data, readOnly: true}
                - {name: backups, mountPath: /backups}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: nexus-state, readOnly: true}
            - name: backups
              persistentVolumeClaim: {claimName: nexus-backups}
