---
# Source: nexus/templates/rbac.yaml
# The read surface behind the runtime overlay (ADR-55): Argo Applications
# and labelled backup CronJobs. Nothing writes, and nothing reads a Secret
# or a ConfigMap cluster-wide - every widening here is a widening of what a
# compromised read-only UI pod could enumerate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus
---
# Source: nexus/templates/configmaps.yaml
# The service's python code + served data files, projected from committed
# chart files (synced from control-plane/nexus - see Chart.yaml). The UI
# bundles (dist/index.js, standalone.js, style.css) are NOT embedded here:
# every chart file lands in the Helm release Secret twice (chart file +
# rendered manifest), and #804 found the release at 1,072,560 bytes against
# the 1MiB cap. #807 dropped index.js believing nothing in-cluster read it -
# wrong: standalone.js is a shell that imports index.js at runtime, and the
# deployed Nexus served a blank page. The dist ConfigMap is therefore
# provisioned OUTSIDE the release (the Pulumi bootstrap, or `hg up` in the
# local loop) and mounted by name: .Values.dist.configMapName
# (nexus-ui-dist - a new name, because this release used to own nexus-dist).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-code
  labels: {hermes-gitops.factorylevel.dev/plane: control-plane, hermes-gitops.factorylevel.dev/component: nexus, app.kubernetes.io/name: nexus}
data:
  plugin_api.py: |
    """Nexus plugin backend (design 11, ADR-42).
    
    Serves the compiled plan from a local GitOps repository clone and layers
    runtime health on top: Argo CD via the operator host's kubectl context
    (``kubectl get applications.argoproj.io -A -o json`` - the platform's
    existing idiom, zero new credentials). The gateway ``/health/detailed``
    adapter is a declared, disabled stub - enabling it without both credential
    layers configured reports ``unknown``, never healthy.
    
    Mounted by the Hermes dashboard under ``/api/plugins/hermes-gitops/`` and
    session-authenticated by the host like every plugin route. The browser
    never receives credentials, raw Kubernetes objects, or raw Hermes
    configuration - this module reads exactly one artifact: the generated
    ``deployments/dashboard/nexus-plan.json`` (schema
    ``dashboard-plan/v1alpha1``, already allowlisted at compile time).
    
    Operator configuration (``~/.hermes/plugins/hermes-gitops/config.yaml``)::
    
        repoPath: /path/to/gitops-clone   # required for real data
        kubeContext: ""                   # optional
        cacheSeconds: 15
        staleAfterSeconds: 90
        backupStaleHours: 48              # a routine older than this reads degraded
        platformBackupStaleHours: 48      # a platform backup RECORD older than this reads unknown
        reconcileStaleSeconds: 1800       # a reconciliation record older than this reads unknown
        probeWindow: 15m                  # a probe that failed inside this window reads as failing
        controlPlaneNamespace: ""         # where the status ConfigMaps live; empty = the pod's own
        integrations:
          argocd:  { baseUrl: https://argocd.example.internal }
          grafana: { baseUrl: https://grafana.example.internal }
        adapters:
          argo:    { enabled: true }
          gateway: { enabled: false }     # stub - reports unknown when enabled
    """
    
    from __future__ import annotations
    
    import base64
    import hashlib
    import hmac
    import json
    import os
    import re
    import secrets
    import subprocess
    import time
    from urllib.parse import quote as _url_quote, urlencode
    from datetime import datetime, timezone
    from pathlib import Path
    from typing import Any, Dict, List, Optional, Tuple
    
    from fastapi import APIRouter, Body, HTTPException, Request, Response
    
    try:  # PyYAML ships with Hermes; be tolerant anyway.
        import yaml
    except Exception:  # pragma: no cover
        yaml = None  # type: ignore[assignment]
    
    router = APIRouter()
    
    CONFIG_PATH = Path.home() / ".hermes" / "plugins" / "hermes-gitops" / "config.yaml"
    # Where `hg nexus emit` writes the plan since the #732 flip. The pre-flip
    # location is read as a fallback so a GitOps repo emitted by an older
    # plugin keeps serving until it is re-emitted - the two diverged unnoticed
    # (emit moved, this reader did not) and a fresh emit would have 503'd the
    # deployed Nexus.
    PLAN_RELPATH = Path("deployments") / "control-plane" / "nexus-plan.json"
    LEGACY_PLAN_RELPATH = Path("deployments") / "dashboard" / "nexus-plan.json"
    
    
    def _plan_path(repo_path: str) -> Path:
        canonical = Path(repo_path) / PLAN_RELPATH
        if canonical.is_file():
            return canonical
        legacy = Path(repo_path) / LEGACY_PLAN_RELPATH
        return legacy if legacy.is_file() else canonical
    ICONS_RELPATH = Path("deployments") / "dashboard" / "assets" / "icons"
    COMM_RELPATH = Path("deployments") / "communication"
    STATE_DIR = Path.home() / ".hermes" / "plugins" / "hermes-gitops" / "state" / "layouts"
    FEATURES_PATH = Path.home() / ".hermes" / "plugins" / "hermes-gitops" / "state" / "features.json"
    
    _cache: Dict[str, Any] = {"at": 0.0, "doc": None, "path": None}
    
    
    # ---------------------------------------------------------------------------
    # Feature flags (ADR-43): every workspace capability beyond the design-11
    # canvas ships dark and is enabled here. The canonical registry is DATA -
    # features.json beside this module, shipped inside the plugin payload -
    # so both this backend and `hg nexus features` (the CLI enablement path)
    # read the same file; each stacked PR that delivers a flagged capability
    # appends its entry there. The browser learns the registry from the API
    # (no mirrored TypeScript copy to drift). Flags gate rendering and
    # request-time route availability only - never compilation, never
    # emitted artifacts.
    
    FEATURES_REGISTRY_PATH = Path(__file__).resolve().parent / "features.json"
    
    _MAX_FEATURES_BYTES = 16 * 1024
    
    
    def _load_registry() -> "tuple[List[Dict[str, Any]], Optional[str]]":
        """The registry plus a loud error: a broken payload must surface as
        'registry unavailable' in the API and UI, never as a silently empty
        feature list that looks like nothing has shipped yet."""
        try:
            doc = json.loads(FEATURES_REGISTRY_PATH.read_text(encoding="utf-8"))
        except Exception:
            return [], f"feature registry unreadable: {FEATURES_REGISTRY_PATH.name}"
        feats = doc.get("features") if isinstance(doc, dict) else None
        if not isinstance(feats, list):
            return [], f"feature registry malformed: {FEATURES_REGISTRY_PATH.name}"
        return [f for f in feats if isinstance(f, dict) and isinstance(f.get("id"), str)], None
    
    
    FEATURES, FEATURES_ERROR = _load_registry()
    
    
    # ---------------------------------------------------------------------------
    # The canonical control-plane inventory (design 15, ADR-55): one name per
    # workload, declared once as DATA beside this module - the same pattern
    # (and the same reasoning) as the feature registry above. The browser
    # imports the same file at build time, `hg observability` joins it with
    # live source levels, and the docs cite it instead of restating it.
    
    INVENTORY_PATH = Path(__file__).resolve().parent / "inventory.json"
    
    
    def _load_inventory() -> "tuple[List[Dict[str, Any]], Optional[str]]":
        try:
            doc = json.loads(INVENTORY_PATH.read_text(encoding="utf-8"))
        except Exception:
            return [], f"inventory unreadable: {INVENTORY_PATH.name}"
        items = doc.get("workloads") if isinstance(doc, dict) else None
        if not isinstance(items, list):
            return [], f"inventory malformed: {INVENTORY_PATH.name}"
        return [w for w in items if isinstance(w, dict) and isinstance(w.get("id"), str)], None
    
    
    INVENTORY, INVENTORY_ERROR = _load_inventory()
    
    # The control-plane's OWN namespaces (#554): every real Kubernetes
    # namespace the canonical inventory claims, plus the cluster
    # infrastructure the platform watches. An alert from one of these - or a
    # cluster-scoped alert with no namespace at all - belongs to the Hermes
    # control plane; any other namespace is an installed bundle's (profiles
    # create their own namespaces by construction). Ownership, never health.
    # `hermes-nexus` is named explicitly (#567): the inventory records the
    # local loop's namespace for Nexus (hermes-gitops), but the bootstrap
    # installs it into hermes-nexus (infra NEXUS_NS) - both are the control
    # plane's, and the backups projection already knew it while this set did
    # not. One definition now, used by alerts AND backups.
    CONTROL_PLANE_NAMESPACES = frozenset(
        {w.get("namespace") for w in INVENTORY if isinstance(w.get("namespace"), str) and " " not in w["namespace"] and "+" not in w["namespace"]}
        | {"kube-system", "external-secrets", "hermes-nexus"}
    )
    
    
    def alert_ownership(
        labels: Dict[str, Any], bundles: Optional[Dict[str, Dict[str, Any]]] = None
    ) -> Dict[str, Any]:
        """Owner scope of an alert (#554, #567), total over any labels dict.
    
        {'ownership': 'control-plane'} for the platform's own namespaces (or
        a cluster-scoped rule with no namespace at all); {'ownership':
        'bundle', 'bundle': <name>, 'bundleTitle': <title>} when the
        namespace is a known installed bundle's; {'ownership': 'unbundled'}
        for any other namespace - an unbundled profile's own. Without a
        membership map the non-control-plane answer stays the pre-#567
        'bundle', name unknown: honest-but-coarse beats guessed."""
        ns = labels.get("namespace")
        if not ns or str(ns) in CONTROL_PLANE_NAMESPACES:
            return {"ownership": "control-plane"}
        if bundles is None:
            return {"ownership": "bundle"}
        for name, bundle in bundles.items():
            if str(ns) == bundle.get("namespace") or str(ns) in (bundle.get("namespaces") or {}).values():
                return {
                    "ownership": "bundle",
                    "bundle": name,
                    "bundleTitle": str(bundle.get("displayName") or name),
                }
        return {"ownership": "unbundled"}
    
    
    @router.get("/nexus/inventory")
    def get_nexus_inventory() -> Dict[str, Any]:
        """The vocabulary, verbatim. A broken payload is loud, never an empty
        list that looks like a bare control plane."""
        if INVENTORY_ERROR:
            raise HTTPException(status_code=500, detail=f"nexus: {INVENTORY_ERROR}")
        return {"version": 1, "workloads": INVENTORY}
    
    
    # ---------------------------------------------------------------------------
    # Repository-owned icon assets (design 12): the compiler emitted
    # deployments/dashboard/assets/icons/<id>.<ext> next to the plan; this
    # serves them by bare component id and the UI falls back to the monogram
    # on 404. Same closed-allowlist posture as everything else here: the id
    # shape is the componentId pattern, the bytes are re-checked at serve
    # time (the mirrored-validator discipline - no jsonschema, no pillow,
    # just the same magic-byte gate the emitter and CLI apply).
    
    _ICON_ID_RE = re.compile(r"^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$")
    _ICON_MAX_BYTES = 256 * 1024
    _ICON_TYPES = ((".png", "image/png"), (".webp", "image/webp"))
    
    
    def resolve_icon(repo_path: str, name: str):
        """(bytes, media_type) for a genuine bounded icon asset, else None."""
        if not _ICON_ID_RE.match(name):
            return None
        base = Path(repo_path) / ICONS_RELPATH
        for ext, media in _ICON_TYPES:
            p = base / f"{name}{ext}"
            if p.is_symlink() or not p.is_file():
                continue
            data = p.read_bytes()
            genuine = (
                data.startswith(b"\x89PNG\r\n\x1a\n")
                if ext == ".png"
                else data[:4] == b"RIFF" and data[8:12] == b"WEBP"
            )
            if not genuine or len(data) > _ICON_MAX_BYTES:
                return None
            return data, media
        return None
    
    
    @router.get("/nexus/assets/icons/{name}")
    def get_nexus_icon(name: str) -> Response:
        cfg = _load_config()
        repo_path = cfg.get("repoPath")
        if not repo_path:
            raise HTTPException(status_code=503, detail="nexus: no repoPath configured")
        found = resolve_icon(str(repo_path), name)
        if found is None:
            raise HTTPException(status_code=404, detail="nexus: no such icon")
        data, media = found
        # Short-lived cache: a merged icon change shows up within minutes
        # without any cache-busting plumbing in the plan.
        return Response(content=data, media_type=media, headers={"Cache-Control": "max-age=300"})
    
    
    # ---------------------------------------------------------------------------
    # The avatar inventory (#426): a platform-curated set of animated agent
    # avatars, emitted into the gitops repo the same way icons ride
    # (deployments/dashboard/assets/avatars/<id>.<ext>) and selected by an
    # agent's display.icon declaration. Personas contribute a STRING, never
    # bytes - the whole hostile-asset surface stays inside this repo's PR
    # review. Formats are a closed set: GIF (either signature) and WebP with
    # a VP8X chunk (the only WebP layout whose canvas size is cheap to read
    # without a decoder; stills are allowed). Caps re-checked at serve time,
    # same mirrored-validator discipline as icons.
    
    AVATARS_RELPATH = Path("deployments") / "dashboard" / "assets" / "avatars"
    _AVATAR_MAX_BYTES = 512 * 1024
    _AVATAR_MAX_DIM = 256
    _AVATAR_TYPES = ((".gif", "image/gif"), (".webp", "image/webp"))
    
    
    def _avatar_dims(ext: str, data: bytes) -> Optional[Tuple[int, int]]:
        """Canvas size parsed from the header bytes alone, or None when the
        bytes are not the format the extension claims. Structural, not just
        magic (Codex catch): the GIF must carry its trailer and the WebP's
        RIFF/VP8X length fields must agree with the bytes - a forged header
        over junk must not become a served image."""
        if ext == ".gif":
            # Signature + dims + the 0x3B trailer every real GIF ends with.
            if data[:6] not in (b"GIF87a", b"GIF89a") or len(data) < 14 or data[-1:] != b"\x3b":
                return None
            return (
                int.from_bytes(data[6:8], "little"),
                int.from_bytes(data[8:10], "little"),
            )
        if data[:4] != b"RIFF" or data[8:12] != b"WEBP" or data[12:16] != b"VP8X" or len(data) < 30:
            return None
        # RIFF size = everything after the 8-byte RIFF header; VP8X's own
        # chunk is a fixed 10 bytes. Disagreement means truncated or forged.
        if int.from_bytes(data[4:8], "little") != len(data) - 8:
            return None
        if int.from_bytes(data[16:20], "little") != 10:
            return None
        return (
            1 + int.from_bytes(data[24:27], "little"),
            1 + int.from_bytes(data[27:30], "little"),
        )
    
    
    def avatar_asset_error(ext: str, data: bytes) -> Optional[str]:
        """Why these bytes are not a servable avatar, or None. Pure so the
        inventory sweep test imports the exact serve-time gate."""
        if len(data) > _AVATAR_MAX_BYTES:
            return f"{len(data)} bytes exceeds the {_AVATAR_MAX_BYTES} cap"
        dims = _avatar_dims(ext, data)
        if dims is None:
            return f"bytes are not {'a GIF' if ext == '.gif' else 'a VP8X WebP'}"
        w, h = dims
        if w != h:
            return f"{w}x{h} is not square"
        if w > _AVATAR_MAX_DIM or w == 0:
            return f"{w}x{h} exceeds the {_AVATAR_MAX_DIM}px cap"
        return None
    
    
    def resolve_avatar(repo_path: str, name: str):
        """(bytes, media_type) for a genuine bounded avatar, else None."""
        if not _ICON_ID_RE.match(name):
            return None
        base = Path(repo_path) / AVATARS_RELPATH
        for ext, media in _AVATAR_TYPES:
            p = base / f"{name}{ext}"
            if p.is_symlink() or not p.is_file():
                continue
            data = p.read_bytes()
            if avatar_asset_error(ext, data) is not None:
                return None
            return data, media
        return None
    
    
    def list_avatars(repo_path: str) -> List[Dict[str, str]]:
        """Every SELECTABLE id the byte route would serve - derived by walking
        the SAME directory through the SAME gate, so the gallery can never
        advertise an avatar the byte route refuses. Excludes "-still" stems
        (#426 beta pass): they ride the same directory because the byte route
        must serve them, but they are reduced-motion machinery, not an
        identity an agent picks - AgentAvatar derives "<code>-still" from a
        chosen code, so listing "<code>-still" itself would let someone pick
        it and have reduced motion 404 on "<code>-still-still"."""
        base = Path(repo_path) / AVATARS_RELPATH
        if not base.is_dir():
            return []
        out = []
        seen = set()
        for p in sorted(base.iterdir()):
            if p.is_symlink() or not p.is_file():
                continue
            ext = p.suffix
            if ext not in dict(_AVATAR_TYPES):
                continue
            if not _ICON_ID_RE.match(p.stem) or p.stem in seen:
                # One id, one asset: .gif sorts before .webp, matching the
                # byte route's own preference order (Codex catch - a
                # duplicated id would list twice and serve only one).
                continue
            if p.stem.endswith("-still"):
                continue
            if avatar_asset_error(ext, p.read_bytes()) is None:
                seen.add(p.stem)
                out.append({"id": p.stem, "ext": ext.lstrip(".")})
        return out
    
    
    @router.get("/nexus/assets/avatars")
    def get_nexus_avatars() -> Dict[str, Any]:
        cfg = _load_config()
        repo_path = cfg.get("repoPath")
        if not repo_path:
            raise HTTPException(status_code=503, detail="nexus: no repoPath configured")
        return {"version": 1, "avatars": list_avatars(str(repo_path))}
    
    
    @router.get("/nexus/assets/avatars/{name}")
    def get_nexus_avatar(name: str) -> Response:
        cfg = _load_config()
        repo_path = cfg.get("repoPath")
        if not repo_path:
            raise HTTPException(status_code=503, detail="nexus: no repoPath configured")
        found = resolve_avatar(str(repo_path), name)
        if found is None:
            raise HTTPException(status_code=404, detail="nexus: no such avatar")
        data, media = found
        return Response(content=data, media_type=media, headers={"Cache-Control": "max-age=300"})
    
    
    # ---------------------------------------------------------------------------
    # The font inventory (#435, ADR-105): the two brand faces as woff2, ridden
    # into the gitops repo exactly like the avatar inventory - they cannot
    # ride the chart (text ConfigMap; and the Helm release Secret sits near
    # its 1MiB cap, which is how inlining them as data: URIs failed the
    # factory roll). The stylesheet references this route by absolute path;
    # a deployment that cannot serve it falls back to system-ui per glyph.
    
    FONTS_RELPATH = Path("deployments") / "dashboard" / "assets" / "fonts"
    _FONT_MAX_BYTES = 256 * 1024
    
    
    def font_asset_error(data: bytes) -> Optional[str]:
        """Why these bytes are not a servable font, or None. Pure so the
        inventory sweep test imports the exact serve-time gate. woff2's magic
        is 'wOF2'; anything else - including a woff1 or a raw ttf - refuses,
        because the stylesheet only ever declares format(\"woff2\")."""
        if len(data) > _FONT_MAX_BYTES:
            return f"{len(data)} bytes exceeds the {_FONT_MAX_BYTES} cap"
        if data[:4] != b"wOF2":
            return "bytes are not woff2"
        return None
    
    
    def resolve_font(repo_path: str, name: str):
        """Bytes for a genuine bounded font, else None. Same shape as
        resolve_avatar: id-regex on the stem, symlink refusal, byte gate."""
        if not name.endswith(".woff2") or not _ICON_ID_RE.match(name[: -len(".woff2")]):
            return None
        p = Path(repo_path) / FONTS_RELPATH / name
        if p.is_symlink() or not p.is_file():
            return None
        data = p.read_bytes()
        if font_asset_error(data) is not None:
            return None
        return data
    
    
    @router.get("/nexus/assets/fonts/{name}")
    def get_nexus_font(name: str) -> Response:
        cfg = _load_config()
        repo_path = cfg.get("repoPath")
        if not repo_path:
            raise HTTPException(status_code=503, detail="nexus: no repoPath configured")
        data = resolve_font(str(repo_path), name)
        if data is None:
            raise HTTPException(status_code=404, detail="nexus: no such font")
        # A day, not five minutes: the faces change on the order of never,
        # and every page load asks for all three.
        return Response(content=data, media_type="font/woff2", headers={"Cache-Control": "max-age=86400"})
    
    
    _TMP_COUNTER = None  # lazy itertools.count - unique tmp per write
    
    
    def _atomic_write_json(path: Path, doc: Any) -> None:
        """Write beside, then rename - a crash never leaves a torn file. The
        tmp name carries the pid AND a process-local counter: the CLI
        (`hg nexus features`) writes the same state files from another
        process, and two request threads share this process's pid - either
        collision would let concurrent writers steal each other's rename."""
        global _TMP_COUNTER
        import itertools
        import os
    
        if _TMP_COUNTER is None:
            _TMP_COUNTER = itertools.count()
        path.parent.mkdir(parents=True, exist_ok=True)
        tmp = path.with_name(f"{path.name}.{os.getpid()}.{next(_TMP_COUNTER)}.tmp")
        tmp.write_text(json.dumps(doc, indent=2) + "\n", encoding="utf-8")
        tmp.replace(path)
    
    
    def read_features() -> Dict[str, bool]:
        """Registry defaults overlaid with the stored operator state. Stored
        ids the registry does not know are ignored - an older server never
        chokes on a newer file - and an unreadable file means defaults."""
        resolved = {f["id"]: not f.get("defaultOff", True) for f in FEATURES}
        if FEATURES_PATH.is_file():
            try:
                doc = json.loads(FEATURES_PATH.read_text(encoding="utf-8"))
            except Exception:
                return resolved
            enabled = doc.get("enabled") if isinstance(doc, dict) else None
            if isinstance(enabled, dict):
                for key, value in enabled.items():
                    if key in resolved and isinstance(value, bool):
                        resolved[key] = value
        return resolved
    
    
    @router.get("/nexus/features")
    def get_features() -> Dict[str, Any]:
        """The registry, resolved: what exists, which milestone delivered it,
        and whether the operator has switched it on."""
        state = read_features()
        return {
            "version": 1,
            **({"error": FEATURES_ERROR} if FEATURES_ERROR else {}),
            "features": [
                {
                    "id": f["id"],
                    "title": f.get("title") or f["id"],
                    "description": f.get("description", ""),
                    "milestone": f.get("milestone", ""),
                    "enabled": state[f["id"]],
                }
                for f in FEATURES
            ],
        }
    
    
    @router.put("/nexus/features")
    def put_features(request: Request, payload: Any = Body(...)) -> Dict[str, Any]:
        """Store the operator's flag choices. Unknown ids are rejected loudly
        on write (the inverse of the lenient read) - a typo must fail, not
        silently do nothing.
    
        Operator role required. This route used to take no Request and call
        no role check at all, which meant anyone who could reach it could
        turn on every flagged capability in the product - including the ones
        gating write surfaces. The read stays open; only the write is
        gated."""
        require_role(request, "operator")
        raw = json.dumps(payload)
        if len(raw.encode("utf-8")) > _MAX_FEATURES_BYTES:
            raise HTTPException(status_code=413, detail="nexus: features exceed the 16KiB bound")
        if not isinstance(payload, dict) or payload.get("version") != 1:
            raise HTTPException(status_code=400, detail="nexus: features must carry version: 1")
        unknown = set(payload) - {"version", "enabled"}
        if unknown:
            raise HTTPException(status_code=400, detail=f"nexus: unknown feature keys {sorted(unknown)}")
        enabled = payload.get("enabled", {})
        if not isinstance(enabled, dict):
            raise HTTPException(status_code=400, detail="nexus: enabled must be a map of flag id to boolean")
        known = {f["id"] for f in FEATURES}
        for key, value in enabled.items():
            if key not in known:
                raise HTTPException(status_code=400, detail=f"nexus: unknown feature {key!r}")
            if not isinstance(value, bool):
                raise HTTPException(status_code=400, detail=f"nexus: feature {key!r} must be true or false")
        _atomic_write_json(FEATURES_PATH, {"version": 1, "enabled": enabled})
        return {"ok": True, "features": read_features()}
    
    
    @router.delete("/nexus/features")
    def delete_features(request: Request) -> Dict[str, Any]:
        """Reset to registry defaults - the overlay discipline's DELETE leg.
        Operator role required, for the same reason PUT is."""
        require_role(request, "operator")
        if FEATURES_PATH.is_file():
            FEATURES_PATH.unlink()
        return {"ok": True, "reset": True, "features": read_features()}
    
    
    def _load_config() -> Dict[str, Any]:
        if yaml is None or not CONFIG_PATH.is_file():
            return {}
        doc = yaml.safe_load(CONFIG_PATH.read_text(encoding="utf-8"))
        return doc if isinstance(doc, dict) else {}
    
    
    # ---------------------------------------------------------------------------
    # Deployment capabilities (ADR-84, #403/#409): what a deployed Nexus is
    # ALLOWED to do, decided by whoever deployed it.
    #
    # Deliberately NOT the ADR-43 feature overlay above, and the difference is
    # the whole point. That overlay is OPERATOR state - request-time mutable,
    # stored on the state volume, switchable from the browser and from
    # `hg nexus features`. It answers "has this capability shipped yet".
    # Capabilities answer "may this deployment use it at all", which is a
    # different question with a different authority, so they arrive only in
    # config.yaml, have no PUT route, and cannot be reached from the UI. That
    # absence is not an omission - it is the feature. A destructive action
    # guarded by something a browser can toggle is not guarded.
    #
    # Config is re-read per request (see _load_config), so a capability
    # changes when the ConfigMap remount lands, not when a pod restarts -
    # provided the value is in the deployment's checksum/config annotation.
    
    CAP_WORKSPACE_RESET = "workspaceReset"
    
    #: Views that exist but are not part of the required launch set. Only
    #: these may be withheld; anything else is a required view and stays.
    GATEABLE_VIEWS = ("system", "communication", "agents", "backups")
    
    
    def _capabilities() -> Dict[str, Any]:
        doc = _load_config().get("capabilities")
        return doc if isinstance(doc, dict) else {}
    
    
    def capability(name: str, default: bool = False) -> bool:
        """One deployment capability, resolved.
    
        A non-boolean is treated as absent. A typo - `"true"`, `1`, `null`, a
        key nested one level too deep - must never be able to GRANT
        something, so the default decides and destructive capabilities
        default to False. Failing closed on a malformed value is the only
        behaviour that makes "absent means off" trustworthy."""
        value = _capabilities().get(name)
        return value if isinstance(value, bool) else default
    
    
    def view_enabled(view: str) -> bool:
        """Whether a top-level view is available in this deployment (#409).
    
        Views fail OPEN, unlike every other capability here: a required
        launch view must not vanish because a key was misspelled or a values
        file was trimmed. Withholding one is therefore always an explicit
        `false` in the deployment's config, never an omission - which is also
        what makes the setting greppable when someone asks where a view
        went."""
        if view not in GATEABLE_VIEWS:
            return True
        views = _capabilities().get("views")
        value = views.get(view) if isinstance(views, dict) else None
        return value if isinstance(value, bool) else True
    
    
    def resolved_capabilities() -> Dict[str, Any]:
        """What the browser is told: the resolved verdicts, never the raw
        config. Read-only by construction - there is no PUT counterpart."""
        return {
            CAP_WORKSPACE_RESET: capability(CAP_WORKSPACE_RESET),
            "views": {v: view_enabled(v) for v in GATEABLE_VIEWS},
        }
    
    
    def require_capability(name: str, detail: str) -> None:
        """Refuse an action this deployment is not allowed to perform.
    
        403 rather than 404: the caller's identity is not the problem and
        pretending the route does not exist would send an operator hunting
        for a deploy bug. The message names the config key, because the only
        useful next step is editing it."""
        if not capability(name):
            raise HTTPException(
                status_code=403,
                detail=(
                    f"nexus: {detail} is disabled by deployment configuration "
                    f"(capabilities.{name} is not true)"
                ),
            )
    
    
    def _read_plan(repo_path: str) -> Optional[Dict[str, Any]]:
        plan_file = _plan_path(repo_path)
        if not plan_file.is_file():
            return None
        return json.loads(plan_file.read_text(encoding="utf-8"))
    
    
    def _read_plan_or_503(repo_path: str) -> Dict[str, Any]:
        """#446, shared by the sibling plan consumers (health, backups): a
        present-but-unparseable plan must be the same diagnosable 503 the
        canvas route gives, never an uncaught 500 - the health route's own
        contract says it never 500s. These routes read the plan defensively
        key-by-key, so they take only the decode gate, not the shape gate."""
        try:
            plan = _read_plan(repo_path)
        except json.JSONDecodeError as exc:
            raise HTTPException(
                status_code=503,
                detail=(
                    f"nexus: {_plan_path(repo_path)} is not valid "
                    f"JSON ({exc}) - re-run `hg nexus emit`"
                ),
            )
        if plan is None:
            raise HTTPException(status_code=503, detail="nexus: no compiled plan")
        return plan
    
    
    def plan_shape_error(plan: Any) -> Optional[str]:
        """#446: the structural floor of dashboard-plan, checked before the
        canvas route serves a plan. Deliberately not a schema validator (the
        runtime image has no jsonschema - the mirrored-validator discipline);
        it names exactly the shapes whose absence blanks the whole canvas in
        the browser. `hg nexus emit` validates fully before writing, so a
        plan that fails here arrived some other way: a hand edit, a partial
        write, an older emitter, a bad merge."""
        if not isinstance(plan, dict):
            return f"the plan document is {type(plan).__name__}, not an object"
        for key in ("components", "relationships"):
            if key not in plan:
                return f"required key '{key}' is missing"
            if not isinstance(plan[key], list):
                return f"'{key}' must be a list, got {type(plan[key]).__name__}"
        return None
    
    
    def _safe_base_url(value: Any) -> Optional[str]:
        """The server-side link allowlist (design 11): destination bases must
        be http(s), carry no userinfo, and have a hostname. Anything else is
        dropped here - the browser never has to judge a URL."""
        if not isinstance(value, str):
            return None
        from urllib.parse import urlsplit
    
        try:
            parts = urlsplit(value)
        except ValueError:
            return None
        if parts.scheme not in ("http", "https") or not parts.hostname or parts.username or parts.password:
            return None
        # No query/fragment: destinations are built by path concatenation, and
        # a base like https://grafana/?orgId=1 would swallow the path.
        if parts.query or parts.fragment:
            return None
        return value.rstrip("/")
    
    
    _LINK_KEYS = ("repository", "docs", "runbook")
    
    
    def _safe_https_url(value: Any) -> Optional[str]:
        """The serve-time layer of the ADR-43 link posture: authored component
        links must be https with a hostname, no userinfo, no query, no
        fragment. Deliberately stricter than ``_safe_base_url`` (which admits
        http for intranet integration bases)."""
        if not isinstance(value, str):
            return None
        from urllib.parse import urlsplit
    
        try:
            parts = urlsplit(value)
        except ValueError:
            return None
        if parts.scheme != "https" or not parts.hostname or parts.username or parts.password:
            return None
        if parts.query or parts.fragment:
            return None
        return value
    
    
    def sanitize_plan_links(plan: Dict[str, Any]) -> Dict[str, Any]:
        """Re-sanitize every authored component link before the browser sees
        the plan. Pure - returns a shallow copy, never mutates the cached
        document; a link the compiler somehow let through (or a hand-edited
        plan file) is dropped here, never rendered."""
        comps = plan.get("components")
        if not isinstance(comps, list):
            return plan
        out_comps: List[Any] = []
        for comp in comps:
            links = comp.get("links") if isinstance(comp, dict) else None
            if not isinstance(links, dict):
                out_comps.append(comp)
                continue
            clean = {}
            for key in _LINK_KEYS:
                safe = _safe_https_url(links.get(key))
                if safe is not None:
                    clean[key] = safe
            comp2 = {k: v for k, v in comp.items() if k != "links"}
            if clean:
                comp2["links"] = clean
            out_comps.append(comp2)
        return {**plan, "components": out_comps}
    
    
    def _links(cfg: Dict[str, Any]) -> Dict[str, Any]:
        integrations = cfg.get("integrations") or {}
        out: Dict[str, Any] = {
            "argocdBaseUrl": _safe_base_url((integrations.get("argocd") or {}).get("baseUrl")),
            "grafanaBaseUrl": _safe_base_url((integrations.get("grafana") or {}).get("baseUrl")),
        }
        # External tool URLs (#469, spec §23): operator-owned config, keyed by
        # system-view inventory id. Deliberately NOT control-plane/nexus/inventory.json
        # - system.tsx imports that at build time, so an operator edit there
        # would split-brain the served copy against the built view. Each value
        # goes through the same https-only gate as authored component links
        # (_safe_https_url), stricter than _safe_base_url's http allowance for
        # intranet Grafana/Argo - a tool URL has no such precedent to honor.
        tool_urls_cfg = cfg.get("toolUrls")
        if isinstance(tool_urls_cfg, dict):
            clean = {
                key: safe
                for key, value in tool_urls_cfg.items()
                if isinstance(key, str) and (safe := _safe_https_url(value)) is not None
            }
            if clean:
                out["toolUrls"] = clean
        return out
    
    
    @router.get("/nexus")
    def get_nexus(request: Request) -> Dict[str, Any]:
        """The compiled plan, wrapped with what this backend can vouch for."""
        cfg = _load_config()
        repo_path = cfg.get("repoPath")
        if not repo_path:
            raise HTTPException(
                status_code=503,
                detail=(
                    "nexus: no repoPath configured - write "
                    f"{CONFIG_PATH} with `repoPath: /path/to/gitops-clone` "
                    "(the clone `hg nexus emit` writes into)"
                ),
            )
        cache_seconds = float(cfg.get("cacheSeconds", 15))
        now = time.monotonic()
        # Keyed by repoPath too: a config switch must never serve the old
        # repository's plan for the remainder of a cache interval.
        if _cache["doc"] is None or _cache["path"] != repo_path or now - _cache["at"] > cache_seconds:
            try:
                _cache["doc"] = _read_plan(str(repo_path))
            except json.JSONDecodeError as exc:
                # Present-but-unparseable (#446): a diagnosable 503 naming the
                # file, not a 500. The cache keeps its previous doc; a cheap
                # re-read per request until the file is fixed.
                raise HTTPException(
                    status_code=503,
                    detail=(
                        f"nexus: {_plan_path(repo_path)} is not valid "
                        f"JSON ({exc}) - re-run `hg nexus emit` (it validates "
                        "before writing; this file arrived some other way)"
                    ),
                )
            _cache["at"] = now
            _cache["path"] = repo_path
        plan = _cache["doc"]
        if plan is None:
            raise HTTPException(
                status_code=503,
                detail=(
                    f"nexus: {_plan_path(repo_path)} does not exist - "
                    "run `hg nexus emit --dir <persona-repo> --output <gitops-clone>`"
                ),
            )
        shape = plan_shape_error(plan)
        if shape:
            # Present-but-malformed (#446): before this gate, a plan missing
            # `relationships` sailed through as a 200 and blanked the whole
            # canvas with only a console TypeError as evidence.
            raise HTTPException(
                status_code=503,
                detail=(
                    f"nexus: {_plan_path(repo_path)} is malformed - "
                    f"{shape}. Re-run `hg nexus emit` (it validates before "
                    "writing; this file arrived some other way)"
                ),
            )
        view_id = ((plan.get("view") or {}).get("id")) or "default"
        can_write, _subject = _can_write(request)
        return {
            "schemaVersion": 1,
            "plan": sanitize_plan_links(plan),
            # The workspace document (#274, ADR-56): the one operator-owned
            # presentation state, with the caller's write verdict.
            "workspace": read_workspace(plan),
            "canWrite": can_write,
            "links": _links(cfg),
            "features": read_features(),
            # Deployment capabilities (ADR-84): what this deployment ALLOWS,
            # beside what the operator has ENABLED. Read-only - the browser
            # renders these, and no route writes them.
            "capabilities": resolved_capabilities(),
            # Bundle membership overlay (ADR-28): the plan cannot say a
            # profile is bundled without a schema bump, so it's served here.
            "bundles": bundle_membership(str(repo_path)),
            "integrations": {"argocd": False, "grafana": False, "hermesRuntime": False},
        }
    
    
    # ---------------------------------------------------------------------------
    # Communication view (ADR-43): a read-only ALLOWLIST PROJECTION of the
    # emitted router records. The values files carry in-cluster URLs, service
    # names, namespaces, ports and secret names - NONE of that may reach the
    # browser. project_communication is the whole contract: what it returns
    # is exactly what the browser may learn, and a test asserts the forbidden
    # material never serializes.
    
    _comm_cache: Dict[str, Any] = {"at": 0.0, "doc": None, "path": None}
    
    # Every projected string must LOOK like a logical identifier: bounded, a
    # tight charset, and never a URL ("//" is rejected outright, which kills
    # every scheme). Key selection alone is not a projection - a hand-edited
    # record could park a service hostname in `event` - so values are
    # type- and shape-enforced too, not just chosen.
    _COMM_STR_RE = None  # compiled lazily below
    
    
    def _comm_str(value: Any) -> Optional[str]:
        global _COMM_STR_RE
        if _COMM_STR_RE is None:
            import re
    
            _COMM_STR_RE = re.compile(r"^[A-Za-z0-9@#/:>._-]{1,200}$")
        if not isinstance(value, str) or "//" in value or not _COMM_STR_RE.match(value):
            return None
        return value
    
    
    def _as_dict(value: Any) -> Dict[str, Any]:
        return value if isinstance(value, dict) else {}
    
    
    def _project_edge(edge: Any, router_scope: str) -> Optional[Dict[str, Any]]:
        """One edge, projected to logical facts only - every string through
        the identifier filter, every nested block type-checked. Returns None
        for anything unusable; a malformed entry is excluded, never a 500."""
        if not isinstance(edge, dict):
            return None
        delivery = _as_dict(edge.get("delivery"))
        ordering = _as_dict(delivery.get("ordering"))
        retry = _as_dict(delivery.get("retry"))
        dead_letter = _as_dict(delivery.get("deadLetter"))
        kind = edge.get("kind")
        target: Dict[str, Any] = {}
        if kind == "agent":
            agent = _as_dict(edge.get("agent"))
            session = _as_dict(agent.get("session"))
            target = {
                "profile": _comm_str(agent.get("profile")),
                "instance": _comm_str(agent.get("instance")),
                "sessionMode": _comm_str(session.get("mode")),
            }
        elif kind == "chatops":
            chatops = _as_dict(edge.get("chatops"))
            target = {
                "space": _comm_str(chatops.get("space")),
                "provider": _comm_str(chatops.get("provider")),
            }
        else:
            return None
        attempts = retry.get("maxAttempts")
        event = _comm_str(edge.get("event"))
        alarm_class = bool(event and event.startswith("observability."))
        return {
            "id": _comm_str(edge.get("id")),
            "router": router_scope,
            "event": event,
            # The ALARM family is semantic, not transport: an observability
            # alert routed through the queue is still an alarm, and the
            # Alarms surface must show it - transport is a row detail there.
            "alarmClass": alarm_class,
            # The plane vocabulary (#416, validated against the four-plane
            # ownership model): every edge in this projection comes from a
            # ROUTER record, so eventRouterInvolved is structurally true for
            # all of them - the direct Alertmanager->agent plane produces no
            # edges here (it appears only as the FIRING NOW section, which
            # says eventRouterInvolved: false about itself), and the human
            # Discord<->gateway conversation plane and native cron appear
            # nowhere in this view at all, by design. A chatops edge is a
            # router DELIVERY to a space, never the conversation plane.
            "plane": "operational-alert" if alarm_class else "business-event",
            "eventRouterInvolved": True,
            "route": _comm_str(edge.get("route")),
            "kind": kind,
            "producer": _comm_str(_as_dict(edge.get("from")).get("producer")),
            # The edge's declared external-input source, when it has one -
            # the join identity an inbound webhook's board selects by
            # (matching on event alone can claim another webhook's routes).
            "externalInput": _comm_str(_as_dict(edge.get("from")).get("externalInput")),
            "target": {k: v for k, v in target.items() if v is not None},
            "delivery": {
                "mode": _comm_str(delivery.get("mode")),
                "orderingMode": _comm_str(ordering.get("mode")),
                "retryMaxAttempts": attempts if isinstance(attempts, int) and 0 <= attempts <= 1000 else None,
                "deadLetter": dead_letter.get("enabled") is True,
            },
        }
    
    
    def _project_external_input(item: Any) -> Optional[Dict[str, Any]]:
        """One external webhook binding, projected to what an operator needs
        to understand the entry point - and nothing that helps reach it. The
        hook PATH, the secret name and the secret's key are all omitted on
        purpose: the browser learns that a binding exists, which events it
        accepts and how it is verified, never how to call it."""
        if not isinstance(item, dict):
            return None
        ident = _comm_str(item.get("id"))
        if ident is None:
            return None
        verification = _as_dict(item.get("verification"))
        accepts = item.get("accepts")
        return {
            "id": ident,
            "profile": _comm_str(item.get("profile")),
            "event": _comm_str(item.get("event")),
            "verification": _comm_str(verification.get("type")),
            "accepts": [a for a in (accepts if isinstance(accepts, list) else []) if _comm_str(a)],
        }
    
    
    def edge_owner(edge: Dict[str, Any], bundles: Dict[str, Dict[str, Any]]) -> Dict[str, Any]:
        """#567: the installed scope an event route belongs to. The TARGET
        profile decides first (the route serves whoever consumes it), then
        the producing profile; a route with profile endpoints but no bundled
        one belongs to an unbundled profile; a route with NO profile endpoint
        at all (an infra producer delivering to chatops) is the control
        plane's own routing when alarm-class. Same three-way vocabulary as
        alert_ownership.
    
        A producer id is the composite `<profile>/<source>[@scope]#<handler>`
        the emitter mints - only a composite's profile prefix joins the
        membership; a bare producer name is infrastructure, not a profile."""
        producer = str(edge.get("producer") or "")
        profile_endpoints = [
            e
            for e in (
                (edge.get("target") or {}).get("profile"),
                producer.split("/", 1)[0] if "/" in producer else None,
            )
            if e
        ]
        for endpoint in profile_endpoints:
            for name, bundle in bundles.items():
                if endpoint in (bundle.get("profiles") or []):
                    return {
                        "ownership": "bundle",
                        "bundle": name,
                        "bundleTitle": str(bundle.get("displayName") or name),
                    }
        if not profile_endpoints and edge.get("alarmClass"):
            return {"ownership": "control-plane"}
        return {"ownership": "unbundled"}
    
    
    def project_communication(repo_path: str) -> Optional[Dict[str, Any]]:
        """The communication graph the browser may see, or None when the
        GitOps clone has no emitted communication tree. Pure filesystem reads
        of the emitted records; nothing here talks to a cluster, and every
        plan.yaml value passes the same identifier filter as the edges - the
        plan file is as hand-editable as the router values."""
        comm_dir = Path(repo_path) / COMM_RELPATH
        plan_file = comm_dir / "plan.yaml"
        if yaml is None or not plan_file.is_file():
            return None
        try:
            plan_doc = _as_dict(yaml.safe_load(plan_file.read_text(encoding="utf-8")))
        except Exception:
            plan_doc = {}
        edges: List[Dict[str, Any]] = []
        routers: List[Dict[str, Any]] = []
        external_inputs: List[Dict[str, Any]] = []
        # #567: one membership read for the whole projection - every edge and
        # external input carries its owner scope so the browser can group by
        # Bundle without a second join of its own.
        membership = bundle_membership(repo_path)
        # Any directory holding a values.yaml is a router record. The scope
        # comes from the RECORD, never from the directory name: the emitter
        # names the directory after the sanitized router id, and a
        # single-scope layout elides the scope from that id entirely (the
        # directory is just `router`). Globbing `router-*` and slicing the
        # prefix silently produced an empty graph for every single-scope
        # fleet - which is most of them.
        for router_dir in sorted(p for p in comm_dir.iterdir() if p.is_dir()):
            values_file = router_dir / "values.yaml"
            if not values_file.is_file():
                continue
            try:
                values = _as_dict(yaml.safe_load(values_file.read_text(encoding="utf-8")))
            except Exception:
                continue
            spec = _as_dict(values.get("spec"))
            router_spec = _as_dict(spec.get("router"))
            # Fall back to the directory name only when the record does not
            # declare its own scope - a hand-edited tree still projects its
            # edges rather than vanishing.
            name = router_dir.name
            scope = _comm_str(router_spec.get("scope")) or _comm_str(
                name[len("router-"):] if name.startswith("router-") else name
            )
            if scope is None:
                continue
            routers.append({"id": _comm_str(router_spec.get("id")) or f"router@{scope}", "scope": scope})
            spec_edges = spec.get("edges")
            for edge in spec_edges if isinstance(spec_edges, list) else []:
                projected = _project_edge(edge, scope)
                if projected is not None:
                    edges.append({**projected, **edge_owner(projected, membership)})
            spec_inputs = spec.get("externalInputs")
            for item in spec_inputs if isinstance(spec_inputs, list) else []:
                projected_input = _project_external_input(item)
                if projected_input is not None:
                    # An external input always binds a profile, never the
                    # control plane - so its scope is bundle-or-unbundled.
                    external_inputs.append(
                        {**projected_input, **edge_owner({"target": projected_input}, membership)}
                    )
        raw_spaces = plan_doc.get("chatopsSpaces")
        raw_producers = plan_doc.get("producers")
        return {
            "version": 1,
            "durableProvider": _comm_str(plan_doc.get("durableProvider")),
            "chatopsSpaces": [s for s in (raw_spaces if isinstance(raw_spaces, list) else []) if _comm_str(s)],
            "producers": sorted({p for p in (raw_producers if isinstance(raw_producers, list) else []) if _comm_str(p)}),
            "routers": routers,
            "edges": edges,
            "externalInputs": external_inputs,
        }
    
    
    def _prom_base(cfg: Dict[str, Any]) -> str:
        """The configured Prometheus, sanitized - "" when there is none."""
        return _safe_base_url((cfg.get("integrations") or {}).get("prometheus", {}).get("baseUrl")) or ""
    
    
    def _grafana_alert_base(cfg: Dict[str, Any]) -> str:
        """Where to read Grafana-EVALUATED alerts from, per the passed cfg (#618).
    
        Mirrors _prom_base rather than calling grafana_probe_base_url(), which
        consults the globally loaded config: a caller that was handed a cfg must
        not silently read a different one. Prefers the server-side probe base -
        the in-cluster Service - over the public base, for the same reason the
        health probe does: the public one may sit behind an edge gate this server
        carries no identity for.
        """
        grafana = (cfg.get("integrations") or {}).get("grafana") or {}
        return _safe_base_url(grafana.get("probeBaseUrl")) or _safe_base_url(grafana.get("baseUrl")) or ""
    
    
    def _stamps_by_edge(series: List[Dict[str, Any]]) -> Dict[str, Dict[str, float]]:
        """hermes_event_last_delivery_timestamp_seconds -> {edge: {outcome: ts}}."""
        out: Dict[str, Dict[str, float]] = {}
        for s in series:
            metric = s.get("metric") or {}
            edge, outcome = metric.get("edge"), metric.get("outcome")
            if not edge or outcome not in ("success", "failure"):
                continue
            try:
                out.setdefault(edge, {})[outcome] = float((s.get("value") or [None, "0"])[1])
            except Exception:
                continue
        return out
    
    
    #: The edge ladder, worst LAST. One definition, shipped to the browser in
    #: the communication envelope (#424) - it used to be restated as a rank
    #: map in TypeScript with a comment promising it matched "the server's
    #: ladder", which is the kind of promise that survives exactly until
    #: someone adds a status. Note this is NOT the health ladder: these are
    #: delivery states for a route, and `declared` is a floor rather than a
    #: level, so the two vocabularies are deliberately separate types.
    EDGE_STATUS_ORDER = ("declared", "configured", "stale", "degraded", "failed")
    
    
    def edge_live_status(
        edges: List[Dict[str, Any]],
        up_series: List[Dict[str, Any]],
        dlq: Dict[str, int],
        pending: Dict[str, int],
        stamps: Dict[str, Dict[str, float]],
        unreachable: bool = False,
    ) -> Dict[str, Dict[str, Any]]:
        """Per-edge live delivery status, keyed by edge id (#277).
    
        The ladder here answers one question - "can I trust this route right
        now" - and it deliberately reads differently from a declaration:
    
        - `declared`   nothing has ever been observed for this edge. NOT a
                       failure and NOT health: the route exists in Git and
                       the router has never had traffic for it.
        - `configured` observed and clean.
        - `degraded`   events accepted but still waiting (queue lag), or the
                       last thing that happened on this route was a failure.
        - `failed`     dead letters are waiting; retries are exhausted and a
                       human owes the queue a decision.
        - `stale`      the router is not reporting at all, so the last thing
                       we knew is the most we know. Never silently `configured`.
    
        Direct (non-queued) edges have no queue depths by construction; they
        are judged only on their last-delivery outcome, which is why an edge
        with no traffic stays `declared` rather than being called healthy."""
        out: Dict[str, Dict[str, Any]] = {}
        for edge in edges:
            ident = edge.get("id")
            if not ident:
                continue
            edge_dlq = dlq.get(ident)
            edge_pending = pending.get(ident)
            stamp = stamps.get(ident, {})
            last_success = stamp.get("success")
            last_failure = stamp.get("failure")
            observed = any(v is not None for v in (edge_dlq, edge_pending, last_success, last_failure))
            if unreachable or not up_series:
                status = "stale" if observed else "declared"
            elif edge_dlq:
                status = "failed"
            elif edge_pending:
                status = "degraded"
            elif last_failure and (not last_success or last_failure > last_success):
                # The most recent thing this route did was fail. Cumulative
                # counters cannot say that; the recency stamps can.
                status = "degraded"
            elif observed:
                status = "configured"
            else:
                status = "declared"
            out[ident] = {
                "status": status,
                "dlqDepth": edge_dlq,
                "pending": edge_pending,
                "lastSuccessAt": _iso_from_epoch(last_success),
                "lastFailureAt": _iso_from_epoch(last_failure),
            }
        return out
    
    
    def _iso_from_epoch(value: Optional[float]) -> Optional[str]:
        if not value:
            return None
        import datetime
    
        return (
            datetime.datetime.fromtimestamp(value, datetime.timezone.utc)
            .isoformat()
            .replace("+00:00", "Z")
        )
    
    
    def _project_receipt(r: Any) -> Optional[Dict[str, Any]]:
        """One delivery receipt, narrowed to what an operator needs to read an
        execution: which edge, what happened, when. Everything else the router
        records - session keys, provider message ids, destination URLs - stays
        on the router."""
        if not isinstance(r, dict):
            return None
        edge = _comm_str(r.get("edge"))
        if edge is None:
            return None
        status = _comm_str(r.get("status"))
        return {
            "edge": edge,
            "route": _comm_str(r.get("route")),
            "kind": _comm_str(r.get("kind")),
            "status": status,
            "classification": _comm_str(r.get("classification")),
            "attempt": r.get("attempt") if isinstance(r.get("attempt"), int) else None,
            "at": _comm_str(r.get("time")),
        }
    
    
    def latest_execution(receipts: List[Any]) -> Optional[Dict[str, Any]]:
        """The most recent fan-out, grouped by correlation id (#278).
    
        One inbound event produces ONE correlation id shared by every edge it
        fanned to, so grouping by it is what turns a flat receipt list into
        "this event, these consumers, these outcomes" - including the case
        that matters most, where one consumer succeeded and another did not.
        Reporting a single overall status would erase exactly that."""
        by_correlation: Dict[str, List[Dict[str, Any]]] = {}
        order: List[str] = []
        for raw in receipts:
            if not isinstance(raw, dict):
                continue
            correlation = _comm_str(raw.get("correlationId"))
            projected = _project_receipt(raw)
            if correlation is None or projected is None:
                continue
            if correlation not in by_correlation:
                by_correlation[correlation] = []
                order.append(correlation)
            by_correlation[correlation].append(projected)
        if not order:
            return None
        correlation = order[-1]  # the router serves receipts oldest-first
        consumers = by_correlation[correlation]
        observed = max((c.get("at") or "" for c in consumers), default="")
        failed = [c for c in consumers if c.get("status") in ("failed", "dead-lettered")]
        return {
            "correlationId": correlation,
            "observedAt": observed or None,
            # Per-consumer, never flattened: "2 of 3 delivered" is the fact,
            # and claiming success because one consumer worked is the lie
            # this whole surface exists to prevent.
            "consumers": consumers[:20],
            "delivered": len(consumers) - len(failed),
            "failed": len(failed),
        }
    
    
    def _router_execution(cfg: Dict[str, Any]) -> tuple:
        """Ask the router for its recent receipts, request-time. Returns
        (execution-or-None, source-state) so the provenance block (#414) can
        distinguish "no router configured" from "router down" from "router up
        with no receipts" - three states one Optional used to flatten.
    
        ponytail: the router keeps receipts in a 2000-entry in-memory ring, so
        a router restart clears "latest execution" while DLQ depth (Redis) and
        the Prometheus counters survive. Named rather than hidden; the durable
        successor is a per-delivery record, which is its own piece of work."""
        base = _safe_base_url((cfg.get("integrations") or {}).get("router", {}).get("baseUrl"))
        if not base:
            return None, "not configured"
        try:
            import urllib.request
    
            with urllib.request.urlopen(f"{base}/v1/status", timeout=5.0) as resp:
                doc = json.loads(resp.read().decode("utf-8"))
        except Exception:
            return None, "unavailable"
        receipts = doc.get("receipts")
        return latest_execution(receipts if isinstance(receipts, list) else []), "ok"
    
    
    def _communication_live(edges: List[Dict[str, Any]], cfg: Dict[str, Any]) -> tuple:
        """Join the projected edges with the router's Prometheus series. Same
        transport as every other adapter - no route from Nexus to the router.
        A dead Prometheus degrades to `stale`, never to silence. Returns
        (live, source-state) for the provenance block (#414): an empty live
        map used to be indistinguishable from "Prometheus not configured",
        which is exactly the ambiguity the ticket names."""
        prom = _prom_base(cfg)
        if not prom:
            return {}, "not configured"
        try:
            up = _prom_query(prom, "hermes_router_up")
            dlq = _depths_by_edge(_prom_query(prom, "hermes_event_dlq_depth"))
            pending = _depths_by_edge(_prom_query(prom, "hermes_event_pending_depth"))
            stamps = _stamps_by_edge(_prom_query(prom, "hermes_event_last_delivery_timestamp_seconds"))
        except Exception:
            return edge_live_status(edges, [], {}, {}, {}, unreachable=True), "unavailable"
        return edge_live_status(edges, up, dlq, pending, stamps), "ok"
    
    
    @router.get("/nexus/communication")
    def get_nexus_communication() -> Dict[str, Any]:
        """The routing graph, gated at request time twice over: the operator
        flag says whether it has shipped, the deployment capability says
        whether this environment serves it at all. Either off and the route
        simply does not exist (#409) - a withheld view must not be reachable
        by typing its URL."""
        if not view_enabled("communication"):
            _comm_cache["doc"] = None
            raise HTTPException(status_code=404, detail="nexus: the communication view is not available in this deployment")
        if not read_features().get("communication-view", False):
            # Dropping the cache here means a flip-off/emit/flip-on sequence
            # can never resurrect the pre-disable graph.
            _comm_cache["doc"] = None
            raise HTTPException(status_code=404, detail="nexus: the communication-view feature is not enabled")
        cfg = _load_config()
        repo_path = cfg.get("repoPath")
        if not repo_path:
            raise HTTPException(status_code=503, detail="nexus: no repoPath configured")
        cache_seconds = float(cfg.get("cacheSeconds", 15))
        now = time.monotonic()
        if _comm_cache["doc"] is None or _comm_cache["path"] != repo_path or now - _comm_cache["at"] > cache_seconds:
            _comm_cache["doc"] = project_communication(str(repo_path))
            _comm_cache["at"] = now
            _comm_cache["path"] = repo_path
        doc = _comm_cache["doc"]
        if doc is None:
            raise HTTPException(
                status_code=503,
                detail="nexus: no communication records emitted - run `hg topology emit`",
            )
        # The live half, joined per request onto the cached static projection.
        # Kept OUT of the cached document: the graph changes when Git changes,
        # the status changes every scrape, and merging them into one cache
        # would serve one at the other's staleness.
        execution, execution_state = _router_execution(cfg)
        live, live_state = _communication_live(doc.get("edges") or [], cfg)
        alerts = _firing_alerts(cfg)
        return {
            **doc,
            "live": live,
            # The ladder itself, so the browser ranks by the server's order
            # rather than its own copy of it.
            "statusOrder": list(EDGE_STATUS_ORDER),
            "alerts": alerts,
            # Provenance (#414): which authoritative source fed each section,
            # its state right now, and when this response was assembled. A
            # section whose source is down says `unavailable` here rather
            # than rendering its last data as if current.
            "provenance": {
                "observedAt": datetime.now(timezone.utc).isoformat(),
                "sources": {
                    "declarations": {
                        "family": "gitops-repository",
                        "state": "ok",
                        "detail": f"compiled communication tree, cached up to {int(cache_seconds)}s",
                    },
                    "delivery": {"family": "prometheus", "state": live_state},
                    "alerts": {
                        "family": "prometheus-alerts",
                        "state": "ok"
                        if alerts.get("reachable")
                        else ("unavailable" if alerts.get("configured") else "not configured"),
                    },
                    "execution": {"family": "event-router", "state": execution_state},
                },
            },
            **_implied_events(doc.get("edges") or []),
            **({"latestExecution": execution} if execution else {}),
        }
    
    
    def _firing_alerts(cfg: Dict[str, Any]) -> Dict[str, Any]:
        """What the promstack alert pipeline is ACTUALLY doing right now:
        firing alerts from the configured Prometheus (the same source the
        health overlay's grafana adapter reads - rule evaluation is what
        feeds Alertmanager). Names and labels only, clipped; never silent -
        an unreachable Prometheus says so."""
        # #416: the promstack pipeline is the OPERATIONAL-ALERT plane on its
        # direct path - Grafana/Alertmanager to an eligible receiver, no
        # event router anywhere in the transport. Stated on the record so the
        # UI can never imply router involvement for it.
        base = {"plane": "operational-alert", "eventRouterInvolved": False}
        prom = _prom_base(cfg)
        if not prom:
            return {**base, "configured": False, "reachable": False, "firing": []}
        try:
            observed = alerts_observation(prom, _grafana_alert_base(cfg))
        except Exception:
            return {**base, "configured": True, "reachable": False, "firing": []}
        # Partial is not the same as complete, and an empty list from a partial
        # read must never be presentable as "nothing is firing" (#618 review).
        unreadable = list(getattr(observed, "unreadable", ()))
        firing = [a for a in observed if (a.get("state") or "").lower() == "firing"]
        grafana = grafana_base_url()
        # #567: the canonical membership map, so ownership can name WHICH
        # bundle rather than the bare word. No repoPath means membership is
        # UNKNOWN - None keeps the coarse pre-#567 'bundle' answer rather
        # than asserting 'unbundled' about alerts nobody could check (Codex
        # review). An empty map from a READABLE tree is a real answer.
        bundles = bundle_membership(str(cfg.get("repoPath"))) if cfg.get("repoPath") else None
        out = []
        for alert in firing[:100]:
            labels = alert.get("labels") or {}
            annotations = alert.get("annotations") or {}
            name = _clip(str(labels.get("alertname") or "alert"), 120)
            out.append(
                {
                    "name": name,
                    "namespace": _clip(str(labels.get("namespace") or ""), 120),
                    # #554: ownership provenance, distinct from health - the
                    # browser renders the Hermes sphere marker from this and
                    # never re-derives it from namespace heuristics of its own.
                    # #567 widened it: bundle/bundleTitle name the owner.
                    **alert_ownership(labels, bundles),
                    "severity": _clip(str(labels.get("severity") or ""), 40),
                    "summary": _clip(str(annotations.get("summary") or ""), _MAX_REASON),
                    "since": _clip(str(alert.get("activeAt") or ""), 40),
                    # #413: the drill-down evidence. Labels and annotations are
                    # the rule's own words, clipped and bounded, never re-derived;
                    # `value` is the evaluation that made it fire.
                    "labels": {
                        _clip(str(k), 60): _clip(str(v), 160)
                        for k, v in sorted(labels.items())[:24]
                    },
                    "annotations": {
                        _clip(str(k), 60): _clip(str(v), 400)
                        for k, v in sorted(annotations.items())[:8]
                    },
                    **(
                        {"value": _clip(str(alert.get("value")), 60)}
                        if alert.get("value") not in (None, "")
                        else {}
                    ),
                    # The authoritative destination, built ON THE SERVER from
                    # the one configured Grafana base (the browser never
                    # assembles a Grafana URL - the panels rule, applied here).
                    **(
                        {
                            "grafanaUrl": f"{grafana}/alerting/list?search="
                            + _url_quote(name)
                        }
                        if grafana
                        else {}
                    ),
                    # #407: business-health rules label themselves
                    # hermes_signal: business, and the global surface must be
                    # able to tell them from infrastructure alerts.
                    **(
                        {"signal": _clip(str(labels.get("hermes_signal")), 40)}
                        if labels.get("hermes_signal")
                        else {}
                    ),
                }
            )
        # #579: the projection caps at 100 entries; the flag keeps a capped
        # list from reading as a confident total (the browser renders "N+").
        return {
            **base,
            "configured": True,
            "reachable": True,
            "firing": out,
            # Which evaluators could NOT be read. Non-empty means this list is a
            # floor, not a total: the browser must not say "nothing is firing".
            **({"unreadable": unreadable} if unreadable else {}),
            **({"truncated": True} if len(firing) > 100 else {}),
        }
    
    
    # ---------------------------------------------------------------------------
    # Routed history + activity pulse (#551). The spike's answers, honored here:
    #
    # - HISTORY ROWS come from the router's receipt ring (`GET <router>/v1/status`,
    #   the same 2000-entry in-memory ring `_router_execution` reads, of which the
    #   unfiltered endpoint serves the last 500). Truthful window: since router
    #   start, cleared on restart - the response SAYS so rather than implying 7d.
    # - THE PULSE comes from Prometheus range queries over the router's delivery
    #   counters (hermes_event_deliveries_total, hermes_chatops_deliveries_total,
    #   and the failure counters - control-plane/event-router/chart/files/
    #   router.ts), retention 15d (monitoring-stack.yaml), so a 7-day increase()
    #   pulse is truthful.
    # - ALERT FIRING HISTORY comes from a range query over Prometheus's ALERTS
    #   series, same retention.
    #
    # Each section degrades to an explicit state (#414) - an unreachable source
    # says `unavailable`, an unwired one `not configured`, never stale-as-current.
    # The durable per-delivery record (#295) remains the successor for
    # restart-surviving rows; this surface reads what exists today.
    
    #: window -> (seconds, range-query step seconds). Steps keep the bucket
    #: count small (12/24/28) - a micro-chart, not a telemetry dashboard.
    _HISTORY_WINDOWS = {"1h": (3600, 300), "24h": (86400, 3600), "7d": (604800, 21600)}
    _HISTORY_MAX_RECEIPTS = 200
    _HISTORY_MAX_ALERTS = 50
    
    # One vector matcher per outcome, not a `sum(a) + sum(b)` join - with `+`,
    # a counter that has never been incremented would empty the whole result.
    _PULSE_DELIVERED = "hermes_event_deliveries_total|hermes_chatops_deliveries_total"
    _PULSE_FAILED = (
        "hermes_events_publish_failures_total|hermes_chatops_delivery_failures_total"
        "|hermes_session_route_failures_total"
    )
    
    
    def _prom_query_range(base: str, expr: str, start: float, end: float, step: int) -> List[Dict[str, Any]]:
        q = urlencode({"query": expr, "start": f"{start:.0f}", "end": f"{end:.0f}", "step": str(step)})
        result = _prom_get(base, f"/api/v1/query_range?{q}").get("result", [])
        return result if isinstance(result, list) else []
    
    
    def _router_receipt_history(cfg: Dict[str, Any]) -> tuple:
        """The receipt ring, projected through the same allowlist as
        `latest_execution` (`_project_receipt` - no URLs, no session keys, no
        provider message ids) plus the correlation id, which IS the trace
        identity a history row drills down by. Newest-last, capped."""
        base = _safe_base_url((cfg.get("integrations") or {}).get("router", {}).get("baseUrl"))
        if not base:
            return [], "not configured"
        try:
            import urllib.request
    
            with urllib.request.urlopen(f"{base}/v1/status", timeout=5.0) as resp:
                doc = json.loads(resp.read().decode("utf-8"))
        except Exception:
            return [], "unavailable"
        raw = doc.get("receipts")
        out: List[Dict[str, Any]] = []
        for r in raw if isinstance(raw, list) else []:
            projected = _project_receipt(r)
            if projected is None:
                continue
            correlation = _comm_str(_as_dict(r).get("correlationId"))
            if correlation:
                projected["correlationId"] = correlation
            out.append(projected)
        return out[-_HISTORY_MAX_RECEIPTS:], "ok"
    
    
    def _bucketize(series: List[Dict[str, Any]], key: str, buckets: Dict[float, Dict[str, int]]) -> None:
        for s in series:
            for pair in s.get("values") or []:
                try:
                    ts, value = float(pair[0]), float(pair[1])
                except Exception:
                    continue
                buckets.setdefault(ts, {})[key] = buckets.get(ts, {}).get(key, 0) + int(round(value))
    
    
    def _pulse_history(prom: str, start: float, end: float, step: int) -> tuple:
        """Delivered/failed per bucket via increase() range queries - counters
        survive router restarts, so this is the one source that can truthfully
        draw a 7-day pulse (attempts_total exists too; delivered+failed is the
        pair an operator reads)."""
        try:
            delivered = _prom_query_range(
                prom, f'sum(increase({{__name__=~"{_PULSE_DELIVERED}"}}[{step}s]))', start, end, step
            )
            failed = _prom_query_range(
                prom, f'sum(increase({{__name__=~"{_PULSE_FAILED}"}}[{step}s]))', start, end, step
            )
        except Exception:
            return [], "unavailable"
        joined: Dict[float, Dict[str, int]] = {}
        _bucketize(delivered, "delivered", joined)
        _bucketize(failed, "failed", joined)
        out = [
            {
                "at": _iso_from_epoch(ts),
                "delivered": vals.get("delivered", 0),
                "failed": vals.get("failed", 0),
            }
            for ts, vals in sorted(joined.items())
        ]
        return out[:100], "ok"
    
    
    def _alert_firing_history(prom: str, start: float, end: float, step: int) -> tuple:
        """Which operational alerts fired inside the window, from the ALERTS
        series - one entry per alert identity with its first/last firing
        sample, labels clipped like the live firing list."""
        try:
            series = _prom_query_range(prom, 'ALERTS{alertstate="firing"}', start, end, step)
        except Exception:
            return [], "unavailable"
        out = []
        for s in series[:_HISTORY_MAX_ALERTS]:
            labels = _as_dict(s.get("metric"))
            stamps = [float(p[0]) for p in (s.get("values") or []) if isinstance(p, (list, tuple)) and p]
            if not stamps:
                continue
            out.append(
                {
                    "name": _clip(str(labels.get("alertname") or "alert"), 120),
                    "namespace": _clip(str(labels.get("namespace") or ""), 120),
                    "severity": _clip(str(labels.get("severity") or ""), 40),
                    "firstActiveAt": _iso_from_epoch(min(stamps)),
                    "lastActiveAt": _iso_from_epoch(max(stamps)),
                }
            )
        out.sort(key=lambda a: a["lastActiveAt"] or "", reverse=True)
        return out, "ok"
    
    
    @router.get("/nexus/communication/history")
    def get_nexus_communication_history(window: str = "24h") -> Dict[str, Any]:
        """Recent routed activity for the Alert Routing page: receipt rows,
        the delivery pulse, and alert-firing history - gated exactly like its
        sibling, assembled per request (all three halves are live reads; a
        cache here would serve a dead source's last answer as current)."""
        if not view_enabled("communication"):
            raise HTTPException(status_code=404, detail="nexus: the communication view is not available in this deployment")
        if not read_features().get("communication-view", False):
            raise HTTPException(status_code=404, detail="nexus: the communication-view feature is not enabled")
        if window not in _HISTORY_WINDOWS:
            raise HTTPException(status_code=400, detail=f"nexus: unknown window (one of {', '.join(_HISTORY_WINDOWS)})")
        seconds, step = _HISTORY_WINDOWS[window]
        cfg = _load_config()
        end = time.time()
        start = end - seconds
        receipts, receipts_state = _router_receipt_history(cfg)
        prom = _prom_base(cfg)
        if prom:
            pulse, pulse_state = _pulse_history(prom, start, end, step)
            alerts, alerts_state = _alert_firing_history(prom, start, end, step)
        else:
            pulse, pulse_state = [], "not configured"
            alerts, alerts_state = [], "not configured"
        return {
            "window": window,
            "windowSeconds": seconds,
            "stepSeconds": step,
            "receipts": {
                "state": receipts_state,
                # The receipts ring's honest bound, stated ON the record so the
                # UI labels the list with it instead of implying the window.
                "truthfulWindow": "since router start",
                "entries": receipts,
            },
            "pulse": {"state": pulse_state, "buckets": pulse},
            "alertHistory": {"state": alerts_state, "entries": alerts},
            "provenance": {
                "observedAt": datetime.now(timezone.utc).isoformat(),
                "sources": {
                    "receipts": {
                        "family": "event-router",
                        "state": receipts_state,
                        "detail": "in-memory receipt ring; cleared on router restart",
                    },
                    "pulse": {
                        "family": "prometheus",
                        "state": pulse_state,
                        "detail": "increase() over delivery/failure counters, 15d retention",
                    },
                    "alertHistory": {
                        "family": "prometheus-alerts",
                        "state": alerts_state,
                        "detail": "ALERTS range query, 15d retention",
                    },
                },
            },
        }
    
    
    def _implied_events(edges: List[Dict[str, Any]]) -> Dict[str, Any]:
        """The reserved platform events, behind their display flag. `agents.all`
        is the implied broadcast every distribution ships with: one test event
        the router fans out to EVERY agent profile. The flag gates DISPLAY
        only; the reservation is platform contract."""
        if not read_features().get("all-agents-event", False):
            return {}
        # Once the emitted tree carries the REAL agents.all fan-out, the
        # implied row would double-show the same event - the reservation
        # display exists only until the synthesis reaches this environment.
        if any(str(e.get("event") or "").startswith("agents.all") for e in edges):
            return {}
        profiles = sorted(
            {
                str((e.get("target") or {}).get("profile"))
                for e in edges
                if e.get("kind") == "agent" and (e.get("target") or {}).get("profile")
            }
        )
        return {
            "impliedEvents": [
                {
                    "event": "agents.all/v1",
                    "reserved": True,
                    "implied": True,
                    "profiles": profiles,
                }
            ]
        }
    
    
    @router.get("/nexus/workspaces")
    def get_nexus_workspaces() -> Dict[str, Any]:
        """Workspace repository bindings (#361) with LIVE mount state: what is
        declared in deployments/workspaces/bindings.yaml, and whether each
        bound profile's running pod actually carries the mount. Rides the
        repository-links flag - it is the repositories surface. Sources and
        revisions may be shown; credentials never leave the cluster."""
        if not read_features().get("repository-links", False):
            raise HTTPException(status_code=404, detail="nexus: the repository-links feature is not enabled")
        cfg = _load_config()
        repo_path = cfg.get("repoPath")
        if not repo_path:
            raise HTTPException(status_code=503, detail="nexus: no repoPath configured")
        bindings_file = Path(str(repo_path)) / "deployments" / "workspaces" / "bindings.yaml"
        if yaml is None or not bindings_file.is_file():
            return {"version": 1, "bindings": []}
        try:
            doc = _as_dict(yaml.safe_load(bindings_file.read_text(encoding="utf-8")))
        except Exception:
            return {"version": 1, "bindings": []}
        raw = _as_dict(doc.get("spec")).get("bindings")
        kube = cfg.get("kubeContext")
        bindings: List[Dict[str, Any]] = []
        mounts_by_ns: Dict[str, Optional[List[str]]] = {}
        for item in raw if isinstance(raw, list) else []:
            if not isinstance(item, dict):
                continue
            mount_path = _comm_str(item.get("mountPath"))
            profiles = [p for p in (item.get("targetProfiles") or []) if _comm_str(p)]
            targets = []
            for profile in profiles:
                ns = f"hermes-{profile}"
                if ns not in mounts_by_ns:
                    try:
                        pods = _k8s_get(f"/api/v1/namespaces/{ns}/pods", kube)
                        paths: List[str] = []
                        for pod in pods.get("items") or []:
                            for container in (pod.get("spec") or {}).get("containers") or []:
                                for vm in container.get("volumeMounts") or []:
                                    if isinstance(vm, dict) and vm.get("mountPath"):
                                        paths.append(str(vm["mountPath"]))
                        mounts_by_ns[ns] = paths
                    except Exception:
                        mounts_by_ns[ns] = None  # unreadable is unknown, never false
                paths = mounts_by_ns[ns]
                targets.append(
                    {
                        "profile": profile,
                        "mounted": (mount_path in paths) if isinstance(paths, list) else None,
                    }
                )
            bindings.append(
                {
                    "repository": _comm_str(item.get("repository")),
                    "source": _clip(str(item.get("source") or ""), 200),
                    "resolvedRevision": _comm_str(item.get("resolvedRevision")),
                    "mountPath": mount_path,
                    "access": _comm_str(item.get("access")),
                    "purpose": _comm_str(item.get("purpose")),
                    "targets": targets,
                }
            )
        return {"version": 1, "bindings": bindings}
    
    
    # ---------------------------------------------------------------------------
    # Health: the normalized runtime overlay (schema
    # runtime-overlay/v1alpha1/overlay.schema.json, design 12 + design 15).
    #
    # THIS MODULE OWNS THE LADDER. It used to be implemented three times - here,
    # in the browser's types.ts, and again per-card in cards.tsx - which meant
    # three chances to disagree about whether a missing observation is green.
    # The overlay now carries every level the UI renders (per instance, per
    # component, and per named rollup), the browser reads them, and the CLI
    # validates the same document against the same schema. One producer, one
    # ladder, no mirrors.
    
    _health_cache: Dict[str, Any] = {"at": 0.0, "doc": None, "key": None}
    
    _LEVEL_RANK = {"unhealthy": 3, "degraded": 2, "unknown": 1, "healthy": 0}
    
    # v1alpha2 (#565/#567): the rollups key space gained the `bundle:<name>`
    # scope and `bucket:unbundled` - a widening, so it is a new frozen
    # schema directory (agent-bundle-contracts/runtime-overlay/v1alpha2).
    OVERLAY_API_VERSION = "nexus.hermes.ai/v1alpha2"
    
    # Closed set - the schema enum. A new source kind is a new schema version
    # directory, never a silent widening: consumers switch on this exhaustively.
    SOURCE_KINDS = (
        "argocd",
        "grafana",
        "uptime",
        "eval",
        "backup",
        "communication",
        "reconciliation",
    )
    
    _MAX_SUMMARY = 120
    _MAX_REASON = 200
    _MAX_REASONS = 5
    _MAX_LINKS = 3
    
    # What each not-yet-wired adapter says about itself. Naming the reason beats
    # a bare "not configured": the operator learns what would have to exist.
    _UNWIRED_SUMMARY = {
        "grafana": "no Prometheus base URL configured",
        "uptime": "no external probe series in Prometheus",
        "eval": "eval results are not persisted",
        "backup": "no labelled backup routines observed",
        "communication": "no router metrics target",
        "reconciliation": "no reconciliation record published",
    }
    
    
    def _rollup(levels: List[str]) -> str:
        """unhealthy > degraded > unknown > healthy; no instances = unknown."""
        if not levels:
            return "unknown"
        worst = "healthy"
        for level in levels:
            if _LEVEL_RANK.get(level, 1) > _LEVEL_RANK[worst]:
                worst = level
        return worst
    
    
    def _clip(text: Any, limit: int) -> str:
        """Bound every string the browser renders. An upstream message is not
        ours - Argo, Grafana and a hand-edited ConfigMap can all put arbitrary
        length in front of an operator, and an unbounded one blows a popover
        open."""
        s = str(text if text is not None else "")
        return s if len(s) <= limit else s[: limit - 1] + "…"
    
    
    def _truncate_reasons(reasons: List[Dict[str, Any]]) -> List[Dict[str, Any]]:
        """At most five, and say so when there were more. Silently dropping the
        tail would let a 40-application outage read like a 5-application one."""
        clean = [
            {k: _clip(v, _MAX_REASON) for k, v in r.items() if k in ("message", "instanceId") and v}
            for r in reasons
            if isinstance(r, dict) and r.get("message")
        ]
        if len(clean) <= _MAX_REASONS:
            return clean
        return clean[: _MAX_REASONS - 1] + [{"message": f"+{len(clean) - (_MAX_REASONS - 1)} more"}]
    
    
    def _source(
        kind: str,
        status: str,
        level: str,
        summary: str,
        observed_at: Optional[str] = None,
        reasons: Optional[List[Dict[str, Any]]] = None,
        links: Optional[List[Optional[Dict[str, str]]]] = None,
    ) -> Dict[str, Any]:
        """The one Source constructor, and the one place the document's central
        invariant is enforced: a source that is unconfigured or failed reports
        `unknown`. An adapter cannot hand back green for something it did not
        observe, because it does not get to choose - this function overrides it.
        That is what makes 'one dead adapter cannot turn the system green' a
        property of the code rather than a rule adapters are asked to follow."""
        if status in ("not configured", "failed"):
            level = "unknown"
        out: Dict[str, Any] = {
            "kind": kind,
            "status": status,
            "level": level,
            "summary": _clip(summary, _MAX_SUMMARY),
        }
        if observed_at:
            out["observedAt"] = observed_at
        if reasons:
            trimmed = _truncate_reasons(reasons)
            if trimmed:
                out["reasons"] = trimmed
        if links:
            kept = [ln for ln in links if ln][:_MAX_LINKS]
            if kept:
                out["links"] = kept
        return out
    
    
    def _unwired_sources(observed_at: str) -> Dict[str, Dict[str, Any]]:
        """Every source kind that has no adapter yet, saying so honestly. These
        are emitted, not omitted: an absent row is indistinguishable from a
        healthy one, which is exactly the lie the overlay exists to prevent."""
        return {
            kind: _source(kind, "not configured", "unknown", _UNWIRED_SUMMARY[kind])
            for kind in SOURCE_KINDS
            if kind != "argocd"
        }
    
    
    # ---------------------------------------------------------------------------
    # Server-built investigation links. The browser used to assemble these from
    # an Application NAME alone, which is not an identity - two namespaces can
    # own the same name. Every link is built here, from exact identity, onto an
    # already-allowlisted base, with every segment percent-encoded.
    
    
    def _join(base: Optional[str], *segments: str) -> Optional[str]:
        """Path-join onto a base that has ALREADY been through _safe_base_url.
        Every segment is encoded with safe='' so a namespace, an Application
        name or a dashboard uid can never introduce a path, a scheme, a query
        or a fragment - the base's shape is guaranteed by the caller, and the
        segments' shape is guaranteed here."""
        from urllib.parse import quote
    
        if not base:
            return None
        parts = []
        for seg in segments:
            if not seg:
                continue
            # `.` and `..` are UNRESERVED, so quote() passes them through
            # untouched - and a lone `..` segment is the one thing a browser
            # will normalise away, walking the URL up out of /applications/.
            # No real Kubernetes name is a dot segment, so refusing beats
            # encoding: a link we cannot build honestly is better than one
            # that resolves somewhere else.
            if str(seg).strip(".") == "":
                return None
            parts.append(quote(str(seg), safe=""))
        if not parts:
            return None
        return base + "/" + "/".join(parts)
    
    
    def _link(label: str, url: Optional[str], instance_id: Optional[str] = None) -> Optional[Dict[str, str]]:
        """An external destination, or nothing. Never a half-built URL."""
        if not url:
            return None
        out = {"label": label, "kind": "external", "url": url}
        if instance_id:
            out["instanceId"] = instance_id
        return out
    
    
    def _internal(label: str, href: str) -> Dict[str, str]:
        """An in-Nexus route. Carries `href`, never `url`: the two are different
        trust paths and the schema refuses a link that is both."""
        return {"label": label, "kind": "internal", "href": href}
    
    
    def _argo_level(health_status: str, sync_status: str) -> str:
        """Argo Application status -> the severity ladder (design 11 §health).
    
        Degraded/Missing are unhealthy; Progressing/Suspended keep running but
        need attention; a Healthy app that is OutOfSync is degraded, not green.
        """
        if health_status in ("Degraded", "Missing"):
            return "unhealthy"
        if health_status in ("Progressing", "Suspended"):
            return "degraded"
        if health_status == "Healthy":
            return "degraded" if sync_status == "OutOfSync" else "healthy"
        return "unknown"
    
    
    # In-cluster ServiceAccount projection (ADR-48): when the pod carries a
    # token, read the Argo Applications straight from the API server - the
    # image ships no kubectl and needs none. Scoped by the chart's ClusterRole
    # to get/list applications.argoproj.io, nothing more.
    _SA_DIR = Path("/var/run/secrets/kubernetes.io/serviceaccount")
    
    
    ARGO_API_PATH = "/apis/argoproj.io/v1alpha1/applications"
    
    
    def _k8s_get(path: str, context: Optional[str] = None, timeout: float = 15.0) -> Dict[str, Any]:
        """One Kubernetes read, either transport, as parsed JSON.
    
        In-cluster (a ServiceAccount token is mounted) the API server is read
        directly - the image ships no kubectl and needs none. Host-side,
        `kubectl get --raw` is the same request through the operator's existing
        context, which is why one function covers both and every adapter gets
        the same credential story: none of its own.
    
        Raises on failure. Callers degrade to a SANITIZED reason - stderr can
        name servers and file paths and must never reach the browser."""
        if (_SA_DIR / "token").exists():
            import ssl
            import urllib.request
    
            token = (_SA_DIR / "token").read_text().strip()
            ctx = ssl.create_default_context(cafile=str(_SA_DIR / "ca.crt"))
            req = urllib.request.Request(
                f"https://kubernetes.default.svc{path}",
                headers={"Authorization": f"Bearer {token}"},
            )
            with urllib.request.urlopen(req, timeout=timeout, context=ctx) as resp:
                return json.loads(resp.read().decode("utf-8"))
        cmd = ["kubectl"]
        if context:
            cmd += ["--context", str(context)]
        cmd += ["get", "--raw", path]
        proc = subprocess.run(cmd, capture_output=True, timeout=timeout, check=True)
        return json.loads(proc.stdout.decode("utf-8"))
    
    
    def _items(doc: Dict[str, Any]) -> List[Dict[str, Any]]:
        items = doc.get("items", [])
        return items if isinstance(items, list) else []
    
    
    def _own_namespace(cfg: Dict[str, Any]) -> str:
        """Where the reconciliation record lives: configured explicitly, else
        the pod's own namespace (the control plane deploys Nexus beside the
        record), else the host-mode fallback."""
        configured = cfg.get("controlPlaneNamespace")
        if isinstance(configured, str) and configured:
            return configured
        ns_file = _SA_DIR / "namespace"
        if ns_file.exists():
            return ns_file.read_text().strip()
        return "hermes-gitops"
    
    
    def _k8s_get_optional(path: str, context: Optional[str] = None) -> Optional[Dict[str, Any]]:
        """A read where absence is an ANSWER, not an error. Returns None on
        404 only; anything else propagates, because 'the record does not
        exist' (not configured) and 'the API is down' (failed) are different
        operator problems and folding them together would hide the second."""
        import urllib.error
    
        try:
            return _k8s_get(path, context)
        except urllib.error.HTTPError as exc:
            if exc.code == 404:
                return None
            raise
        except subprocess.CalledProcessError as exc:
            if b"NotFound" in (exc.stderr or b""):
                return None
            raise
    
    
    def _run_kubectl(context: Optional[str]) -> List[Dict[str, Any]]:
        """Every Argo Application, as parsed JSON items."""
        return _items(_k8s_get(ARGO_API_PATH, context))
    
    
    # ---------------------------------------------------------------------------
    # Alert sources. BOTH engines evaluate rules here, and reading only one of
    # them was #618.
    #
    # Prometheus evaluates the kube-prometheus-stack defaultRules. Grafana
    # evaluates every rule charts/monitoring provisions - the six alerts the
    # platform actually ships. They are separate evaluators with separate state;
    # a Grafana-managed rule never appears in Prometheus's /api/v1/alerts.
    #
    # This file used to say Grafana "would need a credential to tell us something
    # Prometheus already knows". Both halves were wrong: Prometheus does not know
    # it, and Grafana's alerting API answers unauthenticated on the anonymous
    # Viewer the reference bootstrap enables - which is the same access this
    # module already uses for probe_grafana_health. So the reading is merged, and
    # an unreachable Grafana degrades the same way an unreachable Prometheus does:
    # to unknown, never to healthy.
    
    
    def _prom_get(base: str, path: str, timeout: float = 8.0) -> Dict[str, Any]:
        import urllib.request
    
        with urllib.request.urlopen(f"{base}{path}", timeout=timeout) as resp:
            doc = json.loads(resp.read().decode("utf-8"))
        if doc.get("status") != "success":
            raise RuntimeError("prometheus query did not succeed")
        return doc.get("data") or {}
    
    
    def _prom_alerts(base: str) -> List[Dict[str, Any]]:
        alerts = _prom_get(base, "/api/v1/alerts").get("alerts", [])
        return alerts if isinstance(alerts, list) else []
    
    
    def _grafana_alerts(base: str, timeout: float = 8.0) -> List[Dict[str, Any]]:
        """Firing instances of Grafana-EVALUATED rules, shaped like Prometheus's.
    
        Grafana's /api/prometheus/grafana/api/v1/rules is deliberately
        Prometheus-shaped, so flattening groups -> rules -> alerts yields records
        the existing projection already understands: `state`, `activeAt`,
        `labels`, `annotations`, `value`.
    
        One shape difference matters. A Grafana rule provisioned by
        charts/monitoring carries `persona`, `severity` and `alertname` - and no
        `namespace`, which alert_ownership keys on. The persona IS the profile
        namespace's suffix, so it is mapped across rather than left to fall into
        the control-plane bucket.
        """
        import urllib.request
    
        with urllib.request.urlopen(f"{base}/api/prometheus/grafana/api/v1/rules", timeout=timeout) as resp:
            doc = json.loads(resp.read().decode("utf-8"))
        if doc.get("status") != "success":
            raise RuntimeError("grafana rules query did not succeed")
        # Grafana and Prometheus do not share an instance-state vocabulary.
        # Grafana says Alerting/Pending/Normal/NoData/Error; every consumer here
        # filters on Prometheus's firing/pending. Translating at the boundary is
        # what keeps the rest of this file from needing to know there are two
        # engines - and omitting it produced an empty list against a live Grafana
        # with three rules firing, which is the bug this whole change is about.
        states = {"alerting": "firing", "pending": "pending"}
        out: List[Dict[str, Any]] = []
        for group in (doc.get("data") or {}).get("groups") or []:
            for rule in group.get("rules") or []:
                for inst in rule.get("alerts") or []:
                    state = states.get((inst.get("state") or "").lower())
                    if state != "firing":
                        continue
                    labels = dict(inst.get("labels") or {})
                    # Grafana's own bookkeeping, not signal.
                    for k in list(labels):
                        if k.startswith("__") and k.endswith("__"):
                            labels.pop(k, None)
                    persona = labels.get("persona")
                    if persona and not labels.get("namespace"):
                        labels["namespace"] = f"hermes-{persona}"
                    labels.setdefault("alertname", rule.get("name") or "")
                    out.append(
                        {
                            "labels": labels,
                            "annotations": dict(inst.get("annotations") or {}),
                            "state": state,
                            "activeAt": inst.get("activeAt"),
                            "value": inst.get("value"),
                        }
                    )
        return out
    
    
    class AlertReading(list):
        """The merged alert list, plus which evaluators could not be read.
    
        A `list` subclass rather than a tuple or dataclass so that every existing
        consumer - and every test that stubs this out with a plain list - keeps
        working unchanged, and so a plain list remains a valid reading. Read the
        marker with `getattr(reading, "unreadable", ())`.
    
        It exists because "no alerts" and "no answer" are different facts, and the
        overlay treats them differently: absence of a firing alert is the HEALTHY
        signal there, so an unreadable evaluator that silently contributed nothing
        would publish healthy for components it knows nothing about.
        """
    
        unreadable: "tuple[str, ...]" = ()
    
    
    def alerts_observation(base: str, grafana_base: Optional[str] = None) -> AlertReading:
        """Every alert either engine currently knows - the ONE reading of that
        fact (#424).
    
        Two surfaces consume it: the health overlay's grafana adapter, which
        turns alerts into component LEVELS, and the Communication view's
        alert strip, which lists the alerts themselves. They used to reach
        /api/v1/alerts through separate call sites with separate handling, so
        the strip could describe an alert in terms the card health did not
        recognise. One function, one contract, two readings - and the
        readings stay deliberately different, because a firing alert
        correlates to a component, it does not replace that component's
        health.
    
        Deliberately NOT cached. A cache here would sit UNDER the overlay's
        own cache, and the compounded window is time during which a dead
        Prometheus keeps answering with the last alert list it served - which
        is the precise failure this ticket exists to remove: missing evidence
        must read unknown, never healthy. The duplicate call it would save is
        one HTTP GET per request against an in-cluster service.
    
        Raises when Prometheus is unreachable: the adapter degrades to
        stale/unknown, the strip reports unreachable. Those are different
        answers, and both are better than a shared silence.
    
        Prometheus failing is still fatal here because it is the source that was
        always required. Grafana failing is NOT fatal - a deployment may have
        anonymous access disabled, and what Prometheus knew is still worth
        serving - but it is recorded on `unreadable`, because an evaluator that
        could not be read contributes zero alerts and zero alerts is the HEALTHY
        signal to the overlay. Serving that silently would publish healthy for
        every component Grafana watches. Half an answer is fine; half an answer
        presented as whole is the bug this reading exists to prevent."""
        reading = AlertReading(_prom_alerts(base))
        if grafana_base:
            try:
                reading.extend(_grafana_alerts(grafana_base))
            except Exception:
                # NOT swallowed. Prometheus's alerts are still worth serving - a
                # deployment may have anonymous Grafana access disabled, and half a
                # list beats none - but the half must announce itself, or a
                # consumer reads the absence of Grafana's alerts as their absence.
                reading.unreadable = ("grafana",)
        return reading
    
    
    def _prom_query(base: str, expr: str) -> List[Dict[str, Any]]:
        from urllib.parse import quote
    
        result = _prom_get(base, f"/api/v1/query?query={quote(expr, safe='')}").get("result", [])
        return result if isinstance(result, list) else []
    
    
    # ---------------------------------------------------------------------------
    # The non-Argo adapters. Each is PURE given its fetched payload - the same
    # discipline build_overlay already had, for the same reason: the join logic
    # is what carries the honesty rules, and logic you can only exercise
    # against a live cluster is logic nobody exercises.
    #
    # Each returns (global source, {component id: narrowed source}). The
    # per-component narrowing is what makes a card's popover mean something;
    # without it every card would show the whole fleet's summary.
    
    
    def _component_namespaces(plan: Dict[str, Any]) -> Dict[str, set]:
        """component id -> the WORKLOAD namespaces its instances run in.
    
        This is the join key for every namespace-scoped signal (alerts fire
        with a `namespace` label; backup routines live in one). It is the
        plan's `instance.namespace` - the destination namespace - not the
        namespace an Argo Application object lives in."""
        out: Dict[str, set] = {}
        for comp in plan.get("components", []):
            if comp.get("kind") not in ("agent", "application"):
                continue
            out[comp["id"]] = {
                inst.get("namespace") for inst in comp.get("instances", []) if inst.get("namespace")
            }
        return out
    
    
    _ALERT_LEVEL = {"critical": "unhealthy", "error": "unhealthy", "page": "unhealthy"}
    
    
    def grafana_source(
        plan: Dict[str, Any], alerts: List[Dict[str, Any]], observed_at: str
    ) -> "tuple[Dict[str, Any], Dict[str, Dict[str, Any]]]":
        """Firing Prometheus alerts, global and narrowed by namespace.
    
        Absence of a firing alert IS the healthy signal here - that is what an
        alert means - so a component with no alerts reads healthy rather than
        unknown. This is the one adapter where "no data" is genuinely good
        news, and it is only true because the adapter itself is configured;
        when it is not, `_source` forces unknown regardless."""
        firing = [a for a in alerts if (a.get("state") or "").lower() == "firing"]
        by_ns: Dict[str, List[Dict[str, Any]]] = {}
        for alert in firing:
            labels = alert.get("labels") or {}
            by_ns.setdefault(labels.get("namespace") or "", []).append(alert)
    
        def _level(items: List[Dict[str, Any]]) -> str:
            worst = "healthy"
            for a in items:
                sev = str((a.get("labels") or {}).get("severity") or "").lower()
                lvl = _ALERT_LEVEL.get(sev, "degraded")
                if _LEVEL_RANK[lvl] > _LEVEL_RANK[worst]:
                    worst = lvl
            return worst
    
        def _reasons(items: List[Dict[str, Any]]) -> List[Dict[str, Any]]:
            return [
                {
                    "message": _clip(
                        f"{(a.get('labels') or {}).get('alertname') or 'alert'}: "
                        f"{(a.get('annotations') or {}).get('summary') or (a.get('labels') or {}).get('severity') or 'firing'}",
                        _MAX_REASON,
                    )
                }
                for a in items
            ]
    
        per_component: Dict[str, Dict[str, Any]] = {}
        for cid, namespaces in _component_namespaces(plan).items():
            mine = [a for ns in namespaces for a in by_ns.get(ns, [])]
            per_component[cid] = _source(
                "grafana",
                "configured",
                _level(mine),
                f"{len(mine)} firing alert{'s' if len(mine) != 1 else ''}" if mine else "no firing alerts",
                observed_at,
                reasons=_reasons(mine),
            )
        return (
            _source(
                "grafana",
                "configured",
                _level(firing),
                f"{len(firing)} firing alert{'s' if len(firing) != 1 else ''}"
                if firing
                else "no firing alerts",
                observed_at,
                reasons=_reasons(firing),
            ),
            per_component,
        )
    
    
    ROUTINE_LABEL = "hermes.dev/backup-routine"
    
    
    def backup_source(
        plan: Dict[str, Any],
        cronjobs: List[Dict[str, Any]],
        observed_at: str,
        stale_hours: float = 48.0,
    ) -> "tuple[Dict[str, Any], Dict[str, Dict[str, Any]]]":
        """Labelled backup CronJobs: suspended routines and stale ones.
    
        ponytail: staleness is read from CronJob `status.lastSuccessfulTime`
        only - no Jobs list, so no second API call and no extra RBAC verb. A
        failing routine therefore shows up as staleness rather than as an
        immediate failure, which costs up to `stale_hours` of delay. List Jobs
        too if that delay ever matters."""
        now = _parse_ts(observed_at)
        by_ns: Dict[str, List[Dict[str, Any]]] = {}
        for cj in cronjobs:
            meta = cj.get("metadata") or {}
            by_ns.setdefault(meta.get("namespace") or "", []).append(cj)
    
        def _assess(items: List[Dict[str, Any]]) -> "tuple[str, str, List[Dict[str, Any]]]":
            if not items:
                return "not configured", "no labelled backup routines", []
            reasons: List[Dict[str, Any]] = []
            worst = "healthy"
            for cj in items:
                name = (cj.get("metadata") or {}).get("name") or "routine"
                if (cj.get("spec") or {}).get("suspend"):
                    reasons.append({"message": f"{name}: suspended"})
                    worst = _rollup([worst, "degraded"])
                    continue
                last = ((cj.get("status") or {}).get("lastSuccessfulTime")) or ""
                if not last:
                    reasons.append({"message": f"{name}: has never completed a run"})
                    worst = _rollup([worst, "degraded"])
                    continue
                age = _age_hours(last, now)
                if age is None:
                    reasons.append({"message": f"{name}: unreadable last-success time"})
                    worst = _rollup([worst, "unknown"])
                elif age > stale_hours:
                    reasons.append({"message": f"{name}: last success {int(age)}h ago"})
                    worst = _rollup([worst, "degraded"])
            total = len(items)
            if reasons:
                summary = f"{len(reasons)} of {total} routine{'s' if total != 1 else ''} needs attention"
            else:
                summary = f"{total} of {total} routine{'s' if total != 1 else ''} current"
            return "configured", summary, reasons
    
        per_component: Dict[str, Dict[str, Any]] = {}
        for cid, namespaces in _component_namespaces(plan).items():
            mine = [cj for ns in namespaces for cj in by_ns.get(ns, [])]
            status, summary, reasons = _assess(mine)
            per_component[cid] = _source(
                "backup", status, "degraded" if reasons else "healthy", summary, observed_at, reasons=reasons
            )
        status, summary, reasons = _assess(cronjobs)
        return (
            _source("backup", status, "degraded" if reasons else "healthy", summary, observed_at, reasons=reasons),
            per_component,
        )
    
    
    # ---------------------------------------------------------------------------
    # The Backups product surface (#282, ADR-52).
    #
    # `backup_source` above answers "is anything wrong" for the overlay. This
    # answers the four questions the Backups view exists to ask - what is
    # protected, how stale is it, was the artifact inspected, and has a
    # restore ever actually been proven - and they are deliberately SEPARATE
    # axes. A routine can be perfectly on schedule and have produced nothing
    # anyone has ever read back; collapsing that into one green dot is the
    # precise failure this surface is built to prevent.
    
    RETENTION_ANNOTATION = "hermes.dev/backup-retention"
    DESTINATION_ANNOTATION = "hermes.dev/backup-destination"
    PROTECTS_ANNOTATION = "hermes.dev/backup-protects"
    RESTORE_HOOK_ANNOTATION = "hermes.dev/backup-restore-hook"
    PLATFORM_BACKUP_CONFIGMAP = "hermes-platform-backup-status"
    
    _SINK_VOLUME = "backups"
    
    
    def _restore_shape(cj: Dict[str, Any]) -> str:
        """`volume | hook | unsupported` - what could put this artifact back.
    
        Mirrors `restoreShapeOf` in cli/src/backup.ts, from the same CronJob
        facts: a non-`backups` PVC volume is the volume path's target, the
        restore-hook annotation is the app-owned path, and neither means the
        routine produces archives nothing can replay. `unsupported` is an
        actionable failure, not a shrug - it is precisely the shape that
        otherwise renders as a perfectly healthy routine.
    
        Deliberately does NOT re-implement the hook's validation: presence is
        all this needs, and `hg backup restore` refuses an invalid one loudly.
        """
        if (cj.get("metadata") or {}).get("annotations", {}).get(RESTORE_HOOK_ANNOTATION):
            return "hook"
        volumes = (
            (((cj.get("spec") or {}).get("jobTemplate") or {}).get("spec") or {}).get("template") or {}
        ).get("spec", {}).get("volumes") or []
        for vol in volumes:
            if isinstance(vol, dict) and vol.get("name") != _SINK_VOLUME:
                if (vol.get("persistentVolumeClaim") or {}).get("claimName"):
                    return "volume"
        return "unsupported"
    
    
    def _sink_claim(cj: Dict[str, Any]) -> Optional[str]:
        """The PVC behind a routine's `backups` volume - the sink it writes
        to. The ledger names that claim as unprotected-by-design ("archiving
        the archive is circular"), and the projection folds it onto the
        routine's own row rather than listing a second row per routine."""
        volumes = (
            (((cj.get("spec") or {}).get("jobTemplate") or {}).get("spec") or {}).get("template") or {}
        ).get("spec", {}).get("volumes") or []
        for vol in volumes:
            if isinstance(vol, dict) and vol.get("name") == _SINK_VOLUME:
                claim = (vol.get("persistentVolumeClaim") or {}).get("claimName")
                return str(claim) if claim else None
        return None
    
    # The SCHEDULE axis. Ordered worst-first for the summary line; each maps
    # to one overlay level, and the mapping lives here only.
    _ROUTINE_LEVEL = {
        "failed": "unhealthy",
        "never": "degraded",
        "late": "degraded",
        "disabled": "degraded",
        "running": "healthy",
        "healthy": "healthy",
    }
    
    
    def _scrubbed_prose(value: Any) -> Optional[str]:
        """Bounded prose from a hand-editable ConfigMap, or nothing.
    
        The writer already drops host paths and never writes a URL, so a value
        that LOOKS unscrubbed here is evidence of a hand edit rather than
        something to render anyway - the same posture the reconciliation
        reader takes with its summary. Dropping beats sanitizing: a mangled
        half-path in front of an operator is worse than no sentence at all."""
        text = str(value or "").strip()
        if not text or "//" in text or text.startswith("/") or text.startswith("~"):
            return None
        return _clip(text, _MAX_REASON)
    
    
    def _annotation_int(annotations: Dict[str, Any], key: str) -> Optional[int]:
        try:
            value = int(str(annotations.get(key)))
        except (TypeError, ValueError):
            return None
        return value if 0 <= value <= 100000 else None
    
    
    def _routine_state(cj: Dict[str, Any], now: Optional[datetime], stale_hours: float) -> "tuple[str, Optional[str], Optional[float]]":
        """(state, reason, hours since last success). The one ladder for a
        routine's schedule health - `backup_source`'s reasons and this view's
        dots are both downstream of the same facts, so they cannot disagree."""
        spec = cj.get("spec") or {}
        status = cj.get("status") or {}
        if spec.get("suspend"):
            return "disabled", "the routine is suspended - nothing is being archived", None
        last = str(status.get("lastSuccessfulTime") or "")
        if not last:
            scheduled = str(status.get("lastScheduleTime") or "")
            if scheduled:
                return "failed", "scheduled but never completed a run", None
            return "never", "has never run", None
        age = _age_hours(last, now)
        if age is None:
            return "never", "unreadable last-success time", None
        # An active Job whose start is newer than the last success IS a run in
        # flight, not lateness - reporting it late would make every backup
        # window flash amber for its own duration.
        if status.get("active"):
            return "running", None, age
        if age > stale_hours:
            return "late", f"last success {int(age)}h ago (window {int(stale_hours)}h)", age
        return "healthy", None, age
    
    
    def _platform_artifacts(platform: Optional[Dict[str, Any]]) -> Dict[str, Dict[str, Any]]:
        """(profile, routine) -> what the last platform backup found in that
        routine's sink. This is the ONLY evidence in the system that a
        routine's artifact was ever opened and checksummed: `hg platform
        backup` runs each routine fresh, exports the artifact and hashes it.
        Without a platform backup the honest answer is `unmeasured`."""
        if not isinstance(platform, dict):
            return {}
        verified = (platform.get("verification") or {}).get("state") == "restorable"
        out: Dict[str, Dict[str, Any]] = {}
        for comp in platform.get("components") or []:
            if not isinstance(comp, dict) or comp.get("kind") != "volume-archive":
                continue
            profile, routine = comp.get("profile"), comp.get("routine")
            if not profile or not routine:
                continue
            out[f"{profile}/{routine}"] = {
                # ADR-52's two states, per artifact. `restorable` only because
                # a restore replayed the backup this artifact belongs to.
                "state": "restorable" if verified else "available",
                **({"checksum": _clip(comp.get("checksum"), 16)} if comp.get("checksum") else {}),
                **({"sizeKB": comp["sizeKB"]} if isinstance(comp.get("sizeKB"), int) else {}),
                **({"consistency": c} if (c := _scrubbed_prose(comp.get("consistency"))) else {}),
            }
        return out
    
    
    _MAX_RUNS_PER_ROUTINE = 10
    
    
    def _job_run_state(job: Dict[str, Any]) -> str:
        """`succeeded | failed | active` for one backup Job.
    
        Conditions are the Job's own terminal verdict; the pod counters are
        the fallback for a Job the controller has not concluded yet. A Job
        with failed pods that eventually completed is `succeeded` - the
        verdict is about the run, not its retries."""
        for cond in job.get("status", {}).get("conditions") or []:
            if cond.get("status") != "True":
                continue
            if cond.get("type") == "Complete":
                return "succeeded"
            if cond.get("type") in ("Failed", "FailureTarget"):
                return "failed"
        status = job.get("status") or {}
        if status.get("succeeded"):
            return "succeeded"
        if status.get("active"):
            return "active"
        if status.get("failed"):
            return "failed"
        return "active"
    
    
    def _routine_runs(jobs: List[Dict[str, Any]]) -> Dict["tuple[str, str]", List[Dict[str, Any]]]:
        """(namespace, cronjob name) -> that routine's retained runs, newest
        first. The join is ownerReferences, not labels - the routine label
        lives on CronJob metadata only, so a Job carries no mark of its own.
        Bounded per routine: the CronJobs' history limits bound it upstream
        anyway; the cap here just keeps a hand-made Job flood out of the
        payload."""
        out: Dict["tuple[str, str]", List[Dict[str, Any]]] = {}
        for job in jobs:
            meta = job.get("metadata") or {}
            ns = str(meta.get("namespace") or "")
            owner = next(
                (
                    str(ref.get("name") or "")
                    for ref in meta.get("ownerReferences") or []
                    if isinstance(ref, dict) and ref.get("kind") == "CronJob"
                ),
                "",
            )
            if not ns or not owner:
                continue
            status = job.get("status") or {}
            out.setdefault((ns, owner), []).append(
                {
                    "name": _clip(meta.get("name"), 80),
                    "state": _job_run_state(job),
                    **({"startedAt": s} if (s := status.get("startTime")) else {}),
                    **({"completedAt": s} if (s := status.get("completionTime")) else {}),
                }
            )
        for runs in out.values():
            runs.sort(key=lambda r: str(r.get("startedAt") or ""), reverse=True)
            del runs[_MAX_RUNS_PER_ROUTINE:]
        return out
    
    
    # #582: the six control-plane declaratives, in the operator's words. An
    # unknown name renders verbatim - inventing a gloss for a component we do
    # not recognize is the false reassurance this page exists to kill.
    _DECLARATIVE_TITLES = {
        "argocd": "Argo CD",
        "grafana-dashboards-and-alerts": "Grafana dashboards & alerts",
        "prometheus-metric-history": "Prometheus metric history",
        "communication-router": "Event router",
        "cloudflare-tunnel": "Cloudflare tunnel",
        "hermes-host-config": "Hermes host config",
    }
    
    
    def _platform_component_rows(
        platform: Optional[Dict[str, Any]], observed_at: str, stale_hours: float
    ) -> List[Dict[str, Any]]:
        """The control plane's EXPLICIT per-component coverage (#582): the
        platform record's own components as ordinary routine rows - the
        blanket 'Platform backup' row is retired. volume-archives are NOT
        re-emitted (each already rides its CronJob row as the artifact);
        what surfaces here is everything that had no row of its own: the
        host archive, each declarative rebuild claim, and the ledger's
        intentionally-ephemeral volumes with their recorded rationale."""
    
        def row(rid: str, title: str, state: str, level: str, artifact: Dict[str, Any], **extra: Any) -> Dict[str, Any]:
            return {
                "id": rid,
                "title": title,
                "namespace": "",
                "group": "control-plane",
                "groupTitle": "Control plane",
                "runs": [],
                "runCounts": {"succeeded": 0, "failed": 0, "active": 0},
                "schedule": "",
                "protects": [],
                "state": state,
                "level": level,
                "restore": "hook",
                "artifact": artifact,
                **extra,
            }
    
        if not isinstance(platform, dict) or not platform.get("backupId"):
            # Absence is a real, red answer - not a quiet omission.
            return [
                row(
                    "platform/archive",
                    "Host & platform archive",
                    "failed",
                    "unhealthy",
                    {"state": "unmeasured"},
                    reason="no platform backup has ever been taken - run `hg platform backup create`",
                )
            ]
        recorded = str(platform.get("observedAt") or "")
        age = _age_hours(recorded, _parse_ts(observed_at))
        stale = age is None or age > stale_hours
        stale_reason = (
            f"platform backup record is {int(age)}h old - is the backup timer running?"
            if age is not None
            else "platform backup record carries no readable timestamp"
        )
        verified = (platform.get("verification") or {}).get("state") == "restorable"
        created = platform.get("createdAt")
        rows: List[Dict[str, Any]] = []
        saw_host_archive = False
        components = [c for c in (platform.get("components") or []) if isinstance(c, dict) and c.get("name")][:200]
        for c in components:
            kind, name = c.get("kind"), str(c.get("name"))
            if kind == "volume-archive":
                continue
            if kind == "host-archive":
                saw_host_archive = True
                art: Dict[str, Any] = {"state": "restorable" if verified else "available"}
                if c.get("checksum"):
                    art["checksum"] = _clip(c.get("checksum"), 16)
                if isinstance(c.get("sizeKB"), int):
                    art["sizeKB"] = c["sizeKB"]
                reason = stale_reason if stale else (None if verified else "archived by the platform backup - a verified restore has not replayed it yet")
                rows.append(
                    row(
                        f"platform/{name}",
                        "Nexus host state",
                        "archived",
                        "healthy" if (verified and not stale) else "unknown",
                        art,
                        **({"lastSuccess": created} if created else {}),
                        **({"reason": _clip(reason, _MAX_REASON)} if reason else {}),
                    )
                )
            elif kind == "declarative":
                if name.startswith("argocd-application/"):
                    # The profile's own rows already carry that claim.
                    continue
                detail = _scrubbed_prose(c.get("detail"))
                rows.append(
                    row(
                        f"platform/{name}",
                        _DECLARATIVE_TITLES.get(name, _clip(name, 120)),
                        "declarative",
                        "unknown" if stale else "healthy",
                        {"state": "declared"},
                        **({"reason": _clip(stale_reason if stale else detail, _MAX_REASON)} if (stale or detail) else {}),
                    )
                )
        if not saw_host_archive:
            # A record with no host-archive component (older CLI) still needs
            # a carrier for ADR-52's verification state - without one, an
            # archive nobody ever replayed would read green, the exact false
            # reassurance this page exists to kill.
            reason = stale_reason if stale else (None if verified else "archive taken - a verified restore has not replayed it yet")
            rows.append(
                row(
                    "platform/archive",
                    "Platform archive",
                    "archived",
                    "healthy" if (verified and not stale) else "unknown",
                    {"state": "restorable" if verified else "available"},
                    **({"lastSuccess": created} if created else {}),
                    **({"reason": _clip(reason, _MAX_REASON)} if reason else {}),
                )
            )
        for e in (platform.get("unprotectedByDesign") or [])[:50]:
            if not isinstance(e, dict) or not e.get("claim"):
                continue
            rows.append(
                row(
                    f"ephemeral/{_clip(str(e['claim']), 120)}",
                    _clip(str(e["claim"]), 120),
                    "ephemeral",
                    "healthy",
                    {"state": "ephemeral"},
                    namespace=_clip(str(e.get("namespace") or ""), 120),
                    **({"reason": _clip(str(e.get("reason")), _MAX_REASON)} if e.get("reason") else {}),
                )
            )
        return rows
    
    
    def project_backups(
        plan: Dict[str, Any],
        cronjobs: List[Dict[str, Any]],
        platform: Optional[Dict[str, Any]],
        observed_at: str,
        stale_hours: float = 48.0,
        platform_stale_hours: float = 48.0,
        bundles: Optional[Dict[str, str]] = None,
        jobs: Optional[List[Dict[str, Any]]] = None,
        membership: Optional[Dict[str, Dict[str, Any]]] = None,
    ) -> Dict[str, Any]:
        """Every discovered routine as a status-page row - CronJob routines
        plus the platform record's explicit per-component coverage (#582).
    
        `platform` is the scrubbed ConfigMap record the operator host
        publishes; None means no platform backup has ever been taken, which is
        a real and reportable state rather than an error."""
        now = _parse_ts(observed_at)
        # Several components can SHARE a workload namespace (an agent and the
        # agent-applications it ships - engagement + postiz). A plain
        # namespace->component map is last-writer-wins there, which titled the
        # agent's own backup "Postiz" on the factory. Keep every resident and
        # resolve per ROUTINE below: the component whose id appears in the
        # routine's name wins (app routines embed it - "...-postiz-backup"),
        # otherwise the agent, because agents own their namespace and
        # applications are guests in it.
        kind_of = {c.get("id"): c.get("kind") for c in plan.get("components", [])}
        ns_residents: Dict[str, List[str]] = {}
        for cid, namespaces in _component_namespaces(plan).items():
            for ns in namespaces:
                ns_residents.setdefault(ns, []).append(cid)
        # A bundle's routine lives in the bundle namespace, which no
        # component declares - attribute it to its first member so the row
        # carries a component rather than a bare namespace.
        for profile, bundle_ns in (bundles or {}).items():
            ns_residents.setdefault(bundle_ns, [profile])
    
        def _owner(ns: str, routine: str) -> Optional[str]:
            residents = ns_residents.get(ns) or []
            named = [cid for cid in residents if cid and cid in routine]
            if named:
                # Rightmost mention wins: routine names lead with the agent's
                # namespace-derived prefix and end with the specific subject
                # ("hermes-marketing-engagement-postiz-postiz-backup" names
                # the app, not the agent whose namespace prefixes it).
                return max(named, key=lambda cid: (routine.rfind(cid), len(cid)))
            agents = [cid for cid in residents if kind_of.get(cid) == "agent"]
            return (agents or residents or [None])[0]
        titles = {c.get("id"): c.get("title") or c.get("id") for c in plan.get("components", [])}
        artifacts = _platform_artifacts(platform)
        runs_of = _routine_runs(jobs or [])
        # Grouping mirrors _build_rollups: the view's node parents are the one
        # authority on membership. The control plane's own routines resolve to
        # no component at all - that absence, in its namespaces, IS the
        # "Control plane" group. `control-plane` is a reserved bucket id here,
        # like `bucket:ungrouped` in the rollups.
        parent_of = {
            node.get("ref"): node.get("parent")
            for node in ((plan.get("view") or {}).get("nodes") or [])
            if node.get("parent")
        }
        group_titles = {
            c.get("id"): c.get("title") or c.get("id")
            for c in plan.get("components", [])
            if c.get("kind") == "group"
        }
        # #567: canonical bundle attribution per row, by the namespace the
        # routine actually runs in. Beside it, the control-plane bucket now
        # uses the ONE definition (CONTROL_PLANE_NAMESPACES) instead of a
        # private two-namespace tuple - which had silently excluded
        # hermes-monitoring, argocd and hermes-gitops routines from the
        # platform group (#566's "missing control-plane coverage").
        bundle_by_ns = _bundle_ns_index(membership)
    
        rows: List[Dict[str, Any]] = []
        # (namespace, sink claim) -> the routine row that writes to it, so the
        # ledger's sink entries fold onto their routine instead of doubling
        # the row count (eight extra rows on a twelve-routine fleet).
        sink_rows: Dict["tuple[str, str]", Dict[str, Any]] = {}
        for cj in cronjobs:
            meta = cj.get("metadata") or {}
            annotations = meta.get("annotations") or {}
            name = str(meta.get("name") or "routine")
            ns = str(meta.get("namespace") or "")
            component = _owner(ns, name)
            state, reason, age = _routine_state(cj, now, stale_hours)
            shape = _restore_shape(cj)
            if shape == "unsupported":
                # Overrides a green schedule outright. A routine producing
                # perfect archives that nothing can put back is not a backup.
                state, reason = "failed", "no restore path: no data PVC and no declared restore hook"
            protects = [
                _clip(p.strip(), 120)
                for p in str(annotations.get(PROTECTS_ANNOTATION) or "").split(",")
                if p.strip()
            ][:20]
            # The artifact join is keyed on the PROFILE the platform backup
            # used, which is the component id for an agent and the
            # control-plane pseudo-name otherwise.
            artifact = artifacts.get(f"{component}/{name}") or artifacts.get(f"{ns.removeprefix('hermes-')}/{name}")
            runs = runs_of.get((ns, name), [])
            if component and (parent := parent_of.get(component)):
                group: Optional[Dict[str, str]] = {"group": parent, "groupTitle": str(group_titles.get(parent) or parent)}
            elif not component and ns in CONTROL_PLANE_NAMESPACES:
                group = {"group": "control-plane", "groupTitle": "Control plane"}
            else:
                group = None
            bundle_of_row = bundle_by_ns.get(ns)
            rows.append(
                {
                    "id": f"{ns}/{name}",
                    "title": name,
                    "namespace": ns,
                    **({"component": component, "componentTitle": titles.get(component)} if component else {}),
                    **(group or {}),
                    # #567: served attribution - the browser stops re-deriving
                    # bundle membership from the profile->namespace map.
                    **({"bundle": bundle_of_row[0], "bundleTitle": bundle_of_row[1]} if bundle_of_row else {}),
                    "runs": runs,
                    "runCounts": {
                        "succeeded": sum(1 for r in runs if r["state"] == "succeeded"),
                        "failed": sum(1 for r in runs if r["state"] == "failed"),
                        "active": sum(1 for r in runs if r["state"] == "active"),
                    },
                    "schedule": _clip((cj.get("spec") or {}).get("schedule"), 60),
                    **({"retention": r} if (r := _annotation_int(annotations, RETENTION_ANNOTATION)) is not None else {}),
                    **({"destination": _clip(annotations.get(DESTINATION_ANNOTATION), 40)} if annotations.get(DESTINATION_ANNOTATION) else {}),
                    "protects": protects,
                    **({"lastAttempt": s} if (s := (cj.get("status") or {}).get("lastScheduleTime")) else {}),
                    **({"lastSuccess": s} if (s := (cj.get("status") or {}).get("lastSuccessfulTime")) else {}),
                    **({"artifactAgeHours": round(age, 1)} if age is not None else {}),
                    "state": state,
                    "level": _ROUTINE_LEVEL[state],
                    "restore": shape,
                    **({"reason": _clip(reason, _MAX_REASON)} if reason else {}),
                    # `unmeasured` is a value, not a gap: nothing has opened
                    # this routine's sink, so nobody can say what is in it.
                    "artifact": artifact or {"state": "unmeasured"},
                }
            )
            sink = _sink_claim(cj)
            if sink:
                # Keyed on the same clipped spelling the ledger row's id
                # carries, so a long claim name still folds (Codex review).
                sink_rows[(ns, _clip(sink, 120))] = rows[-1]
        # #582: the platform record's components join as ordinary rows. Rows
        # that carry a real namespace (the ledger's ephemeral volumes) take
        # that namespace's own attribution instead of defaulting to the
        # control plane - a bundle's redis belongs to the bundle's routine.
        for prow in _platform_component_rows(platform, observed_at, platform_stale_hours):
            ns = prow.get("namespace") or ""
            if prow["id"].startswith("ephemeral/"):
                owner_row = sink_rows.get((ns, prow["id"][len("ephemeral/"):]))
                if owner_row is not None:
                    # The ledger stays closed - the claim is still named - but
                    # it is named on the routine that fills it, where the
                    # reader looking for "where do these archives go" is.
                    owner_row["sink"] = prow["id"][len("ephemeral/"):]
                    if prow.get("reason"):
                        owner_row["sinkReason"] = prow["reason"]
                    continue
            if ns and ns not in CONTROL_PLANE_NAMESPACES:
                b = bundle_by_ns.get(ns)
                if b:
                    prow.pop("group", None)
                    prow.pop("groupTitle", None)
                    prow["bundle"], prow["bundleTitle"] = b
                comp = _owner(ns, prow["id"])
                if comp:
                    prow["component"] = comp
                    prow["componentTitle"] = titles.get(comp)
            rows.append(prow)
        rows.sort(key=lambda r: (-_LEVEL_RANK.get(r["level"], 1), r["id"]))
        unprotected = _unprotected(plan, cronjobs, bundles, membership)
    
        return {
            "apiVersion": OVERLAY_API_VERSION,
            "kind": "BackupsView",
            "observedAt": observed_at,
            "routines": rows,
            "unprotected": unprotected,
            "counts": {
                "routines": len(rows),
                "needsAttention": sum(1 for r in rows if r["level"] in ("degraded", "unhealthy")),
                "unmeasured": sum(1 for r in rows if r["artifact"]["state"] == "unmeasured"),
                "unprotected": len(unprotected),
                # The header's at-a-glance run totals (retained Jobs only -
                # the Grafana history panels carry the long window).
                "runsSucceeded": sum(r["runCounts"]["succeeded"] for r in rows),
                "runsFailed": sum(r["runCounts"]["failed"] for r in rows),
                "runsActive": sum(r["runCounts"]["active"] for r in rows),
            },
        }
    
    
    def bundle_membership(repo_path: Optional[str]) -> Dict[str, Dict[str, Any]]:
        """bundle name -> {namespace, profiles[]} (ADR-28).
    
        Serve-time overlay: the plan cannot say "profile X is in bundle Y"
        without a schema bump, so this file - `deployments/bundles/<name>/
        values.yaml` in the clone Nexus already has - is the fact's only home.
        Bundling retires a member's own StatefulSet/namespace, which is why a
        bundled agent addressed by its own name otherwise resolves to nothing
        (the third place this bit Nexus, after the communication edges in
        #278 and `hg backup` in #282).
    
        The release namespace defaults to `hermes-<bundle>` by the CLI's own
        placement convention, but #567 stopped it being a guess: the sibling
        `deployment.yaml` the compiler writes beside values.yaml records the
        authoritative `spec.namespace` (honouring placement.namespace), plus
        `spec.id` and the presentation `spec.displayName`. When that file is
        readable its facts win; the convention remains the fallback so an
        older tree keeps resolving.
    
        Enrichment keys (`id`, `displayName`) appear ONLY when the compiled
        tree declares them - an older tree's map is byte-identical to the
        pre-#567 shape, which is also what keeps the frontend's fallbacks
        honest (name is the title when no displayName was ever authored).
    
        ponytail: assumes one `deployments/bundles/<dir>/values.yaml` per
        bundle name (the emitter's own convention - two directories sharing a
        name would already collide at deploy time). Two dirs declaring the
        same `spec.name` last-write-wins here rather than merging; not
        guarded against because it can't arise from a working fleet, only a
        hand-edited one."""
        out: Dict[str, Dict[str, Any]] = {}
        if not repo_path or yaml is None:
            return out
        root = Path(repo_path) / "deployments" / "bundles"
        # The whole scan - is_dir() and the glob iteration, not just each
        # file's parse - is inside this try. `root` is a clone-relative path
        # Nexus does not control; a transiently unreadable directory (or one
        # that turns out to be a file) must degrade to what was already
        # collected, never 500 GET /nexus mid-iteration.
        try:
            for values in sorted(root.glob("*/values.yaml")) if root.is_dir() else []:
                # One try around the whole file, not just the parse: GET /nexus
                # now calls this directly (unlike the old bundle_namespaces,
                # which only backup_facts read, itself always try/except'd by its
                # callers). A syntactically-valid but wrongly-shaped file - a
                # list at the top, `spec` not a mapping - must degrade to "skip
                # this bundle", never 500 the whole canvas.
                try:
                    doc = yaml.safe_load(values.read_text()) or {}
                    if not isinstance(doc, dict):
                        continue
                    spec = doc.get("spec") or {}
                    if not isinstance(spec, dict):
                        continue
                    name = spec.get("name") or values.parent.name
                    if not isinstance(name, str):
                        continue
                    profiles = [
                        p["name"]
                        for p in spec.get("profiles") or []
                        if isinstance(p, dict) and isinstance(p.get("name"), str)
                    ]
                    bundle: Dict[str, Any] = {"namespace": f"hermes-{name}", "profiles": profiles}
                    # The authoritative half (#567), inside the same per-file
                    # guard: a malformed deployment.yaml degrades to the
                    # convention, never drops the bundle.
                    try:
                        dep = yaml.safe_load((values.parent / "deployment.yaml").read_text()) or {}
                        dep_spec = dep.get("spec") if isinstance(dep, dict) else None
                        if isinstance(dep_spec, dict):
                            if isinstance(dep_spec.get("namespace"), str):
                                bundle["namespace"] = dep_spec["namespace"]
                            if isinstance(dep_spec.get("id"), str):
                                bundle["id"] = dep_spec["id"]
                            if isinstance(dep_spec.get("displayName"), str):
                                bundle["displayName"] = dep_spec["displayName"]
                    except Exception:
                        pass
                    out[name] = bundle
                except Exception:
                    continue
        except OSError:
            pass
        if out:
            return out
        # The distribution fallback (#567/ADR-119, identity contract in
        # ADR-123): an environment that retired the ADR-28 runtime bundle
        # (the factory's per-profile topology cutover) still has ONE
        # canonical installed grouping - the distribution its profiles were
        # installed from. Identity comes from the DECLARED `distribution`
        # block the topology compiler stamps onto every agent deployment
        # record (bundles.yaml v4); records without the stamp derive it from
        # the profile record's source-repo stem, title from the words.
        # Members keep their own namespaces, carried in the per-profile
        # `namespaces` map (there is no shared pod here). Fires ONLY when no
        # compiled bundle exists - the compiled tier is authoritative.
        try:
            base = Path(repo_path)
            groups: Dict[str, Dict[str, Any]] = {}
            for record in sorted((base / "profiles").glob("*/profile.yaml")):
                try:
                    doc = yaml.safe_load(record.read_text()) or {}
                    spec = doc.get("spec") if isinstance(doc, dict) else None
                    src = (spec or {}).get("source")
                    if not isinstance(src, str) or not src.strip():
                        continue
                    stem = src.rstrip("/").split("/")[-1]
                    for suffix in (".git", ".hermes-gitops"):
                        if stem.endswith(suffix):
                            stem = stem[: -len(suffix)]
                    if not stem:
                        continue
                    profile = record.parent.name
                    ns = f"hermes-{profile}"
                    declared_name: Optional[str] = None
                    declared_title: Optional[str] = None
                    try:
                        dep = yaml.safe_load((base / "deployments" / "agents" / profile / "deployment.yaml").read_text()) or {}
                        dep_spec = dep.get("spec") if isinstance(dep, dict) else None
                        if isinstance(dep_spec, dict):
                            if isinstance(dep_spec.get("namespace"), str):
                                ns = dep_spec["namespace"]
                            dist = dep_spec.get("distribution")
                            if isinstance(dist, dict):
                                if isinstance(dist.get("name"), str) and dist["name"]:
                                    declared_name = dist["name"]
                                if isinstance(dist.get("displayName"), str) and dist["displayName"].strip():
                                    declared_title = dist["displayName"]
                    except Exception:
                        pass
                    key = declared_name or stem
                    g = groups.setdefault(key, {"profiles": [], "namespaces": {}, "title": None})
                    g["profiles"].append(profile)
                    g["namespaces"][profile] = ns
                    if declared_title and not g["title"]:
                        g["title"] = declared_title
                except Exception:
                    continue
            for key, g in sorted(groups.items()):
                derived = " ".join(w.capitalize() for w in re.split(r"[-_]+", key) if w)
                out[key] = {
                    "namespace": "",
                    "namespaces": g["namespaces"],
                    "profiles": g["profiles"],
                    "id": key,
                    "displayName": g["title"] or derived or key,
                }
        except (OSError, TypeError):
            pass
        return out
    
    
    def bundle_namespaces(repo_path: Optional[str]) -> Dict[str, str]:
        """profile name -> the namespace it ACTUALLY runs in, for bundled
        members. Projection over `bundle_membership` - see there for why this
        exists; kept as its own function because `backup_facts` (below) only
        ever needs the namespace side."""
        return {
            profile: ns
            for bundle in bundle_membership(repo_path).values()
            for profile in bundle["profiles"]
            if (ns := (bundle.get("namespaces") or {}).get(profile) or bundle.get("namespace"))
        }
    
    
    def _bundle_ns_index(membership: Optional[Dict[str, Dict[str, Any]]]) -> Dict[str, "tuple[str, str]"]:
        """namespace -> (bundle id, title), over BOTH membership tiers - the
        one index every backup attribution reads (rows and uncovered alike),
        so the two can never disagree about who owns a namespace."""
        index: Dict[str, "tuple[str, str]"] = {}
        for name, b in (membership or {}).items():
            title = (name, str(b.get("displayName") or name))
            if b.get("namespace"):
                index[b["namespace"]] = title
            for member_ns in (b.get("namespaces") or {}).values():
                index[member_ns] = title
        return index
    
    
    def _unprotected(
        plan: Dict[str, Any],
        cronjobs: List[Dict[str, Any]],
        bundles: Optional[Dict[str, str]] = None,
        membership: Optional[Dict[str, Dict[str, Any]]] = None,
    ) -> List[Dict[str, Any]]:
        """Components no routine covers - the question a list of routines
        cannot answer.
    
        A Backups page built only from discovered routines is a list of what
        IS protected, and reads as complete. It is not: a component whose
        namespace holds no routine simply never appears, so the surface stays
        green while the thing goes unbacked. Found live - two bundled agents
        (ADR-28) had no routine anywhere, because the bundle chart ships none,
        and every existing surface reported the fleet healthy.
    
        An AGENT with no routine is `degraded`: the profile chart gives every
        agent a data volume by construction, so nothing covering it is a real
        gap. An application may legitimately hold no state, so it is listed at
        `unknown` - present and inspectable, not accused."""
        covered = {(cj.get("metadata") or {}).get("namespace") for cj in cronjobs}
        placements = bundles or {}
        # The bundle is the UNIT of protection: an uncovered agent-application
        # (Postiz) belongs to its distribution's shelf, never a third section.
        bundle_by_ns = _bundle_ns_index(membership)
        kinds = {c.get("id"): c.get("kind") for c in plan.get("components", [])}
        titles = {c.get("id"): c.get("title") or c.get("id") for c in plan.get("components", [])}
        binds = {c.get("id"): (c.get("bind") or {}).get("profile") for c in plan.get("components", [])}
        out: List[Dict[str, Any]] = []
        for cid, namespaces in sorted(_component_namespaces(plan).items()):
            # A bundled component's real namespace is the bundle's, not the
            # one the plan declares - so check that too before calling it
            # unprotected, or the bundle's own routine goes unseen.
            bundle_ns = placements.get(binds.get(cid) or cid)
            if bundle_ns:
                namespaces = set(namespaces) | {bundle_ns}
            if not namespaces or namespaces & covered:
                continue
            is_agent = kinds.get(cid) == "agent"
            owner = next((bundle_by_ns[n] for n in sorted(n for n in namespaces if n) if n in bundle_by_ns), None)
            out.append(
                {
                    "id": cid,
                    "title": titles.get(cid, cid),
                    "kind": kinds.get(cid, "component"),
                    "namespaces": sorted(n for n in namespaces if n),
                    **({"bundle": owner[0], "bundleTitle": owner[1]} if owner else {}),
                    "level": "degraded" if is_agent else "unknown",
                    "reason": (
                        "no backup routine covers this agent's data volume"
                        if is_agent
                        else "no backup routine covers this component - it may hold no state"
                    ),
                }
            )
        return out
    
    # Availability thresholds for the per-agent readiness window (#279). One
    # ladder, here, like every other level in this module.
    _READY_HEALTHY = 0.99
    _READY_DEGRADED = 0.95
    
    
    def _ready_ratios(series: List[Dict[str, Any]]) -> Dict[str, float]:
        """namespace -> worst workload's mean ready ratio over the window.
    
        Reads WORKLOAD-level series (statefulset/deployment ready-vs-desired
        replicas), never pod-level. Pod-level readiness looks like the obvious
        source and is a trap: every agent namespace also holds completed
        backup CronJob pods, which are never `ready` and are not availability
        failures - taking the worst pod reported 0% for every agent in the
        fleet. Pod series also multiply per restart (distinct uid), so a
        short-lived one drags the minimum down for the whole window.
    
        Worst-workload within a namespace is kept, because one unready
        workload IS a real availability problem that averaging would hide."""
        out: Dict[str, float] = {}
        for s in series:
            ns = (s.get("metric") or {}).get("namespace")
            if not ns:
                continue
            try:
                value = float((s.get("value") or [None, "0"])[1])
            except Exception:
                continue
            if value != value:  # NaN from 0/0 - no desired replicas, no claim
                continue
            out[ns] = min(out[ns], value) if ns in out else value
        return out
    
    
    def _probe_stats(series: List[Dict[str, Any]]) -> Dict[str, Dict[str, Any]]:
        """probe key -> {group, name, ran, failed} from
        increase(gatus_results_total[w]) series. A series with no numeric
        value (the old instant query) or a flat window (the probe ran zero
        times) leaves `ran` False - silence is not success."""
        out: Dict[str, Dict[str, Any]] = {}
        for s in series:
            m = s.get("metric") or {}
            key = str(m.get("key") or m.get("name") or "")
            if not key:
                continue
            p = out.setdefault(
                key,
                {
                    "group": str(m.get("group") or ""),
                    "name": str(m.get("name") or key),
                    # measured: any numeric value seen, even 0 - what separates
                    # "the range query says the probe ran zero times" (silent)
                    # from "no measurement at all" (a valueless instant query,
                    # which must stay presence-only everywhere).
                    "measured": False,
                    "ran": False,
                    "failed": False,
                },
            )
            try:
                value = float((s.get("value") or [None, None])[1])
            except (TypeError, ValueError):
                continue
            if value != value:  # NaN - no claim
                continue
            p["measured"] = True
            if value <= 0:  # a flat window - the probe ran zero times
                continue
            p["ran"] = True
            if str(m.get("success")) == "false":
                p["failed"] = True
        return out
    
    
    # The generator (uptime/generate-config.ts pair()) emits two probes per
    # target: "<name>" (down = red) and "<name> — degraded" (slow = amber).
    _DEGRADED_TWIN = " — degraded"
    
    
    def _probe_cell(probes: List[Dict[str, Any]], probe_window: str) -> "tuple[str, str, List[Dict[str, Any]]]":
        """(level, summary, reasons) for a set of probes. A probe that ran
        zero times in the window is SILENT: it caps the level at unknown and
        is counted in the summary, because a dead prober hiding behind a
        healthy readiness ratio is exactly the silence-is-not-success trap
        (found by review: a flat group beside an active one read healthy)."""
        ran = [p for p in probes if p["ran"]]
        silent = len(probes) - len(ran)
        failing = [p for p in ran if p["failed"]]
        down = [p for p in failing if not p["name"].endswith(_DEGRADED_TWIN)]
        level = "unhealthy" if down else ("degraded" if failing else "healthy")
        if silent:
            level = _rollup([level, "unknown"])
        passing = len(ran) - len(failing)
        summary = f"{passing}/{len(probes)} probes passing ({probe_window})"
        if silent:
            summary += f", {silent} silent"
        reasons = [{"message": f"probe {p['name']} failing"} for p in failing]
        return level, summary, reasons
    
    
    def uptime_source(
        plan: Dict[str, Any],
        series: List[Dict[str, Any]],
        observed_at: str,
        ready_series: Optional[List[Dict[str, Any]]] = None,
        window: str = "30d",
        probe_window: str = "15m",
    ) -> "tuple[Dict[str, Any], Dict[str, Dict[str, Any]]]":
        """Availability: external probes fleet-wide, pod readiness per agent.
    
        Two different questions share this source kind because they answer the
        same operator question ("has this been up?") from opposite sides.
    
        The external-probe half is real pass/fail when the series come from
        `increase(gatus_results_total[w])` (#293): a probe whose failure
        counter moved in the window is failing, and its `group` label - the
        agent name the generator stamped on it - narrows it to the component
        whose bind.profile (or id) matches. Series without values (an instant
        query of the raw counter) stay presence-only: the counter alone means
        "failed at some point ever", never "failing now".
    
        The per-component half is real, and comes from kube-state-metrics,
        which the monitoring stack already runs: the mean of
        `kube_pod_status_ready` over the window IS the fraction of it the
        agent was ready. A component with no series is `not configured` -
        never healthy-by-default. When a component has both halves the worst
        level wins and the summary names both."""
        probes = _probe_stats(series)
        if not series:
            src = _source("uptime", "not configured", "unknown", _UNWIRED_SUMMARY["uptime"])
        elif any(p["ran"] for p in probes.values()):
            level, summary, reasons = _probe_cell(list(probes.values()), probe_window)
            src = _source(
                "uptime",
                "configured",
                level,
                summary.replace("/", " of ", 1),
                observed_at,
                reasons=_truncate_reasons(reasons),
            )
        else:
            src = _source(
                "uptime",
                "configured",
                "unknown",
                f"{len(probes)} probe{'s' if len(probes) != 1 else ''} reporting; "
                "pass/fail needs a range query",
                observed_at,
            )
    
        # ALL MEASURED probes with a group, ran or silent - a silent probe
        # must reach its component's cell, not vanish behind another group's
        # activity. Unmeasured (valueless) probes stay out: they carry no
        # claim to narrow.
        by_group: Dict[str, List[Dict[str, Any]]] = {}
        for p in probes.values():
            if p["group"] and p["measured"]:
                by_group.setdefault(p["group"], []).append(p)
        profile_of = {
            c.get("id"): str((c.get("bind") or {}).get("profile") or c.get("id"))
            for c in plan.get("components", [])
        }
        # The no-data fallback is the fleet row ONLY while that row has no
        # real level. Once probes give the fleet row a level, inheriting it
        # would paint every unmapped agent red for a failing argocd probe.
        fallback = (
            src
            if src["level"] == "unknown"
            else _source("uptime", "not configured", "unknown", "no probe or readiness series for this component")
        )
    
        ratios = _ready_ratios(ready_series or [])
        per_component: Dict[str, Dict[str, Any]] = {}
        for cid, namespaces in _component_namespaces(plan).items():
            mine = [ratios[ns] for ns in namespaces if ns in ratios]
            group = by_group.get(profile_of.get(cid, ""))
            if not mine and not group:
                per_component[cid] = fallback
                continue
            levels: List[str] = []
            bits: List[str] = []
            reasons: List[Dict[str, Any]] = []
            if mine:
                ratio = min(mine)
                if ratio >= _READY_HEALTHY:
                    levels.append("healthy")
                elif ratio >= _READY_DEGRADED:
                    levels.append("degraded")
                else:
                    levels.append("unhealthy")
                bits.append(f"{ratio * 100:.1f}% ready over {window}")
            if group:
                level, summary, why = _probe_cell(group, probe_window)
                levels.append(level)
                bits.append(summary)
                reasons.extend(why)
            per_component[cid] = _source(
                "uptime",
                "configured",
                _rollup(levels),
                " · ".join(bits),
                observed_at,
                reasons=_truncate_reasons(reasons),
            )
        return src, per_component
    
    
    def _depths_by_edge(series: List[Dict[str, Any]]) -> Dict[str, int]:
        out: Dict[str, int] = {}
        for s in series:
            try:
                depth = int(float((s.get("value") or [None, "0"])[1]))
            except Exception:
                continue
            edge = (s.get("metric") or {}).get("edge") or "unknown edge"
            out[edge] = depth
        return out
    
    
    def communication_source(
        plan: Dict[str, Any],
        up_series: List[Dict[str, Any]],
        dlq_series: List[Dict[str, Any]],
        observed_at: str,
        redis_series: Optional[List[Dict[str, Any]]] = None,
        pending_series: Optional[List[Dict[str, Any]]] = None,
    ) -> "tuple[Dict[str, Any], Dict[str, Dict[str, Any]]]":
        """Router health from its /metrics exposition, via Prometheus.
    
        Each series is chosen because it answers a LIVE question:
        - `hermes_router_up` is the presence marker the router emits on every
          scrape. Counters cannot stand in for it - an idle router has bumped
          none of them yet, so their absence proves nothing.
        - `hermes_router_redis_up` is the durable transport's own state. It
          exists because the router used to fail the WHOLE scrape when Redis
          was unreachable, which deleted `hermes_router_up` too and made this
          adapter report "not configured" - i.e. the dashboard went quiet at
          the exact moment the queue died. A router that is up with its queue
          down is unhealthy and says so.
        - `hermes_event_dlq_depth{edge=...}` is XLEN at scrape time: how many
          dead-lettered events are waiting NOW. A nonzero depth means
          deliveries exhausted their retries and a human owes the queue a
          decision - that is unhealthy, not degraded.
        - `hermes_event_pending_depth{edge=...}` is XPENDING: accepted but not
          yet delivered. Some pending is normal in flight, so it is degraded
          (a lag signal), never unhealthy.
    
        The delivery/failure counters are deliberately NOT levelled: they are
        cumulative, and "failed at some point ever" is the gatus trap again.
    
        ponytail: no per-component narrowing. Edge ids embed profile names,
        but only as substrings - matching them against bind.profile would
        mis-blame components whose names nest (manager / marketing-manager).
        Cards fall back to the fleet-wide entry; narrow only when the router
        labels deliveries with a real profile identity."""
        if not up_series:
            return _source("communication", "not configured", "unknown", _UNWIRED_SUMMARY["communication"]), {}
        reasons: List[Dict[str, Any]] = []
        dlq = _depths_by_edge(dlq_series)
        pending = _depths_by_edge(pending_series or [])
        total_depth = sum(d for d in dlq.values() if d > 0)
        for edge, depth in sorted(dlq.items()):
            if depth > 0:
                reasons.append({"message": _clip(f"{depth} dead-lettered on {edge}", _MAX_REASON)})
        total_pending = sum(d for d in pending.values() if d > 0)
        for edge, depth in sorted(pending.items()):
            if depth > 0:
                reasons.append({"message": _clip(f"{depth} awaiting delivery on {edge}", _MAX_REASON)})
    
        # A router reporting its queue down outranks queue CONTENTS: with the
        # transport dead the depths are unknowable, not zero.
        queue_down = [
            s
            for s in (redis_series or [])
            if str((s.get("value") or [None, "1"])[1]) in ("0", "0.0")
        ]
        routers = len(up_series)
        if queue_down:
            n = len(queue_down)
            summary = f"{n} of {routers} router{'s' if routers != 1 else ''} cannot reach the durable queue"
            level = "unhealthy"
            reasons.insert(0, {"message": "durable transport unreachable - queued delivery is stalled"})
        elif total_depth:
            summary = f"{total_depth} dead-lettered event{'s' if total_depth != 1 else ''} waiting"
            level = "unhealthy"
        elif total_pending:
            summary = f"{total_pending} event{'s' if total_pending != 1 else ''} awaiting delivery"
            level = "degraded"
        else:
            summary = f"{routers} router{'s' if routers != 1 else ''} up, queues empty"
            level = "healthy"
        return (
            _source(
                "communication",
                "configured",
                level,
                summary,
                observed_at,
                reasons=_truncate_reasons(reasons),
            ),
            {},
        )
    
    
    RECONCILIATION_CONFIGMAP = "hermes-reconciliation-status"
    
    # Phase -> ladder. change-detected/validating/applying are healthy, not
    # degraded: a reconciler MID-WORK is the system functioning, and painting
    # every deploy yellow would train operators to ignore yellow.
    _RECON_LEVEL = {
        "synced": "healthy",
        "change-detected": "healthy",
        "validating": "healthy",
        "applying": "healthy",
        "waiting-for-argocd": "degraded",
        "degraded": "degraded",
        "failed": "unhealthy",
        "authentication-required": "unhealthy",
    }
    
    _SHA_RE = None  # compiled lazily in _recon_sha
    
    
    def _recon_sha(value: Any) -> Optional[str]:
        global _SHA_RE
        import re
    
        if _SHA_RE is None:
            _SHA_RE = re.compile(r"^[0-9a-f]{40}$")
        return value if isinstance(value, str) and _SHA_RE.fullmatch(value) else None
    
    
    def reconciliation_source(
        doc: Optional[Dict[str, Any]], observed_at: str, stale_after_seconds: float = 1800.0
    ) -> "tuple[Dict[str, Any], Dict[str, Dict[str, Any]]]":
        """The host reconciler's published record (M01), re-scrubbed.
    
        The record arrives through a ConfigMap because the host and this pod
        share no filesystem, and it must NOT travel through Git - the
        deployment repository is the reconciler's own input, so committing
        status there would change the desired SHA and re-trigger
        reconciliation forever.
    
        A ConfigMap is hand-editable, so nothing in it is trusted shaped: the
        phase must be in the enum, SHAs must be 40-hex, and the summary is
        dropped outright if it smuggles a URL - the writer already scrubbed,
        and a value that LOOKS unscrubbed here is evidence of a hand edit,
        not something to render anyway.
    
        Staleness is the load-bearing check: a record whose observedAt is
        older than stale_after_seconds reads unknown, because a dead timer
        quietly serving its last success is exactly the false green M01
        exists to prevent. The default covers a long `pulumi up` plus the
        timer interval. No per-component narrowing - reconciliation is a fact
        about the installation, not any one workload."""
        if not isinstance(doc, dict):
            return _source("reconciliation", "not configured", "unknown", _UNWIRED_SUMMARY["reconciliation"]), {}
        phase = doc.get("phase")
        if phase not in _RECON_LEVEL:
            return (
                _source("reconciliation", "failed", "unknown", "reconciliation record is malformed"),
                {},
            )
        recorded_at = str(doc.get("observedAt") or "")
        age = _age_hours(recorded_at, _parse_ts(observed_at))
        if age is None or age * 3600.0 > stale_after_seconds:
            return (
                _source(
                    "reconciliation",
                    "stale",
                    "unknown",
                    f"reconciler last reported {int(age * 60) if age is not None else '?'}m ago - is the timer running?"
                    if age is not None
                    else "reconciliation record carries no readable timestamp",
                    recorded_at if _parse_ts(recorded_at) else None,
                ),
                {},
            )
        applied = _recon_sha(doc.get("appliedSha"))
        desired = _recon_sha(doc.get("desiredSha"))
        summary_raw = str(doc.get("summary") or "")
        if "//" in summary_raw:
            summary_raw = ""  # a URL-shaped summary survived the writer's scrub only by hand edit
        if phase == "failed" and desired:
            summary = f"commit {desired[:12]} rejected; running {applied[:12] if applied else 'nothing'}"
        elif applied:
            summary = f"{phase}: at {applied[:12]}"
        else:
            summary = phase
        reasons: List[Dict[str, Any]] = []
        if summary_raw:
            reasons.append({"message": _clip(summary_raw, _MAX_REASON)})
        if bool(doc.get("retryable")):
            reasons.append({"message": "retryable: `hg reconcile retry` will re-attempt this commit"})
        return (
            _source(
                "reconciliation",
                "configured",
                _RECON_LEVEL[phase],
                summary,
                recorded_at,
                reasons=reasons,
            ),
            {},
        )
    
    
    def eval_source(
        plan: Dict[str, Any],
        observed_at: Optional[str] = None,
        stale_hours: float = 168.0,
        reader: Optional[Any] = None,
    ) -> "tuple[Dict[str, Any], Dict[str, Dict[str, Any]]]":
        """Published eval results (ADR-57), read from the store in-process.
    
        The five states the surface must distinguish are all real here:
        `no runs` (nothing published - not configured, so never green),
        `passed`, `failed` (a behavioural failure), `harness error` (the
        evaluator or agent broke, which is NOT the agent failing its eval and
        must stay separable), and `stale` (the newest run is older than the
        freshness window, so the last-good is the most we know).
    
        A red eval is `degraded`, not `unhealthy`: it is a quality signal
        about behaviour, not an outage. ponytail: promote it if evals ever
        gate deployment - which is an explicit cut in #280."""
        read = reader or read_eval_results
        if reader is None and not read_features().get("eval-results", False):
            # The flag is the operator's switch for the whole surface. Off means
            # the adapter says so plainly rather than reporting results nothing
            # in the UI is prepared to render.
            src = _source("eval", "not configured", "unknown", "eval results are not enabled")
            return src, {cid: src for cid in _component_namespaces(plan)}
        cutoff = None
        if observed_at:
            parsed = _parse_ts(observed_at)
            if parsed is not None:
                cutoff = parsed.timestamp() - stale_hours * 3600
    
        per_component: Dict[str, Dict[str, Any]] = {}
        totals = {"pass": 0, "fail": 0, "error": 0}
        any_published = False
        for cid in _component_namespaces(plan):
            records = read(cid)
            if not records:
                per_component[cid] = _source("eval", "not configured", "unknown", "no eval runs published")
                continue
            any_published = True
            # Latest record per (suite, scenario) - a scenario's newest run is
            # its verdict; older ones are history, not additional failures.
            latest: Dict[Any, Dict[str, Any]] = {}
            for rec in records:  # newest first
                key = (rec.get("suite"), rec.get("scenario"))
                if key not in latest:
                    latest[key] = rec
            newest = max((str(r.get("ranAt") or "") for r in latest.values()), default="")
            failures = [r for r in latest.values() if r.get("status") in ("fail", "timeout")]
            harness = [r for r in latest.values() if r.get("status") in ("agent-error", "evaluator-error")]
            totals["fail"] += len(failures)
            totals["error"] += len(harness)
            totals["pass"] += len(latest) - len(failures) - len(harness)
    
            newest_ts = _parse_ts(newest)
            if cutoff is not None and newest_ts is not None and newest_ts.timestamp() < cutoff:
                per_component[cid] = _source(
                    "eval",
                    "stale",
                    "unknown",
                    f"newest run {newest} is older than {int(stale_hours)}h",
                    newest or observed_at,
                )
                continue
    
            reasons = [
                {"message": f"{r.get('suite')}/{r.get('scenario')}: {r.get('status')}"}
                for r in (*failures, *harness)
            ]
            if failures or harness:
                summary = (
                    f"{len(failures) + len(harness)} of {len(latest)} scenario"
                    f"{'s' if len(latest) != 1 else ''} not passing"
                )
                level = "degraded"
            else:
                summary = f"{len(latest)} of {len(latest)} scenarios passing"
                level = "healthy"
            per_component[cid] = _source(
                "eval", "configured", level, summary, newest or observed_at, reasons=_truncate_reasons(reasons)
            )
    
        if not any_published:
            src = _source("eval", "not configured", "unknown", "no eval runs published")
            return src, per_component
        bad = totals["fail"] + totals["error"]
        total = sum(totals.values())
        src = _source(
            "eval",
            "configured",
            "degraded" if bad else "healthy",
            f"{bad} of {total} scenarios not passing" if bad else f"{total} of {total} scenarios passing",
            observed_at,
        )
        return src, per_component
    
    
    def _parse_ts(value: str) -> Optional[datetime]:
        """Every timestamp in this module goes through here, which is why it
        tolerates fractional seconds even though nothing we write emits them.
    
        Found live: the platform backup record shipped `...:12.908Z` from
        `toISOString()` and read as "carries no readable timestamp" - so the
        surface said the record was stale seconds after it was published. The
        producer is fixed (`toRfc3339` in cli/src/lib.ts), but the failure
        mode is the point: a single unexpected millisecond turns a fresh
        observation into an unknown one, silently, in whichever adapter
        happens to be next. Being liberal HERE closes it for all of them."""
        for fmt in ("%Y-%m-%dT%H:%M:%SZ", "%Y-%m-%dT%H:%M:%S.%fZ"):
            try:
                return datetime.strptime(value, fmt).replace(tzinfo=timezone.utc)
            except Exception:
                continue
        return None
    
    
    def _age_hours(value: str, now: Optional[datetime]) -> Optional[float]:
        then, ref = _parse_ts(value), now or datetime.now(timezone.utc)
        if then is None:
            return None
        return (ref - then).total_seconds() / 3600.0
    
    
    def _argo_index(
        argo_items: Optional[List[Dict[str, Any]]],
    ) -> "tuple[Dict[tuple, Dict[str, Any]], Dict[str, Dict[str, Any]], set]":
        """Index Applications by (DESTINATION namespace, name) and by bare name.
    
        TWO different namespaces are in play and confusing them silently breaks
        both the match and the link:
    
        - ``metadata.namespace`` is where the Application OBJECT lives (`argocd`
          for a normal install). It is what an Argo CD URL wants.
        - ``spec.destination.namespace`` is where the Application DEPLOYS - the
          workload namespace, e.g. `hermes-marketing-manager`.
    
        The plan's ``instance.namespace`` is the DESTINATION one, so that is
        what we can key on. It is also the field that actually disambiguates:
        two Argo installations owning an Application of the same name deploy it
        to different workload namespaces. The name-only index remains as a
        fallback for instances with no namespace, and ambiguity is therefore
        only reachable there."""
        by_dest: Dict[tuple, Dict[str, Any]] = {}
        by_name: Dict[str, Dict[str, Any]] = {}
        ambiguous: set = set()
        for item in argo_items or []:
            meta = item.get("metadata") or {}
            name = meta.get("name") or ""
            if not name:
                continue
            dest_ns = (((item.get("spec") or {}).get("destination") or {}).get("namespace")) or ""
            if dest_ns:
                by_dest[(dest_ns, name)] = item
            if name in by_name:
                ambiguous.add(name)
            by_name[name] = item
        return by_dest, by_name, ambiguous
    
    
    def build_overlay(
        plan: Dict[str, Any],
        argo_items: Optional[List[Dict[str, Any]]],
        observed_at: str,
        unavailable_reason: Optional[str] = None,
        *,
        links: Optional[Dict[str, Any]] = None,
        sources: Optional[Dict[str, Dict[str, Any]]] = None,
        component_sources: Optional[Dict[str, Dict[str, Dict[str, Any]]]] = None,
        backups: Optional[Dict[str, Any]] = None,
        membership: Optional[Dict[str, Dict[str, Any]]] = None,
    ) -> Dict[str, Any]:
        """The normalized runtime overlay. Pure - no I/O.
    
        Joins Argo Application status onto the plan's instances, rolls up per
        logical component, and emits every level the UI renders so no consumer
        has to compute one. The whole allowlist of what the browser may learn
        about the cluster is written here: a level, a bounded one-line reason,
        an observation time, and a server-built link. Humans and groups carry
        no health. An instance whose Application is absent reads unknown - a
        missing deployment must be visible, not green.
    
        `sources` supplies the non-Argo adapters (they arrive with their own
        transports in a later change); absent, each says `not configured`
        honestly rather than being omitted. `links` is the already-sanitized
        integration base map from _links(cfg)."""
        by_dest, by_name, ambiguous = _argo_index(argo_items)
        link_bases = links or {}
        argo_base = link_bases.get("argocdBaseUrl")
    
        other_sources = dict(_unwired_sources(observed_at))
        other_sources.update(sources or {})
        narrowed = component_sources or {}
    
        def _rows_for(cid: str) -> List[Dict[str, Any]]:
            """This component's view of every non-Argo source: the adapter's
            narrowed answer where it has one, the fleet-wide entry otherwise."""
            return [
                (narrowed.get(kind) or {}).get(cid) or other_sources[kind]
                for kind in SOURCE_KINDS
                if kind != "argocd"
            ]
    
        components: Dict[str, Any] = {}
        instances: Dict[str, Any] = {}
        argo_reasons: List[Dict[str, Any]] = []
        for comp in plan.get("components", []):
            if comp.get("kind") not in ("agent", "application"):
                continue
            levels: List[str] = []
            comp_links: List[Optional[Dict[str, str]]] = []
            total = 0
            attention = 0
            for inst in comp.get("instances", []):
                total += 1
                inst_id = inst.get("id", "")
                app_name = inst.get("application")
                dest_ns = inst.get("namespace") or ""
                item = None
                if unavailable_reason is not None:
                    level, reasons = "unknown", [{"source": "argocd", "message": unavailable_reason}]
                elif app_name and (dest_ns, app_name) in by_dest:
                    item = by_dest[(dest_ns, app_name)]
                    level, reasons = _argo_instance(item)
                elif not app_name or app_name not in by_name:
                    level = "unknown"
                    reasons = [{"source": "argocd", "message": "no Argo Application matches this instance"}]
                elif app_name in ambiguous:
                    # Only reachable on the name-only fallback: a namespace-
                    # qualified plan can never be ambiguous.
                    level = "unknown"
                    reasons = [{"source": "argocd", "message": "ambiguous: multiple Argo Applications share this name"}]
                else:
                    item = by_name[app_name]
                    level, reasons = _argo_instance(item)
                levels.append(level)
                affected = level in ("degraded", "unhealthy")
                if affected:
                    attention += 1
                    argo_reasons.append({"message": reasons[0]["message"], "instanceId": inst_id})
                # The link needs the Application OBJECT's namespace, which only
                # the cluster knows - the plan carries the destination namespace
                # and using that here would build a URL to nothing. No matched
                # Application means no link, rather than a guessed one.
                object_ns = ((item or {}).get("metadata") or {}).get("namespace") or ""
                argo_url = _join(argo_base, "applications", object_ns, app_name) if app_name and object_ns else None
                inst_link = _link("Open in Argo CD", argo_url)
                # The component's own link list carries only the instances that
                # need looking at, tagged with which. Listing all of them would
                # push the one that is broken past the three-link cap on any
                # component with a few regions - the exact case the link exists
                # for.
                if inst_link and affected:
                    comp_links.append({**inst_link, "instanceId": inst_id})
                record: Dict[str, Any] = {
                    "level": level,
                    "reasons": [
                        {"source": r["source"], "message": _clip(r["message"], _MAX_REASON)}
                        for r in reasons[:_MAX_REASONS]
                    ],
                    "observedAt": observed_at,
                }
                if inst_link:
                    record["links"] = [inst_link]
                instances[inst_id] = record
            if not comp.get("resolved", True):
                reason = comp.get("unresolvedReason") or "binding unresolved"
                components[comp["id"]] = {
                    "level": "unknown",
                    "summary": _clip(reason, _MAX_SUMMARY),
                    "sources": [
                        _source("argocd", "configured", "unknown", reason),
                        *_rows_for(comp["id"]),
                    ],
                }
                continue
            level = _rollup(levels)
            if total == 0:
                summary = "no instances"
            elif attention:
                summary = f"{attention} of {total} instance{'s' if total != 1 else ''} requires attention"
            elif level == "unknown":
                summary = "not yet observed"
            else:
                summary = f"{total} of {total} instance{'s' if total != 1 else ''} healthy"
            argo_status = "failed" if unavailable_reason is not None else "configured"
            components[comp["id"]] = {
                "level": level,
                "summary": summary,
                # ponytail: every kind, per component - O(components x 7). Bounded
                # and gzip-friendly at this scale; narrow to sources with a fact
                # if a fleet ever makes the payload measurable.
                "sources": [
                    _source(
                        "argocd",
                        argo_status,
                        level,
                        unavailable_reason if unavailable_reason is not None else summary,
                        observed_at,
                        links=comp_links,
                    ),
                    *_rows_for(comp["id"]),
                ],
            }
    
        all_levels = [c["level"] for c in components.values()]
        argo_source = _source(
            "argocd",
            "not configured" if unavailable_reason is not None else "configured",
            _rollup(all_levels),
            unavailable_reason if unavailable_reason is not None else _fleet_summary(components),
            observed_at,
            reasons=argo_reasons,
        )
        if unavailable_reason is not None:
            # An adapter that RAN and failed is `failed`; one that was never
            # switched on is `not configured`. Both read unknown, but an
            # operator needs to know which of the two they are looking at.
            argo_source["status"] = "failed" if "disabled" not in unavailable_reason else "not configured"
    
        all_sources = {"argocd": argo_source, **other_sources}
        return {
            "apiVersion": OVERLAY_API_VERSION,
            "kind": "RuntimeOverlay",
            "observedAt": observed_at,
            "stale": any(s.get("status") == "stale" for s in all_sources.values()),
            "sources": all_sources,
            "components": components,
            "instances": instances,
            "rollups": _build_rollups(plan, components, all_sources, backups, membership),
        }
    
    
    def _argo_instance(item: Dict[str, Any]) -> "tuple[str, List[Dict[str, str]]]":
        status = item.get("status") or {}
        health_status = ((status.get("health") or {}).get("status")) or ""
        sync_status = ((status.get("sync") or {}).get("status")) or ""
        level = _argo_level(health_status, sync_status)
        detail = f"{sync_status or 'Unknown'} / {health_status or 'Unknown'}"
        return level, [{"source": "argocd", "message": detail}]
    
    
    def _fleet_summary(components: Dict[str, Any]) -> str:
        total = len(components)
        if total == 0:
            return "no workload components"
        attention = sum(1 for c in components.values() if c["level"] in ("degraded", "unhealthy"))
        if attention:
            return f"{attention} of {total} component{'s' if total != 1 else ''} requires attention"
        unknown = sum(1 for c in components.values() if c["level"] == "unknown")
        if unknown:
            return f"{unknown} of {total} component{'s' if total != 1 else ''} not yet observed"
        return f"{total} of {total} component{'s' if total != 1 else ''} healthy"
    
    
    def _rollup_entry(members: List[str], components: Dict[str, Any], noun: str) -> Dict[str, Any]:
        """One precomputed aggregate. `members` on the way out is the AFFECTED
        subset, sorted - that is what turns 'follow the red indicator down to
        the thing that is broken' into a lookup instead of a second traversal
        in the browser."""
        levels = [components[m]["level"] for m in members if m in components]
        level = _rollup(levels)
        affected = sorted(m for m in members if components.get(m, {}).get("level") in ("degraded", "unhealthy"))
        total = len(levels)
        plural = "s" if total != 1 else ""
        if total == 0:
            summary = f"no {noun}s"
        elif affected:
            summary = f"{len(affected)} of {total} {noun}{plural} requires attention"
        elif level == "unknown":
            # Count the unobserved ones rather than blaming the whole set: with
            # one unresolved binding beside nine healthy components, "10 not yet
            # observed" is a scarier lie than the truth.
            unknown = sum(1 for lv in levels if lv == "unknown")
            summary = f"{unknown} of {total} {noun}{plural} not yet observed"
        else:
            summary = f"{total} of {total} {noun}{plural} healthy"
        return {"level": level, "summary": summary, "members": affected}
    
    
    def _workspace_memberships() -> "tuple[Dict[str, List[str]], List[str]]":
        """sheet id -> card refs, plus the union across sheets - the M05
        hierarchy's middle and top layers. Read from the workspace document
        (concept sheets INCLUDED in the union: presentation can hide a mark,
        never a problem). Empty when no workspace exists yet."""
        try:
            ws = read_workspace(None) if WORKSPACE_PATH.is_file() else None
        except Exception:
            ws = None
        if not ws:
            return {}, []
        sheets: Dict[str, List[str]] = {}
        union: List[str] = []
        seen: set = set()
        for sheet in ws.get("sheets", []):
            # Deduplicated: two canvas instances of one component (#546) are
            # still ONE member of the sheet's rollup.
            refs = list(dict.fromkeys(c["ref"] for c in sheet.get("cards", [])))
            sheets[sheet["id"]] = refs
            for ref in refs:
                if ref not in seen:
                    seen.add(ref)
                    union.append(ref)
        return sheets, union
    
    
    # The workload kinds that stand for the platform itself on the System
    # sheet (#276). Eval is deliberately absent: it grades agent behaviour,
    # not the machinery that runs Hermes GitOps.
    _SYSTEM_SOURCE_KINDS = ("argocd", "grafana", "communication", "backup", "reconciliation", "uptime")
    
    
    def _system_rollup(sources: Dict[str, Any]) -> Dict[str, Any]:
        """nav:system - worst-of the platform sources, members = the inventory
        workload ids whose mapped source is the one requiring attention. Same
        ladder, same never-green posture: a not-configured source reads
        unknown and unknown propagates."""
        levels = [
            (sources.get(kind) or {}).get("level", "unknown") for kind in _SYSTEM_SOURCE_KINDS
        ]
        level = _rollup(levels)
        bad_kinds = {
            kind
            for kind in _SYSTEM_SOURCE_KINDS
            if (sources.get(kind) or {}).get("level") in ("degraded", "unhealthy")
        }
        members = sorted(w["id"] for w in INVENTORY if w.get("source") in bad_kinds)
        total = len(_SYSTEM_SOURCE_KINDS)
        if bad_kinds:
            summary = f"{len(bad_kinds)} of {total} platform sources requires attention"
        elif level == "unknown":
            unknown = sum(1 for lv in levels if lv == "unknown")
            summary = f"{unknown} of {total} platform sources not yet observed"
        else:
            summary = f"{total} of {total} platform sources healthy"
        return {"level": level, "summary": summary, "members": members}
    
    
    def _build_rollups(
        plan: Dict[str, Any],
        components: Dict[str, Any],
        sources: Optional[Dict[str, Any]] = None,
        backups: Optional[Dict[str, Any]] = None,
        membership: Optional[Dict[str, Dict[str, Any]]] = None,
    ) -> Dict[str, Any]:
        """The named aggregates every surface renders: the two kind directories
        and one per canvas group.
    
        Group membership comes from the view's node parents, which is also what
        the canvas draws containment fields from - so the field's severity and
        this rollup cannot disagree. Critically it is computed over ALL members,
        including ones a collapsed group is currently hiding: collapsing a group
        must never be able to hide a red card."""
        by_kind: Dict[str, List[str]] = {"agent": [], "application": []}
        kind_of = {}
        for comp in plan.get("components", []):
            kind = comp.get("kind")
            cid = comp.get("id")
            if kind in by_kind and cid in components:
                by_kind[kind].append(cid)
                kind_of[cid] = kind
        out: Dict[str, Any] = {
            "kind:agent": _rollup_entry(by_kind["agent"], components, "agent"),
            "kind:application": _rollup_entry(by_kind["application"], components, "application"),
        }
        members_by_group: Dict[str, List[str]] = {}
        parented: set = set()
        for node in ((plan.get("view") or {}).get("nodes") or []):
            parent = node.get("parent")
            ref = node.get("ref")
            if parent and ref in components:
                members_by_group.setdefault(parent, []).append(ref)
                parented.add(ref)
        for group_id, members in members_by_group.items():
            out[f"group:{group_id}"] = _rollup_entry(sorted(members), components, "member")
        # The directory shows an "Ungrouped" bucket beside the real groups, and
        # it needs a real level too. Its own scope, not group:ungrouped - a
        # repository is free to declare a Group whose id IS "ungrouped".
        out["bucket:ungrouped"] = _rollup_entry(
            sorted(cid for cid in components if cid not in parented), components, "member"
        )
        # #565/#567: per-Bundle aggregates from the canonical membership map -
        # the Agents directory groups by Bundle, and its bucket pill reads a
        # SERVER level like every other aggregate (the browser never computes
        # one). `bucket:unbundled` covers agents outside every bundle; its own
        # scope for the same reason bucket:ungrouped has one.
        profile_of = {
            comp.get("id"): ((comp.get("bind") or {}).get("profile") or comp.get("id"))
            for comp in plan.get("components", [])
        }
        bundled: set = set()
        for name, bundle in (membership or {}).items():
            profiles = set(bundle.get("profiles") or [])
            members = sorted(cid for cid, prof in profile_of.items() if prof in profiles and cid in components)
            if members:
                out[f"bundle:{name}"] = _rollup_entry(members, components, "member")
                bundled.update(members)
        out["bucket:unbundled"] = _rollup_entry(
            sorted(cid for cid in by_kind["agent"] if cid not in bundled), components, "agent"
        )
        # The M05 hierarchy (#275): per-sheet and top-navigation aggregates,
        # from the SAME ladder over declared membership - the browser follows
        # a red indicator down by lookup, it never recomputes.
        sheets, union = _workspace_memberships()
        for sheet_id, refs in sheets.items():
            out[f"sheet:{sheet_id}"] = _rollup_entry(sorted(refs), components, "component")
        # Fleet = the union of every sheet's cards, concept sheets included -
        # hiding a mark must never hide a problem. With no workspace yet, the
        # whole component set stands in (the default sheet holds everything).
        out["nav:fleet"] = _rollup_entry(
            sorted(union) if union else sorted(components), components, "component"
        )
        # Agents = every agent component, placed on a sheet or not.
        out["nav:agents"] = _rollup_entry(by_kind["agent"], components, "agent")
        # System = the platform's own machinery (#276), from source levels -
        # the one rollup whose members are inventory workloads, not components.
        out["nav:system"] = _system_rollup(sources or {})
        # Backups = routine schedules AND whether a restore has ever been
        # proven (#282). Its members are routine row ids, not components.
        out["nav:backups"] = _backups_rollup(backups)
        return out
    
    
    def _backups_rollup(view: Optional[Dict[str, Any]]) -> Dict[str, Any]:
        """nav:backups - the worst of every routine's schedule health and the
        platform record's verification state.
    
        The platform half is why this cannot be derived from the `backup`
        source: a fleet whose routines all run nightly and whose backups have
        never once been replayed is not healthy, it is UNPROVEN, and `unknown`
        is the overlay's word for that. It reads amber until a restore
        verification runs, which is the alarming-on-purpose posture ADR-52
        asks for - and #283's scheduled restore verification is what finally
        turns it green."""
        if not isinstance(view, dict):
            return {"level": "unknown", "summary": "backup routines not yet observed", "members": []}
        routines = view.get("routines") or []
        unprotected = view.get("unprotected") or []
        # #582: the platform block is gone - its facts live ON the rows. The
        # unproven half of ADR-52 is now per-artifact: an artifact that was
        # exported but never replayed reads `available`, and every such row
        # keeps the dot off green until a restore verification runs.
        unproven = sorted(r["id"] for r in routines if (r.get("artifact") or {}).get("state") == "available")
        levels = (
            [r.get("level", "unknown") for r in routines]
            + [u.get("level", "unknown") for u in unprotected]
            + ["unknown"] * len(unproven)
        )
        members = sorted(r["id"] for r in routines if r.get("level") in ("degraded", "unhealthy"))
        # An uncovered component is a member too. Without this the dot reports
        # only on things that HAVE a routine, which is precisely the blind
        # spot: a fleet stays green by having nothing to be wrong about.
        members += sorted(u["id"] for u in unprotected if u.get("level") in ("degraded", "unhealthy"))
        members += [r for r in unproven if r not in members]
        level = _rollup(levels)
        total = len(routines)
        if members and level in ("degraded", "unhealthy"):
            summary = f"{len(members)} of {total} backup subject(s) requires attention"
        elif level == "unknown":
            summary = (
                f"{len(unproven)} artifact(s) exported but never restore-proven"
                if unproven
                else "backup state not yet observed"
            )
        else:
            summary = f"{total} routine(s) current, restore verified"
        return {"level": level, "summary": summary, "members": members}
    
    
    # ---------------------------------------------------------------------------
    # Collection. The only impure part of the overlay: fetch, hand each payload
    # to its pure adapter, and remember the last good answer per adapter.
    
    # One slot per source kind. In-process on purpose: after a pod restart
    # nothing HAS been observed, and `unknown` is the truthful answer then -
    # persisting last-good to the PVC would let a fresh pod present a
    # pre-restart observation as if it were current.
    # ponytail: in-memory, lost on restart. Persist only if an operator reports
    # the restart-blank actually costs them something.
    _last_good: Dict[str, "tuple[Dict[str, Any], Dict[str, Dict[str, Any]]]"] = {}
    
    
    def collect_sources(
        plan: Dict[str, Any], cfg: Dict[str, Any], observed_at: str
    ) -> "tuple[Dict[str, Dict[str, Any]], Dict[str, Dict[str, Dict[str, Any]]]]":
        """Every non-Argo source, fetched concurrently.
    
        Six sequential adapters at an 8s worst case would blow a 15s poll, so
        they fan out - stdlib threads, bounded by each adapter's own timeout
        rather than by their sum. A failure becomes `failed`, or `stale`
        carrying the previous observation when there is one; either way the
        level is `unknown` or the last-good, never a fresh green."""
        from concurrent.futures import ThreadPoolExecutor
    
        prom = _prom_base(cfg)
        kube = cfg.get("kubeContext")
        stale_hours = float(cfg.get("backupStaleHours", 48))
    
        def _grafana():
            if not prom:
                raise _NotConfigured(_UNWIRED_SUMMARY["grafana"])
            reading = alerts_observation(prom, _grafana_alert_base(cfg))
            if getattr(reading, "unreadable", ()):
                # This adapter's founding rule is that absence of a firing alert IS
                # the healthy signal. That rule only holds when every evaluator was
                # actually read - otherwise it publishes healthy for exactly the
                # components the unread evaluator watches. Raising degrades the
                # source to unknown, which is the honest answer.
                raise RuntimeError(
                    f"alert evaluators unreadable: {', '.join(reading.unreadable)}"
                )
            return grafana_source(plan, reading, observed_at)
    
        # The Backups view (#282) and this adapter read the SAME observation
        # (#424) - one shared fetch, so the dot and the rows cannot be a poll
        # apart or read two different clocks. Failing here leaves `backups`
        # None and the rollup reads `unknown`.
        raw: Dict[str, Any] = {}
    
        def _backup():
            facts = backup_facts(cfg, kube)
            raw.update(facts)
            return backup_source(plan, facts["cronjobs"], observed_at, stale_hours)
    
        def _uptime():
            if not prom:
                raise _NotConfigured(_UNWIRED_SUMMARY["uptime"])
            window = str(cfg.get("availabilityWindow", "30d"))
            # kube-state-metrics is already enabled by the monitoring stack, so
            # per-agent availability costs two plain range queries and no new
            # exporter. Mean-ready-replicas over mean-desired-replicas IS the
            # fraction of the window the workload was fully available; both
            # halves are cheap range vectors, no subquery.
            ready = _prom_query(
                prom,
                f"avg_over_time(kube_statefulset_status_replicas_ready[{window}])"
                f" / avg_over_time(kube_statefulset_replicas[{window}])",
            ) + _prom_query(
                prom,
                f"avg_over_time(kube_deployment_status_replicas_available[{window}])"
                f" / avg_over_time(kube_deployment_spec_replicas[{window}])",
            )
            # increase() over the counter is what makes the probe half honest:
            # "failed in the last probeWindow", not "failed at some point
            # ever". Bare increase (no sum by) keeps the group/name labels the
            # per-component narrowing reads (#293).
            probe_window = str(cfg.get("probeWindow", "15m"))
            probes = _prom_query(prom, f"increase(gatus_results_total[{probe_window}])")
            return uptime_source(plan, probes, observed_at, ready, window, probe_window)
    
        def _communication():
            if not prom:
                raise _NotConfigured(_UNWIRED_SUMMARY["communication"])
            return communication_source(
                plan,
                _prom_query(prom, "hermes_router_up"),
                _prom_query(prom, "hermes_event_dlq_depth"),
                observed_at,
                _prom_query(prom, "hermes_router_redis_up"),
                _prom_query(prom, "hermes_event_pending_depth"),
            )
    
        def _reconciliation():
            ns = _own_namespace(cfg)
            cm = _k8s_get_optional(f"/api/v1/namespaces/{ns}/configmaps/{RECONCILIATION_CONFIGMAP}", kube)
            if cm is None:
                raise _NotConfigured(_UNWIRED_SUMMARY["reconciliation"])
            try:
                doc = json.loads((cm.get("data") or {}).get("status.json") or "")
            except Exception:
                doc = {"phase": "malformed"}  # falls to the enum check -> failed
            return reconciliation_source(
                doc, observed_at, float(cfg.get("reconcileStaleSeconds", 1800))
            )
    
        jobs = {
            "grafana": _grafana,
            "backup": _backup,
            "uptime": _uptime,
            "communication": _communication,
            "reconciliation": _reconciliation,
            "eval": lambda: eval_source(plan, observed_at, float(cfg.get("evalStaleHours", 168))),
        }
        globals_out: Dict[str, Dict[str, Any]] = {}
        per_comp: Dict[str, Dict[str, Dict[str, Any]]] = {}
        with ThreadPoolExecutor(max_workers=len(jobs)) as pool:
            futures = {kind: pool.submit(fn) for kind, fn in jobs.items()}
            for kind, future in futures.items():
                try:
                    source, narrowed = future.result()
                    _last_good[kind] = (source, narrowed)
                except _NotConfigured as exc:
                    source, narrowed = _source(kind, "not configured", "unknown", str(exc)), {}
                except Exception:
                    # Sanitized: an adapter's exception can name hosts, paths
                    # and query strings. The operator debugs on the host.
                    source, narrowed = _degrade(kind, _last_good.get(kind))
                globals_out[kind] = source
                per_comp[kind] = narrowed
        # Built after the join so a failed CronJob list yields no rows rather
        # than an empty-and-therefore-reassuring Backups view.
        backups = (
            project_backups(
                plan,
                raw["cronjobs"],
                raw.get("platform"),
                observed_at,
                stale_hours,
                float(cfg.get("platformBackupStaleHours", 48)),
                raw.get("bundles"),
            )
            if "cronjobs" in raw
            else None
        )
        return globals_out, per_comp, backups
    
    
    # ---------------------------------------------------------------------------
    # ONE backup observation (#424). The Backups page and the Backups nav dot
    # are two renderings of the same facts, and they used to fetch them
    # separately - two CronJob lists, two platform records, two caches, two
    # clocks. Nothing forced them to disagree, and nothing prevented it
    # either: a routine that started failing between the two polls showed a
    # green tab over a red table for a whole cache interval.
    #
    # So the facts BOTH surfaces derive from are observed once and shared.
    # What stays page-only is the Jobs list, which only the run strip reads -
    # no rollup depends on it, and making every health poll list every Job in
    # the cluster to serve a page most operators never open is a cost with no
    # corresponding honesty.
    #
    # Deliberately NOT cached, for the same reason alerts_observation is not:
    # a cache here would sit UNDER the two caches that already wrap these
    # callers, and the compounded window is time during which an unreadable
    # API server keeps answering with the last CronJob list it served. On
    # THIS surface that is the worst possible failure - a reassuring table
    # and a green tab describing backups nobody has taken.
    #
    # What remains is a bounded skew between the two ENDPOINTS: the nav dot
    # rides the health overlay's cache, the page rides its own, so they can
    # still be up to one interval apart in wall-clock terms. That is inherent
    # to two cached endpoints and is not what this fixes. What it fixes is
    # that they now derive from the same reads, with the same failure
    # semantics and one timestamp per observation, instead of two fetches
    # whose error handling had already drifted apart.
    
    
    def backup_facts(cfg: Dict[str, Any], kube: Optional[str]) -> Dict[str, Any]:
        """The CronJob list, the platform record and the bundle namespaces, as
        one observation with one timestamp. Raises on an unreadable read -
        each caller decides what that means (the adapter degrades to
        unknown, the route 503s), because those are genuinely different
        answers to give an operator."""
        doc = _k8s_get(f"/apis/batch/v1/cronjobs?labelSelector={ROUTINE_LABEL}%3Dtrue", kube)
        # BOTH reads, then publish - never one. An unreadable platform record
        # beside a readable CronJob list would otherwise build a view saying
        # "no platform backup has been taken", which is the exact false
        # negative this surface must never produce.
        platform = _platform_backup_record(cfg, kube)
        membership = bundle_membership(cfg.get("repoPath"))
        return {
            "cronjobs": _items(doc),
            "platform": platform,
            # Both projections of the same read (#567): the profile->namespace
            # flattening backups always used, and the full membership map the
            # per-row bundle attribution needs.
            "bundles": {p: b["namespace"] for b in membership.values() for p in b["profiles"]},
            "membership": membership,
            "observedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
        }
    
    
    def _platform_backup_record(cfg: Dict[str, Any], kube: Optional[str]) -> Optional[Dict[str, Any]]:
        """The operator host's published platform-backup record, or None when
        no platform backup has ever been taken. Absence is an ANSWER here, so
        a 404 must not look like a failure."""
        ns = _own_namespace(cfg)
        cm = _k8s_get_optional(f"/api/v1/namespaces/{ns}/configmaps/{PLATFORM_BACKUP_CONFIGMAP}", kube)
        if cm is None:
            return None
        try:
            doc = json.loads((cm.get("data") or {}).get("status.json") or "")
        except Exception:
            return None
        return doc if isinstance(doc, dict) else None
    
    
    class _NotConfigured(Exception):
        """Not an error: the adapter has nothing to talk to yet."""
    
    
    def _stale(source: Dict[str, Any]) -> Dict[str, Any]:
        """Re-mark a remembered source as last-good. `observedAt` is left at
        the ORIGINAL observation time - the gap between it and the document's
        is the staleness the UI renders, so overwriting it would erase exactly
        the fact that makes stale data safe to show."""
        return {**source, "status": "stale"}
    
    
    def _degrade(
        kind: str, remembered: Optional["tuple[Dict[str, Any], Dict[str, Dict[str, Any]]]"]
    ) -> "tuple[Dict[str, Any], Dict[str, Dict[str, Any]]]":
        if remembered is None:
            return _source(kind, "failed", "unknown", f"{kind} query failed - see the control-plane host logs"), {}
        source, narrowed = remembered
        return _stale(source), {cid: _stale(s) for cid, s in narrowed.items()}
    
    
    @router.get("/nexus/health")
    def get_nexus_health() -> Dict[str, Any]:
        """The health overlay for the current plan. Never 500s on adapter
        failure - a broken adapter is an all-unknown overlay with a sanitized
        reason, because one dead integration must not blank the canvas."""
        cfg = _load_config()
        repo_path = cfg.get("repoPath")
        if not repo_path:
            raise HTTPException(status_code=503, detail="nexus: no repoPath configured")
        plan = _read_plan_or_503(str(repo_path))
        cache_seconds = float(cfg.get("cacheSeconds", 15))
        now = time.monotonic()
        adapters = cfg.get("adapters") or {}
        argo_cfg = adapters.get("argo") or {}
        argo_enabled = argo_cfg.get("enabled", True)
        # Keyed by everything that shapes the answer - a config switch must
        # never serve the previous repository's or cluster's overlay.
        cache_key = (repo_path, cfg.get("kubeContext"), bool(argo_enabled))
        if (
            _health_cache["doc"] is not None
            and _health_cache["key"] == cache_key
            and now - _health_cache["at"] <= cache_seconds
        ):
            return _health_cache["doc"]
        observed_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
        link_bases = _links(cfg)
        try:
            src, per_comp, backups = collect_sources(plan, cfg, observed_at)
        except Exception:
            # Collection as a whole cannot take the endpoint down: the Argo
            # answer is still worth serving, and the other six say unknown.
            src, per_comp, backups = {}, {}, None
        common = {
            "links": link_bases,
            "sources": src,
            "component_sources": per_comp,
            "backups": backups,
            # #565: the canonical bundle map feeds per-Bundle rollups.
            "membership": bundle_membership(cfg.get("repoPath")),
        }
        if not argo_enabled:
            overlay = build_overlay(
                plan, None, observed_at, unavailable_reason="argo adapter disabled", **common
            )
        else:
            try:
                items = _run_kubectl(cfg.get("kubeContext"))
                overlay = build_overlay(plan, items, observed_at, **common)
            except Exception:
                # Deliberately unspecific: kubectl stderr can carry server
                # names and file paths. The operator debugs on the host.
                overlay = build_overlay(
                    plan,
                    None,
                    observed_at,
                    unavailable_reason="argo query failed - see the control-plane host logs",
                    **common,
                )
        # Superseded by sources[].status, which says configured/not configured/
        # failed/stale per adapter instead of a boolean that cannot tell "off"
        # from "broken". Kept so an older browser bundle keeps rendering.
        overlay["integrations"] = {
            "argocd": overlay["sources"]["argocd"]["status"] == "configured",
            "grafana": overlay["sources"]["grafana"]["status"] == "configured",
            "hermesRuntime": False,
        }
        _health_cache["doc"] = overlay
        _health_cache["at"] = now
        _health_cache["key"] = cache_key
        return overlay
    
    
    _backups_cache: Dict[str, Any] = {"at": 0.0, "doc": None, "key": None}
    
    
    @router.get("/nexus/backups")
    def get_nexus_backups() -> Dict[str, Any]:
        """The Backups surface (#282), flag-gated at request time.
    
        Its own route and its own cache rather than a field on the overlay:
        the overlay document is a closed schema, and the rows here are a
        product surface that a fleet may never open. The nav dot it feeds
        (`rollups["nav:backups"]`) still rides the overlay, so a red Backups
        tab needs no request to this route at all."""
        if not view_enabled("backups"):
            _backups_cache["doc"] = None
            raise HTTPException(status_code=404, detail="nexus: the backups view is not available in this deployment")
        if not read_features().get("backups-view", False):
            _backups_cache["doc"] = None
            raise HTTPException(status_code=404, detail="nexus: the backups-view feature is not enabled")
        cfg = _load_config()
        repo_path = cfg.get("repoPath")
        if not repo_path:
            raise HTTPException(status_code=503, detail="nexus: no repoPath configured")
        plan = _read_plan_or_503(str(repo_path))
        kube = cfg.get("kubeContext")
        cache_key = (repo_path, kube)
        now = time.monotonic()
        if (
            _backups_cache["doc"] is not None
            and _backups_cache["key"] == cache_key
            and now - _backups_cache["at"] <= float(cfg.get("cacheSeconds", 15))
        ):
            return _backups_cache["doc"]
        try:
            # The SAME observation the health overlay's backup adapter reads
            # (#424), not a second fetch: the nav dot and these rows are two
            # renderings of one set of facts, and they now share one clock.
            facts = backup_facts(cfg, kube)
        except Exception:
            # An unreadable CronJob list or platform record is not "no
            # routines" - serving an empty, therefore reassuring, table would
            # be the worst possible answer on this particular surface.
            raise HTTPException(
                status_code=503,
                detail="nexus: backup routines could not be read - see the control-plane host logs",
            )
        cronjobs, platform = facts["cronjobs"], facts["platform"]
        observed_at = facts["observedAt"]
        try:
            # The runs list joins by ownerReferences, so this is every Job -
            # there is no label to select on (the routine label lives on
            # CronJob metadata only).
            jobs = _items(_k8s_get("/apis/batch/v1/jobs", kube))
        except Exception:
            # Same posture as the CronJob list: an unreadable Jobs list is not
            # "no runs", and rendering it that way would quietly hide every
            # failed run behind an empty strip. The likeliest cause is named:
            # the nexus-argo-reader ClusterRole must grant get,list on
            # batch/jobs.
            raise HTTPException(
                status_code=503,
                detail="nexus: backup runs could not be read - check the nexus-argo-reader "
                "ClusterRole grants get,list on batch jobs",
            )
        # The platform record rides the shared observation above. Its failure
        # mode is deliberately NOT degraded to "no platform backup": absence
        # and unreadability look identical on this surface and mean opposite
        # things - one says take a backup, the other says the reader is broken
        # - so backup_facts raises and this route 503s rather than rendering
        # the second as the first.
        view = project_backups(
            plan,
            cronjobs,
            platform,
            observed_at,
            float(cfg.get("backupStaleHours", 48)),
            float(cfg.get("platformBackupStaleHours", 48)),
            facts["bundles"],
            jobs,
            membership=facts.get("membership"),
        )
        _backups_cache["doc"] = view
        _backups_cache["at"] = now
        _backups_cache["key"] = cache_key
        return view
    
    
    
    # ---------------------------------------------------------------------------
    # The OIDC leg (ADR-50, #284): authorization code + PKCE, an id_token
    # verified against the issuer's JWKS, and a signed host-scoped cookie.
    #
    # No new dependency: PyJWT and cryptography already ship in the runtime
    # image, and `jwt.PyJWKClient` does the key fetch and caching. The
    # session cookie is HMAC-signed with a key that lives on the state PVC -
    # so it survives a pod roll (a restart that logs everyone out reads as an
    # outage) and is backed up with everything else.
    
    AUTH_DIR = Path.home() / ".hermes" / "plugins" / "hermes-gitops" / "state" / "auth"
    _SESSION_COOKIE = "hg_nexus_session"
    _SESSION_TTL = 12 * 3600
    _LOGIN_TTL = 600
    
    
    def _session_key() -> bytes:
        """The cookie signing key. Generated once, 0600, on the state volume."""
        AUTH_DIR.mkdir(parents=True, exist_ok=True)
        key_file = AUTH_DIR / "session.key"
        if not key_file.exists():
            key_file.write_bytes(secrets.token_bytes(32))
            key_file.chmod(0o600)
        return key_file.read_bytes()
    
    
    def _sign(payload: Dict[str, Any]) -> str:
        body = base64.urlsafe_b64encode(json.dumps(payload, sort_keys=True).encode()).decode().rstrip("=")
        mac = hmac.new(_session_key(), body.encode(), hashlib.sha256).digest()
        return f"{body}.{base64.urlsafe_b64encode(mac).decode().rstrip('=')}"
    
    
    def _unsign(token: str) -> Optional[Dict[str, Any]]:
        """Constant-time verify, then expiry. Returns None for anything that
        is not a live, intact session - a tampered cookie and an expired one
        are the same answer to the caller and different lines in the audit."""
        try:
            body, sig = token.split(".", 1)
            expected = hmac.new(_session_key(), body.encode(), hashlib.sha256).digest()
            got = base64.urlsafe_b64decode(sig + "=" * (-len(sig) % 4))
            if not hmac.compare_digest(expected, got):
                return None
            payload = json.loads(base64.urlsafe_b64decode(body + "=" * (-len(body) % 4)))
        except Exception:
            return None
        if not isinstance(payload, dict) or float(payload.get("exp", 0)) < time.time():
            return None
        return payload
    
    
    def _bearer_id_token(request: Request) -> Optional[str]:
        """An `Authorization: Bearer <id_token>` header, if present.
    
        Deliberately NOT the eval publish tokens (`hgev_`): those are scoped
        machine credentials for one narrow write, and letting them stand in
        for a human role here would silently widen them."""
        raw = (getattr(request, "headers", None) or {}).get("authorization") or ""
        if not raw.lower().startswith("bearer "):
            return None
        token = raw[7:].strip()
        return None if not token or token.startswith("hgev_") else token
    
    
    def read_session(request: Request) -> Optional[Dict[str, Any]]:
        cookies = getattr(request, "cookies", None) or {}
        raw = cookies.get(_SESSION_COOKIE)
        return _unsign(raw) if raw else None
    
    
    def auth_audit(event: str, **fields: Any) -> None:
        """Append-only, bounded, and NEVER carrying token material - the same
        discipline the eval audit follows. What a protected decision needs to
        be reconstructable is who, what role, what was asked and what
        happened; the credential itself is not part of that."""
        try:
            AUTH_DIR.mkdir(parents=True, exist_ok=True)
            line = json.dumps(
                {"at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "event": event,
                 **{k: _clip(v, 200) if isinstance(v, str) else v for k, v in fields.items()}},
                sort_keys=True,
            )
            path = AUTH_DIR / "audit.jsonl"
            if path.exists() and path.stat().st_size > 1_000_000:
                keep = path.read_text().splitlines()[-1000:]
                path.write_text("\n".join(keep) + "\n")
            with path.open("a") as fh:
                fh.write(line + "\n")
        except Exception:
            pass  # an unwritable audit must not take down an authorization decision
    
    
    def _discovery() -> Dict[str, Any]:
        """The issuer's own document, cached briefly. Everything else in this
        module derives its endpoints from here rather than assuming Dex's
        paths - the issuer is configurable and so is its layout."""
        issuer = str(_oidc_cfg().get("issuer") or "").rstrip("/")
        now = time.monotonic()
        if _disc_cache.get("at", 0) + 300 > now and _disc_cache.get("issuer") == issuer:
            return _disc_cache["doc"]
        import urllib.request
    
        with urllib.request.urlopen(f"{issuer}/.well-known/openid-configuration", timeout=5) as resp:
            doc = json.loads(resp.read())
        if doc.get("issuer") != issuer:
            # A discovery document naming a different issuer than the one we
            # asked is either a misconfiguration or a redirect somewhere
            # unexpected; either way its keys are not the ones to trust.
            raise HTTPException(status_code=503, detail="nexus: issuer mismatch in discovery document")
        _disc_cache.update({"at": now, "issuer": issuer, "doc": doc})
        return doc
    
    
    _disc_cache: Dict[str, Any] = {}
    
    
    @router.get("/nexus/auth/login")
    def nexus_auth_login(request: Request, redirect: str = "/") -> Response:
        """Start the code+PKCE round trip. The verifier and the CSRF state
        ride a short-lived signed cookie, not server memory - Nexus is one
        pod today and a login that breaks the moment it is not would be a
        landmine, not a simplification."""
        if not oidc_enabled():
            raise HTTPException(status_code=404, detail="nexus: no OIDC issuer is configured")
        doc = _discovery()
        verifier = secrets.token_urlsafe(48)
        challenge = base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).decode().rstrip("=")
        state = secrets.token_urlsafe(24)
        # Only a same-origin path may be returned to. An open redirect on the
        # login route is how an attacker borrows a real sign-in.
        target = redirect if redirect.startswith("/") and not redirect.startswith("//") else "/"
        pending = _sign({"v": verifier, "s": state, "r": target, "exp": time.time() + _LOGIN_TTL})
        params = urlencode({
            "client_id": _oidc_cfg().get("clientId") or "nexus",
            "response_type": "code",
            "scope": "openid email profile groups",
            "redirect_uri": _redirect_uri(request),
            "state": state,
            "code_challenge": challenge,
            "code_challenge_method": "S256",
        })
        resp = Response(status_code=307)
        resp.headers["location"] = f"{doc['authorization_endpoint']}?{params}"
        _set_cookie(resp, "hg_nexus_login", pending, _LOGIN_TTL, request)
        return resp
    
    
    def _redirect_uri(request: Request) -> str:
        return str(request.url.replace(query="")).rsplit("/", 1)[0] + "/callback"
    
    
    def _set_cookie(resp: Response, name: str, value: str, ttl: int, request: Request) -> None:
        """Host-scoped, HttpOnly, SameSite=Lax, Secure only over https. Not
        Secure on a plaintext loop, because a cookie the browser refuses to
        send is indistinguishable from a broken login."""
        resp.set_cookie(
            name, value, max_age=ttl, httponly=True, samesite="lax",
            secure=request.url.scheme == "https", path="/",
        )
    
    
    @router.get("/nexus/auth/callback")
    def nexus_auth_callback(request: Request, code: str = "", state: str = "") -> Response:
        if not oidc_enabled():
            raise HTTPException(status_code=404, detail="nexus: no OIDC issuer is configured")
        pending = _unsign(request.cookies.get("hg_nexus_login") or "")
        if not pending or not code or not hmac.compare_digest(str(pending.get("s", "")), state):
            auth_audit("login-failed", reason="state mismatch or expired login")
            raise HTTPException(status_code=400, detail="nexus: sign-in expired or was tampered with")
        claims = exchange_code(code, str(pending["v"]), _redirect_uri(request))
        role = role_of_claims(claims, _oidc_cfg())
        subject = str(claims.get("email") or claims.get("sub") or "unknown")
        auth_audit("login", subject=subject, role=role)
        session = _sign({"sub": subject, "role": role, "exp": time.time() + _SESSION_TTL})
        resp = Response(status_code=307)
        resp.headers["location"] = str(pending.get("r") or "/")
        _set_cookie(resp, _SESSION_COOKIE, session, _SESSION_TTL, request)
        resp.delete_cookie("hg_nexus_login", path="/")
        return resp
    
    
    def exchange_code(code: str, verifier: str, redirect_uri: str) -> Dict[str, Any]:
        """Trade the code for an id_token and VERIFY it. Signature against
        the issuer's JWKS, issuer and audience checked - an unverified token
        is a string an attacker chose."""
        import urllib.request
    
        doc = _discovery()
        body = urlencode({
            "grant_type": "authorization_code",
            "code": code,
            "redirect_uri": redirect_uri,
            "code_verifier": verifier,
            "client_id": _oidc_cfg().get("clientId") or "nexus",
            "client_secret": os.environ.get("NEXUS_OIDC_CLIENT_SECRET", ""),
        }).encode()
        req = urllib.request.Request(doc["token_endpoint"], data=body)
        req.add_header("Content-Type", "application/x-www-form-urlencoded")
        try:
            with urllib.request.urlopen(req, timeout=10) as resp:
                token = json.loads(resp.read())
        except Exception:
            # Sanitized: a token endpoint's error body can echo the code.
            raise HTTPException(status_code=502, detail="nexus: the issuer rejected the sign-in")
        return verify_id_token(str(token.get("id_token") or ""))
    
    
    def verify_id_token(id_token: str) -> Dict[str, Any]:
        if not id_token:
            raise HTTPException(status_code=502, detail="nexus: the issuer returned no id_token")
        import jwt
    
        doc = _discovery()
        try:
            signing_key = jwt.PyJWKClient(doc["jwks_uri"]).get_signing_key_from_jwt(id_token)
            return jwt.decode(
                id_token,
                signing_key.key,
                algorithms=["RS256"],
                audience=_oidc_cfg().get("clientId") or "nexus",
                issuer=doc["issuer"],
            )
        except Exception:
            auth_audit("token-rejected")
            raise HTTPException(status_code=401, detail="nexus: the id_token did not verify")
    
    
    @router.get("/nexus/auth/whoami")
    def nexus_auth_whoami(request: Request) -> Dict[str, Any]:
        """What this caller is, and HOW that was decided. The mode matters as
        much as the role: `header` means the answer rests on the edge being
        the only ingress, `oidc` means it rests on a verified signature."""
        role, subject = caller_role(request)
        return {
            "mode": "oidc" if oidc_enabled() else "header",
            "subject": subject,
            "role": role,
            "canWrite": _ROLE_RANK.get(role, 0) >= _ROLE_RANK["owner"],
            "loginUrl": "/api/plugins/hermes-gitops/nexus/auth/login" if oidc_enabled() else None,
        }
    
    
    @router.get("/nexus/auth/logout")
    def nexus_auth_logout(request: Request) -> Response:
        _, subject = caller_role(request)
        auth_audit("logout", subject=subject)
        resp = Response(status_code=307)
        resp.headers["location"] = "/"
        resp.delete_cookie(_SESSION_COOKIE, path="/")
        return resp
    
    
    # ---------------------------------------------------------------------------
    # Embedded Grafana panels (design 14, ADR-44, #281).
    #
    # The browser NEVER concatenates a Grafana URL. It asks for a catalogued
    # panel id; the server looks it up, builds the URL from a configured base
    # plus a validated uid and numeric panel id, and returns the finished
    # string. An identifier that is not in the catalog does not resolve.
    #
    # The reason is a specific mistake, not a general principle. The embed
    # this contract replaces was built, verified in a browser, and withdrawn
    # - because the dashboard behind the card was a COST dashboard, and a tab
    # named Uptime would have rendered spend. So every entry names its
    # dashboard and panel explicitly, `hg test --tier register` asserts both
    # exist in the provisioned dashboards, and a surface with no honest panel
    # renders `not configured` rather than the nearest available chart.
    
    PANELS_PATH = Path(__file__).with_name("panels.json")
    _PANEL_RANGES = ("1h", "6h", "24h", "7d", "30d")
    _PANEL_SIZES = ("compact", "standard", "wide", "tall")
    # ADR-100: the closed set of Nexus context kinds a catalog entry's
    # `variables` block may draw from, and the shapes both halves must fit.
    # The VALUE pattern is deliberately narrow - it must cover Kubernetes
    # namespaces and instance ids and nothing that reads as a query-string
    # or PromQL metacharacter; a value that does not fit is a 400, never a
    # best-effort escape.
    _PANEL_CONTEXTS = ("target",)
    _PANEL_VAR_RE = re.compile(r"^[a-z][a-zA-Z0-9_]{0,39}$")
    _PANEL_CONTEXT_VALUE_RE = re.compile(r"^[a-zA-Z0-9][a-zA-Z0-9._-]{0,119}$")
    _UID_RE = None
    
    
    def load_panel_catalog() -> List[Dict[str, Any]]:
        """The catalog, re-validated on read. It ships beside this module, so
        a malformed entry is a packaging bug rather than operator input - but
        it is still the thing that decides what an iframe may point at, so it
        is checked rather than trusted."""
        global _UID_RE
        import re
    
        if _UID_RE is None:
            _UID_RE = re.compile(r"^(\{instance\}|[a-zA-Z0-9-]{1,64})$")
        try:
            doc = json.loads(PANELS_PATH.read_text())
        except Exception:
            return []
        if doc.get("apiVersion") not in (
            "nexus.hermes.ai/panel-catalog/v1alpha1",
            # v1alpha2 (ADR-100): entries may carry a `variables` allowlist.
            # Every v1alpha1 document is valid v1alpha2, so one loader reads
            # both and the field's absence means "no context reaches this
            # panel" - the v1 behaviour exactly.
            "nexus.hermes.ai/panel-catalog/v1alpha2",
        ):
            return []
        out: List[Dict[str, Any]] = []
        seen: set = set()
        for entry in doc.get("panels") or []:
            if not isinstance(entry, dict):
                continue
            pid, dash = entry.get("id"), entry.get("dashboard")
            if not isinstance(pid, str) or pid in seen:
                continue  # a duplicate logical id would make lookup ambiguous
            if not isinstance(dash, str) or not _UID_RE.fullmatch(dash):
                continue
            if not isinstance(entry.get("panelId"), int) or not 1 <= entry["panelId"] <= 10000:
                continue
            if entry.get("size") not in _PANEL_SIZES:
                continue
            if entry.get("range") is not None and entry.get("range") not in _PANEL_RANGES:
                continue
            variables = entry.get("variables")
            if variables is not None:
                # Fail-closed per entry: a malformed variables block drops the
                # WHOLE entry rather than serving the panel without its
                # allowlist - a context-aware panel silently degraded to a
                # static one would render the wrong data under the right
                # title, the exact ADR-44 failure.
                if not isinstance(variables, dict) or not variables:
                    continue
                if not all(
                    isinstance(name, str)
                    and _PANEL_VAR_RE.fullmatch(name)
                    and ctx in _PANEL_CONTEXTS
                    for name, ctx in variables.items()
                ):
                    continue
            seen.add(pid)
            out.append(entry)
        return out
    
    
    def panel_embed_url(
        base: str,
        uid: str,
        panel_id: int,
        time_range: Optional[str],
        variables: Optional[Dict[str, str]] = None,
        theme: Optional[str] = None,
    ) -> Optional[str]:
        """The ONE URL builder. Every parameter is either a fixed literal or
        has been validated above; nothing reaches it from a request.
    
        `/d-solo/` is the single-panel render path, and `kiosk` removes
        Grafana's own chrome so the frame carries a panel rather than a
        miniature application with its own navigation.
    
        `variables` (ADR-100) is variable name -> validated context value,
        already allowlisted by the caller against the catalog entry - this
        function re-checks both shapes anyway, because the URL builder being
        the last line of defense is the whole reason there is only one."""
        safe = _safe_base_url(base)
        if not safe or not uid or "/" in uid or ".." in uid:
            return None
        if time_range is not None and time_range not in _PANEL_RANGES:
            return None
        from urllib.parse import quote, urlencode
    
        params = [("panelId", str(panel_id)), ("kiosk", "")]
        if time_range:
            params = [("from", f"now-{time_range}"), ("to", "now")] + params
        for name, value in sorted((variables or {}).items()):
            if not _PANEL_VAR_RE.fullmatch(name) or not _PANEL_CONTEXT_VALUE_RE.fullmatch(value):
                return None
            params.append((f"var-{name}", value))
        # #421: render the panel in the shell's theme rather than Grafana's
        # own preference, so an embed never flashes a mismatched background
        # inside Nexus. Closed two-value set; anything else kills the URL.
        if theme is not None:
            if theme not in ("light", "dark"):
                return None
            params.append(("theme", theme))
        return f"{safe}/d-solo/{quote(uid, safe='')}?{urlencode(params)}"
    
    
    def panel_open_url(
        base: str, uid: str, panel_id: int, variables: Optional[Dict[str, str]] = None
    ) -> Optional[str]:
        """The `Open in Grafana` destination, built SEPARATELY. A failed frame
        must still leave a working way through to the real dashboard, and
        deriving it from the embed URL would make one broken string break
        both.
    
        Carries the SAME context variables as the embed (ADR-100; Codex
        catch): an escape hatch that opens the dashboard default while the
        frame shows the selection would show different data than the panel
        it claims to expand."""
        safe = _safe_base_url(base)
        if not safe or not uid or "/" in uid or ".." in uid:
            return None
        from urllib.parse import quote, urlencode
    
        params = [("viewPanel", str(panel_id))]
        for name, value in sorted((variables or {}).items()):
            if not _PANEL_VAR_RE.fullmatch(name) or not _PANEL_CONTEXT_VALUE_RE.fullmatch(value):
                return None
            params.append((f"var-{name}", value))
        return f"{safe}/d/{quote(uid, safe='')}?{urlencode(params)}"
    
    
    def project_panels(
        surface: str,
        grafana_base: Optional[str],
        instance_uid: Optional[str] = None,
        context: Optional[Dict[str, str]] = None,
        theme: Optional[str] = None,
    ) -> Dict[str, Any]:
        """Every panel a surface may render, with its URLs already built.
    
        A surface with no catalogued panel is `not configured` and says so -
        it does NOT fall back to the nearest available chart. That is the
        entire lesson of the withdrawn embed: the failure was not a broken
        frame, it was a panel that rendered perfectly and meant something
        else."""
        entries = [p for p in load_panel_catalog() if p.get("surface") == surface]
        if not grafana_base:
            return {
                "surface": surface,
                "status": "not configured",
                "reason": "no Grafana base URL is configured",
                "panels": [],
            }
        if not entries:
            return {
                "surface": surface,
                "status": "not configured",
                "reason": f"no panel is catalogued for the {surface} surface",
                "panels": [],
            }
        panels: List[Dict[str, Any]] = []
        def plane_of(dashboard: str) -> str:
            # #706 / ADR 0166: the Nexus half of plane visibility. The
            # platform PROMISES its control-plane dashboard uids (constants
            # asserted by fleetRegister, hg-* by convention); per-instance
            # `{instance}` dashboards are the workload plane by construction.
            # Served per panel so no browser ever derives the plane itself.
            if dashboard == "{instance}":
                return "workload"
            return "control-plane" if dashboard.startswith("hg-") else "workload"
    
        for entry in entries:
            uid = instance_uid if entry["dashboard"] == "{instance}" else entry["dashboard"]
            if not uid:
                # A per-instance panel asked for without an instance dashboard
                # is not an error and not an empty frame - it is a panel this
                # component does not have.
                panels.append({
                    "id": entry["id"],
                    "title": entry["title"],
                    "size": entry["size"],
                    "plane": plane_of(entry["dashboard"]),
                    "status": "not configured",
                    "reason": "this component has no Grafana dashboard",
                })
                continue
            # ADR-100: map the entry's variables allowlist onto the supplied
            # context. A declared variable whose context is ABSENT simply
            # does not appear in the URL - the dashboard's own default
            # applies - so the same catalog entry serves both the static
            # grid (no context) and the contextual host.
            variables: Dict[str, str] = {}
            for var_name, ctx_key in (entry.get("variables") or {}).items():
                value = (context or {}).get(ctx_key)
                if value:
                    variables[var_name] = value
            embed = panel_embed_url(grafana_base, uid, entry["panelId"], entry.get("range"), variables, theme)
            opened = panel_open_url(grafana_base, uid, entry["panelId"], variables)
            if not embed or not opened:
                panels.append({
                    "id": entry["id"],
                    "title": entry["title"],
                    "size": entry["size"],
                    "plane": plane_of(entry["dashboard"]),
                    "status": "failed",
                    "reason": "the configured Grafana base URL is not usable",
                })
                continue
            panels.append({
                "id": entry["id"],
                "title": entry["title"],
                "size": entry["size"],
                "plane": plane_of(entry["dashboard"]),
                "status": "configured",
                "embedUrl": embed,
                "openUrl": opened,
                # The browser needs to know WHICH panels are context-aware to
                # route them to the single host instead of the static grid.
                **({"contextual": True} if entry.get("variables") else {}),
            })
        return {"surface": surface, "status": "configured", "panels": panels}
    
    
    
    def content_security_policy(grafana_base: Optional[str]) -> str:
        """The page's frame policy (design 14, #281).
    
        `frame-src` names the configured Grafana ORIGIN and nothing else -
        never a wildcard, and never the full base URL, because a path in a
        CSP source is ignored by browsers and would read as tighter than it
        is. With no Grafana configured the answer is `'none'`: a page that
        embeds nothing should not be permitted to embed anything.
    
        `frame-ancestors 'self'` is the other half and the one people forget:
        it stops Nexus itself being framed, which is what turns a read-only
        dashboard into a clickjacking surface for its own write actions."""
        from urllib.parse import urlsplit
    
        origin = "'none'"
        safe = _safe_base_url(grafana_base)
        if safe:
            parts = urlsplit(safe)
            origin = f"{parts.scheme}://{parts.netloc}"
        return "; ".join([
            "default-src 'self'",
            f"frame-src {origin}",
            "frame-ancestors 'self'",
            "object-src 'none'",
            "base-uri 'self'",
            # The bundle is served from this origin; 'unsafe-inline' is needed
            # for the style attribute the canvas writes per node.
            "script-src 'self'",
            "style-src 'self' 'unsafe-inline'",
            "img-src 'self' data:",
            # No font-src: the brand faces are served same-origin by the
            # fonts asset route (#435, ADR-105), so default-src 'self'
            # already covers them and no external font origin is ever named.
            "connect-src 'self'",
        ])
    
    
    def grafana_base_url() -> Optional[str]:
        """The one configured Grafana base, read once. Both the CSP and the
        panel builder derive from it - two readers of one value, so a policy
        can never name an origin the builder would not use."""
        return _safe_base_url((_load_config().get("integrations", {}).get("grafana") or {}).get("baseUrl"))
    
    
    def grafana_probe_base_url() -> Optional[str]:
        """Where the HEALTH PROBE reaches Grafana (#556): the optional
        server-side probeBaseUrl (the in-cluster Service when the public base
        sits behind an edge Access gate the server carries no identity for),
        falling back to the one public base. Embed URLs and the CSP NEVER
        read this - the panels rule stands: the browser is only ever handed
        the public base."""
        grafana = _load_config().get("integrations", {}).get("grafana") or {}
        return _safe_base_url(grafana.get("probeBaseUrl")) or _safe_base_url(grafana.get("baseUrl"))
    
    
    # Embed-health probe (#415): the SERVER-VISIBLE half of "why is this
    # frame blank?". A blocked iframe renders as blank space, never as an
    # error (embed-debug's founding observation), so the browser cannot
    # distinguish Grafana-down from Grafana-denying from cookie-rejected.
    # This probe answers the first two from the server; the third - the
    # browser's own cookie being refused inside the frame - is structurally
    # invisible to us and is SAID to be, never guessed at.
    _GRAFANA_HEALTH_CACHE: Dict[str, Any] = {"at": 0.0, "doc": None}
    _GRAFANA_HEALTH_TTL = 30.0
    
    
    def probe_grafana_health(base: Optional[str]) -> Dict[str, Any]:
        """GET <base>/api/health with a short timeout, classified. Cached for
        a polling interval so a panels refresh never stacks probes."""
        if not base:
            return {"state": "not configured", "detail": "no Grafana base URL is configured"}
        now = time.monotonic()
        cached = _GRAFANA_HEALTH_CACHE["doc"]
        if cached is not None and now - _GRAFANA_HEALTH_CACHE["at"] < _GRAFANA_HEALTH_TTL:
            return cached
        import urllib.error
        import urllib.request
    
        try:
            with urllib.request.urlopen(f"{base}/api/health", timeout=3.0) as resp:
                doc: Dict[str, Any] = {"state": "reachable"} if resp.status == 200 else {
                    "state": "degraded",
                    "detail": f"Grafana /api/health answered {resp.status}",
                }
        except urllib.error.HTTPError as exc:
            # 401/403 from the health endpoint means the SERVER cannot reach
            # Grafana anonymously - which on the local loop (anonymous
            # Viewer) is exactly the misconfiguration #415 describes.
            doc = {
                "state": "denied" if exc.code in (401, 403) else "degraded",
                "detail": f"Grafana answered {exc.code} to an unauthenticated health check",
            }
        except Exception:
            doc = {"state": "unreachable", "detail": "Grafana did not answer within 3s"}
        _GRAFANA_HEALTH_CACHE["doc"] = doc
        _GRAFANA_HEALTH_CACHE["at"] = now
        return doc
    
    @router.get("/nexus/panels")
    def get_nexus_panels(
        request: Request, surface: str = "system", component: str = "", target: str = "", theme: str = ""
    ) -> Dict[str, Any]:
        """Panels for a surface. The caller names a SURFACE, never a
        dashboard - which is what makes the allowlist an allowlist.
    
        `target` (ADR-100) is the one context value the browser may supply:
        a selected component/namespace identity. It only ever reaches a
        template variable a catalog entry explicitly maps to the `target`
        context, and an out-of-shape value is a 400 - fail-closed, never a
        best-effort escape.
    
        `theme` (#421, the second browser-supplied context; ADR-100
        amendment) selects the panel's render theme so an embed matches the
        shell around it. Closed two-value set, 400 otherwise - presentation
        only, and never an authorization statement."""
        require_role(request, "viewer")
        if surface not in ("system", "communication", "backup", "agent", "application", "uptime", "eval"):
            raise HTTPException(status_code=400, detail="nexus: unknown panel surface")
        if target and not _PANEL_CONTEXT_VALUE_RE.fullmatch(target):
            raise HTTPException(status_code=400, detail="nexus: invalid panel context value")
        if theme and theme not in ("light", "dark"):
            raise HTTPException(status_code=400, detail="nexus: invalid panel theme")
        cfg = _load_config()
        base = grafana_base_url()
        instance_uid: Optional[str] = None
        if component:
            try:
                plan = _read_plan(str(cfg.get("repoPath") or "")) or {}
            except json.JSONDecodeError:
                # #446: an unparseable plan degrades this best-effort lookup
                # to "no instance uid" - the canvas route names the failure.
                plan = {}
            for comp in plan.get("components", []):
                if comp.get("id") == component:
                    for inst in comp.get("instances", []):
                        uid = inst.get("grafanaDashboardUid")
                        if isinstance(uid, str) and uid:
                            instance_uid = uid
                            break
                    break
        out = project_panels(surface, base, instance_uid, {"target": target} if target else None, theme or None)
        # #415: the server-visible embed health rides every panels response,
        # so the browser can render an explicit denied/unreachable state
        # instead of a grid of blank frames. Probed via the probe base
        # (#556): behind an Access'd edge the SERVER has no identity, but the
        # in-cluster Service answers - the browser's own session carries the
        # iframes, and lying "denied" about a Grafana that is up suppressed
        # every frame for users who could see them.
        out["grafana"] = probe_grafana_health(grafana_probe_base_url())
        return out
    
    # ---------------------------------------------------------------------------
    # Layout overlay (M5): one of the closed set of operator overlays Nexus
    # writes (layout, flags, notes, connections - ADR-43 amends ADR-42's
    # single-write boundary; all share this discipline). A patch over the
    # repository default - positions and viewport, nothing operational - stored
    # on the control-plane host, schema-versioned, size-bounded, written
    # atomically. Deleting it IS the reset-to-repository-default.
    
    _VIEW_ID_RE = r"^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
    _MAX_LAYOUT_BYTES = 64 * 1024
    _COORD_LIMIT = 100_000
    
    
    def _layout_path(view_id: str) -> Path:
        import re
    
        if not re.fullmatch(_VIEW_ID_RE, view_id) or len(view_id) > 63:
            raise HTTPException(status_code=400, detail="nexus: invalid view id")
        return STATE_DIR / f"{view_id}.json"
    
    
    def validate_layout(doc: Any) -> Dict[str, Any]:
        """The overlay allowlist: version, positions (id -> bounded x/y), an
        optional viewport. Anything else is rejected - operational data can
        never ride the overlay."""
        if not isinstance(doc, dict) or doc.get("version") != 1:
            raise HTTPException(status_code=400, detail="nexus: layout must carry version: 1")
        unknown = set(doc) - {"version", "positions", "viewport"}
        if unknown:
            raise HTTPException(status_code=400, detail=f"nexus: unknown layout keys {sorted(unknown)}")
        positions = doc.get("positions", {})
        if not isinstance(positions, dict) or len(positions) > 500:
            raise HTTPException(status_code=400, detail="nexus: positions must be a map of at most 500 nodes")
        import re
    
        for key, value in positions.items():
            if not isinstance(key, str) or not re.fullmatch(_VIEW_ID_RE, key) or len(key) > 63:
                raise HTTPException(status_code=400, detail=f"nexus: invalid node id {key!r}")
            if not isinstance(value, dict) or set(value) != {"x", "y"}:
                raise HTTPException(status_code=400, detail=f"nexus: position for {key} must be {{x, y}}")
            for axis in ("x", "y"):
                coord = value[axis]
                # bool is an int subclass - `x: true` must not pass as 1.
                if isinstance(coord, bool) or not isinstance(coord, (int, float)) or not -_COORD_LIMIT <= coord <= _COORD_LIMIT:
                    raise HTTPException(status_code=400, detail=f"nexus: {key}.{axis} out of bounds")
        viewport = doc.get("viewport")
        if viewport is not None:
            if not isinstance(viewport, dict) or set(viewport) != {"x", "y", "zoom"}:
                raise HTTPException(status_code=400, detail="nexus: viewport must be {x, y, zoom}")
            for axis in ("x", "y"):
                if not isinstance(viewport[axis], (int, float)) or not -_COORD_LIMIT <= viewport[axis] <= _COORD_LIMIT:
                    raise HTTPException(status_code=400, detail=f"nexus: viewport.{axis} out of bounds")
            zoom = viewport["zoom"]
            if not isinstance(zoom, (int, float)) or not 0.05 <= zoom <= 10:
                raise HTTPException(status_code=400, detail="nexus: viewport.zoom out of bounds")
        return {"version": 1, "positions": positions, **({"viewport": viewport} if viewport else {})}
    
    
    def read_layout(view_id: str) -> Optional[Dict[str, Any]]:
        path = _layout_path(view_id)
        if not path.is_file():
            return None
        try:
            doc = json.loads(path.read_text(encoding="utf-8"))
            return validate_layout(doc)
        except HTTPException:
            return None  # schema-incompatible file: ignored, never fatal
        except Exception:
            return None
    
    
    # ---------------------------------------------------------------------------
    # Sticky notes (ADR-43): the second operator annotation overlay, cloned
    # from the layout discipline - closed shape, bounded, atomic, lenient
    # read, DELETE resets. Notes are durable operator context pinned to
    # canvas coordinates; text renders escaped in the browser and is bounded
    # here. Never operational data.
    
    NOTES_DIR = Path.home() / ".hermes" / "plugins" / "hermes-gitops" / "state" / "notes"
    _MAX_NOTES_BYTES = 64 * 1024
    _MAX_NOTES = 100
    _MAX_NOTE_TEXT = 2000
    
    
    def _notes_path(view_id: str) -> Path:
        import re
    
        if not re.fullmatch(_VIEW_ID_RE, view_id) or len(view_id) > 63:
            raise HTTPException(status_code=400, detail="nexus: invalid view id")
        return NOTES_DIR / f"{view_id}.json"
    
    
    def validate_notes(doc: Any) -> Dict[str, Any]:
        """The notes allowlist: version, and up to 100 notes of exactly
        {id, x, y, text}. Anything else is rejected."""
        import re
    
        if not isinstance(doc, dict) or doc.get("version") != 1:
            raise HTTPException(status_code=400, detail="nexus: notes must carry version: 1")
        unknown = set(doc) - {"version", "notes"}
        if unknown:
            raise HTTPException(status_code=400, detail=f"nexus: unknown notes keys {sorted(unknown)}")
        notes = doc.get("notes", [])
        if not isinstance(notes, list) or len(notes) > _MAX_NOTES:
            raise HTTPException(status_code=400, detail=f"nexus: notes must be a list of at most {_MAX_NOTES}")
        seen: set = set()
        for note in notes:
            # w/h are the persisted sticky size (#577); absence keeps the
            # classic footprint so pre-size documents round-trip unchanged.
            if not isinstance(note, dict) or set(note) - {"w", "h"} != {"id", "x", "y", "text"}:
                raise HTTPException(status_code=400, detail="nexus: each note must be exactly {id, x, y, text} (+ optional w, h)")
            for dim in ("w", "h"):
                if dim in note:
                    v = note[dim]
                    if isinstance(v, bool) or not isinstance(v, (int, float)) or not 20 <= v <= 20_000:
                        raise HTTPException(status_code=400, detail=f"nexus: note {note.get('id')}.{dim} out of bounds")
            note_id = note["id"]
            if not isinstance(note_id, str) or not re.fullmatch(_VIEW_ID_RE, note_id) or len(note_id) > 63:
                raise HTTPException(status_code=400, detail=f"nexus: invalid note id {note_id!r}")
            if note_id in seen:
                raise HTTPException(status_code=400, detail=f"nexus: duplicate note id {note_id!r}")
            seen.add(note_id)
            for axis in ("x", "y"):
                coord = note[axis]
                # bool is an int subclass - `x: true` must not pass as 1.
                if isinstance(coord, bool) or not isinstance(coord, (int, float)) or not -_COORD_LIMIT <= coord <= _COORD_LIMIT:
                    raise HTTPException(status_code=400, detail=f"nexus: note {note_id}.{axis} out of bounds")
            text = note["text"]
            if not isinstance(text, str) or len(text) > _MAX_NOTE_TEXT:
                raise HTTPException(
                    status_code=400,
                    detail=f"nexus: note {note_id} text must be a string of at most {_MAX_NOTE_TEXT} characters",
                )
        return {"version": 1, "notes": notes}
    
    
    def read_notes(view_id: str) -> Dict[str, Any]:
        path = _notes_path(view_id)
        if not path.is_file():
            return {"version": 1, "notes": []}
        try:
            return validate_notes(json.loads(path.read_text(encoding="utf-8")))
        except Exception:
            return {"version": 1, "notes": []}  # incompatible file: never fatal
    
    
    # ---------------------------------------------------------------------------
    # Operator connections (ADR-43): the third annotation overlay - conceptual
    # edges the operator draws between cards, rendered dashed and visually
    # distinct from repository-declared relationships and from runtime routes.
    # Same discipline as layout and notes. An edge naming a node that no
    # longer exists is simply not rendered by the client - never an error.
    
    CONNECTIONS_DIR = Path.home() / ".hermes" / "plugins" / "hermes-gitops" / "state" / "connections"
    _MAX_CONNECTIONS_BYTES = 64 * 1024
    _MAX_CONNECTIONS = 200
    _MAX_CONNECTION_LABEL = 200
    
    
    def _connections_path(view_id: str) -> Path:
        import re
    
        if not re.fullmatch(_VIEW_ID_RE, view_id) or len(view_id) > 63:
            raise HTTPException(status_code=400, detail="nexus: invalid view id")
        return CONNECTIONS_DIR / f"{view_id}.json"
    
    
    _CONNECTION_KINDS = ("depends-on", "calls", "observes", "owns", "custom")
    # Arrowhead configuration (#547): a closed set of four direction states.
    # Absent means "end" - the only behaviour that existed before the field -
    # so every legacy record stays valid and renders unchanged.
    _CONNECTION_ARROWS = ("none", "start", "end", "both")
    
    
    def validate_connections(doc: Any) -> Dict[str, Any]:
        """The connections allowlist: version, and up to 200 edges of exactly
        {id, from, to, label} plus an optional typed `kind` (ADR-72's arc) and
        an optional `arrows` direction-marker state (#547) - DNS-label ids,
        bounded plain-text label."""
        import re
    
        if not isinstance(doc, dict) or doc.get("version") != 1:
            raise HTTPException(status_code=400, detail="nexus: connections must carry version: 1")
        unknown = set(doc) - {"version", "connections"}
        if unknown:
            raise HTTPException(status_code=400, detail=f"nexus: unknown connections keys {sorted(unknown)}")
        connections = doc.get("connections", [])
        if not isinstance(connections, list) or len(connections) > _MAX_CONNECTIONS:
            raise HTTPException(
                status_code=400, detail=f"nexus: connections must be a list of at most {_MAX_CONNECTIONS}"
            )
        seen: set = set()
        for conn in connections:
            if not isinstance(conn, dict) or set(conn) - {"kind", "arrows"} != {"id", "from", "to", "label"}:
                raise HTTPException(
                    status_code=400,
                    detail="nexus: each connection must be exactly {id, from, to, label} (+ optional kind, arrows)",
                )
            if "kind" in conn and conn["kind"] not in _CONNECTION_KINDS:
                raise HTTPException(
                    status_code=400,
                    detail=f"nexus: connection kind must be one of {list(_CONNECTION_KINDS)}",
                )
            if "arrows" in conn and conn["arrows"] not in _CONNECTION_ARROWS:
                raise HTTPException(
                    status_code=400,
                    detail=f"nexus: connection arrows must be one of {list(_CONNECTION_ARROWS)}",
                )
            value = conn["id"]
            if not isinstance(value, str) or not re.fullmatch(_VIEW_ID_RE, value) or len(value) > 63:
                raise HTTPException(status_code=400, detail=f"nexus: invalid connection id {value!r}")
            for key in ("from", "to"):
                # An endpoint is a card's bare instance key (the legacy
                # vocabulary), or a prefixed shape:/text: member key (#576) -
                # shapes and texts speak the same terminal grammar as cards.
                value = conn[key]
                if not isinstance(value, str) or len(value) > 70 or not (
                    re.fullmatch(_VIEW_ID_RE, value) or re.fullmatch(r"(shape|text):[a-z0-9]([-a-z0-9]*[a-z0-9])?", value)
                ):
                    raise HTTPException(status_code=400, detail=f"nexus: invalid connection {key} {value!r}")
            if conn["id"] in seen:
                raise HTTPException(status_code=400, detail=f"nexus: duplicate connection id {conn['id']!r}")
            seen.add(conn["id"])
            label = conn["label"]
            if not isinstance(label, str) or len(label) > _MAX_CONNECTION_LABEL:
                raise HTTPException(
                    status_code=400,
                    detail=f"nexus: connection {conn['id']} label must be a string of at most {_MAX_CONNECTION_LABEL} characters",
                )
        return {"version": 1, "connections": connections}
    
    
    def read_connections(view_id: str) -> Dict[str, Any]:
        path = _connections_path(view_id)
        if not path.is_file():
            return {"version": 1, "connections": []}
        try:
            return validate_connections(json.loads(path.read_text(encoding="utf-8")))
        except Exception:
            return {"version": 1, "connections": []}  # incompatible file: never fatal
    
    
    
    
    # ---------------------------------------------------------------------------
    # The workspace document (#274, ADR-56): ONE versioned NexusWorkspace per
    # environment, superseding the three per-view overlay files above. Sheets
    # are operator-owned presentation - the plan stays the only authority on
    # what exists; a sheet's cards[] is the AUTHORITATIVE card set for that
    # sheet (which is what creates the "not on any sheet" bucket the
    # inventory sidebar needs, with no compiler change). DEPLOYMENT grouping
    # stays declarative plan data - but canvas groups[] (ADR-72) are pure
    # presentation over prefixed member keys: no parent semantics, no rollup
    # keys, never in the compiled plan. The operator arranges; the plan
    # remains the only authority on what belongs to what.
    #
    # There is no agent-bundle-contracts/ file for this on purpose: the workspace is
    # server-owned state, not an external-repo contract, and this validator
    # IS the schema, versioned by apiVersion. Validation is the same
    # closed-allowlist style as validate_layout - not jsonschema, because the
    # runtime image ships fastapi/uvicorn/git/pyyaml and nothing else.
    
    WORKSPACE_PATH = Path.home() / ".hermes" / "plugins" / "hermes-gitops" / "state" / "workspace.json"
    WORKSPACE_API_VERSION = "nexus.hermes.ai/v1alpha1"
    _MAX_WORKSPACE_BYTES = 512 * 1024
    # The launch sheet cap (#405, ADR-93). This one IS a product limit, and
    # deliberately so: the launch posture is "support a bounded number of
    # sheets WELL and defer libraries", rather than an ever-more-complicated
    # overflow UI over an effectively unlimited count.
    #
    # Eight, because that is what the tab row holds at a readable width
    # without compression or scrolling - the number came from the control
    # that has to display it, not from a guess. #274's rule that this must
    # not become a monetization cap still stands; raising it is a product
    # decision plus a look at the tab row, not a config knob.
    #
    # The browser restates it (nexus-ui/src/stores/document.ts MAX_SHEETS) because no
    # build step can hand a Python constant to TypeScript; a drift test
    # parses this file and fails if the two disagree. The SERVER is the
    # enforcement - #405 is explicit that persistence must refuse invalid
    # over-limit state rather than trust the client.
    _MAX_SHEETS = 8
    _MAX_CARDS = 500  # == validate_layout's positions cap
    _MAX_SHAPES = 200
    _MAX_TEXTS = 200
    _MAX_SHEET_NAME = 80
    _MAX_TEXT_LEN = 200
    _MAX_CANVAS_GROUPS = 50
    _MAX_SHEET_OBJECTS = 200
    # Members-by-reference cap (ADR-145): the fan draws four; twelve leaves
    # room for a bundle bigger than its presentation without inviting a
    # membership database into a whiteboard document.
    _MAX_OBJECT_MEMBERS = 12
    
    # The frozen domain vocabulary (#399), server side. Mirrors
    # nexus-ui/src/app/workspace/kinds.ts DOMAIN_KINDS exactly - a drift test parses that
    # file and fails if the two lists disagree, so this cannot rot silently.
    #
    # It is duplicated rather than imported because there is no build step
    # that can hand a TypeScript constant to a Python router. Duplication with
    # an enforced equality check is honest; a second, unchecked list is not.
    DOMAIN_KIND_IDS = (
        "person",
        "group",
        "agent",
        "agent-bundle",
        "tool",
        "external-tool",
        "comm-in",
        "comm-out",
    )
    _MAX_GROUP_MEMBERS = 500
    # A canvas-group member is a prefixed selection key over sheet content.
    _GROUP_MEMBER_RE = re.compile(r"^(card|shape|text|note):[a-z0-9]([-a-z0-9]*[a-z0-9])?$")
    _SHAPE_MIN, _SHAPE_MAX = 20, 20_000
    # The bounded shape vocabulary (#548). Mirrors nexus-ui/design/tokens.json
    # ShapeVariant; sheets.test.ts pins the pair. Every field below is
    # optional and absent-by-default, so a pre-#548 document round-trips
    # byte-identically (ADR-72 discipline).
    _SHAPE_VARIANTS = ("rect", "ellipse", "diamond", "pill", "arrow", "brace-l", "brace-r")
    # The bounded fill/accent tokens (#548) - the stylesheet owns what they
    # look like; the record never carries raw color values.
    _SHAPE_COLORS = ("apricot", "sky", "mint", "rose", "violet", "slate")
    # Rotation is whole degrees 1..359; 0 is stored as absence of the field.
    _MAX_ROTATION = 359
    # The bounded text faces (#548): the two shipped brand faces plus the
    # system monospace - the field selects among loaded faces, never loads one.
    _TEXT_FONTS = ("display", "body", "mono")
    _SHEET_MODES = ("operational", "concept")
    # The seven overlay source kinds (SOURCE_KINDS above) are the legal badge
    # filter values - a sheet chooses which rows RENDER, never what levels.
    
    
    def _ws_id_ok(value: Any) -> bool:
        import re
    
        return isinstance(value, str) and bool(re.fullmatch(_VIEW_ID_RE, value)) and len(value) <= 63
    
    
    def _ws_fail(detail: str) -> HTTPException:
        return HTTPException(status_code=400, detail=f"nexus: {detail}")
    
    
    def _ws_coord(container: Dict[str, Any], key: str, what: str) -> None:
        v = container.get(key)
        if isinstance(v, bool) or not isinstance(v, (int, float)) or not -_COORD_LIMIT <= v <= _COORD_LIMIT:
            raise _ws_fail(f"{what}.{key} out of bounds")
    
    
    def validate_workspace(doc: Any) -> Dict[str, Any]:
        """The workspace allowlist. revision/savedAt/savedBy/featureFlags are
        validated for SHAPE and overwritten by the writer - a client can
        never forge them."""
        if not isinstance(doc, dict):
            raise _ws_fail("workspace must be a mapping")
        if doc.get("apiVersion") != WORKSPACE_API_VERSION:
            raise _ws_fail(f"workspace apiVersion must be {WORKSPACE_API_VERSION}")
        if doc.get("kind") != "NexusWorkspace":
            raise _ws_fail("workspace kind must be NexusWorkspace")
        unknown = set(doc) - {"apiVersion", "kind", "environment", "revision", "savedAt", "savedBy", "featureFlags", "adoptedRelationships", "sheets"}
        if unknown:
            raise _ws_fail(f"unknown workspace keys {sorted(unknown)}")
        revision = doc.get("revision", 0)
        if isinstance(revision, bool) or not isinstance(revision, int) or revision < 0:
            raise _ws_fail("revision must be a non-negative integer")
        environment = doc.get("environment", "default")
        if not _ws_id_ok(environment):
            raise _ws_fail("environment must be a DNS label")
        sheets = doc.get("sheets", [])
        if not isinstance(sheets, list) or not sheets or len(sheets) > _MAX_SHEETS:
            # An over-limit document is an explicit COMPATIBILITY failure, not
            # a silent truncation (#405). A workspace written before the cap
            # can legitimately hold more; refusing it loudly tells the
            # operator which sheets to move, where dropping the tail would
            # destroy work without ever mentioning it.
            raise _ws_fail(
                f"sheets must be a non-empty list of at most {_MAX_SHEETS} "
                f"(this document has {len(sheets) if isinstance(sheets, list) else 'none'}) - "
                f"delete or merge sheets until {_MAX_SHEETS} remain; nothing is dropped for you"
            )
        sheet_ids: set = set()
        clean_sheets: List[Dict[str, Any]] = []
        for sheet in sheets:
            clean_sheets.append(_validate_sheet(sheet, sheet_ids))
        return {
            "apiVersion": WORKSPACE_API_VERSION,
            "kind": "NexusWorkspace",
            "environment": environment,
            "revision": revision,
            **({"savedAt": doc["savedAt"]} if isinstance(doc.get("savedAt"), str) else {}),
            **({"savedBy": str(doc["savedBy"])[:200]} if doc.get("savedBy") else {}),
            "featureFlags": doc.get("featureFlags") if isinstance(doc.get("featureFlags"), dict) else {},
            # #563's one-time-adoption marker: a bool a client cannot abuse -
            # true only ever ADDS the fact that adoption already happened.
            **({"adoptedRelationships": True} if doc.get("adoptedRelationships") is True else {}),
            "sheets": clean_sheets,
        }
    
    
    def _validate_sheet(sheet: Any, seen_ids: set) -> Dict[str, Any]:
        if not isinstance(sheet, dict):
            raise _ws_fail("each sheet must be a mapping")
        unknown = set(sheet) - {"id", "name", "mode", "viewport", "settings", "cards", "objects", "shapes", "texts", "notes", "connections", "groups"}
        if unknown:
            raise _ws_fail(f"unknown sheet keys {sorted(unknown)}")
        sheet_id = sheet.get("id")
        if not _ws_id_ok(sheet_id):
            raise _ws_fail(f"invalid sheet id {sheet_id!r}")
        if sheet_id in seen_ids:
            raise _ws_fail(f"duplicate sheet id {sheet_id!r}")
        seen_ids.add(sheet_id)
        name = sheet.get("name")
        if not isinstance(name, str) or not name.strip() or len(name) > _MAX_SHEET_NAME:
            raise _ws_fail(f"sheet {sheet_id}: name must be 1..{_MAX_SHEET_NAME} characters")
        mode = sheet.get("mode", "operational")
        if mode not in _SHEET_MODES:
            raise _ws_fail(f"sheet {sheet_id}: mode must be one of {_SHEET_MODES}")
        out: Dict[str, Any] = {"id": sheet_id, "name": name, "mode": mode}
    
        viewport = sheet.get("viewport")
        if viewport is not None:
            if not isinstance(viewport, dict) or set(viewport) != {"x", "y", "zoom"}:
                raise _ws_fail(f"sheet {sheet_id}: viewport must be {{x, y, zoom}}")
            _ws_coord(viewport, "x", "viewport")
            _ws_coord(viewport, "y", "viewport")
            zoom = viewport["zoom"]
            if isinstance(zoom, bool) or not isinstance(zoom, (int, float)) or not 0.05 <= zoom <= 10:
                raise _ws_fail(f"sheet {sheet_id}: viewport.zoom out of bounds")
            out["viewport"] = viewport
    
        settings = sheet.get("settings")
        if settings is not None:
            if not isinstance(settings, dict) or set(settings) - {"sourceBadges"}:
                raise _ws_fail(f"sheet {sheet_id}: settings allows only sourceBadges")
            badges = settings.get("sourceBadges", [])
            if not isinstance(badges, list) or any(b not in SOURCE_KINDS for b in badges):
                raise _ws_fail(f"sheet {sheet_id}: sourceBadges must be a subset of {list(SOURCE_KINDS)}")
            out["settings"] = {"sourceBadges": badges}
    
        cards = sheet.get("cards", [])
        if not isinstance(cards, list) or len(cards) > _MAX_CARDS:
            raise _ws_fail(f"sheet {sheet_id}: cards must be a list of at most {_MAX_CARDS}")
        card_keys: set = set()
        for card in cards:
            if not isinstance(card, dict) or set(card) - {"displayMode", "id"} != {"ref", "position"}:
                raise _ws_fail(f"sheet {sheet_id}: each card must be exactly {{ref, position}} (+ optional id, displayMode)")
            if "displayMode" in card and card["displayMode"] not in ("badge", "stack", "expanded"):
                raise _ws_fail(f"sheet {sheet_id}: card {card.get('ref')} displayMode must be badge|stack|expanded")
            if not _ws_id_ok(card["ref"]):
                raise _ws_fail(f"sheet {sheet_id}: invalid card ref {card['ref']!r}")
            if "id" in card and not _ws_id_ok(card["id"]):
                raise _ws_fail(f"sheet {sheet_id}: invalid card id {card['id']!r}")
            # Canvas-instance identity (#546): the instance key is id-or-ref.
            # Two cards MAY share a ref - two visual copies of one domain
            # object - but never an instance key. An id-less card's key is its
            # ref, so pre-#546 documents keep exactly their old semantics.
            key = card.get("id", card["ref"])
            if key in card_keys:
                raise _ws_fail(f"sheet {sheet_id}: duplicate card ref or instance id {key!r}")
            card_keys.add(key)
            pos = card["position"]
            if not isinstance(pos, dict) or set(pos) != {"x", "y"}:
                raise _ws_fail(f"sheet {sheet_id}: card {card['ref']} position must be {{x, y}}")
            _ws_coord(pos, "x", f"card {card['ref']}")
            _ws_coord(pos, "y", f"card {card['ref']}")
        out["cards"] = cards
    
        # Authored domain objects (ADR-87). NOT run through _validate_objects:
        # that helper enforces x/y, and an authored object has no position of
        # its own - placement lives on the cards[] entry, exactly as it does
        # for a plan component. Emitted only when present, so a document
        # written before ADR-87 round-trips byte-identically.
        objects = sheet.get("objects")
        if objects is not None:
            if not isinstance(objects, list) or len(objects) > _MAX_SHEET_OBJECTS:
                raise _ws_fail(f"sheet {sheet_id}: objects must be a list of at most {_MAX_SHEET_OBJECTS}")
            seen_objects: set = set()
            # {"subtitle", "url", "members"}: authored objects deliberately do
            # not route through _validate_objects (its `optional` param serves
            # shapes; it also enforces x/y, which authored objects do not
            # carry) — optional keys stay literal here, "url" and "members"
            # beside "subtitle".
            for obj in objects:
                if not isinstance(obj, dict) or set(obj) - {"subtitle", "url", "members", "icon"} != {"id", "kind", "title"}:
                    raise _ws_fail(
                        f"sheet {sheet_id}: each object must be exactly {{id, kind, title}} "
                        "(+ optional subtitle, url, members, icon)"
                    )
                if not _ws_id_ok(obj["id"]):
                    raise _ws_fail(f"sheet {sheet_id}: invalid object id {obj['id']!r}")
                if obj["id"] in seen_objects:
                    raise _ws_fail(f"sheet {sheet_id}: duplicate object id {obj['id']!r}")
                seen_objects.add(obj["id"])
                # The frozen vocabulary is the gate: a retired kind cannot be
                # newly persisted, which is what keeps an orphan on an old
                # sheet from becoming legitimate again by being re-saved.
                if obj["kind"] not in DOMAIN_KIND_IDS:
                    raise _ws_fail(f"sheet {sheet_id}: object {obj['id']} kind must be one of {list(DOMAIN_KIND_IDS)}")
                for field in ("title", "subtitle"):
                    value = obj.get(field)
                    if field == "subtitle" and value is None:
                        continue
                    if not isinstance(value, str) or not value.strip() or len(value) > _MAX_SHEET_NAME:
                        raise _ws_fail(f"sheet {sheet_id}: object {obj['id']} {field} must be 1..{_MAX_SHEET_NAME} characters")
                # Same https-only gate as _links' toolUrls and every other
                # authored link (_safe_https_url) - an authored object's URL is
                # no less a click-target than a component's.
                url = obj.get("url")
                if url is not None and _safe_https_url(url) is None:
                    raise _ws_fail(f"sheet {sheet_id}: object {obj['id']} url must be an https URL")
                # Authored objects wear inventory art like plan components do
                # (ADR-146): the id is shape-checked against the same stem
                # grammar the asset route serves; an id nothing serves simply
                # falls back at render, like a dangling member ref.
                icon = obj.get("icon")
                if icon is not None and (not isinstance(icon, str) or not _ICON_ID_RE.match(icon)):
                    raise _ws_fail(f"sheet {sheet_id}: object {obj['id']} icon must match {_ICON_ID_RE.pattern}")
                # Members by REFERENCE (ADR-145): ids only, shape-checked like
                # connection endpoints - no referential integrity, a dangling
                # ref simply draws nothing. The render resolves them; the
                # document never carries invented titles or initials (#460).
                members = obj.get("members")
                if members is not None:
                    if not isinstance(members, list) or len(members) > _MAX_OBJECT_MEMBERS:
                        raise _ws_fail(
                            f"sheet {sheet_id}: object {obj['id']} members must be a list of at most {_MAX_OBJECT_MEMBERS} ids"
                        )
                    for ref in members:
                        if not _ws_id_ok(ref):
                            raise _ws_fail(f"sheet {sheet_id}: object {obj['id']} has an invalid member ref {ref!r}")
            out["objects"] = objects
    
        out["shapes"] = _validate_objects(
            sheet.get("shapes", []), sheet_id, "shapes", _MAX_SHAPES,
            {"id", "x", "y", "w", "h", "label"},
            extra=_validate_shape_fields,
            optional={"shape", "color", "rotation"},
        )
        out["texts"] = _validate_objects(
            sheet.get("texts", []), sheet_id, "texts", _MAX_TEXTS,
            {"id", "x", "y", "text", "size"},
            extra=_validate_text_fields,
            optional={"font"},
        )
        # Notes and connections reuse the EXACT per-item rules the standalone
        # validators enforced; only the container moved.
        notes_doc = validate_notes({"version": 1, "notes": sheet.get("notes", [])})
        out["notes"] = notes_doc["notes"]
        conns_doc = validate_connections({"version": 1, "connections": sheet.get("connections", [])})
        out["connections"] = conns_doc["connections"]
    
        # Canvas groups (ADR-72): presentation-only arrangement. Emitted only
        # when present so pre-existing documents round-trip byte-identically.
        groups = sheet.get("groups")
        if groups is not None:
            if not isinstance(groups, list) or len(groups) > _MAX_CANVAS_GROUPS:
                raise _ws_fail(f"sheet {sheet_id}: groups must be a list of at most {_MAX_CANVAS_GROUPS}")
            seen_groups: set = set()
            claimed: set = set()
            for g in groups:
                if not isinstance(g, dict) or set(g) != {"id", "name", "members"}:
                    raise _ws_fail(f"sheet {sheet_id}: each group must be exactly {{id, name, members}}")
                if not _ws_id_ok(g["id"]):
                    raise _ws_fail(f"sheet {sheet_id}: invalid group id {g['id']!r}")
                if g["id"] in seen_groups:
                    raise _ws_fail(f"sheet {sheet_id}: duplicate group id {g['id']!r}")
                seen_groups.add(g["id"])
                gname = g["name"]
                if not isinstance(gname, str) or not gname.strip() or len(gname) > _MAX_SHEET_NAME:
                    raise _ws_fail(f"sheet {sheet_id}: group {g['id']} name must be 1..{_MAX_SHEET_NAME} characters")
                members = g["members"]
                if not isinstance(members, list) or len(members) > _MAX_GROUP_MEMBERS:
                    raise _ws_fail(f"sheet {sheet_id}: group {g['id']} members must be a list of at most {_MAX_GROUP_MEMBERS}")
                for m in members:
                    if not isinstance(m, str) or not _GROUP_MEMBER_RE.match(m):
                        raise _ws_fail(f"sheet {sheet_id}: group {g['id']} member {m!r} is not a prefixed member key")
                    if m in claimed:
                        # Nested/overlapping groups are out of scope - one home each.
                        raise _ws_fail(f"sheet {sheet_id}: member {m!r} appears in two groups")
                    claimed.add(m)
            out["groups"] = groups
        return out
    
    
    def _validate_objects(items: Any, sheet_id: str, what: str, cap: int, keys: set, extra, optional: frozenset = frozenset()) -> List[Dict[str, Any]]:
        if not isinstance(items, list) or len(items) > cap:
            raise _ws_fail(f"sheet {sheet_id}: {what} must be a list of at most {cap}")
        seen: set = set()
        for item in items:
            if not isinstance(item, dict) or set(item) - optional != keys:
                raise _ws_fail(f"sheet {sheet_id}: each of {what} must be exactly {sorted(keys)}")
            if not _ws_id_ok(item["id"]):
                raise _ws_fail(f"sheet {sheet_id}: invalid {what} id {item['id']!r}")
            if item["id"] in seen:
                raise _ws_fail(f"sheet {sheet_id}: duplicate {what} id {item['id']!r}")
            seen.add(item["id"])
            _ws_coord(item, "x", f"{what} {item['id']}")
            _ws_coord(item, "y", f"{what} {item['id']}")
            extra(item, sheet_id)
        return items
    
    
    def _validate_shape_fields(item: Dict[str, Any], sheet_id: str) -> None:
        for dim in ("w", "h"):
            v = item[dim]
            if isinstance(v, bool) or not isinstance(v, (int, float)) or not _SHAPE_MIN <= v <= _SHAPE_MAX:
                raise _ws_fail(f"sheet {sheet_id}: shape {item['id']}.{dim} out of bounds")
        label = item["label"]
        if not isinstance(label, str) or len(label) > _MAX_TEXT_LEN:
            raise _ws_fail(f"sheet {sheet_id}: shape {item['id']} label too long")
        if "shape" in item and item["shape"] not in _SHAPE_VARIANTS:
            raise _ws_fail(f"sheet {sheet_id}: shape {item['id']} shape must be one of {'|'.join(_SHAPE_VARIANTS)}")
        if "color" in item and item["color"] not in _SHAPE_COLORS:
            raise _ws_fail(f"sheet {sheet_id}: shape {item['id']} color must be one of {'|'.join(_SHAPE_COLORS)}")
        if "rotation" in item:
            r = item["rotation"]
            # Whole degrees, 1..359: 0 is stored as ABSENCE (the client's
            # rotateShape drops the key), so accepting a written 0 here would
            # let two byte-different spellings of "unrotated" persist.
            if isinstance(r, bool) or not isinstance(r, int) or not 1 <= r <= _MAX_ROTATION:
                raise _ws_fail(f"sheet {sheet_id}: shape {item['id']} rotation must be an integer 1..{_MAX_ROTATION}")
    
    
    def _validate_text_fields(item: Dict[str, Any], sheet_id: str) -> None:
        text = item["text"]
        if not isinstance(text, str) or not text.strip() or len(text) > _MAX_TEXT_LEN:
            raise _ws_fail(f"sheet {sheet_id}: text {item['id']} must be 1..{_MAX_TEXT_LEN} characters")
        if item["size"] not in ("sm", "md", "lg"):
            raise _ws_fail(f"sheet {sheet_id}: text {item['id']} size must be sm|md|lg")
        if "font" in item and item["font"] not in _TEXT_FONTS:
            raise _ws_fail(f"sheet {sheet_id}: text {item['id']} font must be one of {'|'.join(_TEXT_FONTS)}")
    
    
    def _adopt_relationships(sheet: Dict[str, Any], plan: Optional[Dict[str, Any]]) -> None:
        """#563 parity: materialize the plan's relationships as ORDINARY
        editable connections on this sheet. A 'preloaded' line must obey the
        same select/edit/delete grammar as one authored this session - the
        read-only plan-edge overlay is retired from workspace hosts, so this
        is where those lines now live. Only pairs whose endpoints are cards
        on the sheet, and never a pair some connection already draws."""
        refs = {c.get("ref") for c in sheet.get("cards") or [] if isinstance(c, dict)}
        conns = sheet.setdefault("connections", [])
        have = {(c.get("from"), c.get("to")) for c in conns if isinstance(c, dict)}
        used = {c.get("id") for c in conns if isinstance(c, dict)}
        i = 1
        for rel in (plan or {}).get("relationships") or []:
            if not isinstance(rel, dict):
                continue
            frm, to = rel.get("from"), rel.get("to")
            if frm not in refs or to not in refs or frm == to or (frm, to) in have:
                continue
            if not _ws_id_ok(frm) or not _ws_id_ok(to):
                continue
            while f"conn-{i}" in used:
                i += 1
            cid = f"conn-{i}"
            used.add(cid)
            i += 1
            conns.append({"id": cid, "from": frm, "to": to, "label": str(rel.get("label") or "")[:_MAX_TEXT_LEN]})
            have.add((frm, to))
    
    
    def default_workspace(plan: Optional[Dict[str, Any]]) -> Dict[str, Any]:
        """The repository default, PROJECTED - one sheet composed from the
        plan's view plus whatever the legacy per-view overlay files hold, at
        revision 0. This is both the fresh-install default and the upgrade
        path: existing state is never rewritten until the first save, so
        rollback is free until then.
        ponytail: the legacy layout/notes/connections files are left on disk
        and ignored once workspace.json exists - delete them in a later
        cleanup once the rollback window closes."""
        plan = plan or {}
        view = plan.get("view") or {}
        view_id = view.get("id") or "default"
        layout = read_layout(view_id) if _ws_id_ok(view_id) else None
        positions = (layout or {}).get("positions", {})
        cards = []
        seen_refs: set = set()
        for node in view.get("nodes") or []:
            ref = node.get("ref")
            if not _ws_id_ok(ref) or ref in seen_refs:
                continue
            seen_refs.add(ref)
            pos = positions.get(ref) or node.get("position") or {"x": 0, "y": 0}
            cards.append({"ref": ref, "position": {"x": pos.get("x", 0), "y": pos.get("y", 0)}})
        sheet: Dict[str, Any] = {
            "id": view_id if _ws_id_ok(view_id) else "fleet",
            "name": view.get("title") or "Fleet Canvas",
            "mode": "operational",
            "cards": cards,
            "shapes": [],
            "texts": [],
            "notes": (read_notes(view_id) if _ws_id_ok(view_id) else {"notes": []}).get("notes", []),
            "connections": (read_connections(view_id) if _ws_id_ok(view_id) else {"connections": []}).get("connections", []),
        }
        viewport = (layout or {}).get("viewport") or view.get("viewport")
        if viewport:
            sheet["viewport"] = viewport
        _adopt_relationships(sheet, plan)
        return {
            "apiVersion": WORKSPACE_API_VERSION,
            "kind": "NexusWorkspace",
            "environment": "default",
            "revision": 0,
            "featureFlags": read_features(),
            "adoptedRelationships": True,
            "sheets": [sheet],
        }
    
    
    def read_workspace(plan: Optional[Dict[str, Any]]) -> Dict[str, Any]:
        if WORKSPACE_PATH.is_file():
            try:
                doc = validate_workspace(json.loads(WORKSPACE_PATH.read_text(encoding="utf-8")))
                # One-time migration (#563): a document written before the
                # read-only plan-edge overlay retired has never adopted the
                # plan's relationships as editable connections. Adopt into the
                # FIRST sheet on read and mark the document, so the marker
                # persists with the next save and a deleted line can never be
                # resurrected by a later read.
                if not doc.get("adoptedRelationships"):
                    # EVERY sheet: the read-only plan edges used to render on
                    # any sheet holding both endpoint cards, so each sheet
                    # adopts the pairs its own cards can anchor (Codex review:
                    # first-sheet-only left later sheets bare forever).
                    for sheet in doc["sheets"]:
                        _adopt_relationships(sheet, plan)
                    doc["adoptedRelationships"] = True
                return doc
            except Exception:
                pass  # lenient read, exactly like read_notes - never fatal
        return default_workspace(plan)
    
    
    # --- Authorization (#274, then ADR-50/#284).
    #
    # TWO postures, and the difference is not cosmetic:
    #
    #   OIDC configured  - the caller presents a session cookie carrying a
    #                      VERIFIED id_token subject. Claims are checked
    #                      against the issuer's JWKS; nothing is taken on
    #                      trust from the request.
    #   OIDC absent      - the pre-ADR-50 fallback: an identity HEADER the
    #                      edge sets, trusted because the edge is the only
    #                      ingress (ADR-48).
    #
    # `GET /nexus/health` reports which one is live, so a proof asserts
    # "verified claims" rather than assuming them - the header posture was
    # always meant to be temporary, and the only way that stays true is if
    # something can tell the difference.
    
    ROLES = ("owner", "operator", "viewer", "none")
    _ROLE_RANK = {"none": 0, "viewer": 1, "operator": 2, "owner": 3}
    
    
    def _oidc_cfg() -> Dict[str, Any]:
        cfg = _load_config().get("oidc")
        return cfg if isinstance(cfg, dict) else {}
    
    
    def oidc_enabled() -> bool:
        """One answer, used by the gate, the health document and the login
        route. A half-configured issuer must not silently keep the header
        path alive under a UI that shows a Sign in button."""
        return bool(_oidc_cfg().get("issuer"))
    
    
    def role_of_claims(claims: Dict[str, Any], cfg: Dict[str, Any]) -> str:
        """Map verified token claims onto the canonical vocabulary.
    
        Defaults to `none`. That is the whole point: an identity the operator
        has not placed in a role is DENIED, not quietly given the weakest
        useful one, and #284's matrix is unprovable otherwise.
    
        The claim carrying the role is configurable because Dex's password DB
        has no groups (ADR-50 Cost) - the local loop maps on `email`, a real
        connector maps on `groups`. Either way the VALUES come from config,
        never from the token: a token that could name its own role would be
        an authorization bypass wearing an authentication hat."""
        claim = cfg.get("roleClaim") or "email"
        raw = claims.get(claim)
        values = [v for v in (raw if isinstance(raw, list) else [raw]) if isinstance(v, str)]
        mapping = cfg.get("roles") if isinstance(cfg.get("roles"), dict) else {}
        best = "none"
        for role in ("viewer", "operator", "owner"):
            allowed = mapping.get(role)
            allowed = [a for a in allowed if isinstance(a, str)] if isinstance(allowed, list) else []
            if any(v in allowed for v in values):
                if _ROLE_RANK[role] > _ROLE_RANK[best]:
                    best = role
        return best
    
    
    def _header_subject(request: Request) -> Optional[str]:
        ws_cfg = _load_config().get("workspace") or {}
        header = ws_cfg.get("identityHeader") or "Cf-Access-Authenticated-User-Email"
        value = request.headers.get(header)
        return value[:200] if isinstance(value, str) and value else None
    
    
    def _caller_subject(request: Request) -> Optional[str]:
        """The verified session subject when OIDC is on; the edge header when
        it is not. NEVER both: once an issuer is configured a forged header
        must not be able to name a subject, and a test asserts it cannot."""
        if oidc_enabled():
            session = read_session(request)
            return session.get("sub") if session else None
        return _header_subject(request)
    
    
    def _owner_emails() -> List[str]:
        ws_cfg = _load_config().get("workspace") or {}
        owners = ws_cfg.get("ownerEmails")
        return [o for o in owners if isinstance(o, str)] if isinstance(owners, list) else []
    
    
    def caller_role(request: Request) -> "tuple[str, str]":
        """(role, subject). The one place a request becomes a role."""
        if oidc_enabled():
            session = read_session(request)
            if session:
                return session.get("role", "none"), session.get("sub") or "unknown"
            # A machine caller presents the id_token directly. `hg` reads
            # protected surfaces this way and should not have to simulate a
            # browser to do it - but the token is VERIFIED exactly as the
            # login flow verifies it, so this is a second transport for the
            # same proof, not a second, weaker door.
            bearer = _bearer_id_token(request)
            if bearer:
                try:
                    claims = verify_id_token(bearer)
                except HTTPException:
                    return "none", "anonymous"
                return role_of_claims(claims, _oidc_cfg()), str(
                    claims.get("email") or claims.get("sub") or "unknown"
                )
            return "none", "anonymous"
        # Header posture: the pre-OIDC rule, unchanged. An empty ownerEmails
        # list is single-operator mode, which is why this cannot simply
        # default to `none` the way the OIDC path does.
        subject = _header_subject(request) or "operator"
        owners = _owner_emails()
        return ("owner" if not owners or subject in owners else "viewer"), subject
    
    
    def require_role(request: Request, minimum: str) -> str:
        """Enforce, and return the subject. The 403 IS the enforcement -
        hiding a button is courtesy."""
        role, subject = caller_role(request)
        if _ROLE_RANK.get(role, 0) < _ROLE_RANK[minimum]:
            # getattr, not request.url: recording a denial must never be able
            # to turn a clean 403 into a 500. The decision is the product;
            # the audit line is bookkeeping about it.
            path = getattr(getattr(request, "url", None), "path", "")
            auth_audit("deny", subject=subject, role=role, required=minimum, path=str(path))
            raise HTTPException(
                status_code=403,
                detail=f"nexus: this action requires the {minimum} role (you are {role})",
            )
        return subject
    
    
    def _can_write(request: Request) -> "tuple[bool, str]":
        role, subject = caller_role(request)
        return _ROLE_RANK.get(role, 0) >= _ROLE_RANK["owner"], subject
    
    
    def _require_owner(request: Request) -> str:
        return require_role(request, "owner")
    
    
    # --- Routes.
    
    
    def _plan_or_none() -> Optional[Dict[str, Any]]:
        repo_path = _load_config().get("repoPath")
        if not repo_path:
            return None
        try:
            return _read_plan(str(repo_path))
        except Exception:
            return None
    
    
    @router.get("/nexus/workspace")
    def get_workspace(request: Request) -> Dict[str, Any]:
        role, subject = caller_role(request)
        return {
            "workspace": read_workspace(_plan_or_none()),
            "canWrite": _ROLE_RANK.get(role, 0) >= _ROLE_RANK["owner"],
            "ownerEnforced": bool(_owner_emails()) or oidc_enabled(),
            # The browser renders the role and the MODE - "you are a viewer"
            # is a different sentence from "the edge says you are a viewer".
            "role": role,
            "subject": subject,
            "authMode": "oidc" if oidc_enabled() else "header",
        }
    
    
    @router.put("/nexus/workspace")
    def put_workspace(request: Request, payload: Any = Body(...)):
        subject = _require_owner(request)
        raw = json.dumps(payload)
        if len(raw.encode("utf-8")) > _MAX_WORKSPACE_BYTES:
            raise HTTPException(status_code=413, detail="nexus: workspace exceeds the 512KiB bound")
        doc = validate_workspace(payload)
        current = read_workspace(_plan_or_none())
        if doc["revision"] != current["revision"]:
            # The CAS: the revision in the body is the one the client READ.
            # The current document rides along so recovery costs no second
            # round trip - and a stale tab can NEVER silently overwrite.
            from fastapi.responses import JSONResponse
    
            return JSONResponse(
                status_code=409,
                content={
                    "error": "stale-revision",
                    "currentRevision": current["revision"],
                    "workspace": current,
                },
            )
        doc["revision"] = current["revision"] + 1
        doc["savedAt"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
        doc["savedBy"] = subject
        doc["featureFlags"] = read_features()  # server-owned mirror; the client's copy is discarded
        _atomic_write_json(WORKSPACE_PATH, doc)
        return {"ok": True, "revision": doc["revision"], "savedAt": doc["savedAt"], "savedBy": subject}
    
    
    @router.delete("/nexus/workspace")
    def delete_workspace(request: Request) -> Dict[str, Any]:
        """Reset the workspace to the repository default - every sheet, note,
        shape and position the operator authored, gone.
    
        TWO gates, and they answer different questions. The owner check asks
        whether this caller may write; the capability check asks whether this
        DEPLOYMENT may be reset at all. A production Nexus answers no to the
        second even for its owner, because there is no trash and no undo here
        - the only recovery is the nightly PVC backup or a prior export."""
        _require_owner(request)
        require_capability(CAP_WORKSPACE_RESET, "workspace reset")
        if WORKSPACE_PATH.is_file():
            WORKSPACE_PATH.unlink()
        # Deleting IS the reset: the next read returns the repository default.
        return {"ok": True, "reset": True, "workspace": read_workspace(_plan_or_none())}
    
    
    @router.get("/nexus/workspace/export")
    def export_workspace() -> Response:
        """The file's RAW BYTES - that is what makes export/import
        byte-equivalent round-trips provable. With no file yet, the default
        projection is serialized exactly as _atomic_write_json would."""
        if WORKSPACE_PATH.is_file():
            body = WORKSPACE_PATH.read_bytes()
        else:
            body = (json.dumps(default_workspace(_plan_or_none()), indent=2) + "\n").encode("utf-8")
        return Response(
            content=body,
            media_type="application/json",
            headers={"Content-Disposition": 'attachment; filename="nexus-workspace.json"'},
        )
    
    
    # ---------------------------------------------------------------------------
    # Eval results and publish tokens (ADR-57, #280).
    #
    # Everything here lives in the SAME state directory the workspace does, on
    # the same PVC, which is what makes backup and recovery free: the chart's
    # backup CronJob already archives this path, so a published result is
    # recoverable the day it is written with no new machinery.
    #
    # The security posture is deliberately unlazy. A publish token is minted
    # only by an owner, shown exactly once, stored only as a SHA-256 digest,
    # compared in constant time, scoped to named components, revocable, and
    # audited on every create/use/denial/revoke. None of that is negotiable
    # for a credential that lets an external harness write into an operator's
    # control plane.
    
    EVAL_API_VERSION = "hermes.dev/eval-result/v1alpha1"
    EVAL_STORE_API_VERSION = "hermes.dev/eval-results-store/v1alpha1"
    EVAL_TOKENS_API_VERSION = "hermes.dev/eval-tokens/v1alpha1"
    
    _EVAL_DIR = Path.home() / ".hermes" / "plugins" / "hermes-gitops" / "state" / "evals"
    EVAL_RESULTS_DIR = _EVAL_DIR / "results"
    EVAL_TOKENS_PATH = _EVAL_DIR / "tokens.json"
    EVAL_AUDIT_PATH = _EVAL_DIR / "audit.jsonl"
    
    _MAX_EVAL_RECORDS = 200          # per component; oldest drop out, loudly
    _MAX_EVAL_BATCH = 100
    _MAX_EVAL_BODY = 256 * 1024
    _MAX_EVAL_FILE = 512 * 1024
    _MAX_AUDIT_BYTES = 1024 * 1024
    _AUDIT_KEEP_LINES = 1000
    
    _EVAL_STATUSES = ("pass", "fail", "timeout", "agent-error", "evaluator-error")
    
    # One writer process, one lock. ponytail: a single uvicorn worker with a
    # global lock is the whole concurrency story; if Nexus ever runs more than
    # one replica this needs a real store, and the file-per-component layout
    # is what makes that swap small.
    _EVAL_LOCK = None
    
    
    def _eval_lock():
        global _EVAL_LOCK
        if _EVAL_LOCK is None:
            import threading
    
            _EVAL_LOCK = threading.Lock()
        return _EVAL_LOCK
    
    
    def _eval_fail(message: str) -> HTTPException:
        return HTTPException(status_code=400, detail=f"nexus: {message}")
    
    
    # Values that must never be accepted into a browser-visible document.
    # A Python mirror of the CLI's SECRET_PATTERNS - the same guarantee has to
    # hold on the way IN, not only on the way out.
    _EVAL_SECRET_HINTS = (
        "ghp_", "github_pat_", "gho_", "ghs_",
        "xoxb-", "xoxp-", "sk-", "AKIA",
        "-----BEGIN",
    )
    
    
    def _eval_clean_text(value: Any, limit: int, field: str) -> str:
        if not isinstance(value, str) or not value.strip():
            raise _eval_fail(f"{field} must be a non-empty string")
        if len(value) > limit:
            raise _eval_fail(f"{field} exceeds {limit} characters")
        for hint in _EVAL_SECRET_HINTS:
            if hint in value:
                raise _eval_fail(f"{field} looks like it carries a credential; results are browser-visible")
        return value
    
    
    def _eval_component_ok(value: Any) -> bool:
        """Component ids become FILE NAMES. The pattern is the containment:
        no separators, no dots, so a published id can never escape the
        results directory."""
        import re
    
        return isinstance(value, str) and 0 < len(value) <= 64 and re.fullmatch(_VIEW_ID_RE, value) is not None
    
    
    def validate_eval_batch(doc: Any) -> List[Dict[str, Any]]:
        """The hand-written mirror of eval-result/v1alpha1 (no jsonschema in
        the runtime image). A pytest asserts this allowlist and the frozen
        schema name the same fields and enums, so they cannot drift apart
        while both sides believe they agree."""
        if not isinstance(doc, dict):
            raise _eval_fail("body must be a mapping")
        if doc.get("apiVersion") != EVAL_API_VERSION:
            raise _eval_fail(f"apiVersion must be {EVAL_API_VERSION}")
        unknown = set(doc) - {"apiVersion", "records"}
        if unknown:
            raise _eval_fail(f"unknown keys {sorted(unknown)}")
        records = doc.get("records")
        if not isinstance(records, list) or not records:
            raise _eval_fail("records must be a non-empty list")
        if len(records) > _MAX_EVAL_BATCH:
            raise _eval_fail(f"at most {_MAX_EVAL_BATCH} records per publish")
        return [_validate_eval_record(r) for r in records]
    
    
    def _validate_eval_record(rec: Any) -> Dict[str, Any]:
        if not isinstance(rec, dict):
            raise _eval_fail("each record must be a mapping")
        allowed = {
            "runId", "componentId", "instanceId", "suite", "scenario", "status",
            "score", "harness", "ranAt", "durationMs", "commitSha", "metadata", "artifacts",
        }
        unknown = set(rec) - allowed
        if unknown:
            raise _eval_fail(f"unknown record keys {sorted(unknown)}")
        if not _eval_component_ok(rec.get("componentId")):
            raise _eval_fail("componentId must be a DNS label")
        if rec.get("status") not in _EVAL_STATUSES:
            raise _eval_fail(f"status must be one of {list(_EVAL_STATUSES)}")
        out: Dict[str, Any] = {
            "runId": _eval_clean_text(rec.get("runId"), 128, "runId"),
            "componentId": rec["componentId"],
            "suite": _eval_clean_text(rec.get("suite"), 128, "suite"),
            "scenario": _eval_clean_text(rec.get("scenario"), 128, "scenario"),
            "status": rec["status"],
            "harness": _eval_clean_text(rec.get("harness"), 64, "harness"),
            "ranAt": _eval_clean_text(rec.get("ranAt"), 40, "ranAt"),
        }
        if "instanceId" in rec:
            out["instanceId"] = _eval_clean_text(rec["instanceId"], 128, "instanceId")
        if "score" in rec:
            score = rec["score"]
            if isinstance(score, bool) or not isinstance(score, (int, float)) or not 0 <= score <= 1:
                raise _eval_fail("score must be a number between 0 and 1")
            out["score"] = float(score)
        if "durationMs" in rec:
            duration = rec["durationMs"]
            if isinstance(duration, bool) or not isinstance(duration, int) or duration < 0:
                raise _eval_fail("durationMs must be a non-negative integer")
            out["durationMs"] = duration
        if "commitSha" in rec:
            sha = _recon_sha(rec["commitSha"])
            if sha is None:
                raise _eval_fail("commitSha must be 40 hex characters")
            out["commitSha"] = sha
        if "metadata" in rec:
            meta = rec["metadata"]
            if not isinstance(meta, dict) or len(meta) > 16:
                raise _eval_fail("metadata must be a mapping of at most 16 entries")
            out["metadata"] = {
                _eval_clean_text(k, 64, "metadata key"): _eval_clean_text(v, 256, f"metadata.{k}")
                for k, v in meta.items()
            }
        if "artifacts" in rec:
            arts = rec["artifacts"]
            if not isinstance(arts, list) or len(arts) > 5:
                raise _eval_fail("artifacts must be a list of at most 5 entries")
            clean: List[Dict[str, str]] = []
            for art in arts:
                if not isinstance(art, dict):
                    raise _eval_fail("each artifact must be a mapping")
                url = _safe_https_url(art.get("url"))
                if url is None:
                    # The single most important refusal here: a publisher that
                    # can name a filesystem path can ask the control plane to
                    # surface anything on the box.
                    raise _eval_fail("artifact url must be an https URL")
                clean.append({"label": _eval_clean_text(art.get("label"), 64, "artifact label"), "url": url})
            out["artifacts"] = clean
        return out
    
    
    def _eval_now() -> str:
        return datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
    
    
    def eval_audit(event: str, **fields: Any) -> None:
        """Append-only, bounded, and NEVER carrying raw token material - a
        token id and its display prefix are enough to trace a credential
        without the log becoming a place to steal one."""
        try:
            EVAL_AUDIT_PATH.parent.mkdir(parents=True, exist_ok=True)
            line = json.dumps({"at": _eval_now(), "event": event, **fields}, sort_keys=True)
            with EVAL_AUDIT_PATH.open("a", encoding="utf-8") as fh:
                fh.write(line + "\n")
            if EVAL_AUDIT_PATH.stat().st_size > _MAX_AUDIT_BYTES:
                kept = EVAL_AUDIT_PATH.read_text(encoding="utf-8").splitlines()[-_AUDIT_KEEP_LINES:]
                tmp = EVAL_AUDIT_PATH.with_suffix(".jsonl.tmp")
                tmp.write_text("\n".join(kept) + "\n", encoding="utf-8")
                tmp.replace(EVAL_AUDIT_PATH)
        except Exception:
            # An unwritable audit log must not take the control plane down,
            # but it must not silently disable the feature either - the write
            # path continues and the operator sees the gap in the file.
            pass
    
    
    def read_eval_tokens() -> List[Dict[str, Any]]:
        if not EVAL_TOKENS_PATH.is_file():
            return []
        try:
            doc = json.loads(EVAL_TOKENS_PATH.read_text(encoding="utf-8"))
        except Exception:
            return []
        tokens = doc.get("tokens") if isinstance(doc, dict) else None
        return [t for t in tokens if isinstance(t, dict) and t.get("id")] if isinstance(tokens, list) else []
    
    
    def _write_eval_tokens(tokens: List[Dict[str, Any]]) -> None:
        _atomic_write_json(EVAL_TOKENS_PATH, {"apiVersion": EVAL_TOKENS_API_VERSION, "tokens": tokens})
    
    
    def _public_token(t: Dict[str, Any]) -> Dict[str, Any]:
        """What a listing may show: everything except the verifier."""
        return {k: v for k, v in t.items() if k != "sha256"}
    
    
    def authenticate_eval_token(raw: Optional[str], now: Optional[str] = None) -> Dict[str, Any]:
        """Resolve a bearer token to its record, or raise 401.
    
        Constant-time comparison against every stored digest: an early exit on
        a prefix match would leak which tokens exist. The set is tiny, so the
        linear scan costs nothing worth optimizing."""
        import hashlib
        import hmac as hmac_mod
    
        if not raw or not isinstance(raw, str):
            raise HTTPException(status_code=401, detail="nexus: a publish token is required")
        digest = hashlib.sha256(raw.encode("utf-8")).hexdigest()
        now = now or _eval_now()
        found: Optional[Dict[str, Any]] = None
        for token in read_eval_tokens():
            if hmac_mod.compare_digest(str(token.get("sha256", "")), digest):
                found = token
        if found is None:
            eval_audit("deny", reason="unknown-token")
            raise HTTPException(status_code=401, detail="nexus: unknown publish token")
        if found.get("revokedAt"):
            eval_audit("deny", tokenId=found["id"], prefix=found.get("prefix"), reason="revoked")
            raise HTTPException(status_code=401, detail="nexus: this publish token was revoked")
        expires = found.get("expiresAt")
        if expires and str(expires) <= now:
            eval_audit("deny", tokenId=found["id"], prefix=found.get("prefix"), reason="expired")
            raise HTTPException(status_code=401, detail="nexus: this publish token has expired")
        return found
    
    
    def _token_allows(token: Dict[str, Any], component_id: str) -> bool:
        scopes = token.get("scopes") or []
        return "*" in scopes or component_id in scopes
    
    
    def _eval_results_path(component_id: str) -> Path:
        if not _eval_component_ok(component_id):
            raise _eval_fail("componentId must be a DNS label")
        return EVAL_RESULTS_DIR / f"{component_id}.json"
    
    
    def read_eval_results(component_id: str) -> List[Dict[str, Any]]:
        path = _eval_results_path(component_id)
        if not path.is_file():
            return []
        try:
            doc = json.loads(path.read_text(encoding="utf-8"))
        except Exception:
            return []
        records = doc.get("records") if isinstance(doc, dict) else None
        return [r for r in records if isinstance(r, dict)] if isinstance(records, list) else []
    
    
    def store_eval_records(records: List[Dict[str, Any]]) -> Dict[str, Any]:
        """Merge a validated batch into the per-component files.
    
        `(componentId, runId)` is the idempotency key, so a retried publish is
        a no-op rather than a duplicate - the one property that makes a
        publisher safe to retry at all."""
        written, deduped, dropped = 0, 0, 0
        by_component: Dict[str, List[Dict[str, Any]]] = {}
        for rec in records:
            by_component.setdefault(rec["componentId"], []).append(rec)
        with _eval_lock():
            for component_id, incoming in by_component.items():
                existing = read_eval_results(component_id)
                seen = {r.get("runId") for r in existing}
                fresh = []
                for rec in incoming:
                    if rec["runId"] in seen:
                        deduped += 1
                        continue
                    seen.add(rec["runId"])
                    fresh.append(rec)
                if not fresh:
                    continue
                merged = fresh + existing
                if len(merged) > _MAX_EVAL_RECORDS:
                    dropped += len(merged) - _MAX_EVAL_RECORDS
                    merged = merged[:_MAX_EVAL_RECORDS]
                payload = {"apiVersion": EVAL_STORE_API_VERSION, "records": merged}
                body = json.dumps(payload, indent=2) + "\n"
                if len(body.encode("utf-8")) > _MAX_EVAL_FILE:
                    raise _eval_fail(f"{component_id} results exceed {_MAX_EVAL_FILE} bytes")
                _atomic_write_json(_eval_results_path(component_id), payload)
                written += len(fresh)
        return {"written": written, "deduped": deduped, "dropped": dropped}
    
    
    @router.post("/nexus/evals/tokens")
    def create_eval_token(request: Request, body: Any = Body(default=None)) -> Dict[str, Any]:
        """Mint a publish token. Owner-only, and the raw material is returned
        HERE and nowhere else, ever again - the store keeps only a digest."""
        import hashlib
        import secrets
    
        subject = _require_owner(request)
        doc = body if isinstance(body, dict) else {}
        name = _eval_clean_text(doc.get("name"), 64, "name")
        scopes = doc.get("scopes")
        if not isinstance(scopes, list) or not scopes or len(scopes) > 32:
            raise _eval_fail("scopes must be a non-empty list of component ids (or [\"*\"])")
        clean_scopes: List[str] = []
        for scope in scopes:
            if scope == "*":
                clean_scopes.append("*")
            elif _eval_component_ok(scope):
                clean_scopes.append(scope)
            else:
                raise _eval_fail("each scope must be a component id or \"*\"")
        expires = doc.get("expiresAt")
        if expires is not None:
            expires = _eval_clean_text(expires, 40, "expiresAt")
    
        raw = "hgev_" + secrets.token_urlsafe(24)
        record = {
            "id": "tok_" + secrets.token_hex(8),
            "name": name,
            "owner": subject or "single-operator",
            "prefix": raw[:10],
            "sha256": hashlib.sha256(raw.encode("utf-8")).hexdigest(),
            "scopes": sorted(set(clean_scopes)),
            "permissions": ["publish"],
            "createdAt": _eval_now(),
        }
        if expires:
            record["expiresAt"] = expires
        with _eval_lock():
            tokens = read_eval_tokens()
            tokens.append(record)
            _write_eval_tokens(tokens)
        eval_audit("create", tokenId=record["id"], prefix=record["prefix"], subject=record["owner"], scopes=record["scopes"])
        # `token` appears in this response and in no other place in the system.
        return {"ok": True, "token": raw, "record": _public_token(record)}
    
    
    @router.get("/nexus/evals/tokens")
    def list_eval_tokens(request: Request) -> Dict[str, Any]:
        _require_owner(request)
        return {"tokens": [_public_token(t) for t in read_eval_tokens()]}
    
    
    @router.delete("/nexus/evals/tokens/{token_id}")
    def revoke_eval_token(token_id: str, request: Request) -> Dict[str, Any]:
        """Revocation is immediate and irreversible. The record survives so the
        audit trail keeps naming a real token rather than a vanished id."""
        _require_owner(request)
        with _eval_lock():
            tokens = read_eval_tokens()
            target = next((t for t in tokens if t.get("id") == token_id), None)
            if target is None:
                raise HTTPException(status_code=404, detail="nexus: no such publish token")
            if not target.get("revokedAt"):
                target["revokedAt"] = _eval_now()
                _write_eval_tokens(tokens)
        eval_audit("revoke", tokenId=token_id, prefix=target.get("prefix"))
        return {"ok": True, "record": _public_token(target)}
    
    
    @router.post("/nexus/evals/publish")
    def publish_eval_results(request: Request, body: Any = Body(default=None)) -> Dict[str, Any]:
        """The publisher API: scoped bearer auth, versioned envelope, idempotent."""
        header = request.headers.get("authorization") or ""
        token_raw = header[7:].strip() if header[:7].lower() == "bearer " else None
        token = authenticate_eval_token(token_raw)
        # The batch is bounded by record count and by every field's own length
        # cap; this is the belt on top of those braces, so one enormous string
        # cannot ride in through a field we forgot to bound.
        if len(json.dumps(body if body is not None else "")) > _MAX_EVAL_BODY:
            raise HTTPException(status_code=413, detail="nexus: publish body too large")
        records = validate_eval_batch(body)
    
        out_of_scope = sorted({r["componentId"] for r in records if not _token_allows(token, r["componentId"])})
        if out_of_scope:
            # Name the COMPONENT, never the token's scopes: a rejected caller
            # learns what it asked for, not what else the credential could do.
            eval_audit("deny", tokenId=token["id"], prefix=token.get("prefix"), reason="out-of-scope", componentId=out_of_scope[0])
            raise HTTPException(
                status_code=403,
                detail=f"nexus: this token may not publish for {out_of_scope[0]}",
            )
    
        result = store_eval_records(records)
        with _eval_lock():
            tokens = read_eval_tokens()
            for t in tokens:
                if t.get("id") == token["id"]:
                    t["lastUsedAt"] = _eval_now()
            _write_eval_tokens(tokens)
        eval_audit(
            "use",
            tokenId=token["id"],
            prefix=token.get("prefix"),
            records=len(records),
            components=sorted({r["componentId"] for r in records}),
        )
        return {"ok": True, **result}
    
    
    @router.get("/nexus/evals/results")
    def get_eval_results(
        component: str,
        suite: Optional[str] = None,
        scenario: Optional[str] = None,
        limit: int = 50,
    ) -> Dict[str, Any]:
        """Bounded readback. The records are small, so the list IS the detail -
        a separate detail route would be a second shape to keep in step for no
        information gain."""
        records = read_eval_results(component)
        if suite:
            records = [r for r in records if r.get("suite") == suite]
        if scenario:
            records = [r for r in records if r.get("scenario") == scenario]
        limit = max(1, min(int(limit or 50), _MAX_EVAL_RECORDS))
        return {
            "apiVersion": EVAL_STORE_API_VERSION,
            "component": component,
            "total": len(records),
            "records": records[:limit],
        }
    
    
    def eval_metrics_text(components: Optional[List[str]] = None, reader: Optional[Any] = None) -> str:
        """Prometheus exposition for published eval results (#280).
    
        Hand-rolled text, exactly like the event router's - the runtime image
        ships no client library and this is a dozen lines. Names say what they
        mean: `_stored` is a bounded gauge over retained history, never a
        `_total` counter, because the store rotates and a counter that can go
        down is a lie a dashboard will believe."""
        read = reader or read_eval_results
        if components is None:
            try:
                components = sorted(p.stem for p in EVAL_RESULTS_DIR.glob("*.json"))
            except Exception:
                components = []
        esc = lambda v: str(v).replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")
        lines: List[str] = [
            "# TYPE hermes_eval_last_run_timestamp_seconds gauge",
            "# TYPE hermes_eval_last_status gauge",
            "# TYPE hermes_eval_last_score gauge",
            "# TYPE hermes_eval_runs_stored gauge",
        ]
        for component in components:
            records = read(component)
            if not records:
                continue
            latest: Dict[Any, Dict[str, Any]] = {}
            stored: Dict[Any, int] = {}
            for rec in records:  # newest first
                key = (rec.get("suite"), rec.get("scenario"))
                if key not in latest:
                    latest[key] = rec
                stored[(rec.get("suite"), rec.get("status"))] = stored.get((rec.get("suite"), rec.get("status")), 0) + 1
            newest_by_suite: Dict[str, float] = {}
            for (suite, scenario), rec in sorted(latest.items(), key=lambda kv: (str(kv[0][0]), str(kv[0][1]))):
                labels = f'component="{esc(component)}",suite="{esc(suite)}",scenario="{esc(scenario)}"'
                lines.append(f'hermes_eval_last_status{{{labels},status="{esc(rec.get("status"))}"}} 1')
                if isinstance(rec.get("score"), (int, float)) and not isinstance(rec.get("score"), bool):
                    lines.append(f"hermes_eval_last_score{{{labels}}} {float(rec['score'])}")
                ts = _parse_ts(str(rec.get("ranAt") or ""))
                if ts is not None:
                    seconds = ts.timestamp()
                    if seconds > newest_by_suite.get(str(suite), 0):
                        newest_by_suite[str(suite)] = seconds
            for suite, seconds in sorted(newest_by_suite.items()):
                lines.append(
                    f'hermes_eval_last_run_timestamp_seconds{{component="{esc(component)}",suite="{esc(suite)}"}} {int(seconds)}'
                )
            for (suite, status), count in sorted(stored.items(), key=lambda kv: (str(kv[0][0]), str(kv[0][1]))):
                lines.append(
                    f'hermes_eval_runs_stored{{component="{esc(component)}",suite="{esc(suite)}",status="{esc(status)}"}} {count}'
                )
        return "\n".join(lines) + "\n"
    
