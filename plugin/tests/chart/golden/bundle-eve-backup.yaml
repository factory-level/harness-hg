    hermes-gitops.factorylevel.dev/runtime: eve
    hermes-gitops.factorylevel.dev/managed: "true"
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    harness-hg.factorylevel.dev/eve-version: "0.42.0"
    harness-hg.factorylevel.dev/source-sha.echo: "1111111111111111111111111111111111111111"
    harness-hg.factorylevel.dev/runtime-digest.echo: "8b392193e5f3a4cf5522b70b1fa7d714baf06f80b10dda4699396fa28ea73788"
    harness-hg.factorylevel.dev/source-sha.greeter: "1111111111111111111111111111111111111111"
    harness-hg.factorylevel.dev/runtime-digest.greeter: "862e6d1be3ba0cdd0ef807cabfaf1f0b811f7159ce6498df945decb5d5bfe46e"
spec:
  # One retry, then fail the sync: a check that keeps retrying would turn a
  # broken deployment into a slow one.
  backoffLimit: 1
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        # Deliberately NOT the workload's labels: those are the Service's
        # selector, and a smoke pod with no listener must never become an
        # endpoint. Enough to identify the pod, nothing that selects it.
        hermes-gitops.factorylevel.dev/plane: workload
        hermes-gitops.factorylevel.dev/component: eve-bundle-smoke
        app.kubernetes.io/managed-by: Helm
    spec:
      restartPolicy: Never
      serviceAccountName: ag-eve-team-smoke
      securityContext:
        fsGroup: 1000
      containers:
        - name: smoke
          image: us-docker.pkg.dev/inferlab-dev/harness-hg/eve-runtime:0.42.0
          imagePullPolicy: IfNotPresent
          command: ["node", "/scripts/smoke.mjs"]
          env:
            - name: HG_NAMESPACE
              value: "ag-eve-team"
            - name: HG_WORKLOAD
              value: "ag-eve-team"
            # One workload, many members: the check loops over these.
            - name: HG_MEMBERS
              value: echo:3000:1111111111111111111111111111111111111111:8b392193e5f3a4cf5522b70b1fa7d714baf06f80b10dda4699396fa28ea73788,greeter:3100:1111111111111111111111111111111111111111:862e6d1be3ba0cdd0ef807cabfaf1f0b811f7159ce6498df945decb5d5bfe46e
            - name: HG_AGENT_HOST
              value: ag-eve-team.ag-eve-team.svc
            - name: HG_ROUTE_AUTH_USERNAME
              value: "agent"
            # The cluster's own CA, the dependency-free way to trust the API server.
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: HG_EXPECTED_EVE_VERSION
              value: "0.42.0"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: boot-script
              mountPath: /scripts
              readOnly: true
            - name: runtime-manifest-echo
              mountPath: /hg/echo
              readOnly: true
            - name: route-auth-echo
              mountPath: /run/secrets/route-auth/echo
              readOnly: true
            - name: runtime-manifest-greeter
              mountPath: /hg/greeter
              readOnly: true
            - name: route-auth-greeter
              mountPath: /run/secrets/route-auth/greeter
              readOnly: true
      volumes:
        - name: boot-script
          configMap:
            name: ag-eve-team-boot
        - name: runtime-manifest-echo
          configMap:
            name: ag-eve-team-echo-runtime-manifest
        - name: route-auth-echo
          secret:
            secretName: ag-eve-team-echo-route-auth
        - name: runtime-manifest-greeter
          configMap:
