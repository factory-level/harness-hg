                  name: ag-eve-echo-route-auth
                  key: password
            # The compiled per-instance overlay (ADR-97): resolved
            # capability values. eve.envGuard proved none shadow a
            # chart-owned variable.
            - name: CONTENT_BOARD_URL
              value: "http://hermes-board.hermes-board.svc:8080"
          envFrom:
            - secretRef:
                name: ag-eve-echo-env
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # GET /eve/v1/health is public by design (route auth never covers
          # it), so probes need no credentials.
          # The startup gate (ADR 0195): the build receipt must match what this
          # pod was rendered for BEFORE health decides readiness. Liveness and
          # readiness stay plain HTTP - a running agent is not re-gated.
          startupProbe:
            exec:
              command: ["node", "/scripts/verify-build.mjs"]
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /eve/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /eve/v1/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            # files/verify-build.mjs, the startup gate (ADR 0195).
            - name: boot-script
              mountPath: /scripts
              readOnly: true
            - name: data
              mountPath: /app
            # /hg: what the platform resolved for this agent (ADR-153).
            # Read-only and outside /app deliberately - it describes the
            # deployment, it is not part of it.
            - name: runtime-manifest
              mountPath: /hg
              readOnly: true
            - name: route-auth
              mountPath: /run/secrets/route-auth
              readOnly: true
      volumes:
        - name: boot-script
          configMap:
            name: ag-eve-echo-boot
            defaultMode: 0755
        - name: runtime-manifest
          configMap:
            name: ag-eve-echo-runtime-manifest
        # 0440, not 0400: Secret volumes are owned by root with fsGroup as
        # the group, and the process runs as uid 1000 - group-read is what
        # lets it read the file.
        - name: route-auth
          secret:
            secretName: ag-eve-echo-route-auth
            defaultMode: 0440
        - name: git-auth
          secret:
            secretName: ag-eve-echo-git-auth
            defaultMode: 0440
