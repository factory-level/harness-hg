            - name: HG_EXPECTED_BUILD_KEY
              value: "3f06a1b2c3d4e5f60718293a4b5c6d7e8f901234"
            - name: HG_EXPECTED_RUNTIME_DIGEST
              value: "ee02a61dbb36b6b6a3f176484139626edf816e0c1b796f212552ead11e388666"
            - name: HG_EXPECTED_EVE_VERSION
              value: "0.42.0-test"
            # Route auth: the minted Basic credential the default
            # agent/channels/eve.ts verifies (templates/route-auth-secret.yaml).
            # The default channel reads the PASSWORD FILE per request, so a
            # re-minted Secret propagates through the volume without a
            # restart. The env form is provided for authored channels that
            # prefer httpBasic({username, password}); it is captured at
            # process start and goes stale on a re-mint - authors choosing
            # it accept that.
            - name: ROUTE_AUTH_BASIC_USERNAME
              value: "agent"
            - name: ROUTE_AUTH_BASIC_PASSWORD_FILE
              value: /run/secrets/route-auth/password
            - name: ROUTE_AUTH_BASIC_PASSWORD
              valueFrom:
