            - name: HG_EXPECTED_EVE_VERSION
              value: "0.42.0-test"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: boot-script
              mountPath: /scripts
              readOnly: true
            - name: runtime-manifest
              mountPath: /hg
              readOnly: true
            - name: route-auth
              mountPath: /run/secrets/route-auth
              readOnly: true
