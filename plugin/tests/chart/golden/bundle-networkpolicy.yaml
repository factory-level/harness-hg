# Source: hermes-bundle/templates/apikey-secret.yaml
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-marketing-core-marketing-manager-api-key-gen
  namespace: hermes-marketing-core
  labels:
    app.kubernetes.io/name: hermes-bundle
    app.kubernetes.io/instance: hermes-marketing-core
