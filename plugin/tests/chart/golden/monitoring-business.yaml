# Source: monitoring/templates/configmap-alerts.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-alerts
  namespace: hermes-social-media
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: monitoring
    grafana_alert: "1"
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/instance: monitoring
data:
  monitoring-alerts.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: "hermes-social-media-alerts"
        receivers:
          - uid: "hermes-social-media-wh"
            type: webhook
            settings:
              url: "https://sink.invalid/alerts"
              httpMethod: POST
    groups:
      - orgId: 1
        name: "monitoring"
        folder: Hermes GitOps
        interval: 1m
        rules:
          - uid: "hermes-social-media-visits"
            title: "SiteVisitsHigh (social-media)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: A
                  instant: true
                  expr: "sum(increase(traefik_service_requests_total{service=~\"hermes-social-media-.*@kubernetes\"}[5m])) or vector(0)"
              - refId: B
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          # float64: the per-instance Pulumi override channel
                          # delivers the threshold as a STRING ("3"), and
                          # Grafana's threshold evaluator silently errors on
                          # string params (masked by execErrState: OK) - the
                          # rule imports fine and then never, ever fires.
                          - 100
            noDataState: OK
            execErrState: OK
            for: 0s
            labels:
              persona: "social-media"
              severity: warning
            annotations:
              summary: "Site visits for profile social-media exceeded 100 in the last 5 minutes"
            isPaused: false
            notification_settings:
              receiver: "hermes-social-media-alerts"
              # Send the first firing notification quickly: the default
              # 30s group_wait swallowed short-lived firings entirely
              # (fired AND resolved inside the wait -> nothing delivered).
              group_wait: 10s
              # And re-notify promptly after a state change: the default
              # 5m group_interval delays a NEW firing that follows a
              # recent resolve in the same group by up to 5 minutes.
              group_interval: 1m
          - uid: "hermes-social-media-bizfail"
            title: "BusinessOutcomeFailures (social-media)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: A
                  instant: true
                  # `or vector(0)` so a pipeline that has never failed
                  # evaluates to 0 rather than NoData - NoData with
                  # noDataState: OK is indistinguishable from healthy, and
                  # this rule must not be silent for that reason.
                  expr: "sum(increase(hermes_business_outcome_total{event=\"content.published/v1\",outcome=\"failed\"}[1h])) or vector(0)"
              - refId: B
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          # float64 for the same reason as siteVisits5m: a
                          # string threshold silently errors and the rule
                          # never fires, masked by execErrState: OK.
                          - 0
            noDataState: OK
            execErrState: OK
            for: 0s
            labels:
              persona: "social-media"
              severity: warning
              hermes_signal: business
            annotations:
              # The dedupe window is DURABLE where the environment declares
              # a durable provider (#444: Redis SETNX, 7-day window, same
              # shape as the delivery done-marker), so a retry crossing a
              # router restart no longer double-counts; without Redis the
              # in-memory window applies and the old caveat stands. A
              # producer that mints fresh eventIds for one subject is
              # reported as hermes_business_eventid_varied_total.
              summary: "social-media reported a terminal failure for content.published/v1 in the last hour"
            isPaused: false
            notification_settings:
              receiver: "hermes-social-media-alerts"
              # Send the first firing notification quickly: the default
              # 30s group_wait swallowed short-lived firings entirely
              # (fired AND resolved inside the wait -> nothing delivered).
              group_wait: 10s
              # And re-notify promptly after a state change: the default
              # 5m group_interval delays a NEW firing that follows a
              # recent resolve in the same group by up to 5 minutes.
              group_interval: 1m
          - uid: "hermes-social-media-bizidle"
            title: "BusinessOutputBelowMinimum (social-media)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: A
                  instant: true
                  # Gated on router liveness: with the router silent this
                  # expression is NoData (noDataState: OK below), and the
                  # telemetry rule fires instead. A missing telemetry
                  # source must never masquerade as an idle pipeline -
                  # they need different responses (#407).
                  expr: "(sum(increase(hermes_business_outcome_total{event=\"content.published/v1\",outcome=\"succeeded\"}[24h])) or vector(0)) and on() (sum(hermes_router_up) > 0)"
              - refId: B
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        # LT minCount: fewer than the declared floor
                        # succeeded in the window. minCount 1 is the
                        # dead-man half - a pipeline that stopped looks
                        # exactly like one with nothing to do, and only a
                        # deliberately chosen window tells them apart.
                        type: lt
                        params:
                          - 3
            noDataState: OK
            execErrState: OK
            for: 0s
            labels:
              persona: "social-media"
              severity: warning
              hermes_signal: business
            annotations:
              summary: "social-media produced fewer than 3 successful content.published/v1 in the last 24h"
            isPaused: false
            notification_settings:
              receiver: "hermes-social-media-alerts"
              # Send the first firing notification quickly: the default
              # 30s group_wait swallowed short-lived firings entirely
              # (fired AND resolved inside the wait -> nothing delivered).
              group_wait: 10s
              # And re-notify promptly after a state change: the default
              # 5m group_interval delays a NEW firing that follows a
              # recent resolve in the same group by up to 5 minutes.
              group_interval: 1m
          # The telemetry guard (#407): fires when the event router - the
          # ONLY source of hermes_business_outcome_total - stops
          # reporting. While this fires, the business rules above are
          # BLIND, not green; giving that state its own alert is what
          # keeps "no telemetry" from masquerading as "healthy output".
          - uid: "hermes-social-media-biztelem"
            title: "BusinessTelemetryMissing (social-media)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: A
                  instant: true
                  expr: "sum(hermes_router_up) or vector(0)"
              - refId: B
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 1.0
            noDataState: Alerting
            # Alerting, unlike every other rule here: this rule IS the
            # blind-detector, so a Prometheus query error - a state in
            # which the business rules are just as blind as when the
            # router is down - must fire it, not resolve it. execErrState
            # OK on the guard itself would violate the exact contract the
            # guard exists to keep (ADR-101; Codex catch).
            execErrState: Alerting
            for: 0s
            labels:
              persona: "social-media"
              severity: warning
              hermes_signal: business
            annotations:
              summary: "Business telemetry for social-media is missing: the event router is not reporting, so the business-outcome rules are blind - this is not evidence the pipeline is healthy"
            isPaused: false
            notification_settings:
              receiver: "hermes-social-media-alerts"
              # Send the first firing notification quickly: the default
              # 30s group_wait swallowed short-lived firings entirely
              # (fired AND resolved inside the wait -> nothing delivered).
              group_wait: 10s
              # And re-notify promptly after a state change: the default
              # 5m group_interval delays a NEW firing that follows a
              # recent resolve in the same group by up to 5 minutes.
              group_interval: 1m
          - uid: "hermes-social-media-agent"
            title: "HermesAgentDown (social-media)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: A
                  instant: true
                  expr: "sum(min_over_time(kube_statefulset_status_replicas_ready{namespace=\"hermes-social-media\",statefulset=\"hermes-social-media\"}[2m])) or vector(0)"
              - refId: B
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 1
            noDataState: OK
            execErrState: OK
            for: 5m
            labels:
              persona: "social-media"
              severity: critical
            annotations:
              summary: "Hermes agent hermes-social-media has no ready pod"
            isPaused: false
            notification_settings:
              receiver: "hermes-social-media-alerts"
              # Send the first firing notification quickly: the default
              # 30s group_wait swallowed short-lived firings entirely
              # (fired AND resolved inside the wait -> nothing delivered).
              group_wait: 10s
              # And re-notify promptly after a state change: the default
              # 5m group_interval delays a NEW firing that follows a
              # recent resolve in the same group by up to 5 minutes.
              group_interval: 1m
          - uid: "hermes-social-media-apps"
            title: "AgentAppUnhealthy (social-media)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: "prometheus"
                model:
                  refId: A
                  instant: true
                  expr: "sum(max_over_time(kube_deployment_status_replicas_unavailable{namespace=\"hermes-social-media\"}[2m])) or vector(0)"
              - refId: B
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: OK
            for: 5m
            labels:
              persona: "social-media"
              severity: critical
            annotations:
              summary: "One or more agent-app Deployments of profile social-media have unavailable replicas"
            isPaused: false
            notification_settings:
              receiver: "hermes-social-media-alerts"
              # Send the first firing notification quickly: the default
              # 30s group_wait swallowed short-lived firings entirely
              # (fired AND resolved inside the wait -> nothing delivered).
              group_wait: 10s
              # And re-notify promptly after a state change: the default
              # 5m group_interval delays a NEW firing that follows a
              # recent resolve in the same group by up to 5 minutes.
              group_interval: 1m
