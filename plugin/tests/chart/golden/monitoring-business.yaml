# Source: monitoring/templates/configmap-dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-dashboard
  namespace: hermes-social-media
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: monitoring
    grafana_dashboard: "1"
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/instance: monitoring
  annotations:
    grafana_folder: Workloads
data:
  monitoring-dashboard.json: |
    {
      "uid": "hermes-social-media-dash",
      "title": "Hermes — social-media",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Site visits (trailing 5m window)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {
            "defaults": {
              "custom": { "thresholdsStyle": { "mode": "line" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 100 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "sum(increase(traefik_service_requests_total{service=~\"hermes-social-media-.*@kubernetes\"}[5m])) or vector(0)",
              "legendFormat": "visits / 5m"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Visits (last 5m)",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 8 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 100 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "datasource": {"type":"prometheus","uid":"prometheus"}, "expr": "sum(increase(traefik_service_requests_total{service=~\"hermes-social-media-.*@kubernetes\"}[5m])) or vector(0)", "instant": true }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Agent ready pods",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 8 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "datasource": {"type":"prometheus","uid":"prometheus"}, "expr": "sum(kube_statefulset_status_replicas_ready{namespace=\"hermes-social-media\",statefulset=\"hermes-social-media\"}) or vector(0)", "instant": true }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "App unavailable replicas",
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 8 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "datasource": {"type":"prometheus","uid":"prometheus"}, "expr": "sum(kube_deployment_status_replicas_unavailable{namespace=\"hermes-social-media\"}) or vector(0)", "instant": true }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "MTD estimated spend (USD)",
          "gridPos": { "x": 0, "y": 8, "w": 6, "h": 8 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [ { "color": "green", "value": null } ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "datasource": {"type":"prometheus","uid":"prometheus"}, "expr": "max(hermes_cost_usd_mtd{profile=\"social-media\"}) or vector(0)", "instant": true }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Token usage by type (tokens/h)",
          "gridPos": { "x": 6, "y": 8, "w": 10, "h": 8 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {
            "defaults": {
              "custom": { "stacking": { "mode": "normal" } }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "sum by (type) (rate(hermes_usage_tokens_total{profile=\"social-media\"}[1h])) * 3600",
              "legendFormat": "{{type}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Estimated cost rate (USD/h)",
          "gridPos": { "x": 16, "y": 8, "w": 8, "h": 8 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {
            "defaults": { "unit": "currencyUSD" },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "datasource": {"type":"prometheus","uid":"prometheus"}, "expr": "sum(rate(hermes_estimated_cost_usd_total{profile=\"social-media\"}[1h])) * 3600 or vector(0)", "legendFormat": "USD/h" }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Agent freshness (s since last observer event)",
          "description": "The in-pod observer's heartbeat. A climbing number means the agent runtime stopped emitting - the same fact the Nexus overlay levels.",
          "gridPos": { "x": 0, "y": 16, "w": 6, "h": 8 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 900 },
                  { "color": "red", "value": 3600 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "datasource": {"type":"prometheus","uid":"prometheus"}, "instant": true,
              "expr": "time() - max(hermes_observer_last_event_timestamp_seconds{profile=\"social-media\"})" }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Uptime probe success ratio (10m)",
          "description": "External Gatus probes for this persona's group, scraped into Prometheus (ADR-55). Empty until the uptime workload's /metrics is scraped - absence here matches the overlay's uptime source saying not configured.",
          "gridPos": { "x": 6, "y": 16, "w": 18, "h": 8 },
          "datasource": {"type":"prometheus","uid":"prometheus"},
          "fieldConfig": {
            "defaults": { "unit": "percentunit", "min": 0, "max": 1 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type":"prometheus","uid":"prometheus"},
              "expr": "sum by (name) (rate(gatus_results_total{group=~\".*social-media.*\", success=\"true\"}[10m])) / sum by (name) (rate(gatus_results_total{group=~\".*social-media.*\"}[10m]))",
              "legendFormat": "{{name}}"
            }
          ]
        }
      ]
    }
