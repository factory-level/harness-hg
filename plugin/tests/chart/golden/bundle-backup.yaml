      protocol: TCP
      appProtocol: http
    - name: hook-0
      port: 8644
      targetPort: hook-0
      protocol: TCP
      appProtocol: http
---
# Source: hermes-bundle/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-marketing-core
  namespace: hermes-marketing-core
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: hermes-bundle
    app.kubernetes.io/name: hermes-bundle
    app.kubernetes.io/instance: hermes-marketing-core
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: "hermes-bundle-0.1.0"
    hermes-gitops.factorylevel.dev/bundle: "marketing-core"
    hermes-gitops.factorylevel.dev/managed: "true"
spec:
  replicas: 1
  serviceName: hermes-marketing-core
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-bundle
      app.kubernetes.io/instance: hermes-marketing-core
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: hermes-bundle
          app.kubernetes.io/instance: hermes-marketing-core
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: workspaces
        labels:
          app.kubernetes.io/name: hermes-bundle
          app.kubernetes.io/instance: hermes-marketing-core
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-bundle
        app.kubernetes.io/instance: hermes-marketing-core
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: "hermes-bundle-0.1.0"
        hermes-gitops.factorylevel.dev/bundle: "marketing-core"
        hermes-gitops.factorylevel.dev/managed: "true"
      annotations:
        checksum/spec: 41c28b4416f2b7240f0708011be4169fe06912b89dd6417356b1cfc17b4632f6
        # The BOOT SCRIPT is a ConfigMap the init container reads once, so a
        # change to it alone never rolled the pod: the mount updated minutes
        # later and the already-written .env kept the old values. Found live -
        # a new WEBHOOK_PORT sat in the ConfigMap while the running gateway
        # bound nothing. Checksum the rendered script, same as spec.
        checksum/boot: 1db2c95e3b54a4c120aaf051cf6349bcfee6728f7ae2a5df200c93309a4f0d9c
    spec:
      serviceAccountName: hermes-marketing-core
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: bootstrap-bundle
          image: ghcr.io/dummy/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/boot.sh"]
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: workspaces
              mountPath: /workspaces
            - name: boot-script
              mountPath: /scripts
              readOnly: true
            - name: profile-marketing-manager-env
              mountPath: /run/secrets/profiles/marketing-manager/env
              readOnly: true
      containers:
        - name: profile-marketing-manager
          image: ghcr.io/dummy/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["/opt/hermes/bin/hermes"]
          args: ["-p", "marketing-manager", "gateway", "run"]
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HOME
              value: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
          ports:
            - name: api-0
              containerPort: 8642
              protocol: TCP
            
            - name: hook-0
              containerPort: 8644
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: workspaces
              mountPath: "/workspaces/brand"
              subPath: repos/brand
              readOnly: false
      volumes:
        - name: boot-script
          configMap:
            name: hermes-marketing-core-boot
            defaultMode: 0555
        - name: profile-marketing-manager-env
          secret:
            secretName: hermes-marketing-manager-env
