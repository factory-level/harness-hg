# Source: hermes-event-router/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-event-router
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: event-router
    app.kubernetes.io/name: hermes-event-router
    app.kubernetes.io/instance: router-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-event-router
      app.kubernetes.io/instance: router-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-event-router
        app.kubernetes.io/instance: router-test
      annotations:
        # Roll the pod whenever the code or the compiled config changes.
        checksum/code: 6097a7c88999647361d5f4ac26e48004aa888278f973e372040a0b0a65823836
        checksum/config: 07783a01e283d3c6b0801049d80042b17270664c3ee71884529341f221f5d5d8
        # The annotation scrape job the monitoring stack already runs
        # (the same convention as the agent exporter) - no ServiceMonitor.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: router
          image: oven/bun:1-alpine
          command: ["bun", "/app/router.ts"]
          env:
            - name: CONFIG_PATH
              value: /config/config.json
            - name: SECRETS_DIR
              value: /secrets
            - name: PORT
              value: "8080"
            - name: REDIS_URL
              value: redis://hermes-event-router-redis:6379
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: hermes-event-router-code
        - name: config
          configMap:
            name: hermes-event-router-config
        - name: secrets
          secret:
            secretName: hermes-event-router-secrets
            optional: true
