# Source: hermes-event-router/templates/redis.yaml
# The durable transport backing queued delivery (redis-streams plugin).
# Append-only + PVC: a queued event survives BOTH consumer (router) and
# broker restarts. Gated on the environment declaring a durableProvider -
# a direct-only plane runs no broker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-event-router-redis
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: event-router
    app.kubernetes.io/name: hermes-event-router-redis
    app.kubernetes.io/instance: router-test
spec:
  replicas: 1
  strategy:
    type: Recreate # one PVC, one writer
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-event-router-redis
      app.kubernetes.io/instance: router-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-event-router-redis
        app.kubernetes.io/instance: router-test
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-event-router-redis
---
# Source: hermes-event-router/templates/backup-dlq.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-event-router-dlq-backup
  namespace: hermes-system
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: event-router
    hermes.dev/backup-routine: "true"
  annotations:
    # An archive without this file backed up an empty Redis, which is
    # indistinguishable from a fleet that has had no failures.
    hermes.dev/backup-protects: "dead-letters.jsonl"
    hermes.dev/backup-retention: "7"
    hermes.dev/backup-destination: pvc
    # No data PVC to restore INTO, and re-injection is deliberately NOT
    # automatic: adding a dead letter back to a live stream re-delivers a
    # failure, and whether that is wanted depends on why it failed. The
    # hook therefore RESTORES THE RECORD - it puts the archive back where
    # an operator (or `hg event dlq replay`) can act on it - and reports
    # what it staged. A hook that silently re-drove every failed delivery
    # after a disaster would be the wrong kind of helpful.
    hermes.dev/backup-restore-hook: |
      {"workload": "deployment/hermes-event-router-redis",
       "container": "redis",
       "stagePath": "/tmp/dead-letters.jsonl",
       "command": ["sh","-c","test -s /tmp/dead-letters.jsonl && echo \"dead letters restored to /tmp/dead-letters.jsonl: $(wc -l < /tmp/dead-letters.jsonl) line(s) - replay with hg event dlq replay\""]}
spec:
  schedule: "20 3 * * *"
  concurrencyPolicy: Forbid
  # Keep enough finished Jobs for the Backups view's per-run strip to
  # show real history (defaults are 3/1); the long window lives in
  # Grafana's kube_job_* series, not in retained objects.
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dlq-backup
              image: redis:7-alpine
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  ts="$(date -u +%Y%m%d-%H%M%S)"
                  out="/backups/dead-letters-${ts}"
                  mkdir -p "$out"
                  : > "$out/dead-letters.jsonl"
                  # One line per dead letter, tagged with the stream it
                  # came from - a replay has to know where to put it back.
                  redis-cli -h hermes-event-router-redis --scan --pattern '*:dlq' | while read -r s; do
                    [ -n "$s" ] || continue
                    redis-cli -h hermes-event-router-redis XRANGE "$s" - + | \
                      awk -v st="$s" 'NF{printf "{\"stream\":\"%s\",\"entry\":%s}\n", st, "\"" $0 "\""}' \
                      >> "$out/dead-letters.jsonl"
                  done
                  n="$(wc -l < "$out/dead-letters.jsonl")"
                  echo "[dlq-backup] archived ${n} dead letter line(s) -> ${out}"
                  # Retention by directory count; timestamped names sort
                  # chronologically, same rule every other routine uses.
                  ls -1d /backups/dead-letters-* | sort -r | tail -n +8 | while read -r old; do
                    rm -rf "$old"
                  done
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: hermes-event-router-dlq-backups
