# Source: hermes-event-router/templates/backup-dlq.yaml
# The dead-letter backup (#303, ADR-52's convention).
#
# Gated on spec.durableProvider as well as its own switch, because the
# dead-letter queue IS the broker's: no durableProvider renders no Redis
# (templates/redis.yaml), and a routine whose restore hook names a
# Deployment nothing rendered fails the whole platform restore. Found the
# hard way - `hg platform verify-restore` restored both agent volumes and
# then died on `deployment/hermes-event-router-redis, which does not
# exist`, on a router that connections alone had brought up (ADR-152).
# A direct-only plane has no dead letters to archive.
#
# The Redis volume holds three things with three different values: stream
# entries in flight (fine to lose - `hg up` re-creates the streams and
# design 13 does not promise them), consumer offsets (rebuilt on the next
# delivery), and the DEAD-LETTER QUEUE, which is neither.
#
# Dead letters are the record of what failed and the only input `hg event
# dlq replay` has. So this routine archives exactly those - not the whole
# volume, which would restore stale in-flight entries alongside them and
# replay deliveries that already succeeded elsewhere.
#
# It follows the ordinary routine convention (labelled CronJob, sink
# volume named `backups`, protects annotation), so `hg backup list|run|
# verify` and the Nexus Backups view discover it like any other.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-event-router-dlq-backups
  namespace: hermes-system
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
