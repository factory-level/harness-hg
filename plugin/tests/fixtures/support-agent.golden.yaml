spec:
  persona: support-agent
  source: github.com/factorylevel/support-agent
  ref: v1.3.0
  sha: 9f2c1ab3d4e5f60718293a4b5c6d7e8f9a0b1c2d
  distributionVersion: 1.3.0
  deployment:
    baseImageTag: hermes-base-2026-07
    diskSizeGb: 100
  apps:
  - name: vector-db
    chart: qdrant
    repo: https://qdrant.github.io/qdrant-helm
    version: 1.9.1
    values:
      auth:
        apiKeySecretRef: sec
      replicas: 1
  - name: docs-site
    chart: charts/test-page
    repo: local
  envRequires:
  - name: DISCORD_BOT_TOKEN
    required: true
    secret: true
  - name: OPENAI_API_KEY
    required: true
    secret: true
    description: Model access
  expose:
    services:
    - name: tools
      port: 8080
      path: /
    - name: metrics
      port: 9090
    access:
      policy: service-token
