# A credential VALUE pasted where a reference belongs must fail - unknown
# keys reject, so no token has a path into the emitted tree.
spec:
  router:
    id: router
    scope: global
    namespace: hermes-system
    service: hermes-event-router
  chatopsConnections:
    company_discord:
      provider: discord
      token: xoxb-not-a-reference
  producers: []
  externalInputs: []
  edges: []
