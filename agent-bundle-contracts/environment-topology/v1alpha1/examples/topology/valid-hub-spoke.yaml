# Two regions, two jurisdictions, a hub: the reference two-region topology
# the social-media acceptance plan compiles against.
version: 1
name: production
layout: hub-spoke
sovereignty:
  mode: permissive
dns:
  publicBaseDomain: hermes.factorylevel.ai
  privateBaseDomain: internal.hermes.factorylevel.ai
globalTarget: ca-west-a
regions:
  - name: ca-west
    jurisdiction: CA
    targets:
      - name: ca-west-a
        argoDestination: ca-west-a
        primary: true
  - name: eu-west
    jurisdiction: EU
    targets:
      - name: eu-west-a
        argoDestination: eu-west-a
        primary: true
