# A url must be http(s) - a bare credential string or a redis:// DSN with
# an embedded password is not a capability URL. Credentials travel the
# secret path (ADR-6); rejecting non-http schemes keeps the common
# password-in-DSN mistake out of a Git-committed file.
version: 1
bindings:
  work-queue:
    implementation: managed-redis
    url: redis://:hunter2@redis.internal:6379/0
