# A branch name may not contain '..' (Git refuses it, and it reads as a
# revision range to every tool downstream).
apiVersion: hermes.gitops/v1alpha2
kind: WorkspaceBindings

repositories:
  - name: vision
    source:
      url: https://github.com/organization/vision-manager.git
      revision:
        mode: tracked
        branch: main..release
        refreshInterval: 30m
    mount:
      path: /workspaces/vision-manager
      access: read-only

bindings:
  - repository: vision
    profiles: [marketing-manager]
    purpose: brand-context
