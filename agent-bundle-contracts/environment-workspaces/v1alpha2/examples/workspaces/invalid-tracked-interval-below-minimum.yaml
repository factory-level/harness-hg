# The refresh interval has a five-minute floor: a tighter loop turns a
# release channel into a polling load on the Git host.
apiVersion: hermes.gitops/v1alpha2
kind: WorkspaceBindings

repositories:
  - name: vision
    source:
      url: https://github.com/organization/vision-manager.git
      revision:
        mode: tracked
        branch: main
        refreshInterval: 1m
    mount:
      path: /workspaces/vision-manager
      access: read-only

bindings:
  - repository: vision
    profiles: [marketing-manager]
    purpose: brand-context
