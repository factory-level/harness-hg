# A workspace path that is not absolute. `path` is where the pod reads the
# checkout; a relative one means the producer emitted a name, not a mount.
contract: agent-runtime/v1alpha1
spec:
  name: echo
  engine: eve
  instance: ag-eve-echo
  namespace: ag-eve-echo
  runtimeImage: ghcr.io/example/eve-runtime:0.42.0
  source:
    repository: https://github.com/factorylevel/eve-agents.git
    revision: 3f06a1b2c3d4e5f60718293a4b5c6d7e8f901234
  workspaces:
    - name: own-source
      path: workspaces/own-source
      access: read-only
      repository: https://github.com/factorylevel/eve-agents.git
      revision: 3f06a1b2c3d4e5f60718293a4b5c6d7e8f901234
  requiredSecrets: []
  connections: []
  apps: []
