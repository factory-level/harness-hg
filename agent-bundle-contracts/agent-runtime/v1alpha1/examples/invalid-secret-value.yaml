# A VALUE where only a name belongs. requiredSecrets is a list of variable
# names; this object shape is how a well-meaning producer would smuggle a
# credential into a ConfigMap, so the schema refuses it outright.
contract: agent-runtime/v1alpha1
spec:
  name: echo
  engine: eve
  instance: ag-eve-echo
  namespace: ag-eve-echo
  runtimeImage: ghcr.io/example/eve-runtime:0.42.0
  source:
    repository: https://github.com/factorylevel/eve-agents.git
    revision: 3f06a1b2c3d4e5f60718293a4b5c6d7e8f901234
  workspaces: []
  requiredSecrets:
    - name: AI_GATEWAY_API_KEY
      value: sk-not-a-real-key
  connections: []
  apps: []
