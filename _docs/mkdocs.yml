# Harness Hg wiki — MkDocs Material site over _docs/.
# Local preview: `make wiki-serve`. Strict build (CI gate): `make wiki-build`.
# NOTE: some pages are GENERATED and byte-drift-checked — never hand-edit them.
#   _docs/wiki/reference/profile-record.md  (make docs      / make docs-drift)
#   _docs/wiki/reference/contracts/*.md     (make docs      / make docs-drift; index.md is hand-written)
#   _docs/wiki/reference/cli/*.md           (make cli-docs  / make cli-docs-drift)
#   _docs/wiki/assets/{mark,favicon}.svg    (make mark      / make mark-drift)
# Nav titles for them live here instead; `make cli-docs` prints the CLI nav
# block to paste when the command set changes.
site_name: Harness Hg
site_description: Run a team of AI agents from Git — no custom controllers.
# Overridable for another host (the in-cluster wiki serves at its own root):
#   HG_SITE_URL=https://wiki.example/ HG_HOMEPAGE=/ mkdocs build …
site_url: !ENV [HG_SITE_URL, "https://factory-level.github.io/harness-hg/docs/"]
repo_url: https://github.com/factory-level/harness-hg
repo_name: factory-level/harness-hg
docs_dir: wiki
site_dir: site

# The theme overrides live inside docs_dir (custom_dir below) and are not pages.
# This config sits one level UP from docs_dir on purpose: mkdocs refuses a
# docs_dir that is the config file's own directory, and only `build` used to get
# away with it (a relative-vs-absolute path comparison) - `serve` raised on
# every rebuild.
exclude_docs: |
  overrides/

# `first-agent-team.md` became the dev quickstart (#675); the page stays as a
# one-line pointer because install-the-tools.md links to it, but it earns no
# nav row of its own.
not_in_nav: |
  get-started/first-agent-team.md

theme:
  name: material
  # The header's source area gains an Install quick action and a version badge
  # (#616). `overrides/` lives beside this config (docs_dir excludes it below).
  custom_dir: wiki/overrides
  # Both are GENERATED from the live mark — see infra/scripts/generate-mark-svg.mjs.
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  # `false` stops Material fetching anything from Google Fonts. The brand faces
  # (Figtree, Nunito Sans) are self-hosted from _docs/wiki/assets/fonts/ by
  # stylesheets/extra.css — the same three OFL woff2 files Nexus ships, so the
  # docs and the product render in one typeface. See ADR-105 for why Nexus
  # stopped fetching them over the network.
  font: false
  # Dark by default for everyone, not by OS preference. Nexus behaves the same
  # way — `.nx-root` has no system-preference mode, so dark is what you get
  # until you choose otherwise. Keying these to `prefers-color-scheme` instead
  # would show anyone on a light desktop a palette the product never uses.
  # The toggle still switches, and the choice still persists.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - navigation.instant
    - navigation.tracking
    - content.tooltips
    - search.share
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: "☤"
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# The header logo AND the site-name anchor point at the landing site, which
# `make site` publishes one level above the wiki (site root = landing,
# /docs/ = wiki, /demo/ = Nexus demo). The value is site-root-absolute
# because Material passes it through the `url` filter, which leaves a
# leading slash untouched — a relative value would resolve per page.
extra:
  homepage: !ENV [HG_HOMEPAGE, "/harness-hg/"]

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/palette-default.js
  - javascripts/header-home-link.js
  - javascripts/copy-page.js

plugins:
  - search

# Computes the docs version from the commit history at build time — see
# infra/scripts/mkdocs_version_hook.py. Deliberately NOT a committed file: the
# value embeds the HEAD sha, so anything committed would be stale immediately.
hooks:
  - ../infra/scripts/mkdocs_version_hook.py
  - ../infra/scripts/mkdocs_llms_hook.py

# MkDocs defaults `links.anchors` to `info`, and `--strict` only promotes
# warnings — so a dead `page.md#anchor` link builds clean and silently jumps
# nowhere. The decision log is addressed by anchor (`adr/CHANGES.md#adr-33`)
# from many pages; raising this to `warn` is what makes `make wiki-build`
# actually catch a renamed one.
validation:
  links:
    anchors: warn
  # Generated reference pages must all be reachable: a page on disk that nav
  # omits would build silently and be findable only by search.
  nav:
    omitted_files: warn

# Only the wiki publishes. The decision ledger (_docs/adr/), the desired-state
# design (_docs/design/) and the as-built architecture (_docs/architecture/)
# live OUTSIDE docs_dir as internal engineering documents; wiki pages link to
# the ledger by GitHub URL.

