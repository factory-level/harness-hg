# The slack-sandbox environment: topologically identical to the local
# default (one cluster, single layout) - it exists so communication.yaml
# beside it can bind company_chat to the REAL Slack plugin.
version: 1
name: slack-sandbox
layout: single
regions:
  - name: local
    jurisdiction: NA
    targets:
      - name: in-cluster
        argoDestination: in-cluster
        primary: true
