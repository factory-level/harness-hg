apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-site
  labels:
    app.kubernetes.io/name: site
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: site
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
