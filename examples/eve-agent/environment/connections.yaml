# Platform connections (environment-connections v1alpha1, ADR-152): one
# third-party app registration each, declared ONCE and granted to agents.
# No secret material here - `hg connection set <name> KEY=value` (locally)
# or the stack's `connections.<name>.<KEY>` config hold the keys in ONE
# platform Secret, projected into every bound agent's namespace and into
# the event router. The router's gateway verifies the provider's signature
# on /v1/connect/<provider>/<name> and forwards, verbatim, to the agent the
# binding's match rule selects; the agent's own eve channel then verifies
# again, threads, and replies.
#
# GitHub App webhooks route by repository.
apiVersion: hermes.gitops/v1alpha1
kind: Connections

connections:
  - name: platform-github
    provider: github
    bindings:
      - profile: echo
        match:
          repositories: ["factory-level/harness-hg"]
