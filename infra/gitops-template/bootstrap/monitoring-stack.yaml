# Platform monitoring: ONE pinned kube-prometheus-stack release (ADR-45,
# design 14/15), replacing the earlier split prometheus + grafana pair.
# Synced by the hermes-gitops-root Application like every other manifest in
# bootstrap/ — the operator edits THIS file (a normal GitOps change) to tune
# retention, receivers, scrape config, or turn components on/off.
#
# What the stack brings that the split pair could not:
#   - Prometheus Operator CRDs: ServiceMonitor/PodMonitor/PrometheusRule are
#     the application observability contract (design 14) — discovered
#     cluster-wide below, no per-app scrape-config edits.
#   - Alertmanager, ON: the notification-routing authority (ADR-45,
#     superseding ADR-10's Grafana-only routing). Rules route by labels;
#     receivers arrive as AlertmanagerConfig resources selected below, so
#     receiver credentials (PagerDuty routing key) ride the declared secret
#     path (an ExternalSecret into the receiver's Secret) and never this file.
#   - the reviewed upstream dashboards/rules for cluster, node, workload,
#     Prometheus and Alertmanager health (design 15's baseline rule: retain,
#     do not copy).
#
# Name compatibility (deliberate): grafana.fullnameOverride keeps the
# Grafana Deployment/Service named `monitoring-grafana` exactly as before —
# every kubectl-exec transport (hg dash) and port-forward keeps working.
# fullnameOverride "monitoring" names the Prometheus service
# `monitoring-prometheus` (port 9090; the old chart's was
# monitoring-prometheus-server:80).
#
# How dashboards and Grafana-native alerts arrive (unchanged): the sidecars
# watch ConfigMaps in EVERY namespace — grafana_dashboard: "1" loads a
# dashboard, grafana_alert: "1" imports alert provisioning. Per-profile
# dashboards/alerts still ship via charts/monitoring exactly as before;
# their migration to PrometheusRule is tracked in ADR-45's Cost.
#
# No scaffold tokens in this file — it is fully static; the scaffold step
# copies it into the GitOps repo verbatim.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  labels:
    hermes-gitops.factorylevel.dev/component: monitoring
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # "default" for the same no-deadlock reason the split pair documented: the
  # hermes-gitops AppProject is created by this same bootstrap/ sync.
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.0.1
    helm:
      valuesObject:
        fullnameOverride: monitoring
        # No consumer for node metrics yet (parity with the split pair);
        # a fleet that wants the upstream node dashboards turns it on here.
        nodeExporter:
          enabled: false
        kubeStateMetrics:
          enabled: true
        # k3s runs kube-proxy, the scheduler and the controller-manager
        # inside the single k3s binary with no separate metrics endpoints,
        # so scraping them (and the KubeProxyDown/KubeSchedulerDown/
        # KubeControllerManagerDown rules the chart gates on these flags)
        # can only ever produce permanently-firing false alerts (#555).
        # etcd does not exist at all under k3s' default sqlite/kine.
        kubeProxy:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubelet:
          serviceMonitor:
            # The kubelet Endpoints object lists every node address family;
            # on a dual-stack host the IPv6 duplicate is unreachable from
            # the pod network, permanently firing TargetDown/
            # KubeletInstanceUnreachable for a kubelet that is fine (#555).
            # Keep one target per node: drop bracketed-IPv6 addresses.
            # The chart renders three kubelet endpoints (metrics, cadvisor,
            # probes), each with its own relabelings value - and setting a
            # value REPLACES that endpoint's default relabelings, which
            # carry the __metrics_path__ -> metrics_path mapping the
            # KubeletDown/K8sResource rules select on (learned live: the
            # drop alone made up{metrics_path="/metrics"} absent and fired
            # KubeletDown against a healthy kubelet). Restate the default
            # alongside the drop in all three.
            relabelings:
              - sourceLabels: [__metrics_path__]
                targetLabel: metrics_path
                action: replace
              - sourceLabels: [__address__]
                regex: '\[.*\]:.*'
                action: drop
            cAdvisorRelabelings:
              - sourceLabels: [__metrics_path__]
                targetLabel: metrics_path
                action: replace
              - sourceLabels: [__address__]
                regex: '\[.*\]:.*'
                action: drop
            probesRelabelings:
              - sourceLabels: [__metrics_path__]
                targetLabel: metrics_path
                action: replace
              - sourceLabels: [__address__]
                regex: '\[.*\]:.*'
                action: drop
        defaultRules:
          create: true
        alertmanager:
          enabled: true
          alertmanagerSpec:
            # Receivers are AlertmanagerConfig resources (any namespace,
            # this label) — the secret-path home for PagerDuty keys etc.
            alertmanagerConfigSelector:
              matchLabels:
                hermes_alertmanager_config: "1"
            alertmanagerConfigNamespaceSelector: {}
          # The closed routing tree (design 15). The default receiver is a
          # deliberate no-op: real receivers (chat webhook, PagerDuty) bind
          # through AlertmanagerConfig objects so their credentials come
          # from Secrets, never from this file. Promotion label
          # hermes_escalation=paged and severity=critical both route to the
          # paging receiver once an environment binds one.
          config:
            route:
              group_by: ["hermes_environment", "hermes_component", "alertname"]
              receiver: "null"
              routes:
                - matchers: ['hermes_escalation = "paged"']
                  receiver: "null"
                  continue: false
                - matchers: ['severity = "critical"']
                  receiver: "null"
            receivers:
              - name: "null"
        prometheus:
          prometheusSpec:
            # Discover every ServiceMonitor/PodMonitor/PrometheusRule in the
            # cluster, not only helm-labelled ones (design 14's
            # cross-namespace discovery).
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            # Real retention on a real volume: metric history is now state
            # worth protecting (design 13's ledger names the panels that
            # promise continuity).
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 8Gi
            # 15s, not the 1m default: health alerting samples
            # kube-state-metrics' view of ready replicas, and a pod restart
            # shorter than one scrape interval is INVISIBLE to it (observed
            # live with the split pair; see git history).
            scrapeInterval: 15s
            evaluationInterval: 15s
            additionalScrapeConfigs:
              # External uptime probes (#293): the Gatus workload in
              # The agent exporter is still discovered by pod annotations
              # (hermes-profile statefulset.yaml); the operator does no
              # annotation scraping by itself, so this job preserves it.
              # ServiceMonitor migration for the exporter is ADR-45 Cost.
              - job_name: kubernetes-pods
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    regex: "true"
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    regex: (.+)
                    target_label: __metrics_path__
                    action: replace
                  - source_labels:
                      [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                    regex: ([^:]+)(?::\d+)?;(\d+)
                    replacement: $1:$2
                    target_label: __address__
                    action: replace
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                    action: replace
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                    action: replace
              # Argo CD exposes Prometheus metrics on dedicated *metrics*
              # service ports but carries no scrape annotations - this job
              # is what puts argocd_app_info (health/sync per Application,
              # by exact identity) into Prometheus for the
              # hg-control-plane-* dashboards (design 15, ADR-55).
              - job_name: argocd
                kubernetes_sd_configs:
                  - role: endpoints
                    namespaces:
                      names:
                        - argocd
                relabel_configs:
                  - source_labels: [__meta_kubernetes_endpoint_port_name]
                    regex: .*metrics.*
                    action: keep
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                    action: replace
                  - source_labels: [__meta_kubernetes_service_name]
                    target_label: service
                    action: replace
              # Traefik has no prometheus.io/scrape annotations in k3s, so
              # an explicit job keeps only traefik pods' "metrics" port —
              # traefik_service_requests_total is the "site visits" series.
              - job_name: traefik
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names:
                        - kube-system
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                    regex: traefik
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_container_port_name]
                    regex: metrics
                    action: keep
        grafana:
          enabled: true
          # Keep the exact pre-migration workload/service name: every
          # kubectl-exec transport and port-forward references it.
          fullnameOverride: monitoring-grafana
          # The admin credential is a Secret, never a committed value
          # (issue #130). The bootstrap (stage 3) and the local loop each
          # create it; ESO can deliver it in a fleet.
          admin:
            existingSecret: monitoring-grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # An iframe of ANY Grafana URL is refused by X-Frame-Options
          # unless allow_embedding is on (ADR-44). Anonymous access is the
          # MVP/reference embed posture (#556, superseding #415's
          # authenticated-only stance): embeds render inside Nexus with no
          # separate Grafana login, as a read-only Viewer. Admin/editor
          # access still requires the real session; no tokens or
          # credentials ever appear in embed URLs.
          grafana.ini:
            security:
              allow_embedding: true
            auth.anonymous:
              enabled: true
              org_name: Main Org.
              org_role: Viewer
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
              # Folder ownership (#663, ADR 0166): the annotation decides
              # the Grafana folder, derived from the plane - a dashboard
              # cannot land in the wrong folder without failing the
              # plane/folder validation test.
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
            alerts:
              enabled: true
              label: grafana_alert
              labelValue: "1"
              searchNamespace: ALL
            datasources:
              # The stack provisions the default Prometheus datasource with
              # the FIXED uid "prometheus" — load-bearing: every provisioned
              # panel and alert rule references the datasource by this uid.
              defaultDatasourceEnabled: true
              uid: prometheus
              # And imports labeled datasource ConfigMaps - how the Loki
              # datasource (fixed uid "loki", control-plane/loki/chart)
              # provisions declaratively (#661, ADR 0165).
              enabled: true
              label: grafana_datasource
              labelValue: "1"
              searchNamespace: ALL
  destination:
    name: in-cluster
    namespace: hermes-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
