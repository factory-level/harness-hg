name: Feature request
description: Something the platform should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: One paragraph. What would you declare in your Agent Team Repo, and what should the platform do with it?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: The workaround, if any. Say if the roadmap already lists this.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I looked at the roadmap (https://factory-level.github.io/harness-hg/docs/roadmap/) and it is not there.
