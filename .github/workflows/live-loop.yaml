# Nightly live loop: `make e2e` (cli/e2e-local.sh) on a throwaway k3d cluster -
# a real Eve agent through onboard, up, test, the dev loop, reset, the
# reconcile acceptance, the team watcher, and `hg team status` proving the
# running agent, catching its drift and following a rollback. Deliberately NOT
# a PR gate: it needs docker (k3d = k3s-in-docker), network for the agent's
# `npm ci`, and 20-30 minutes end to end. Runs on a schedule and on demand.
#
# The Hermes-only drift + decommission job that used to live here was removed
# with its harness: it installed a payload deleted in #678. Nothing replaces it
# yet (maintainers/gaps.md). Like every workflow here, this one is disabled
# (.github/workflows/DISABLED.md).
name: live-loop

on:
  schedule:
    # 03:17 UTC nightly — an odd minute, per GitHub's guidance to avoid
    # the top-of-hour scheduling stampede.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The wiki image derives the platform version from git history.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: e2e local loop (Eve agent)
        run: make e2e
