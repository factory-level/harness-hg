apiVersion: v2
# Rename to match the directory (charts/<PERSONA>-dashboard) and the `chart:`
# field in hermes-gitops.yaml. Templates key off .Chart.Name / .Release.Name,
# so this and the directory name are the only edits a rename needs.
name: <PERSONA>-dashboard
description: >
  A starter Grafana dashboard for <PERSONA>, delivered as a ConfigMap the
  platform Grafana's sidecar picks up (label grafana_dashboard: "1"). Generic
  and heavily self-documenting: its first panels TEACH how dashboards work in
  this ecosystem. Modeled on charts/monitoring's dashboard; yours to grow.
  See CONVENTIONS.md. Publish before deploying (helm push).
type: application
version: 0.1.0
appVersion: "1.0"
