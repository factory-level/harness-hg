{{- include "hermes.computeGuard" . -}}
{{- if and (eq .Values.providers.compute "pod") .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hermes.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: hermes-profile
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hermes.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8642
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        # Prometheus scrapes the observer-metrics exporter from
        # hermes-monitoring; without this the metrics silently vanish
        # whenever the policy is on.
        - port: {{ .Values.metrics.port }}
          protocol: TCP
        {{- end }}
      {{- if .Values.spec.expose }}
        {{- range $svc := .Values.spec.expose.services }}
        - port: {{ $svc.port }}
          protocol: TCP
        {{- end }}
      {{- end }}
{{- end }}
