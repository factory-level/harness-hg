{{- include "hermes.computeGuard" . -}}
{{- if eq .Values.providers.compute "pod" -}}
{{/*
Boot/(re)install script for the bootstrap-distribution initContainer (see
pod/statefulset.yaml). Mounted as a volume and run via container.command
(overriding the image's s6 ENTRYPOINT entirely for this narrow job - the
main container keeps the normal /init supervision path, only its args are
overridden to ["gateway","run"]).

Design notes (see harness/hermes/charts/hermes-profile in the Task 8 report for the fuller
version):
  - Profiles installed via `hermes profile install` always land under
    $HERMES_HOME/profiles/<name>/ - the CLI hard-refuses to install AS
    "default" (hermes_cli/profile_distribution.py plan_install(): `if canon
    == "default": raise DistributionError(...)`), so this script installs
    as a NAMED profile (the instance name) and then runs `hermes profile use
    <name>` to make it the active/current profile - main.py documents
    active_profile as the sticky fallback `hermes gateway run` (no -p flag,
    per templates/pod/statefulset.yaml's container args) resolves against.
  - Uses `hermes profile install ... --force` unconditionally (fresh
    install AND every sha change) rather than `hermes profile update
    <name>`: update_distribution() re-reads and re-resolves the SOURCE
    STRING RECORDED ON THE PREVIOUS INSTALL, fragment (#<ref>) included
    (hermes_cli/profile_distribution.py _stage_source()'s docstring: "a
    branch pin follows the branch; a tag / commit-SHA pin stays fixed") -
    so once installed, `update` alone can never converge to a *different*
    target sha than whatever was first recorded. Re-cloning ourselves to a
    plain local directory (which _stage_source resolves with no ref pin at
    all) and reinstalling with --force is what actually lets this
    initContainer converge to whatever spec.sha the profile record
    specifies on every reconcile. `--force` still preserves all user-owned
    paths (memories/, sessions/, state.db, .env, ...) - it shares the same
    _copy_dist_payload()/USER_OWNED_EXCLUDE machinery as `update`.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hermes.fullname" . }}-boot
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: hermes-profile
    {{- include "hermes.labels" . | nindent 4 }}
data:
  boot.sh: |
    #!/bin/sh
    # Generated by harness/hermes/charts/hermes-profile/templates/pod/configmap-boot.yaml -
    # do not edit by hand, edit the chart template instead.
    set -eu

    STAMP_DIR="$HERMES_HOME/.hermes-gitops"
    STAMP_FILE="$STAMP_DIR/installed_sha"
    PROFILE_DIR="$HERMES_HOME/profiles/$HERMES_PROFILE_NAME"

    mkdir -p "$STAMP_DIR"
{{- if .Values.spec.workspace }}

    # ---- workspace repositories (#362) -------------------------------------
    # Ported from hermes-bundle/templates/configmap-boot.yaml - the twin
    # copy; keep the two in step (extract a shared template at the third
    # consumer). One physical checkout per declared repository under
    # /workspaces/repos, pinned to the compiled full SHA; the container
    # mounts select what the profile actually sees.
    WORKSPACE_STATE_DIR="$STAMP_DIR/workspaces"
    WORKSPACE_ROOT=/workspaces/repos
    mkdir -p "$WORKSPACE_STATE_DIR" "$WORKSPACE_ROOT"

    normalize_source() {
      case "$1" in
        https://*|http://*|git@*|ssh://*) printf '%s' "$1" ;;
        github.com/*|gitlab.com/*|bitbucket.org/*) printf 'https://%s' "$1" ;;
        *) echo "unsupported git source: $1" >&2; return 1 ;;
      esac
    }

    AUTH_CLEANUP=""
    prepare_git_auth() {
      source_url="$1"
      auth_dir="$2"
      AUTH_CLEANUP=""
      unset GIT_SSH_COMMAND || true
      rm -f "$HOME/.netrc" "$HOME/.ssh/hermes-workspace-key" 2>/dev/null || true
      [ -n "$auth_dir" ] || return 0
      [ -d "$auth_dir" ] || {
        echo "referenced git auth directory is missing: $auth_dir" >&2
        return 1
      }
      case "$source_url" in
        https://*|http://*)
          [ -f "$auth_dir/username" ] && [ -f "$auth_dir/password" ] || {
            echo "$auth_dir needs username and password keys for an HTTPS source" >&2
            return 1
          }
          host="$(printf '%s' "$source_url" | sed -E 's#^https?://([^/]+)/.*#\1#')"
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$host" "$(cat "$auth_dir/username")" "$(cat "$auth_dir/password")" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          AUTH_CLEANUP="$HOME/.netrc"
          ;;
        git@*|ssh://*)
          [ -f "$auth_dir/ssh-privatekey" ] || {
            echo "$auth_dir needs ssh-privatekey for an SSH source" >&2
            return 1
          }
          mkdir -p "$HOME/.ssh"
          cp "$auth_dir/ssh-privatekey" "$HOME/.ssh/hermes-workspace-key"
          chmod 600 "$HOME/.ssh/hermes-workspace-key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/hermes-workspace-key -o StrictHostKeyChecking=accept-new"
          AUTH_CLEANUP="$HOME/.ssh/hermes-workspace-key"
          ;;
      esac
    }

    clear_git_auth() {
      [ -z "$AUTH_CLEANUP" ] || rm -f "$AUTH_CLEANUP"
      AUTH_CLEANUP=""
      unset GIT_SSH_COMMAND || true
    }

    sync_workspace() {
      repo_name="$1"
      source_url="$(normalize_source "$2")"
      source_sha="$3"
      access="$4"
      auth_dir="$5"
      destination="$WORKSPACE_ROOT/$repo_name"
      stamp="$WORKSPACE_STATE_DIR/workspace-$repo_name.sha"
      previous_declared=""
      previous_source=""
      if [ -f "$stamp" ]; then
        # "<sha>" (legacy, pre-source-tracking) or "<sha> <source>".
        previous_declared="$(cut -d" " -f1 < "$stamp")"
        previous_source="$(cut -d" " -f2- < "$stamp")"
        [ "$previous_source" != "$previous_declared" ] || previous_source=""
      fi

      if [ ! -d "$destination/.git" ]; then
        rm -rf "$destination"
        prepare_git_auth "$source_url" "$auth_dir"
        if ! git clone --no-checkout "$source_url" "$destination"; then
          clear_git_auth
          return 1
        fi
        if ! git -C "$destination" checkout --detach "$source_sha"; then
          clear_git_auth
          return 1
        fi
        clear_git_auth
        printf '%s %s' "$source_sha" "$source_url" > "$stamp"
        return 0
      fi

      current="$(git -C "$destination" rev-parse HEAD)"
      # A matching SHA is NOT enough to skip: if `source` changed, this
      # checkout is the old repository and fetching would either resolve an
      # identically-named commit from the wrong remote or fail forever.
      current_source="$(git -C "$destination" remote get-url origin 2>/dev/null || echo "")"
      source_changed=0
      if [ -n "$previous_source" ] && [ "$previous_source" != "$source_url" ]; then
        source_changed=1
      elif [ -n "$current_source" ] && [ "$current_source" != "$source_url" ]; then
        source_changed=1
      fi
      if [ "$current" = "$source_sha" ] && [ "$source_changed" -eq 0 ]; then
        printf '%s %s' "$source_sha" "$source_url" > "$stamp"
        return 0
      fi
      # Deliberately NOT gated on "$access" = read-write: what matters is
      # whether THIS CHECKOUT has work in it, which is knowable, not what
      # the incoming declaration says it should have been. A genuinely
      # read-only checkout is clean at the declared SHA and passes free.
      if [ -n "$(git -C "$destination" status --porcelain)" ]; then
        echo "workspace $repo_name has uncommitted changes; refusing to replace $current with $source_sha" >&2
        echo "commit or discard them in the pod, then restart" >&2
        exit 1
      fi
      if [ -z "$previous_declared" ] || [ "$current" != "$previous_declared" ]; then
        echo "workspace $repo_name has local commits at $current; refusing to replace them with $source_sha" >&2
        echo "push or preserve the work, then restore the checkout to declared SHA ${previous_declared:-unknown}" >&2
        exit 1
      fi
      if [ "$source_changed" -eq 1 ]; then
        echo "[bootstrap] workspace $repo_name source changed to $source_url; realigning origin" >&2
        git -C "$destination" remote set-url origin "$source_url"
      fi
      prepare_git_auth "$source_url" "$auth_dir"
      if ! git -C "$destination" fetch --force origin "$source_sha"; then
        clear_git_auth
        return 1
      fi
      if ! git -C "$destination" checkout --detach "$source_sha"; then
        clear_git_auth
        return 1
      fi
      clear_git_auth
      printf '%s %s' "$source_sha" "$source_url" > "$stamp"
    }

    echo "[bootstrap] syncing pinned workspace repositories"
{{- range .Values.spec.workspace.repositories }}
    # DEGRADE, do not refuse (ADR-61): a workspace that cannot be cloned
    # is a missing checkout with a written reason, not a boot failure -
    # the gateway starts without it and anything that reads it finds the
    # marker, never a quietly empty directory.
    if ! sync_workspace \
      {{ .name | quote }} \
      {{ .source | quote }} \
      {{ .sha | quote }} \
      {{ .access | quote }} \
      {{ if .gitAuthSecretRef }}"/run/secrets/repositories/{{ .name }}/git"{{ else }}""{{ end }}; then
      echo "[bootstrap] WARNING: workspace {{ .name }} is UNAVAILABLE - it could not be cloned." >&2
      echo "[bootstrap] the agent starts without it; anything that reads it will find nothing." >&2
      printf 'unavailable %s\n' {{ .source | quote }} > "$WORKSPACE_STATE_DIR/workspace-{{ .name }}.unavailable"
    else
      rm -f "$WORKSPACE_STATE_DIR/workspace-{{ .name }}.unavailable"
    fi
{{- end }}
{{- end }}

    CURRENT_SHA=""
    if [ -f "$STAMP_FILE" ]; then
      CURRENT_SHA="$(cat "$STAMP_FILE")"
    fi

    if [ "$CURRENT_SHA" != "$HERMES_DIST_SHA" ]; then
      echo "[bootstrap] installed_sha ('$CURRENT_SHA') != spec.sha ('$HERMES_DIST_SHA') - (re)installing distribution"
      rm -rf /tmp/dist
      # Private-source auth (issue #18 [G1]): when spec.gitAuthSecretRef
      # names a Secret, it is mounted at /git-auth (see statefulset.yaml)
      # and consumed off the source scheme: username+password keys become
      # an ephemeral ~/.netrc for https sources; an ssh-privatekey key
      # becomes an ephemeral identity for git@/ssh sources. Both live in
      # $HOME only for the duration of the clone and are removed right
      # after (alongside the .git scrub below), so no credential ever
      # lands in the installed profile or the running container's
      # long-lived filesystem.
      GIT_AUTH_CLEANUP=""
      if [ -d /git-auth ]; then
        case "$HERMES_DIST_SOURCE" in
          https://*)
            if [ -f /git-auth/username ] && [ -f /git-auth/password ]; then
              DIST_HOST="$(printf '%s' "$HERMES_DIST_SOURCE" | sed -E 's#^https://([^/]+)/.*#\1#')"
              printf 'machine %s\nlogin %s\npassword %s\n' \
                "$DIST_HOST" "$(cat /git-auth/username)" "$(cat /git-auth/password)" > "$HOME/.netrc"
              chmod 600 "$HOME/.netrc"
              GIT_AUTH_CLEANUP="$HOME/.netrc"
              echo "[bootstrap] git auth: using HTTPS credentials from gitAuthSecretRef for $DIST_HOST"
            else
              echo "[bootstrap] git auth: /git-auth mounted but username/password keys missing for an https source" >&2
              exit 1
            fi
            ;;
          git@*|ssh://*)
            if [ -f /git-auth/ssh-privatekey ]; then
              mkdir -p "$HOME/.ssh"
              cp /git-auth/ssh-privatekey "$HOME/.ssh/git-auth-key"
              chmod 600 "$HOME/.ssh/git-auth-key"
              export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/git-auth-key -o StrictHostKeyChecking=accept-new"
              GIT_AUTH_CLEANUP="$HOME/.ssh/git-auth-key"
              echo "[bootstrap] git auth: using SSH deploy key from gitAuthSecretRef"
            else
              echo "[bootstrap] git auth: /git-auth mounted but ssh-privatekey key missing for an ssh source" >&2
              exit 1
            fi
            ;;
        esac
      fi
      git clone "$HERMES_DIST_SOURCE" /tmp/dist
      git -C /tmp/dist checkout "$HERMES_DIST_SHA"
      if [ -n "$GIT_AUTH_CLEANUP" ]; then
        rm -f $GIT_AUTH_CLEANUP
        unset GIT_SSH_COMMAND || true
      fi
      # `hermes profile install` only strips .git when IT does the git clone
      # itself (a bare git-URL source); since we pre-clone to a local
      # directory ourselves, its local-directory install branch would
      # otherwise copy .git straight into the installed profile (verified
      # live in this task's k3d check before this line was added).
      rm -rf /tmp/dist/.git
      # Subdir-layout sources (spec.sourceSubdir, the fork's --subdir /
      # #subdirectory= form): the distribution root is a subtree of the
      # clone, and installing that subtree path directly is the fork's
      # local-directory equivalent of --subdir.
      hermes profile install "/tmp/dist${HERMES_DIST_SUBDIR:+/$HERMES_DIST_SUBDIR}" --name "$HERMES_PROFILE_NAME" --force -y
      rm -rf /tmp/dist
      echo "$HERMES_DIST_SHA" > "$STAMP_FILE"
    else
      echo "[bootstrap] installed_sha matches spec.sha ('$HERMES_DIST_SHA') - skipping (re)install"
    fi

    hermes profile use "$HERMES_PROFILE_NAME"

    # ---- observer-metrics plugin (hermes.observer.v1) ----------------------
    # Copies the chart-shipped directory plugin (configmap-plugins.yaml,
    # mounted at /plugins) into the ACTIVE profile's user-plugins dir -
    # the fork's gateway process resolves HERMES_HOME to the profile dir,
    # so $PROFILE_DIR/plugins/ is exactly where hermes_cli/plugins.py's
    # "user" discovery source scans - and adds it to plugins.enabled in
    # the profile's config.yaml (preserved across --force reinstalls).
    # Runs every boot: a distribution that ships its own plugins/ dir
    # replaces this dir at install time, and this re-copy converges it
    # back. Copy BEFORE enable: `hermes plugins enable` exits nonzero if
    # discovery can't find the plugin; re-running enable is a no-op.
    if [ "${HERMES_OBSERVER_METRICS:-1}" = "1" ] && [ -d /plugins ]; then
      echo "[bootstrap] installing observer-metrics plugin"
      mkdir -p "$PROFILE_DIR/plugins/observer-metrics"
      cp -f /plugins/plugin.yaml /plugins/__init__.py "$PROFILE_DIR/plugins/observer-metrics/"
      hermes plugins enable observer-metrics --no-allow-tool-override
    else
      # Disabled (or mount absent): converge OFF. Both guarded - the
      # plugin may never have been installed/enabled on this PVC.
      rm -rf "$PROFILE_DIR/plugins/observer-metrics" || true
      hermes plugins disable observer-metrics >/dev/null 2>&1 || true
    fi

    echo "[bootstrap] materializing .env for profile '$HERMES_PROFILE_NAME'"
    : > "$PROFILE_DIR/.env.tmp"
    # Secret volume mounts glob-skip their own "..data"/"..<timestamp>" bookkeeping
    # entries automatically (POSIX sh globs never match leading-dot names), so no
    # special-casing is needed here - only the real, renamed leaf keys show up.
    for dir in /run/secrets/hermes-env /run/secrets/hermes-api-key; do
      [ -d "$dir" ] || continue
      for f in "$dir"/*; do
        [ -e "$f" ] || continue
        key="$(basename "$f")"
        val="$(cat "$f")"
        printf '%s=%s\n' "$key" "$val" >> "$PROFILE_DIR/.env.tmp"
      done
    done
{{- if .Values.spec.workspace }}
    # A Secret key must not be able to spoof the platform-owned mount list.
    grep -v -E '^HERMES_GITOPS_REPOSITORIES=' "$PROFILE_DIR/.env.tmp" > "$PROFILE_DIR/.env.tmp.filtered" || true
    mv "$PROFILE_DIR/.env.tmp.filtered" "$PROFILE_DIR/.env.tmp"
    {{- $mountPaths := list }}
    {{- range .Values.spec.workspace.repositories }}
    {{- $mountPaths = append $mountPaths .mountPath }}
    {{- end }}
    printf 'HERMES_GITOPS_REPOSITORIES=%s\n' {{ join "," $mountPaths | quote }} >> "$PROFILE_DIR/.env.tmp"
{{- end }}
    mv "$PROFILE_DIR/.env.tmp" "$PROFILE_DIR/.env"
    chmod 600 "$PROFILE_DIR/.env"
{{- if .Values.spec.workspace }}
{{- $cwd := .Values.spec.workspace.terminalCwd }}
{{- if and (not $cwd) (eq (len .Values.spec.workspace.repositories) 1) }}
{{- $cwd = (index .Values.spec.workspace.repositories 0).mountPath }}
{{- end }}
{{- if $cwd }}

    hermes -p "$HERMES_PROFILE_NAME" config set terminal.cwd {{ $cwd | quote }}
{{- end }}
{{- end }}

    # ---- declared cron jobs -------------------------------------------------
    # `hermes profile install` copies a distribution's cron/ directory onto the
    # PVC, but the scheduler only reads cron/jobs.json - so a shipped
    # cron/<job>.yaml lands on disk and never runs. `cron sync` converges the
    # declarations into the store. Runs AFTER .env so a job's provider/model
    # snapshot resolves against the profile's real credentials.
    #
    # New jobs arrive PAUSED and sync never rewrites the enabled flag again, so
    # `hermes cron resume <name>` is a decision that survives every redeploy.
    #
    # The two ways this can fail are NOT the same and must not be conflated:
    #
    #   - The subcommand does not exist. An agent image predating `cron sync`
    #     must not brick the pod for want of a feature it never had, so this is
    #     a warning and boot continues. Probed with `--help` (no side effects)
    #     rather than inferred from an exit code, because argparse's "invalid
    #     choice" is indistinguishable from a genuine failure by status alone.
    #
    #   - The subcommand exists and FAILED: a malformed declaration, an
    #     unwritable store, a job the runtime rejected. That is a
    #     misconfigured agent, and swallowing it would leave a healthy-looking
    #     pod running none of the work it was told to do - the exact failure
    #     this step exists to end. Fail the initContainer instead: a
    #     CrashLoopBackOff is visible, a log line in an init container is not.
    #     `hg validate` catches these locally, before a cluster is involved.
    echo "[bootstrap] syncing declared cron jobs"
    if hermes -p "$HERMES_PROFILE_NAME" cron sync --help >/dev/null 2>&1; then
      if ! hermes -p "$HERMES_PROFILE_NAME" cron sync; then
        echo "[bootstrap] FATAL: cron sync failed - this agent's declared jobs are NOT scheduled." >&2
        echo "[bootstrap] Run 'hg validate' against the distribution; it checks every cron/*.yaml." >&2
        exit 1
      fi
    else
      echo "[bootstrap] WARNING: this agent image predates 'hermes cron sync'." >&2
      echo "[bootstrap] Any declared cron/<job>.yaml is on the volume but NOT scheduled." >&2
      echo "[bootstrap] Rebuild the agent image from the fork to activate them." >&2
    fi

    echo "[bootstrap] done"
{{- end -}}
