{{- include "hermes.computeGuard" . -}}
{{- include "hermes.ingressGuard" . -}}
{{- if and (eq .Values.providers.compute "pod") (eq .Values.providers.ingress "cloudflare") -}}
{{- include "hermes.cloudflareConfigGuard" . -}}
{{/*
Pod-path delivery of the tunnel connector token to the cloudflared sidecar
(templates/pod/statefulset.yaml). Unlike the Pulumi-backend/API-token
ExternalSecrets above (which read a SHARED fleet-wide remote key), this
one is genuinely PER-INSTANCE: the remote key is
hermes.cfTunnelTokenSecretName ("hermes-<name>-cf-tunnel-token", computed
identically on both sides of this contract - see that helper's docstring),
because infra/pulumi/programs/cloudflare-tunnel/cloudflare_tunnel/secrets.py
WRITES a Secret of exactly that name into the hermes-secrets namespace.

Feeds the pod workload's cloudflared sidecar its tunnel token
(templates/pod/statefulset.yaml).
*/}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hermes.cfTunnelTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: hermes-profile
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hermes-gitops
    kind: ClusterSecretStore
  target:
    name: {{ include "hermes.cfTunnelTokenSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        key: {{ include "hermes.cfTunnelTokenSecretName" . }}
        property: value
{{- end -}}
