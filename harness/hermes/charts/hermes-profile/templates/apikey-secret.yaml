{{- include "hermes.computeGuard" . -}}
{{- if eq .Values.providers.compute "pod" -}}
{{/*
See templates/pod/statefulset.yaml's API_SERVER_KEY env.

Mints API_SERVER_KEY via an ESO Password generator instead of asking the
operator to seed one. gateway/platforms/api_server.py (hermes-agent-gitops
fork, ~line 1234/5250) refuses to start the API server without a key of at
least 16 chars, so this must exist before the main container's first
successful startupProbe.

refreshInterval MUST be "0" (one-time), not a duration. ESO Password/
generator-backed ExternalSecrets re-run the generator on EVERY refresh
cycle by design (see https://external-secrets.io/latest/api/generator/password/
- "every invocation creates a new set of values") - a periodic refresh here
would silently rotate the key out from under the running gateway process on
every refreshInterval tick, not just on legitimate re-installs.
refreshInterval: "0" tells ESO to generate once and never re-run the
generator for this ExternalSecret.

Known caveat (external-secrets/external-secrets#2699,
external-secrets/external-secrets discussion #3148): even with
refreshInterval "0", touching the ExternalSecret object itself (labels,
annotations - e.g. re-applying it with a new `helm.sh/chart` label after a
chart bump) can still cause ESO to treat it as changed and re-invoke the
generator, minting a new key. Deliberately: this ExternalSecret does NOT
carry the checksum/profile annotation (see templates/pod/statefulset.yaml)
for exactly this reason - only the Pod template annotation should change on
every profile edit. If a re-mint does happen anyway (e.g. a chart upgrade
that changes this file's labels), the blast radius is a forced agent
restart (main container's env changes, K8s rolls the pod) - not data loss:
nothing in the profile's persistent state depends on the API key's value.
*/}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "hermes.apiKeySecretName" . }}-gen
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: hermes-profile
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "hermes.apiKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: hermes-profile
    {{- include "hermes.labels" . | nindent 4 }}
spec:
  refreshInterval: "0"
  target:
    name: {{ include "hermes.apiKeySecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "hermes.apiKeySecretName" . }}-gen
{{- end -}}
