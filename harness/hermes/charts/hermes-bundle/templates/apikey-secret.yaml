{{- /*
API_SERVER_KEY for every bundled profile that publishes an api port. The
per-profile chart (hermes-profile/templates/apikey-secret.yaml) mints it
through an ESO Password generator; a bundle never did, so a bundled
gateway's api_server refused to start and the profile answered nothing
on its Service port (found live, #849).

Same rules as the per-profile chart: refreshInterval "0" (a generator
re-runs on every refresh and would rotate the key under the running
gateway), and no per-spec checksum annotation on the ExternalSecret so a
profile edit never re-mints.
*/ -}}
{{- range .Values.spec.profiles }}
{{- if and .gatewayEnabled .apiServerPort }}
{{- $name := printf "%s-%s-api-key" (include "hermes-bundle.fullname" $) .name }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}-gen
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hermes-bundle.labels" $ | nindent 4 }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hermes-bundle.labels" $ | nindent 4 }}
spec:
  refreshInterval: "0"
  target:
    name: {{ $name }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}-gen
{{- end }}
{{- end }}
