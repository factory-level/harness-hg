{{- include "eve-bundle.guard" . -}}
{{/*
One Service, one named port per enabled member (the port name IS the
member name, so an Ingress rule or a NetworkPolicy can address a member
without knowing its index).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eve-bundle.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-bundle
    {{- include "eve-bundle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "eve-bundle.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $i, $p := .Values.spec.profiles }}
    {{- if ne ($p.gatewayEnabled | default true | toString) "false" }}
    {{- $port := include "eve-bundle.memberPort" (dict "index" $i "profile" $p) }}
    - name: {{ $p.name | trunc 15 | trimSuffix "-" }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: TCP
      appProtocol: http
    {{- end }}
    {{- end }}
