{{- include "eve-bundle.guard" . -}}
{{- include "eve-bundle.ingressGuard" . -}}
{{/*
One host per member (<member>.<baseDomain>), each forwarding BOTH runtime
prefixes unrewritten to the member's port - the two-prefix contract of
eve-agent/templates/ingress.yaml.
*/}}
{{- if eq .Values.providers.ingress "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "eve-bundle.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-bundle
    {{- include "eve-bundle.labels" . | nindent 4 }}
spec:
  rules:
    {{- range $i, $p := .Values.spec.profiles }}
    {{- if ne ($p.gatewayEnabled | default true | toString) "false" }}
    {{- $port := include "eve-bundle.memberPort" (dict "index" $i "profile" $p) }}
    - host: {{ printf "%s.%s" $p.name ($.Values.ingress.baseDomain | default "hermes.local") }}
      http:
        paths:
          - path: /eve/
            pathType: Prefix
            backend:
              service:
                name: {{ include "eve-bundle.fullname" $ }}
                port:
                  number: {{ $port }}
          - path: /.well-known/workflow/
            pathType: Prefix
            backend:
              service:
                name: {{ include "eve-bundle.fullname" $ }}
                port:
                  number: {{ $port }}
    {{- end }}
    {{- end }}
{{- end }}
