{{- include "eve-bundle.guard" . -}}
{{/*
The SAME boot script as eve-agent (files/boot.sh, byte-identical, cmp-gated
by render-test) and the same default channel. The bundle drives it through
env: one build-agent initContainer per member with EVE_DATA_ROOT=
/app/members/<name>, and one workspaces initContainer (EVE_BOOT_MODE=
workspaces) that syncs the bundle's repositories onto the shared
workspaces claim.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eve-bundle.fullname" . }}-boot
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-bundle
    {{- include "eve-bundle.labels" . | nindent 4 }}
data:
  channel-eve.ts: |
{{ .Files.Get "files/channel-eve.ts" | indent 4 }}
  boot.sh: |
{{ .Files.Get "files/boot.sh" | indent 4 }}
