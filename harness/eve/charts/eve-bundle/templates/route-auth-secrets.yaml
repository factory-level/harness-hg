{{- include "eve-bundle.guard" . -}}
{{/*
One minted Basic credential per member (eve-agent/templates/
route-auth-secret.yaml's shape): a member keeps its own route identity
inside the bundle, so `hg` and callers address ag-eve-<bundle>-<member>-
route-auth exactly as they would the standalone instance's Secret.
refreshInterval "0" - one-time, never rotated under the running process.
*/}}
{{- range .Values.spec.profiles }}
{{- $secret := include "eve-bundle.routeAuthSecretName" (dict "root" $ "member" .name) }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $secret }}-gen
  namespace: {{ $.Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-bundle
    {{- include "eve-bundle.labels" $ | nindent 4 }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-bundle
    {{- include "eve-bundle.labels" $ | nindent 4 }}
spec:
  refreshInterval: "0"
  target:
    name: {{ $secret }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $secret }}-gen
{{- end }}
