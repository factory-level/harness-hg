{{- include "eve.runtimeGuard" . -}}
{{- include "eve.computeGuard" . -}}
{{- include "eve.ingressGuard" . -}}
{{/*
The runtime's two route prefixes, forwarded unrewritten. eve's self-hosting
guide is explicit: a proxy restricted to /eve/ lets a session start and
then stalls it when the Workflow callback cannot reach
/.well-known/workflow/. The path set is owned by the runtime and never
authored - an EveAgent record has no expose block.
*/}}
{{/*
Rendered for BOTH "ingress" and "cloudflare": under cloudflare the platform's
one shared control-plane tunnel forwards <name>.<zoneName> to traefik with the
host header rewritten to the host below, so the same object serves both (see
eve.ingressGuard). "none" renders nothing.
*/}}
{{- if or (eq .Values.providers.ingress "ingress") (eq .Values.providers.ingress "cloudflare") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "eve.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-agent
    {{- include "eve.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ printf "%s.%s" (include "eve.name" .) (.Values.ingress.baseDomain | default "hermes.local") }}
      http:
        paths:
          - path: /eve/
            pathType: Prefix
            backend:
              service:
                name: {{ include "eve.fullname" . }}
                port:
                  number: 3000
          - path: /.well-known/workflow/
            pathType: Prefix
            backend:
              service:
                name: {{ include "eve.fullname" . }}
                port:
                  number: 3000
{{- end }}
