{{- include "eve.runtimeGuard" . -}}
{{- include "eve.computeGuard" . -}}
{{/*
The instance's Service: one port, the Nitro server on 3000. Both runtime
route prefixes (/eve/ and /.well-known/workflow/) are served by this same
port - the Ingress forwards both to it unrewritten (templates/ingress.yaml).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eve.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-agent
    {{- include "eve.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "eve.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
