{{- include "eve.runtimeGuard" . -}}
{{- include "eve.computeGuard" . -}}
{{/*
Mints the route-auth Basic password via an ESO Password generator instead
of asking the operator to seed one. Eve fails closed on production session
routes (guides/auth-and-route-protection.md): without an authenticator that
accepts the caller every POST /eve/v1/session is a 401. The boot script's
default agent/channels/eve.ts verifies ROUTE_AUTH_BASIC_USERNAME/PASSWORD,
and `hg test` / `hg agent prove` read this Secret to authenticate their real
turn.

refreshInterval MUST be "0" (one-time): generator-backed ExternalSecrets
re-run the generator on EVERY refresh cycle by design, which would rotate
the credential out from under the running process on every tick. Same
caveat as hermes-profile's apikey-secret.yaml: touching the ExternalSecret
object itself (a chart-label bump) can re-mint; this resource therefore
carries no checksum/record annotation, and a re-mint's blast radius is a
pod roll (the env changes), never data loss.
*/}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "eve.routeAuthSecretName" . }}-gen
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-agent
    {{- include "eve.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "eve.routeAuthSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: workload
    hermes-gitops.factorylevel.dev/component: eve-agent
    {{- include "eve.labels" . | nindent 4 }}
spec:
  refreshInterval: "0"
  target:
    name: {{ include "eve.routeAuthSecretName" . }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "eve.routeAuthSecretName" . }}-gen
