# The standalone Nexus service (ADR-48). HOME points at the state PVC, so
# plugin_api's Path.home()-derived state paths land on durable storage
# with zero code change; the config file is subPath-mounted onto the
# exact path the plugin resolves. The plan arrives by git clone (init)
# and stays fresh by pull (sidecar) - Nexus stays a projection of the
# GitOps repository, never a second authority (ADR-42).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-state
  labels: {hermes-gitops.factorylevel.dev/plane: control-plane, hermes-gitops.factorylevel.dev/component: nexus, app.kubernetes.io/name: nexus}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.state.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: nexus
    app.kubernetes.io/name: nexus
    {{- with .Values.owner }}
    # Queried by `hg up` to decide whether it owns this release (ADR-53).
    hermes.dev/owner: {{ . | quote }}
    {{- end }}
spec:
  replicas: 1
  strategy: {type: Recreate}   # the state PVC is RWO
  selector:
    matchLabels: {app.kubernetes.io/name: nexus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nexus}
      annotations:
        # Scraped by the monitoring stack's existing kubernetes-pods
        # annotation job (#280) - no ServiceMonitor, no monitoring-chart
        # change. /metrics serves published eval results.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        # Roll the pods when the projected code/UI changes - a ConfigMap
        # edit alone updates mounts minutes later without a restart, which
        # left a crashed old process running the new file (observed live).
        # features.json rides the code checksum too: it is projected into
        # the SAME nexus-code ConfigMap, and plugin_api.py captures the
        # registry once at import (FEATURES, plugin_api.py:88), so adding
        # a flag without a restart left the pod serving the old set.
        # `codeChecksum` is the same payload hashed by the CALLER (Pulumi
        # hashes the projected files so its Release diff can see them at
        # all - it does not read a local chart's contents). Preferred when
        # set so the two never disagree; a plain `helm install` still gets
        # the render-time hash below.
        # The UI bundles are NOT chart files (they live in the externally
        # provisioned dist ConfigMap, see configmaps.yaml), so the
        # render-time fallback cannot see them; the CALLER's codeChecksum
        # hashes control-plane/nexus/dist too - style.css included, because
        # the brand fonts live INSIDE it (ADR-105) and a CSS-only update
        # must roll the pod, or standalone.py's boot-time DIST_VERSION keeps
        # advertising the old cache key over a new mount.
        checksum/code: {{ .Values.codeChecksum | default (print (.Files.Get "files/plugin_api.py") (.Files.Get "files/standalone.py") (.Files.Get "files/inventory.json") (.Files.Get "files/panels.json") (.Files.Get "files/features.json") | sha256sum) }}
        # Same reason, for the CONFIG map: changing an integration base URL
        # rewrote the ConfigMap and left the running pod on the old value,
        # so Nexus kept serving dead Grafana/Argo links after a fixed `up`.
        checksum/config: {{ print .Values.gitopsUrl .Values.gitopsBranch .Values.argocdBaseUrl .Values.grafanaBaseUrl .Values.grafanaProbeBaseUrl .Values.prometheusBaseUrl .Values.routerBaseUrl .Values.backupStaleHours .Values.evalStaleHours (.Values.workspace | toJson) .Values.cacheSeconds .Values.staleAfterSeconds .Values.kubeContext .Values.adapters.argo.enabled .Values.adapters.gateway.enabled (.Values.capabilities | toJson) (.Values.toolUrls | toJson) | sha256sum }}
    spec:
      serviceAccountName: nexus
      initContainers:
        - name: clone
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /state/.hermes/plugins/hermes-gitops/state
              rm -rf /repo/* /repo/.git 2>/dev/null || true
              {{- if .Values.gitopsAuth.secretName }}{{ include "nexus.gitCredentialHelper" . | nindent 14 }}{{ end }}
              git clone --depth 1 --branch {{ .Values.gitopsBranch }} \
                {{ required "gitopsUrl is required" .Values.gitopsUrl | quote }} /repo
          {{- with .Values.gitopsAuth.secretName }}
          env:
            - name: GIT_USERNAME
              valueFrom: {secretKeyRef: {name: {{ . | quote }}, key: username}}
            - name: GIT_TOKEN
              valueFrom: {secretKeyRef: {name: {{ . | quote }}, key: token}}
          {{- end }}
          volumeMounts:
            - {name: repo, mountPath: /repo}
            - {name: state, mountPath: /state}
      containers:
        - name: nexus
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["uvicorn", "standalone:app", "--host", "0.0.0.0", "--port", "8080"]
          env:
            - {name: HOME, value: /state}
            - {name: PYTHONPATH, value: /app}
            {{- if .Values.oidc.issuer }}
            # A REFERENCE, never a value (ADR-53): the platform creates
            # this Secret, the chart only names it. Absent issuer means
            # absent variable, and the backend falls back to the header
            # path rather than half-configuring OIDC.
            - name: NEXUS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretRef.name | quote }}
                  key: {{ .Values.oidc.clientSecretRef.key | quote }}
            {{- end }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - {name: code, mountPath: /app}
            - {name: dist, mountPath: /app/dist}
            - {name: repo, mountPath: /repo, readOnly: true}
            - {name: state, mountPath: /state}
            - name: config
              mountPath: /state/.hermes/plugins/hermes-gitops/config.yaml
              subPath: config.yaml
        - name: repo-sync
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              {{- if .Values.gitopsAuth.secretName }}{{ include "nexus.gitCredentialHelper" . | nindent 14 }}{{ end }}
              while true; do
                git -C /repo pull --quiet || echo "[repo-sync] pull failed; retrying"
                sleep {{ .Values.syncSeconds }}
              done
          {{- with .Values.gitopsAuth.secretName }}
          env:
            - name: GIT_USERNAME
              valueFrom: {secretKeyRef: {name: {{ . | quote }}, key: username}}
            - name: GIT_TOKEN
              valueFrom: {secretKeyRef: {name: {{ . | quote }}, key: token}}
          {{- end }}
          volumeMounts:
            - {name: repo, mountPath: /repo}
      volumes:
        - {name: repo, emptyDir: {}}
        - {name: state, persistentVolumeClaim: {claimName: nexus-state}}
        - {name: code, configMap: {name: nexus-code}}
        - {name: dist, configMap: {name: {{ .Values.dist.configMapName | quote }}}}
        - {name: config, configMap: {name: nexus-config}}
