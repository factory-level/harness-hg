apiVersion: v1
kind: Service
metadata:
  # The compiled DNS identity - producers' generated ingest URLs resolve
  # to exactly this name.
  name: {{ include "hermes-event-router.service" . }}
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: event-router
    app.kubernetes.io/name: hermes-event-router
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: hermes-event-router
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
