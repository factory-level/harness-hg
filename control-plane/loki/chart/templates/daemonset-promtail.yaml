apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: loki
    app.kubernetes.io/name: promtail
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-promtail.yaml") . | sha256sum }}
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: {{ .Values.images.promtail }}
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          securityContext:
            # Reading /var/log/pods requires root on most nodes; promtail
            # is read-only there and writes only its positions file.
            runAsUser: 0
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/promtail}
            - {name: run, mountPath: /run/promtail}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: containers, mountPath: /var/lib/docker/containers, readOnly: true}
      volumes:
        - name: config
          configMap: {name: promtail-config}
        - name: run
          hostPath: {path: /run/promtail, type: DirectoryOrCreate}
        - name: pods
          hostPath: {path: /var/log/pods}
        - name: containers
          hostPath: {path: /var/lib/docker/containers}
