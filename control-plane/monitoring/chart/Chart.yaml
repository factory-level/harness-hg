apiVersion: v2
name: monitoring
description: >
  Per-profile observability payload: a Grafana dashboard, alert rules
  (site visits per 5m over a configurable threshold, agent unavailable,
  agent-app deployments unhealthy) and their generic webhook contact point, all rendered as
  ConfigMaps the platform Grafana's sidecars pick up from this profile's
  namespace (see bootstrap/monitoring-grafana.yaml). Referenced from
  hermes-gitops.yaml as {chart: charts/monitoring, repo: local} — local
  charts version with the platform revision, so this chart's version is
  informational only.
type: application
version: 0.1.0
appVersion: "1.0"

# The shared Grafana alert-delivery templates (#619). The subchart is COMMITTED
# under charts/ rather than fetched: `helm dependency update` runs nowhere in
# this repo, because Argo CD syncs this chart from a bare Git path. Regenerate
# the copy with `make alerting-lib`; `make alerting-lib-drift` gates it.
dependencies:
  - name: hermes-alerting
    version: 0.1.0
    repository: ""
