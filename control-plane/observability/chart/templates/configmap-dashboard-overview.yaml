{{- /*
hg-control-plane-overview (design 15): "is the Hermes control plane
working?" on one page. Five rows: a status strip of live counts, agent
runtime freshness, reconciliation-at-a-glance, communication delivery,
and capacity. Every expression queries a series the pinned stack really
emits - argocd_* arrives via the argocd scrape job in
bootstrap/monitoring-stack.yaml, kube_* via kube-state-metrics, hermes_*
via the observer plugin and the event router's /metrics.

The uid is a constant the platform PROMISES (design 15's stable embed
set resolves to it); it never derives from release or namespace.
*/ -}}
{{- if .Values.overview.enabled }}
{{- $ds := printf "{\"type\":\"prometheus\",\"uid\":%s}" (.Values.datasourceUid | toJson) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-overview
  namespace: {{ .Release.Namespace }}
  labels:
    hermes-gitops.factorylevel.dev/plane: control-plane
    hermes-gitops.factorylevel.dev/component: observability
    grafana_dashboard: "1"
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    grafana_folder: Control Plane
data:
  {{ .Release.Name }}-overview.json: |
    {
      "uid": "hg-control-plane-overview",
      "title": "Hermes — Control plane overview",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Firing alerts",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 5 },
          "datasource": {{ $ds }},
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 }
              ] }
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "datasource": {{ $ds }}, "instant": true,
              "expr": "count(ALERTS{alertstate=\"firing\", alertname!=\"Watchdog\"}) or vector(0)" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Argo apps needing attention",
          "description": "Applications not both Synced and Healthy. The overlay's argocd source levels the same fact.",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 5 },
          "datasource": {{ $ds }},
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 }
              ] }
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "datasource": {{ $ds }}, "instant": true,
              "expr": "(count(argocd_app_info{sync_status!=\"Synced\"}) or vector(0)) + (count(argocd_app_info{health_status!=\"Healthy\"}) or vector(0))" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Dead-lettered events",
          "description": "XLEN of every edge's DLQ at scrape time (router /metrics). Nonzero means retries are exhausted and a human owes the queue a decision.",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 5 },
          "datasource": {{ $ds }},
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 }
              ] }
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "datasource": {{ $ds }}, "instant": true,
              "expr": "sum(hermes_event_dlq_depth) or vector(0)" }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Routers up",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 5 },
          "datasource": {{ $ds }},
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {{ $ds }}, "instant": true,
              "expr": "sum(hermes_router_up) or vector(0)" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Agent runtime freshness (s since last observer event)",
          "description": "The in-pod observer's heartbeat per profile. A flat climb means the agent runtime stopped emitting - the same fact Nexus renders as agent health.",
          "gridPos": { "x": 0, "y": 5, "w": 12, "h": 8 },
          "datasource": {{ $ds }},
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {{ $ds }},
              "expr": "time() - max by (profile) (hermes_observer_last_event_timestamp_seconds)",
              "legendFormat": "{{`{{profile}}`}}" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Fleet MTD estimated spend (USD)",
          "gridPos": { "x": 12, "y": 5, "w": 12, "h": 8 },
          "datasource": {{ $ds }},
          "fieldConfig": { "defaults": { "unit": "currencyUSD" }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {{ $ds }},
              "expr": "max by (profile) (hermes_cost_usd_mtd)",
              "legendFormat": "{{`{{profile}}`}}" }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Backup routine staleness (h since last success)",
          "description": "hermes-* namespaces' CronJobs via kube-state-metrics. The overlay's backup source levels the same fact against its staleness window.",
          "gridPos": { "x": 0, "y": 13, "w": 12, "h": 8 },
          "datasource": {{ $ds }},
          "fieldConfig": { "defaults": { "unit": "h" }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {{ $ds }},
              "expr": "(time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{namespace=~\"hermes-.*\"})) / 3600",
              "legendFormat": "{{`{{namespace}}/{{cronjob}}`}}" }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Event deliveries and failures (per hour)",
          "gridPos": { "x": 12, "y": 13, "w": 12, "h": 8 },
          "datasource": {{ $ds }},
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {{ $ds }},
              "expr": "sum(rate(hermes_event_deliveries_total[1h])) * 3600 or vector(0)",
              "legendFormat": "delivered" },
            { "refId": "B", "datasource": {{ $ds }},
              "expr": "sum(rate(hermes_events_publish_failures_total[1h])) * 3600 or vector(0)",
              "legendFormat": "publish failures" },
            { "refId": "C", "datasource": {{ $ds }},
              "expr": "sum(rate(hermes_chatops_delivery_failures_total[1h])) * 3600 or vector(0)",
              "legendFormat": "chatops failures" }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Hermes workload memory (top 10)",
          "gridPos": { "x": 0, "y": 21, "w": 12, "h": 8 },
          "datasource": {{ $ds }},
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {{ $ds }},
              "expr": "topk(10, sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"hermes-.*\", container!=\"\"}))",
              "legendFormat": "{{`{{namespace}}/{{pod}}`}}" }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Prometheus head series",
          "description": "The stack watching itself: a runaway series count is how observability becomes the outage.",
          "gridPos": { "x": 12, "y": 21, "w": 12, "h": 8 },
          "datasource": {{ $ds }},
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "targets": [
            { "refId": "A", "datasource": {{ $ds }},
              "expr": "prometheus_tsdb_head_series", "legendFormat": "series" }
          ]
        }
      ]
    }
{{- end }}
